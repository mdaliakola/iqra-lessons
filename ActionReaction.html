<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IQRA VIRTUAL LAB — Equal and Opposite</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&family=Manrope:wght@400;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<style>
  /* Custom Scrollbar */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: #0f172a;
  }
  ::-webkit-scrollbar-thumb {
    background: #334155;
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #475569;
  }

  /* Jameel Noori Nastaliq (downloaded via Google Fonts CDN, aliased) */
  @font-face {
    font-family: 'Jameel Noori Nastaliq';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: local('Jameel Noori Nastaleeq'), local('Jameel Noori Nastaliq'),
         url('https://fonts.gstatic.com/s/notonastaliqurdu/v23/LhWNMUPbN-oZdNFcBy1-DJYsEoTq5pudQ9L940pGPkB3Qt_-DK0.ttf') format('truetype');
  }
  @font-face {
    font-family: 'Jameel Noori Nastaliq';
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: local('Jameel Noori Nastaleeq'),
         url('https://fonts.gstatic.com/s/notonastaliqurdu/v23/LhWNMUPbN-oZdNFcBy1-DJYsEoTq5pudQ9L940pGPkB3Qjj5DK0.ttf') format('truetype');
  }

  /* RTL Styling Adjustments for Urdu with Jameel Noori Nastaliq */
  [dir="rtl"] .rtl-flip {
    transform: scaleX(-1);
  }
  [dir="rtl"] {
    font-family: 'Jameel Noori Nastaliq', 'Noto Nastaliq Urdu', serif !important;
    line-height: 2.3 !important;
  }

  /* Glassmorphism Classes */
  .glass-panel {
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .glass-card {
    background: rgba(30, 41, 59, 0.6);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  /* Pulse Glow Effects */
  .glow-cyan {
    box-shadow: 0 0 20px rgba(0, 243, 255, 0.35);
  }
  .glow-red {
    box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
  }
  .glow-green {
    box-shadow: 0 0 20px rgba(34, 197, 94, 0.35);
  }

  /* Canvas styling */
  canvas {
    touch-action: none;
  }

  /* Custom Slider Styling */
  input[type=range] {
    -webkit-appearance: none;
    background: #334155;
    border-radius: 8px;
    height: 8px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    height: 20px;
    width: 20px;
    border-radius: 50%;
    background: #00f3ff;
    cursor: pointer;
    box-shadow: 0 0 10px #00f3ff;
    transition: transform 0.1s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
  }

  /* Extended design language */
  html, body {
    height: 100%;
  }
  body {
    font-family: 'Manrope', sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    overflow: hidden;
  }
  .font-display { font-family: 'Oxanium', 'Manrope', sans-serif; }
  .bg-grid {
    background-image:
      linear-gradient(rgba(0,243,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,243,255,0.04) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  body.lang-ur, body.lang-ur [data-i18n], body.lang-ur .ur-text {
    font-family: 'Jameel Noori Nastaliq', 'Noto Nastaliq Urdu', serif !important;
    line-height: 2.3 !important;
    font-size: 1.06em;
  }
  body.lang-ur .font-display { font-family: 'Jameel Noori Nastaliq', 'Noto Nastaliq Urdu', serif !important; }
  .num, .stat-val {
    font-family: 'Oxanium', monospace !important;
    line-height: 1.4 !important;
    direction: ltr;
    unicode-bidi: embed;
  }

  #intro {
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(ellipse at center, #10233f 0%, #0f172a 65%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity .7s ease;
  }
  .intro-title {
    font-family: 'Oxanium', sans-serif;
    font-weight: 800; letter-spacing: .14em;
    background: linear-gradient(92deg, #00f3ff, #7dd3fc, #00f3ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: introZoom 1.6s cubic-bezier(.2,.8,.2,1) both, glowPulse 2s ease-in-out infinite;
  }
  .intro-topic {
    color: #94a3b8; letter-spacing: .18em;
    animation: introFade 1.4s .35s ease both;
  }
  .intro-ring {
    width: 160px; height: 160px; border-radius: 50%;
    border: 2px solid rgba(0,243,255,.35);
    box-shadow: 0 0 60px rgba(0,243,255,.25), inset 0 0 40px rgba(0,243,255,.12);
    display:flex; align-items:center; justify-content:center;
    animation: ringSpin 2.4s linear infinite, introZoom 1.2s ease both;
    margin-bottom: 28px; position: relative;
  }
  .intro-ring::before {
    content:''; position:absolute; inset:-10px; border-radius:50%;
    border-top: 2px solid #00f3ff; border-right: 2px solid transparent;
    border-bottom: 2px solid transparent; border-left: 2px solid transparent;
  }
  @keyframes ringSpin { to { transform: rotate(360deg); } }
  @keyframes introZoom { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
  @keyframes introFade { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes glowPulse {
    0%,100% { text-shadow: 0 0 24px rgba(0,243,255,.55); }
    50% { text-shadow: 0 0 54px rgba(0,243,255,.9); }
  }

  .tab-btn {
    position: relative; transition: color .25s ease, background-color .25s ease;
    border-radius: 12px;
  }
  .tab-btn.active {
    color: #00f3ff; background: rgba(0,243,255,.08);
    box-shadow: inset 0 0 0 1px rgba(0,243,255,.35), 0 0 18px rgba(0,243,255,.15);
  }
  .view { animation: viewIn .35s ease both; }
  @keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .mode-btn {
    transition: background-color .25s ease, color .25s ease, box-shadow .25s ease, transform .15s ease;
    border: 1px solid rgba(255,255,255,.1);
  }
  .mode-btn:active { transform: scale(.96); }
  .mode-btn.active {
    background: rgba(0,243,255,.12); color: #00f3ff;
    border-color: rgba(0,243,255,.5); box-shadow: 0 0 16px rgba(0,243,255,.25);
  }

  .opt-btn {
    transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .12s ease;
    border: 1px solid rgba(255,255,255,.1);
  }
  .opt-btn:not(.locked):hover { border-color: rgba(0,243,255,.45); background: rgba(0,243,255,.06); }
  .opt-btn:not(.locked):active { transform: scale(.98); }
  .opt-btn.correct { background: rgba(34,197,94,.16); border-color:#22c55e; box-shadow: 0 0 18px rgba(34,197,94,.3); }
  .opt-btn.wrong { background: rgba(239,68,68,.14); border-color:#ef4444; box-shadow: 0 0 18px rgba(239,68,68,.3); }

  .zoom-btn {
    width: 42px; height: 42px; border-radius: 12px;
    background: rgba(15,23,42,.8); border:1px solid rgba(255,255,255,.12);
    color:#00f3ff; display:flex; align-items:center; justify-content:center;
    backdrop-filter: blur(8px); cursor:pointer;
    transition: background-color .2s ease, box-shadow .2s ease, transform .12s ease;
  }
  .zoom-btn:hover { background: rgba(0,243,255,.12); box-shadow: 0 0 14px rgba(0,243,255,.25); }
  .zoom-btn:active { transform: scale(.92); }

  #sim-viewport { position: relative; overflow: hidden; }
  #sim-world {
    position: absolute; inset: 0;
    transform-origin: 0 0;
    will-change: transform;
  }
  #sim-canvas { width: 100%; height: 100%; display: block; }
  #fabricLayer, .canvas-container {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    pointer-events: none;
    z-index: 20;
  }
  .canvas-container canvas { position: absolute !important; left: 0; top: 0; }

  #anno-float {
    position: absolute; z-index: 30; left: 12px; bottom: 12px;
    transition: width .3s ease, height .3s ease, opacity .3s ease, padding .3s ease;
    cursor: grab;
    min-width: 52px;
  }
  #anno-float.collapsed { width: 52px; padding: 8px; }
  #anno-float.collapsed .anno-float-body { display: none; }

  .eq-chip {
    font-family: 'Oxanium', monospace;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body class="bg-grid">

<div id="intro">
  <div class="intro-ring"><i class="fa-solid fa-people-arrows text-5xl text-cyan-300" style="filter:drop-shadow(0 0 14px rgba(0,243,255,.8))"></i></div>
  <div class="intro-title text-4xl sm:text-5xl lg:text-6xl">IQRA VIRTUAL LAB</div>
  <div class="intro-topic text-base md:text-lg mt-5 font-bold uppercase text-center px-6" id="intro-topic">EQUAL AND OPPOSITE — NEWTON’S THIRD LAW</div>
</div>

<div id="app" class="h-screen flex flex-col opacity-0 transition-opacity duration-700">

  <header class="glass-panel flex items-center justify-between px-4 md:px-6 py-3 z-30 gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-10 h-10 rounded-xl bg-slate-900 border border-cyan-500/40 glow-cyan flex items-center justify-center shrink-0">
        <i class="fa-solid fa-flask text-cyan-400"></i>
      </div>
      <div class="min-w-0">
        <div class="font-display font-extrabold tracking-widest text-cyan-400 text-sm md:text-base truncate" style="font-family:'Oxanium',sans-serif !important;">IQRA VIRTUAL LAB</div>
        <div class="text-xs text-slate-400 truncate" data-i18n="topic"></div>
      </div>
    </div>

    <nav class="flex items-center gap-2 glass-card rounded-2xl p-1.5 shrink-0">
      <button id="tab-sim" onclick="switchTab('sim')" class="tab-btn active px-3 md:px-6 py-2.5 font-bold text-sm md:text-base text-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-house"></i><span data-i18n="tab_sim"></span>
      </button>
      <button id="tab-quiz" onclick="switchTab('quiz')" class="tab-btn px-3 md:px-6 py-2.5 font-bold text-sm md:text-base text-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-clipboard-question"></i><span data-i18n="tab_quiz"></span>
      </button>
    </nav>

    <div class="flex items-center gap-3">
      <!-- Annotation Toolbar (Hidden by default) -->
      <div id="anno-toolbar" class="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 transition-all duration-300 max-w-0 overflow-hidden opacity-0">
        <input type="color" id="anno-color" value="#00f3ff" onchange="changeAnnoColor(this.value)" class="w-6 h-6 cursor-pointer bg-transparent border-0 p-0" title="Color">
        <button id="anno-pen" onclick="setAnnoMode('pen')" class="text-cyan-400 p-1.5 rounded hover:bg-slate-700 transition" title="Pen"><i class="fa-solid fa-pen"></i></button>
        <button id="anno-eraser" onclick="setAnnoMode('eraser')" class="text-slate-400 p-1.5 rounded hover:bg-slate-700 transition" title="Eraser"><i class="fa-solid fa-eraser"></i></button>
        <button onclick="clearAnnotations()" class="text-red-400 p-1.5 rounded hover:bg-slate-700 transition" title="Clear All"><i class="fa-solid fa-trash-can"></i></button>
      </div>

      <!-- Annotation Toggle Button -->
      <button id="btn-anno-toggle" onclick="toggleAnnotationMode()" class="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 flex items-center justify-center border border-slate-700 transition" title="Toggle Annotation">
        <i class="fa-solid fa-pen-nib"></i>
      </button>

      <!-- Language Selector -->
      <div class="relative">
        <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-slate-900 border border-slate-700 text-cyan-400 text-sm rounded-lg focus:ring-cyan-500 focus:border-cyan-500 px-3 py-2 cursor-pointer font-bold outline-none">
          <option value="en">🌐 English</option>
          <option value="ur">🌐 اردو</option>
          <option value="hi" disabled>🌐 हिंदी (Soon)</option>
          <option value="bn" disabled>🌐 বাংলা (Soon)</option>
          <option value="ta" disabled>🌐 தமிழ் (Soon)</option>
        </select>
      </div>

      <!-- Fullscreen Button -->
      <button onclick="toggleFullScreen()" class="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-400 flex items-center justify-center border border-slate-700 transition" title="Toggle Fullscreen">
        <i class="fa-solid fa-expand" id="fs-icon"></i>
      </button>
    </div>
  </header>

  <main id="view-sim" class="view flex-1 flex flex-col lg:flex-row gap-4 p-4 min-h-0 overflow-y-auto lg:overflow-hidden">

    <section class="flex-1 flex flex-col gap-3 min-h-0 min-w-0">
      <div class="glass-card rounded-2xl p-2 flex flex-wrap gap-2">
        <button id="mode-ice" onclick="setScene('ice')" class="mode-btn active flex-1 min-w-[110px] px-3 py-3 rounded-xl font-bold text-sm text-slate-300 flex items-center justify-center gap-2">
          <i class="fa-solid fa-person-skating"></i><span data-i18n="mode_ice"></span>
        </button>
        <button id="mode-micro" onclick="setScene('micro')" class="mode-btn flex-1 min-w-[110px] px-3 py-3 rounded-xl font-bold text-sm text-slate-300 flex items-center justify-center gap-2">
          <i class="fa-solid fa-microscope"></i><span data-i18n="mode_micro"></span>
        </button>
        <button id="mode-rocket" onclick="setScene('rocket')" class="mode-btn flex-1 min-w-[110px] px-3 py-3 rounded-xl font-bold text-sm text-slate-300 flex items-center justify-center gap-2">
          <i class="fa-solid fa-rocket"></i><span data-i18n="mode_rocket"></span>
        </button>
        <button id="mode-walk" onclick="setScene('walk')" class="mode-btn flex-1 min-w-[110px] px-3 py-3 rounded-xl font-bold text-sm text-slate-300 flex items-center justify-center gap-2">
          <i class="fa-solid fa-person-walking"></i><span data-i18n="mode_walk"></span>
        </button>
      </div>

      <div id="sim-viewport" class="glass-card rounded-2xl relative flex-1 min-h-[340px]">
        <div id="sim-world">
          <canvas id="sim-canvas"></canvas>
        </div>
        <canvas id="fabricLayer"></canvas>

        <div class="absolute top-3 z-10 glass-panel rounded-xl px-3 py-2 text-xs md:text-sm text-cyan-300 pointer-events-none" style="inset-inline-start:12px; max-width:70%">
          <i class="fa-solid fa-hand-pointer"></i> <span data-i18n="drag_hint"></span>
        </div>

        <div class="absolute bottom-3 flex flex-col gap-2 z-10" style="inset-inline-end:12px" dir="ltr">
          <button class="zoom-btn" onclick="zoomBy(1.2)" title="+"><i class="fa-solid fa-plus"></i></button>
          <button class="zoom-btn" onclick="zoomBy(1/1.2)" title="−"><i class="fa-solid fa-minus"></i></button>
          <button class="zoom-btn" onclick="resetView()" title="Reset"><i class="fa-solid fa-crosshairs"></i></button>
        </div>

        <div id="anno-float" class="glass-panel rounded-2xl p-3 glow-cyan">
          <div class="flex items-center justify-between gap-2">
            <button onclick="toggleAnnoFloat()" class="zoom-btn" style="width:36px;height:36px" title="Minimize">
              <i id="anno-float-icon" class="fa-solid fa-pen-nib"></i>
            </button>
            <span class="text-xs font-bold text-cyan-300 anno-float-body" data-i18n="anno_card"></span>
          </div>
          <div class="anno-float-body mt-3 flex items-center gap-2">
            <input type="color" value="#00f3ff" onchange="document.getElementById('anno-color').value=this.value; changeAnnoColor(this.value)" class="w-8 h-8 cursor-pointer bg-transparent border-0 p-0" title="Color">
            <button onclick="setAnnoMode('pen')" class="zoom-btn" style="width:36px;height:36px"><i class="fa-solid fa-pen"></i></button>
            <button onclick="setAnnoMode('eraser')" class="zoom-btn" style="width:36px;height:36px"><i class="fa-solid fa-eraser"></i></button>
            <button onclick="clearAnnotations()" class="zoom-btn" style="width:36px;height:36px;color:#f87171"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        </div>
      </div>
    </section>

    <aside class="w-full lg:w-[340px] xl:w-[380px] flex flex-col gap-4 lg:overflow-y-auto lg:min-h-0 shrink-0 pb-2">
      <div class="glass-card rounded-2xl p-5 space-y-5">
        <h2 class="font-display font-bold text-base text-cyan-400 flex items-center gap-2">
          <i class="fa-solid fa-sliders"></i><span data-i18n="ctrl_title"></span>
        </h2>

        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-bold text-slate-300" data-i18n="force_push"></label>
            <span class="stat-val text-sm num" id="val-F">50 N</span>
          </div>
          <input type="range" id="sl-F" class="w-full" min="0" max="100" step="1" value="50" oninput="onControls()">
        </div>
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-bold text-slate-300" data-i18n="mass_a"></label>
            <span class="stat-val text-sm num" id="val-mA">50 kg</span>
          </div>
          <input type="range" id="sl-mA" class="w-full" min="30" max="90" step="1" value="50" oninput="onControls()">
        </div>
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-bold text-slate-300" data-i18n="mass_b"></label>
            <span class="stat-val text-sm num" id="val-mB">50 kg</span>
          </div>
          <input type="range" id="sl-mB" class="w-full" min="30" max="90" step="1" value="50" oninput="onControls()">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <button onclick="pushPair()" class="px-4 py-3 rounded-xl font-bold bg-cyan-500/15 text-cyan-300 border border-cyan-400/40 hover:bg-cyan-500/25 glow-cyan">
            <i class="fa-solid fa-play"></i> <span data-i18n="btn_push"></span>
          </button>
          <button onclick="resetSim()" class="px-4 py-3 rounded-xl font-bold bg-slate-800 text-slate-200 border border-slate-600 hover:bg-slate-700">
            <i class="fa-solid fa-rotate-left"></i> <span data-i18n="btn_reset"></span>
          </button>
        </div>
        <button onclick="togglePause()" class="w-full px-4 py-3 rounded-xl font-bold bg-slate-900 text-amber-300 border border-amber-500/30 hover:bg-slate-800">
          <i class="fa-solid fa-pause"></i> <span data-i18n="btn_pause"></span>
        </button>
      </div>

      <div class="glass-card rounded-2xl p-5 space-y-3">
        <h2 class="font-display font-bold text-base text-cyan-400 flex items-center gap-2">
          <i class="fa-solid fa-eye"></i><span data-i18n="obs_title"></span>
        </h2>
        <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
          <span class="text-sm text-slate-400" data-i18n="obs_fab"></span>
          <span class="stat-val text-sm num" id="obs-fab">50 N</span>
        </div>
        <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
          <span class="text-sm text-slate-400" data-i18n="obs_fba"></span>
          <span class="stat-val text-sm num" id="obs-fba">50 N</span>
        </div>
        <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
          <span class="text-sm text-slate-400" data-i18n="obs_aa"></span>
          <span class="stat-val text-sm num" id="obs-aa">1.00 m/s²</span>
        </div>
        <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
          <span class="text-sm text-slate-400" data-i18n="obs_ab"></span>
          <span class="stat-val text-sm num" id="obs-ab">1.00 m/s²</span>
        </div>
        <div class="glass-panel rounded-xl px-4 py-3 text-center eq-chip text-cyan-300 text-sm" id="obs-eq">F<sub>AB</sub> = −F<sub>BA</sub></div>
        <div class="text-xs text-amber-200/90 leading-relaxed" id="obs-note"></div>
      </div>

      <div class="glass-card rounded-2xl p-5">
        <h2 class="font-display font-bold text-base text-green-400 flex items-center gap-2 mb-2">
          <i class="fa-solid fa-lightbulb"></i><span data-i18n="tip_title"></span>
        </h2>
        <p class="text-sm text-slate-300 leading-relaxed" id="tip-text"></p>
      </div>
    </aside>
  </main>

  <main id="view-quiz" class="view flex-1 min-h-0 overflow-y-auto p-4 hidden">
    <div class="max-w-3xl mx-auto">
      <div id="quiz-box" class="glass-card rounded-2xl p-6 md:p-8"></div>
    </div>
  </main>
</div>

<script>
const LANG = {
  en: {
    topic: "Equal and Opposite — Newton’s Third Law",
    intro_topic: "EQUAL AND OPPOSITE — NEWTON’S THIRD LAW",
    tab_sim: "Simulation",
    tab_quiz: "Quiz",
    mode_ice: "Ice Rink",
    mode_micro: "Contact Zoom",
    mode_rocket: "Rocket",
    mode_walk: "Walking",
    drag_hint: "Scroll to zoom · drag to pan after zoom · tap Push to experiment",
    anno_card: "Draw",
    ctrl_title: "Experiment Controls",
    force_push: "Push Force",
    mass_a: "Skater A Mass",

let currentLang = localStorage.getItem('iqra-lang') || 'en';
let scene = 'ice';
let F = 50, mA = 50, mB = 50;
let phase = 'idle'; // idle | contact | coast | paused
let pauseHold = null;
let xA = -90, xB = 90, vA = 0, vB = 0;
let contactT = 0;
const CONTACT_DUR = 0.55;
let lastTs = 0;
let cam = { z: 1, x: 0, y: 0 };
let panning = false, panLast = null;
let pointers = new Map();
let lastPinch = 0;
let sparks = [];
let exhaust = [];
let walkPhase = 0;

const canvas = document.getElementById('sim-canvas');
const ctx = canvas.getContext('2d');
const world = document.getElementById('sim-world');
const viewport = document.getElementById('sim-viewport');

function t(k) {
  const pack = LANG[currentLang] || LANG.en;
  return pack[k] != null ? pack[k] : (LANG.en[k] != null ? LANG.en[k] : k);
}

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (LANG[currentLang] && LANG[currentLang][k] != null) el.textContent = LANG[currentLang][k];
    else if (LANG.en[k] != null) el.textContent = LANG.en[k];
  });
  const intro = document.getElementById('intro-topic');
  if (intro) intro.textContent = t('intro_topic');
  document.getElementById('tip-text').textContent = t('tip_' + (scene === 'ice' ? 'ice' : scene));
  document.getElementById('obs-note').textContent = t('note_equal') + ' ' + t('note_cancel') + ' ' + t('note_same_time');
  if (!document.getElementById('view-quiz').classList.contains('hidden')) renderQuiz();
}

function changeLanguage(v) {
  if (v !== 'en' && v !== 'ur') return;
  currentLang = v;
  localStorage.setItem('iqra-lang', v);
  document.getElementById('lang-select').value = v;
  document.documentElement.lang = v === 'ur' ? 'ur' : 'en';
  document.body.classList.toggle('lang-ur', v === 'ur');
  applyI18n();
  updateReadouts();
}

function switchTab(name) {
  document.getElementById('view-sim').classList.toggle('hidden', name !== 'sim');
  document.getElementById('view-quiz').classList.toggle('hidden', name !== 'quiz');
  document.getElementById('tab-sim').classList.toggle('active', name === 'sim');
  document.getElementById('tab-quiz').classList.toggle('active', name === 'quiz');
  if (name === 'quiz') renderQuiz();
  if (name === 'sim') requestAnimationFrame(() => fitAndResize());
}

function setScene(s) {
  scene = s;
  ['ice','micro','rocket','walk'].forEach(id => {
    document.getElementById('mode-' + id).classList.toggle('active', id === s);
  });
  document.getElementById('tip-text').textContent = t('tip_' + (s === 'ice' ? 'ice' : s));
  resetSim(true);
}

function onControls() {
  if (phase === 'idle') {
    F = +document.getElementById('sl-F').value;
    mA = +document.getElementById('sl-mA').value;
    mB = +document.getElementById('sl-mB').value;
  }
  updateReadouts();
}

function updateReadouts() {
  const liveF = (phase === 'contact') ? F : (phase === 'idle' ? F : 0);
  document.getElementById('val-F').textContent = F + ' N';
  document.getElementById('val-mA').textContent = mA + ' kg';
  document.getElementById('val-mB').textContent = mB + ' kg';
  document.getElementById('obs-fab').textContent = liveF.toFixed(0) + ' N';
  document.getElementById('obs-fba').textContent = liveF.toFixed(0) + ' N';
  const aA = liveF / mA;
  const aB = liveF / mB;
  document.getElementById('obs-aa').textContent = aA.toFixed(2) + ' m/s²';
  document.getElementById('obs-ab').textContent = aB.toFixed(2) + ' m/s²';
}

function pushPair() {
  if (phase === 'contact' || phase === 'coast') return;
  F = +document.getElementById('sl-F').value;
  mA = +document.getElementById('sl-mA').value;
  mB = +document.getElementById('sl-mB').value;
  if (F <= 0) return;
  phase = 'contact';
  contactT = 0;
  vA = 0; vB = 0;
  if (scene === 'ice' || scene === 'micro') { xA = -90; xB = 90; }
  if (scene === 'rocket') { xA = 0; vA = 0; }
  if (scene === 'walk') { xA = 0; vA = 0; walkPhase = 0; }
}

function resetSim(keepScene) {
  phase = 'idle';
  pauseHold = null;
  vA = 0; vB = 0; contactT = 0;
  xA = -90; xB = 90;
  sparks = []; exhaust = [];
  if (!keepScene) {
    document.getElementById('sl-F').value = 50;
    document.getElementById('sl-mA').value = 50;
    document.getElementById('sl-mB').value = 50;
    F = 50; mA = 50; mB = 50;
  } else {
    F = +document.getElementById('sl-F').value;
    mA = +document.getElementById('sl-mA').value;
    mB = +document.getElementById('sl-mB').value;
  }
  updateReadouts();
}

function togglePause() {
  if (phase === 'paused') {
    phase = pauseHold || 'idle';
    pauseHold = null;
  } else if (phase !== 'idle') {
    pauseHold = phase;
    phase = 'paused';
  }
}

function toggleFullScreen() {
  const root = document.documentElement;
  if (!document.fullscreenElement) {
    (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }
}
document.addEventListener('fullscreenchange', () => {
  const ic = document.getElementById('fs-icon');
  ic.className = document.fullscreenElement ? 'fa-solid fa-compress' : 'fa-solid fa-expand';
  fitAndResize();
});

let fCanvas;
let isAnnoActive = false;

function initAnnotationCanvas(w, h) {
    fCanvas = new fabric.Canvas('fabricLayer', {
        isDrawingMode: false,
        width: w,
        height: h
    });
    fCanvas.freeDrawingBrush.color = document.getElementById('anno-color').value;
    fCanvas.freeDrawingBrush.width = 4;

    fCanvas.on('mouse:down', function(options) {
        if(isAnnoActive && !fCanvas.isDrawingMode && options.target) {
            fCanvas.remove(options.target);
        }
    });
}

function toggleAnnotationMode() {
    isAnnoActive = !isAnnoActive;
    const btn = document.getElementById('btn-anno-toggle');
    const toolbar = document.getElementById('anno-toolbar');

    const fabricContainer = document.querySelector('.canvas-container');

    if (isAnnoActive) {
        btn.classList.replace('text-slate-400', 'text-cyan-400');
        toolbar.classList.remove('max-w-0', 'opacity-0');
        toolbar.classList.add('max-w-xs', 'opacity-100');
        if(fabricContainer) fabricContainer.style.pointerEvents = 'auto';
        setAnnoMode('pen');
    } else {
        btn.classList.replace('text-cyan-400', 'text-slate-400');
        toolbar.classList.remove('max-w-xs', 'opacity-100');
        toolbar.classList.add('max-w-0', 'opacity-0');
        if(fabricContainer) fabricContainer.style.pointerEvents = 'none';
        if (fCanvas) fCanvas.isDrawingMode = false;
    }
}

function setAnnoMode(mode) {
    document.getElementById('anno-pen').classList.replace('text-cyan-400', 'text-slate-400');
    document.getElementById('anno-eraser').classList.replace('text-cyan-400', 'text-slate-400');

    if (mode === 'pen') {
        document.getElementById('anno-pen').classList.replace('text-slate-400', 'text-cyan-400');
        if(fCanvas) fCanvas.isDrawingMode = true;
    } else {
        document.getElementById('anno-eraser').classList.replace('text-slate-400', 'text-cyan-400');
        if(fCanvas) fCanvas.isDrawingMode = false;
    }
}

function changeAnnoColor(color) {
    if(fCanvas) fCanvas.freeDrawingBrush.color = color;
    setAnnoMode('pen');
}

function clearAnnotations() {
    if(fCanvas) fCanvas.clear();
}

function toggleAnnoFloat() {
  document.getElementById('anno-float').classList.toggle('collapsed');
}

(function enableDragFloat() {
  const el = document.getElementById('anno-float');
  let drag = false, ox = 0, oy = 0;
  el.addEventListener('pointerdown', e => {
    if (e.target.closest('button,input')) return;
    drag = true; el.style.cursor = 'grabbing';
    const r = el.getBoundingClientRect();
    const vr = viewport.getBoundingClientRect();
    ox = e.clientX - r.left; oy = e.clientY - r.top;
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', e => {
    if (!drag) return;
    const vr = viewport.getBoundingClientRect();
    el.style.left = (e.clientX - vr.left - ox) + 'px';
    el.style.top = (e.clientY - vr.top - oy) + 'px';
    el.style.bottom = 'auto';
  });
  el.addEventListener('pointerup', () => { drag = false; el.style.cursor = 'grab'; });
})();

/* ===== Zoom / pan ===== */
function applyCam() {
  world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.z})`;
}
function zoomAt(factor, cx, cy) {
  const vr = viewport.getBoundingClientRect();
  const px = cx - vr.left, py = cy - vr.top;
  const wx = (px - cam.x) / cam.z;
  const wy = (py - cam.y) / cam.z;
  cam.z = Math.min(3.2, Math.max(0.55, cam.z * factor));
  cam.x = px - wx * cam.z;
  cam.y = py - wy * cam.z;
  applyCam();
}
function zoomBy(f) {
  const vr = viewport.getBoundingClientRect();
  zoomAt(f, vr.left + vr.width/2, vr.top + vr.height/2);
}
function resetView() {
  cam.z = 1; cam.x = 0; cam.y = 0;
  applyCam();
}

viewport.addEventListener('wheel', e => {
  e.preventDefault();
  zoomAt(e.deltaY < 0 ? 1.08 : 1/1.08, e.clientX, e.clientY);
}, { passive: false });

viewport.addEventListener('pointerdown', e => {
  if (isAnnoActive) return;
  if (e.target.closest('#anno-float, .zoom-btn')) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1 && cam.z > 1.02) {
    panning = true; panLast = { x: e.clientX, y: e.clientY };
    viewport.setPointerCapture(e.pointerId);
  }
});
viewport.addEventListener('pointermove', e => {
  if (isAnnoActive) return;
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const pts = [...pointers.values()];
    const d = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    const mx = (pts[0].x+pts[1].x)/2, my = (pts[0].y+pts[1].y)/2;
    if (lastPinch) zoomAt(d / lastPinch, mx, my);
    lastPinch = d;
    panning = false;
    return;
  }
  if (panning && panLast) {
    cam.x += e.clientX - panLast.x;
    cam.y += e.clientY - panLast.y;
    panLast = { x: e.clientX, y: e.clientY };
    applyCam();
  }
});
function endPtr(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) lastPinch = 0;
  panning = false; panLast = null;
}
viewport.addEventListener('pointerup', endPtr);
viewport.addEventListener('pointercancel', endPtr);

/* ===== Resize ===== */
function fitAndResize() {
  const r = viewport.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.max(1, r.width * dpr);
  canvas.height = Math.max(1, r.height * dpr);
  canvas.style.width = r.width + 'px';
  canvas.style.height = r.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (fCanvas) {
    fCanvas.setWidth(r.width);
    fCanvas.setHeight(r.height);
    fCanvas.calcOffset();
  } else if (r.width > 2) {
    initAnnotationCanvas(r.width, r.height);
    const fc = document.querySelector('.canvas-container');
    if (fc) fc.style.pointerEvents = 'none';
  }
}

/* ===== Physics ===== */
function step(dt) {
  if (phase === 'paused' || phase === 'idle') return;
  const live = phase === 'contact';
  const f = live ? F : 0;
  if (scene === 'ice' || scene === 'micro') {
    if (live) {
      vA -= (f / mA) * dt * 48;
      vB += (f / mB) * dt * 48;
      contactT += dt;
      if (contactT >= CONTACT_DUR) phase = 'coast';
    }
    xA += vA * dt;
    xB += vB * dt;
    const lim = 210;
    if (xA < -lim) { xA = -lim; vA = 0; }
    if (xB > lim) { xB = lim; vB = 0; }
  } else if (scene === 'rocket') {
    if (live) {
      vA += (f / mA) * dt * 22;
      contactT += dt;
      for (let i = 0; i < 3; i++) {
        exhaust.push({ x: 0, y: 18, vx: (Math.random()-0.5)*30, vy: 80+Math.random()*40, life: 1 });
      }
      if (contactT >= 1.8) phase = 'coast';
    }
    xA = Math.min(120, xA + (live || phase==='coast' ? vA * dt : 0));
    exhaust.forEach(p => { p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt*0.7; });
    exhaust = exhaust.filter(p => p.life > 0);
  } else if (scene === 'walk') {
    if (live) {
      walkPhase += dt * 3;
      vA = (f / 70) * 40;
      xA = Math.min(180, xA + vA * dt);
      contactT += dt;
      if (contactT >= 2.2) phase = 'coast';
    }
  }
  updateReadouts();
}

/* ===== Drawing helpers ===== */
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x+r, y);
  c.arcTo(x+w, y, x+w, y+h, r);
  c.arcTo(x+w, y+h, x, y+h, r);
  c.arcTo(x, y+h, x, y, r);
  c.arcTo(x, y, x+w, y, r);
  c.closePath();
}
function arrow(c, x1, y1, x2, y2, color, w) {
  const ang = Math.atan2(y2-y1, x2-x1);
  c.strokeStyle = color; c.fillStyle = color; c.lineWidth = w || 4;
  c.lineCap = 'round';
  c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
  c.beginPath();
  c.moveTo(x2, y2);
  c.lineTo(x2 - 12*Math.cos(ang-0.4), y2 - 12*Math.sin(ang-0.4));
  c.lineTo(x2 - 12*Math.cos(ang+0.4), y2 - 12*Math.sin(ang+0.4));
  c.closePath(); c.fill();
}
function label(c, text, x, y, color, size) {
  c.save();
  c.fillStyle = color || '#e2e8f0';
  c.font = (currentLang === 'ur')
    ? `600 ${size || 14}px 'Jameel Noori Nastaliq','Noto Nastaliq Urdu',serif`
    : `700 ${size || 14}px Manrope,sans-serif`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText(text, x, y);
  c.restore();
}
function drawSkater(c, x, y, side, mass, color) {
  const s = 0.85 + (mass-30)/200;
  c.save();
  c.translate(x, y);
  c.scale(side, 1);
  c.fillStyle = '#94a3b8';
  c.fillRect(-10*s, 38*s, 8*s, 10*s);
  c.fillRect(4*s, 38*s, 8*s, 10*s);
  c.fillStyle = color;
  roundRect(c, -16*s, -8*s, 32*s, 40*s, 10);
  c.fill();
  c.beginPath(); c.arc(0, -22*s, 14*s, 0, Math.PI*2); c.fillStyle = '#fde68a'; c.fill();
  c.beginPath(); c.arc(0, -26*s, 16*s, Math.PI, Math.PI*2); c.fillStyle = color; c.fill();
  c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 2;
  c.strokeRect(-16*s, -8*s, 32*s, 40*s);
  c.restore();
}

function drawIce(w, h) {
  const c = ctx;
  c.fillStyle = '#0b1224';
  c.fillRect(0,0,w,h);
  const iceY = h * 0.62;
  c.fillStyle = '#1e293b';
  c.fillRect(0, iceY, w, h-iceY);
  c.fillStyle = 'rgba(224,224,224,0.12)';
  c.fillRect(0, iceY, w, 8);
  c.strokeStyle = 'rgba(224,224,224,0.18)';
  c.lineWidth = 1;
  const cx = w/2, cy = iceY - 20;
  const px = 1.15;
  for (let m = -200; m <= 200; m += 20) {
    const x = cx + m * px;
    c.beginPath(); c.moveTo(x, iceY); c.lineTo(x, iceY+14); c.stroke();
    if (m % 40 === 0) {
      c.fillStyle = '#64748b';
      c.font = '11px Oxanium,monospace';
      c.textAlign = 'center';
      c.fillText((m/10)+' m', x, iceY+28);
    }
  }
  c.fillStyle = 'rgba(0,243,255,0.08)';
  roundRect(c, 16, 16, w-32, 54, 12); c.fill();
  label(c, t('lbl_ice'), w/2, 42, '#67e8f9', 15);

  const y = cy - 10;
  const ax = cx + xA * px;
  const bx = cx + xB * px;
  drawSkater(c, ax, y, 1, mA, '#F44336');
  drawSkater(c, bx, y, -1, mB, '#2196F3');
  label(c, t('lbl_a') + '  ' + mA + ' kg', ax, y - 58, '#fca5a5', 13);
  label(c, t('lbl_b') + '  ' + mB + ' kg', bx, y - 58, '#93c5fd', 13);

  const mid = (ax+bx)/2;
  const grow = phase === 'idle' ? Math.min(1, F/100) : (phase === 'contact' ? 1 : 0.15);
  c.fillStyle = '#111827';
  roundRect(c, mid-54, y-8, 108, 36, 8); c.fill();
  c.strokeStyle = '#FFEB3B'; c.lineWidth = 2; c.stroke();
  c.fillStyle = '#FFEB3B';
  c.font = 'bold 13px Oxanium,monospace';
  c.textAlign = 'center';
  const shown = (phase === 'coast') ? 0 : F;
  c.fillText(shown.toFixed(0) + ' N', mid-22, y+8);
  c.fillText(shown.toFixed(0) + ' N', mid+22, y+8);
  c.strokeStyle = '#FFEB3B';
  c.beginPath(); c.moveTo(mid, y-6); c.lineTo(mid, y+26); c.stroke();
  label(c, t('lbl_scale'), mid, y+42, '#fde047', 11);

  const len = 28 + grow * (20 + F * 0.55);
  if (F > 0) {
    arrow(c, ax+22, y-6, ax+22+len, y-6, '#F44336', 5);
    arrow(c, bx-22, y-6, bx-22-len, y-6, '#2196F3', 5);
    label(c, shown.toFixed(0)+' N', ax+22+len*0.55, y-22, '#F44336', 12);
    label(c, shown.toFixed(0)+' N', bx-22-len*0.55, y-22, '#2196F3', 12);
  }

  if (Math.abs(vA) > 2 || Math.abs(vB) > 2) {
    arrow(c, ax, y+52, ax + Math.sign(vA)*Math.min(80, Math.abs(vA)*1.2), y+52, '#4CAF50', 3);
    arrow(c, bx, y+52, bx + Math.sign(vB)*Math.min(80, Math.abs(vB)*1.2), y+52, '#4CAF50', 3);
    label(c, t('lbl_vel'), cx, y+70, '#86efac', 11);
  }

  // Isolated FBDs
  const pw = 150, ph = 118;
  roundRect(c, 18, h-ph-18, pw, ph, 12);
  c.fillStyle = 'rgba(15,23,42,0.85)'; c.fill();
  c.strokeStyle = 'rgba(244,67,54,.5)'; c.stroke();
  label(c, t('lbl_fbd_a'), 18+pw/2, h-ph-2, '#fca5a5', 11);
  c.beginPath(); c.arc(18+pw/2, h-18-ph/2+8, 16, 0, Math.PI*2); c.fillStyle = '#F44336'; c.fill();
  if (F > 0 && phase !== 'coast') arrow(c, 18+pw/2, h-18-ph/2+8, 36, h-18-ph/2+8, '#2196F3', 4);

  roundRect(c, w-18-pw, h-ph-18, pw, ph, 12);
  c.fillStyle = 'rgba(15,23,42,0.85)'; c.fill();
  c.strokeStyle = 'rgba(33,150,243,.5)'; c.stroke();
  label(c, t('lbl_fbd_b'), w-18-pw/2, h-ph-2, '#93c5fd', 11);
  c.beginPath(); c.arc(w-18-pw/2, h-18-ph/2+8, 16, 0, Math.PI*2); c.fillStyle = '#2196F3'; c.fill();
  if (F > 0 && phase !== 'coast') arrow(c, w-18-pw/2, h-18-ph/2+8, w-36, h-18-ph/2+8, '#F44336', 4);
}

function drawMicro(w, h) {
  const c = ctx;
  c.fillStyle = '#07101f'; c.fillRect(0,0,w,h);
  label(c, t('lbl_contact'), w/2, 28, '#FFEB3B', 16);
  const grow = (phase === 'idle' ? F/100 : (phase === 'contact' ? 1 : 0.2));
  const compress = 18 * grow;
  // two palms
  c.fillStyle = '#F44336';
  roundRect(c, 40, h*0.28, w*0.38 - compress/2, h*0.44, 28); c.fill();
  c.fillStyle = '#2196F3';
  roundRect(c, w*0.62 + compress/2, h*0.28, w*0.38 - compress/2, h*0.44, 28); c.fill();
  label(c, t('lbl_a'), w*0.22, h*0.22, '#fca5a5', 14);
  label(c, t('lbl_b'), w*0.78, h*0.22, '#93c5fd', 14);

  const n = 8;
  for (let i = 0; i < n; i++) {
    const y = h*0.34 + i * (h*0.32/(n-1));
    const cx0 = w/2;
    c.strokeStyle = '#FFEB3B';
    c.lineWidth = 2;
    c.beginPath();
    for (let k = 0; k < 12; k++) {
      const x = cx0 - 40 + k * 8;
      const yy = y + Math.sin(k*1.2 + i + performance.now()/180) * (6 - compress*0.2);
      if (k===0) c.moveTo(x, yy); else c.lineTo(x, yy);
    }
    c.stroke();
    c.beginPath(); c.arc(cx0-42, y, 5, 0, Math.PI*2); c.fillStyle = '#F44336'; c.fill();
    c.beginPath(); c.arc(cx0+42, y, 5, 0, Math.PI*2); c.fillStyle = '#2196F3'; c.fill();
  }
  label(c, t('lbl_mol'), w/2, h*0.82, '#fde047', 13);
  const len = 40 + grow * 50;
  arrow(c, w/2+10, h*0.5, w/2+10+len, h*0.5, '#F44336', 5);
  arrow(c, w/2-10, h*0.5, w/2-10-len, h*0.5, '#2196F3', 5);
  const shown = (phase === 'coast') ? 0 : F;
  label(c, shown + ' N', w/2+10+len*0.6, h*0.5-18, '#F44336', 14);
  label(c, shown + ' N', w/2-10-len*0.6, h*0.5-18, '#2196F3', 14);
}

function drawRocket(w, h) {
  const c = ctx;
  const g = c.createLinearGradient(0,0,0,h);
  g.addColorStop(0, '#020617'); g.addColorStop(1, '#0f172a');
  c.fillStyle = g; c.fillRect(0,0,w,h);
  for (let i=0;i<40;i++) {
    c.fillStyle = 'rgba(255,255,255,.35)';
    c.fillRect((i*97)%w, (i*53)%h, 2, 2);
  }
  const rx = w/2, ry = h*0.42 - xA;
  c.fillStyle = '#94a3b8';
  c.beginPath();
  c.moveTo(rx, ry-70); c.lineTo(rx+28, ry+10); c.lineTo(rx-28, ry+10); c.closePath(); c.fill();
  c.fillStyle = '#64748b';
  c.fillRect(rx-22, ry+10, 44, 50);
  c.fillStyle = '#F44336';
  c.beginPath(); c.moveTo(rx-22, ry+20); c.lineTo(rx-40, ry+62); c.lineTo(rx-22, ry+50); c.closePath(); c.fill();
  c.fillStyle = '#2196F3';
  c.beginPath(); c.moveTo(rx+22, ry+20); c.lineTo(rx+40, ry+62); c.lineTo(rx+22, ry+50); c.closePath(); c.fill();
  label(c, t('lbl_rocket'), rx, ry-88, '#e2e8f0', 15);

  exhaust.forEach(p => {
    c.globalAlpha = Math.max(0, p.life);
    c.fillStyle = p.life > 0.5 ? '#f97316' : '#64748b';
    c.beginPath(); c.arc(rx + p.x, ry+70 + p.y, 4, 0, Math.PI*2); c.fill();
    c.globalAlpha = 1;
  });
  const live = (phase === 'contact');
  const shown = live ? F : (phase === 'idle' ? F : 0);
  if (shown > 0) {
    arrow(c, rx, ry+70, rx, ry+70 + 40 + shown*0.7, '#F44336', 5);
    arrow(c, rx, ry-10, rx, ry-10 - 40 - shown*0.7, '#2196F3', 5);
    label(c, t('lbl_exhaust') + '  ' + shown + ' N', rx + 90, ry+110, '#F44336', 13);
    label(c, t('lbl_rocket') + '  ' + shown + ' N', rx + 90, ry-80, '#93c5fd', 13);
  }
}

function drawWalk(w, h) {
  const c = ctx;
  c.fillStyle = '#0b1224'; c.fillRect(0,0,w,h);
  c.fillStyle = '#1e3a2f';
  c.fillRect(0, h*0.72, w, h*0.28);
  c.strokeStyle = 'rgba(76,175,80,.35)';
  for (let i=0;i<12;i++) { c.beginPath(); c.moveTo(i*w/12, h*0.72); c.lineTo(i*w/12, h); c.stroke(); }
  const x = 80 + xA;
  const y = h*0.72;
  const swing = Math.sin(walkPhase) * 18;
  c.fillStyle = '#38bdf8';
  roundRect(c, x-16, y-90, 32, 50, 10); c.fill();
  c.beginPath(); c.arc(x, y-108, 14, 0, Math.PI*2); c.fillStyle = '#fde68a'; c.fill();
  c.strokeStyle = '#e2e8f0'; c.lineWidth = 5;
  c.beginPath(); c.moveTo(x, y-40); c.lineTo(x-10+swing, y); c.stroke();
  c.beginPath(); c.moveTo(x, y-40); c.lineTo(x+18-swing, y); c.stroke();
  label(c, t('lbl_foot'), x+40, y-8, '#93c5fd', 12);
  label(c, t('lbl_earth'), w/2, h-28, '#86efac', 14);
  const shown = (phase === 'idle' || phase === 'contact') ? F : 0;
  if (shown > 0) {
    arrow(c, x+8, y-4, x+8 - 30 - shown*0.5, y-4, '#F44336', 5);
    arrow(c, x+8, y-18, x+8 + 30 + shown*0.5, y-18, '#2196F3', 5);
    label(c, shown + ' N', x - 50, y-22, '#F44336', 12);
    label(c, shown + ' N', x + 70, y-36, '#2196F3', 12);
  }
  c.fillStyle = 'rgba(15,23,42,.7)';
  roundRect(c, 16, 16, w-32, 48, 12); c.fill();
  label(c, t('tip_walk'), w/2, 40, '#cbd5e1', 13);
}

function render() {
  const r = viewport.getBoundingClientRect();
  const w = r.width, h = r.height;
  if (w < 2) return;
  ctx.clearRect(0,0,w,h);
  if (scene === 'ice') drawIce(w,h);
  else if (scene === 'micro') drawMicro(w,h);
  else if (scene === 'rocket') drawRocket(w,h);
  else drawWalk(w,h);
}

function loop(ts) {
  if (!lastTs) lastTs = ts;
  const dt = Math.min(0.033, (ts - lastTs)/1000);
  lastTs = ts;
  step(dt);
  render();
  requestAnimationFrame(loop);
}

/* ===== Quiz ===== */
const quizState = { i: 0, score: 0, locked: false, done: false };

function renderQuiz() {
  const box = document.getElementById('quiz-box');
  const Q = LANG[currentLang].quiz;
  if (quizState.done) {
    const pct = Math.round((quizState.score / Q.length) * 100);
    box.innerHTML = `
      <h2 class="font-display text-2xl text-cyan-400 font-bold mb-4">${t('score_title')}</h2>
      <div class="text-center py-6">
        <div class="text-6xl font-extrabold text-cyan-300 num">${quizState.score}/${Q.length}</div>
        <div class="text-3xl text-slate-300 mt-2 num">${pct}%</div>
      </div>
      <button onclick="quizState.i=0;quizState.score=0;quizState.locked=false;quizState.done=false;renderQuiz()" class="w-full mt-4 py-4 rounded-xl font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-400/40 glow-cyan">${t('restart')}</button>
    `;
    return;
  }
  const item = Q[quizState.i];
  const prog = t('quiz_progress').replace('{i}', quizState.i+1).replace('{n}', Q.length);
  box.innerHTML = `
    <div class="text-sm text-cyan-400 font-bold mb-2">${t('quiz_title')}</div>
    <div class="text-xs text-slate-400 mb-4">${prog}</div>
    <h3 class="text-xl font-bold text-slate-100 mb-6 leading-relaxed">${item.q}</h3>
    <div class="space-y-3" id="opts"></div>
    <div id="explain" class="mt-5 hidden glass-panel rounded-xl px-4 py-3 text-sm"></div>
    <button id="quiz-next" onclick="quizNext()" class="hidden w-full mt-5 py-3 rounded-xl font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-400/40">${t('next')}</button>
  `;
  const opts = document.getElementById('opts');
  item.opts.forEach((opt, idx) => {
    const b = document.createElement('button');
    b.className = 'opt-btn w-full text-start px-4 py-4 rounded-xl font-bold text-slate-200 bg-slate-900/50';
    b.textContent = opt;
    b.onclick = () => pickOpt(idx);
    opts.appendChild(b);
  });
}

function pickOpt(idx) {
  if (quizState.locked) return;
  quizState.locked = true;
  const item = LANG[currentLang].quiz[quizState.i];
  const btns = [...document.querySelectorAll('#opts .opt-btn')];
  btns.forEach((b, i) => {
    b.classList.add('locked');
    if (i === item.a) b.classList.add('correct');
    if (i === idx && i !== item.a) b.classList.add('wrong');
  });
  if (idx === item.a) quizState.score++;
  const ex = document.getElementById('explain');
  ex.classList.remove('hidden');
  ex.innerHTML = `<span class="${idx===item.a?'text-green-400':'text-red-400'} font-bold">${idx===item.a?t('correct_fb'):t('wrong_fb')}</span> ${item.exp}`;
  document.getElementById('quiz-next').classList.remove('hidden');
}

function quizNext() {
  quizState.i++;
  quizState.locked = false;
  if (quizState.i >= LANG[currentLang].quiz.length) quizState.done = true;
  renderQuiz();
}

/* ===== Boot ===== */
window.addEventListener('resize', fitAndResize);
changeLanguage(currentLang);
setTimeout(() => {
  const intro = document.getElementById('intro');
  intro.style.opacity = '0';
  document.getElementById('app').classList.remove('opacity-0');
  setTimeout(() => { intro.style.display = 'none'; fitAndResize(); resetView(); }, 700);
}, 5000);
requestAnimationFrame(loop);
window.addEventListener('load', () => { fitAndResize(); applyI18n(); });
</script>
