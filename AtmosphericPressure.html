<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<script>
if(window.top===window.self){
document.documentElement.innerHTML="<h1 style='color:red;text-align:center;margin-top:50px;font-family:sans-serif;'>Access Denied! Please open this lesson through the Smart Panel App.</h1>";

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IQRA VIRTUAL LAB — Atmospheric Pressure</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&family=Manrope:wght@400;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<style>
@font-face {
  font-family: 'Jameel Noori Nastaliq';
  src: url('https://cdn.jsdelivr.net/gh/fomalhautb/jameel-noori-nastaleeq@master/JameelNooriNastaleeq.ttf') format('truetype');
  font-weight: normal; font-style: normal; font-display: swap;
}

/* Custom Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #0f172a; }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #475569; }

/* RTL Styling Adjustments for Urdu with Jameel Noori Nastaliq */
[dir="rtl"] .rtl-flip { transform: scaleX(-1); }
[dir="rtl"] {
  font-family: 'Jameel Noori Nastaliq', 'Noto Nastaliq Urdu', serif !important;
  line-height: 2.3 !important;
}

/* Glassmorphism Classes */
.glass-panel {
  background: rgba(15, 23, 42, 0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.1);
}
.glass-card {
  background: rgba(30, 41, 59, 0.6);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.08);
}

/* Pulse Glow Effects */
.glow-cyan { box-shadow: 0 0 20px rgba(0, 243, 255, 0.35); }
.glow-red { box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
.glow-green { box-shadow: 0 0 20px rgba(34, 197, 94, 0.35); }

/* Canvas styling */
canvas { touch-action: none; }

/* Custom Slider Styling */
input[type=range] {
  -webkit-appearance: none;
  background: #334155;
  border-radius: 8px;
  height: 8px;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  height: 20px; width: 20px; border-radius: 50%;
  background: #00f3ff; cursor: pointer;
  box-shadow: 0 0 10px #00f3ff;
  transition: transform 0.1s ease;
}
input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
input[type=range]:disabled::-webkit-slider-thumb { background: #64748b; box-shadow: none; cursor: not-allowed; }

/* Bipolar elevation slider: depth ← 0 → height */
.elev-track-wrap { position: relative; padding-top: 6px; }
.elev-track-wrap input[type=range]#sl-elev {
  background: linear-gradient(90deg,
    #f97316 0%, #f97316 50%,
    #00f3ff 50%, #00f3ff 100%);
  height: 10px;
}
.elev-zero {
  position: absolute; left: 50%; top: -2px; transform: translateX(-50%);
  width: 2px; height: 22px; background: #f8fafc;
  box-shadow: 0 0 8px rgba(255,255,255,.6);
  pointer-events: none; border-radius: 1px;
}
.preset-btn {
  transition: background-color .2s ease, color .2s ease, border-color .2s ease, box-shadow .2s ease;
  border: 1px solid rgba(255,255,255,.1);
}
.preset-btn.active {
  background: rgba(0,243,255,.14); color: #00f3ff;
  border-color: rgba(0,243,255,.5); box-shadow: 0 0 14px rgba(0,243,255,.2);
}
.preset-btn.depth-tone.active {
  background: rgba(249,115,22,.14); color: #fb923c;
  border-color: rgba(249,115,22,.5); box-shadow: 0 0 14px rgba(249,115,22,.2);
}

/* Extended design language */
body {
  font-family: 'Manrope', sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  overflow: hidden;
}
.font-display { font-family: 'Oxanium', 'Manrope', sans-serif; }
[dir="rtl"] .font-display { font-family: 'Jameel Noori Nastaliq', 'Noto Nastaliq Urdu', serif; }
[dir="rtl"] body, [dir="rtl"] { font-size: 1.08em; }

.bg-grid {
  background-image:
    linear-gradient(rgba(0,243,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,243,255,0.04) 1px, transparent 1px);
  background-size: 44px 44px;
}

#intro {
  position: fixed; inset: 0; z-index: 100;
  background: radial-gradient(ellipse at center, #0c2a45 0%, #0f172a 65%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity .8s ease;
}
.intro-title {
  font-family: 'Oxanium', sans-serif;
  font-weight: 800; letter-spacing: .14em;
  background: linear-gradient(92deg, #00f3ff, #7dd3fc, #00f3ff);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: introZoom 1.6s cubic-bezier(.2,.8,.2,1) both, glowPulse 2s ease-in-out infinite;
}
.intro-topic {
  color: #94a3b8; letter-spacing: .28em;
  animation: introFade 1.4s .35s ease both;
}
.intro-ring {
  width: 160px; height: 160px; border-radius: 50%;
  border: 2px solid rgba(0,243,255,.35);
  box-shadow: 0 0 60px rgba(0,243,255,.25), inset 0 0 40px rgba(0,243,255,.12);
  display:flex; align-items:center; justify-content:center;
  animation: ringSpin 2.4s linear infinite, introZoom 1.2s ease both;
  margin-bottom: 28px; position: relative;
}
.intro-ring::before {
  content:''; position:absolute; inset:-10px; border-radius:50%;
  border-top: 2px solid #00f3ff; border-right: 2px solid transparent;
  border-bottom: 2px solid transparent; border-left: 2px solid transparent;
}
@keyframes ringSpin { to { transform: rotate(360deg); } }
@keyframes introZoom { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
@keyframes introFade { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes glowPulse {
  0%,100% { text-shadow: 0 0 24px rgba(0,243,255,.55); }
  50% { text-shadow: 0 0 54px rgba(0,243,255,.9); }
}

.tab-btn {
  position: relative; transition: color .25s ease, background-color .25s ease;
  border-radius: 12px;
}
.tab-btn.active {
  color: #00f3ff; background: rgba(0,243,255,.08);
  box-shadow: inset 0 0 0 1px rgba(0,243,255,.35), 0 0 18px rgba(0,243,255,.15);
}
.view { animation: viewIn .35s ease both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.mode-btn {
  transition: background-color .25s ease, color .25s ease, box-shadow .25s ease, transform .15s ease;
  border: 1px solid rgba(255,255,255,.1);
}
.mode-btn:active { transform: scale(.96); }
.mode-btn.active {
  background: rgba(0,243,255,.12); color: #00f3ff;
  border-color: rgba(0,243,255,.5); box-shadow: 0 0 16px rgba(0,243,255,.25);
}

.opt-btn {
  transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .12s ease;
  border: 1px solid rgba(255,255,255,.1);
}
.opt-btn:not(.locked):hover { border-color: rgba(0,243,255,.45); background: rgba(0,243,255,.06); }
.opt-btn:not(.locked):active { transform: scale(.98); }
.opt-btn.correct { background: rgba(34,197,94,.16); border-color:#22c55e; box-shadow: 0 0 18px rgba(34,197,94,.3); }
.opt-btn.wrong { background: rgba(239,68,68,.14); border-color:#ef4444; box-shadow: 0 0 18px rgba(239,68,68,.3); }

.zoom-btn {
  width: 42px; height: 42px; border-radius: 12px;
  background: rgba(15,23,42,.8); border:1px solid rgba(255,255,255,.12);
  color:#00f3ff; display:flex; align-items:center; justify-content:center;
  backdrop-filter: blur(8px); cursor:pointer;
  transition: background-color .2s ease, box-shadow .2s ease, transform .12s ease;
}
.zoom-btn:hover { background: rgba(0,243,255,.12); box-shadow: 0 0 14px rgba(0,243,255,.25); }
.zoom-btn:active { transform: scale(.92); }

.stat-val { font-family: 'Oxanium', monospace; color:#00f3ff; }
[dir="rtl"] .stat-val { font-family: 'Oxanium', monospace !important; line-height: 1.4 !important; }
.num { font-family:'Oxanium', monospace !important; line-height:1.4 !important; direction:ltr; unicode-bidi:embed; }

.score-ring { filter: drop-shadow(0 0 14px rgba(0,243,255,.5)); }

/* Floating annotation card */
#anno-float {
  position: absolute; z-index: 25;
  top: 12px; left: 12px;
  transition: width .3s ease, height .3s ease, padding .3s ease, opacity .25s ease;
  user-select: none;
}
#anno-float.collapsed {
  width: 48px; height: 48px; padding: 0 !important;
  overflow: hidden; cursor: pointer;
}
#anno-float.collapsed .anno-float-body { display: none; }
#anno-float.collapsed .anno-float-header span { display: none; }
#anno-float .canvas-container { pointer-events: none; }

#fabricLayer, .canvas-container {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  pointer-events: none;
  z-index: 15;
}
.canvas-container canvas { width: 100% !important; height: 100% !important; }

.status-boil { color: #f97316; text-shadow: 0 0 12px rgba(249,115,22,.5); }
.status-ok { color: #22c55e; }
.status-heat { color: #00f3ff; }
</style>
</head>
<body class="bg-grid">

<!-- INTRO -->
<div id="intro">
  <div class="intro-ring"><i class="fa-solid fa-cloud-sun text-5xl text-cyan-300" style="filter:drop-shadow(0 0 14px rgba(0,243,255,.8))"></i></div>
  <div class="intro-title text-4xl sm:text-5xl lg:text-6xl">IQRA VIRTUAL LAB</div>
  <div class="intro-topic text-base md:text-lg mt-5 font-bold uppercase" id="intro-topic">ATMOSPHERIC PRESSURE</div>
  <div class="mt-8 flex items-center gap-3 text-slate-400 text-sm tracking-widest uppercase" style="animation:introFade 1.4s .6s ease both">
    <i class="fa-solid fa-spinner animate-spin text-cyan-400"></i>
    <span id="intro-loading">Loading Virtual Laboratory...</span>
  </div>
</div>

<!-- APP -->
<div id="app" class="h-screen flex flex-col opacity-0 transition-opacity duration-700">

  <!-- HEADER -->
  <header class="glass-panel flex items-center justify-between px-3 md:px-6 py-3 z-30 gap-2">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-10 h-10 rounded-xl bg-slate-900 border border-cyan-500/40 glow-cyan flex items-center justify-center shrink-0">
        <i class="fa-solid fa-flask text-cyan-400"></i>
      </div>
      <div class="min-w-0">
        <div class="font-display font-extrabold tracking-widest text-cyan-400 text-sm md:text-base truncate" style="font-family:'Oxanium',sans-serif !important;">IQRA VIRTUAL LAB</div>
        <div class="text-xs text-slate-400 truncate" data-i18n="topic"></div>
      </div>
    </div>

    <nav class="hidden sm:flex items-center gap-2 glass-card rounded-2xl p-1.5">
      <button id="tab-sim" onclick="switchTab('sim')" class="tab-btn active px-4 md:px-6 py-2.5 font-bold text-sm md:text-base text-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-house"></i><span data-i18n="tab_sim"></span>
      </button>
      <button id="tab-quiz" onclick="switchTab('quiz')" class="tab-btn px-4 md:px-6 py-2.5 font-bold text-sm md:text-base text-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-clipboard-question"></i><span data-i18n="tab_quiz"></span>
      </button>
    </nav>

    <div class="flex items-center gap-3">
      <!-- Annotation Toolbar (Hidden by default) -->
      <div id="anno-toolbar" class="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 transition-all duration-300 max-w-0 overflow-hidden opacity-0">
        <input type="color" id="anno-color" value="#00f3ff" onchange="changeAnnoColor(this.value)" class="w-6 h-6 cursor-pointer bg-transparent border-0 p-0" title="Color">
        <button id="anno-pen" onclick="setAnnoMode('pen')" class="text-cyan-400 p-1.5 rounded hover:bg-slate-700 transition" title="Pen"><i class="fa-solid fa-pen"></i></button>
        <button id="anno-eraser" onclick="setAnnoMode('eraser')" class="text-slate-400 p-1.5 rounded hover:bg-slate-700 transition" title="Eraser"><i class="fa-solid fa-eraser"></i></button>
        <button onclick="clearAnnotations()" class="text-red-400 p-1.5 rounded hover:bg-slate-700 transition" title="Clear All"><i class="fa-solid fa-trash-can"></i></button>
      </div>

      <!-- Annotation Toggle Button -->
      <button id="btn-anno-toggle" onclick="toggleAnnotationMode()" class="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 flex items-center justify-center border border-slate-700 transition" title="Toggle Annotation">
        <i class="fa-solid fa-pen-nib"></i>
      </button>

      <!-- Language Selector -->
      <div class="relative">
        <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-slate-900 border border-slate-700 text-cyan-400 text-sm rounded-lg focus:ring-cyan-500 focus:border-cyan-500 px-3 py-2 cursor-pointer font-bold outline-none">
          <option value="en">🌐 English</option>
          <option value="ur">🌐 اردو</option>
          <option value="hi" disabled>🌐 हिंदी (Soon)</option>
          <option value="bn" disabled>🌐 বাংলা (Soon)</option>
          <option value="ta" disabled>🌐 தமிழ் (Soon)</option>
        </select>
      </div>

      <!-- Fullscreen Button -->
      <button onclick="toggleFullScreen()" class="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-400 flex items-center justify-center border border-slate-700 transition" title="Toggle Fullscreen">
        <i class="fa-solid fa-expand" id="fs-icon"></i>
      </button>
    </div>
  </header>

  <!-- Mobile tabs -->
  <div class="sm:hidden flex justify-center gap-2 py-2 border-b border-white/5 glass-panel">
    <button id="tab-sim-m" onclick="switchTab('sim')" class="tab-btn active px-5 py-2 font-bold text-sm text-slate-300 flex items-center gap-2"><i class="fa-solid fa-house"></i><span data-i18n="tab_sim"></span></button>
    <button id="tab-quiz-m" onclick="switchTab('quiz')" class="tab-btn px-5 py-2 font-bold text-sm text-slate-300 flex items-center gap-2"><i class="fa-solid fa-clipboard-question"></i><span data-i18n="tab_quiz"></span></button>
  </div>

  <!-- ===================== SIMULATION ===================== -->
  <main id="view-sim" class="view flex-1 flex flex-col lg:flex-row gap-3 p-3 min-h-0 overflow-hidden">

    <!-- CANVAS -->
    <section class="flex-1 flex flex-col gap-3 min-h-0 min-w-0">
      <!-- Unified elevation: depth ← sea level → mountain -->
      <div class="glass-card rounded-2xl p-3 md:p-4 space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div class="font-display font-bold text-sm text-cyan-400 flex items-center gap-2">
            <i class="fa-solid fa-arrows-up-down"></i><span data-i18n="elev_title"></span>
          </div>
          <div class="stat-val text-sm num" id="val-elev">0 m · Sea Level</div>
        </div>
        <div class="flex flex-wrap gap-2" id="preset-row">
          <button type="button" class="preset-btn depth-tone flex-1 min-w-[72px] px-2 py-2 rounded-xl font-bold text-xs text-slate-300" data-elev="-2000" onclick="setElevation(-2000)">−2000 m</button>
          <button type="button" class="preset-btn depth-tone flex-1 min-w-[72px] px-2 py-2 rounded-xl font-bold text-xs text-slate-300" data-elev="-500" onclick="setElevation(-500)">−500 m</button>
          <button type="button" class="preset-btn active flex-1 min-w-[72px] px-2 py-2 rounded-xl font-bold text-xs text-slate-300" data-elev="0" onclick="setElevation(0)"><span data-i18n="loc_sea">Sea Level</span></button>
          <button type="button" class="preset-btn flex-1 min-w-[72px] px-2 py-2 rounded-xl font-bold text-xs text-slate-300" data-elev="2500" onclick="setElevation(2500)">+2500 m</button>
          <button type="button" class="preset-btn flex-1 min-w-[72px] px-2 py-2 rounded-xl font-bold text-xs text-slate-300" data-elev="5000" onclick="setElevation(5000)">+5000 m</button>
        </div>
        <div class="elev-track-wrap">
          <div class="elev-zero"></div>
          <input type="range" id="sl-elev" class="w-full" min="-5000" max="5000" step="10" value="0" oninput="onElevSlider()">
          <div class="flex justify-between text-[10px] mt-2 font-bold">
            <span class="text-orange-400" data-i18n="lbl_depth_side">← Depth (Underground)</span>
            <span class="text-slate-200" data-i18n="lbl_sea_zero">0 Sea Level</span>
            <span class="text-cyan-400" data-i18n="lbl_height_side">Height (Mountain) →</span>
          </div>
        </div>
      </div>

      <div id="canvas-wrap" class="glass-card rounded-2xl relative flex-1 min-h-[280px] overflow-hidden">
        <canvas id="sim-canvas" class="absolute inset-0 w-full h-full cursor-grab"></canvas>
        <canvas id="fabricLayer"></canvas>

        <!-- Floating Annotation Controls Card -->
        <div id="anno-float" class="glass-panel rounded-2xl p-3 glow-cyan collapsed" onclick="if(this.classList.contains('collapsed')){expandAnnoFloat(event)}">
          <div class="anno-float-header flex items-center justify-between gap-3 cursor-move" id="anno-drag-handle">
            <span class="text-xs font-bold text-cyan-300 tracking-wider uppercase flex items-center gap-2"><i class="fa-solid fa-pen-ruler"></i><span data-i18n="anno_card"></span></span>
            <button onclick="toggleAnnoFloat(event)" class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 text-cyan-400 flex items-center justify-center hover:bg-slate-700" title="Minimize">
              <i id="anno-float-icon" class="fa-solid fa-pen-nib"></i>
            </button>
          </div>
          <div class="anno-float-body mt-3 flex items-center gap-2">
            <input type="color" id="anno-color-f" value="#00f3ff" onchange="document.getElementById('anno-color').value=this.value;changeAnnoColor(this.value)" class="w-8 h-8 cursor-pointer bg-transparent border-0 p-0" title="Color">
            <button onclick="if(!isAnnoActive)toggleAnnotationMode();setAnnoMode('pen')" class="w-9 h-9 rounded-lg bg-slate-800 border border-slate-700 text-cyan-400 hover:bg-slate-700"><i class="fa-solid fa-pen"></i></button>
            <button onclick="if(!isAnnoActive)toggleAnnotationMode();setAnnoMode('eraser')" class="w-9 h-9 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700"><i class="fa-solid fa-eraser"></i></button>
            <button onclick="clearAnnotations()" class="w-9 h-9 rounded-lg bg-slate-800 border border-slate-700 text-red-400 hover:bg-slate-700"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        </div>

        <div class="absolute bottom-3 flex flex-col gap-2 z-20" style="inset-inline-end:12px" dir="ltr">
          <button class="zoom-btn" onclick="zoomBy(1.2)" title="+"><i class="fa-solid fa-plus"></i></button>
          <button class="zoom-btn" onclick="zoomBy(1/1.2)" title="−"><i class="fa-solid fa-minus"></i></button>
          <button class="zoom-btn" onclick="resetView()" title="Reset"><i class="fa-solid fa-crosshairs"></i></button>
        </div>
        <div class="absolute top-3 glass-panel rounded-xl px-4 py-2 text-xs md:text-sm text-cyan-300 pointer-events-none z-10" style="inset-inline-end:12px; max-width:55%">
          <i class="fa-solid fa-hand-pointer"></i> <span data-i18n="drag_hint"></span>
        </div>
      </div>
    </section>

    <!-- SIDE PANEL -->
    <aside class="w-full lg:w-[340px] xl:w-[380px] flex flex-col gap-3 lg:overflow-y-auto lg:min-h-0 shrink-0 pb-1">

      <!-- Experiment controls -->
      <div class="glass-card rounded-2xl p-4 space-y-4">
        <h2 class="font-display font-bold text-base text-cyan-400 flex items-center gap-2">
          <i class="fa-solid fa-fire-burner"></i><span data-i18n="ctrl_title"></span>
        </h2>
        <p class="text-xs text-slate-400 leading-relaxed" data-i18n="elev_help"></p>

        <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
          <span class="text-sm text-slate-400" data-i18n="position"></span>
          <span class="text-sm font-bold text-slate-100 text-end" id="read-pos"></span>
        </div>
        <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
          <span class="text-sm text-slate-400" data-i18n="air_col_h"></span>
          <span class="stat-val text-sm num" id="read-aircol">100%</span>
        </div>

        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-bold text-slate-300" data-i18n="heat_power"></label>
            <span class="stat-val text-sm num" id="val-heat">0%</span>
          </div>
          <input type="range" id="sl-heat" class="w-full" min="0" max="100" step="1" value="0" oninput="onHeatChange()">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <button onclick="toggleHeat()" id="btn-heat" class="mode-btn px-3 py-3 rounded-xl font-bold text-sm text-slate-300 flex items-center justify-center gap-2">
            <i class="fa-solid fa-fire"></i><span data-i18n="btn_heat"></span>
          </button>
          <button onclick="resetExperiment()" class="mode-btn px-3 py-3 rounded-xl font-bold text-sm text-slate-300 flex items-center justify-center gap-2">
            <i class="fa-solid fa-rotate-left"></i><span data-i18n="btn_reset"></span>
          </button>
        </div>
      </div>

      <!-- Live readings -->
      <div class="glass-card rounded-2xl p-4 space-y-3">
        <h2 class="font-display font-bold text-base text-cyan-400 flex items-center gap-2">
          <i class="fa-solid fa-gauge-high"></i><span data-i18n="readings"></span>
        </h2>

/* ============================================================
   STATE
============================================================ */
let cur = localStorage.getItem('iqra_lang') || 'en';
const T = k => (typeof LANG[cur][k] === 'function' ? LANG[cur][k] : LANG[cur][k]);

const state = {
  elev: 0, // metres: negative = underground depth, 0 = sea level, positive = mountain height
  heatPower: 0,
  heating: false,
  waterT: 25,
  ambientT: 25,
  zoom: 1, panX: 0, panY: 0,
  bubbles: [],
  t: 0
};

let canvas, ctx, baseScale = 1, W = 800, H = 500;
let pinch = null, dragging = false, lastX = 0, lastY = 0;

const ELEV_MIN = -5000;
const ELEV_MAX = 5000;
const SEA_P = 101.325;

/* ============================================================
   PHYSICS
============================================================ */
function pressureAtAltitude(h) {
  const hClamped = Math.max(0, Math.min(h, 11000));
  return SEA_P * Math.pow(1 - 2.25577e-5 * hClamped, 5.25588);
}

function pressureAtDepth(d) {
  // Hypothetical sealed / poorly-ventilated underground chamber for learning
  return SEA_P + d * 0.04; // ~ +40 kPa per 1000 m depth
}

function getExternalPressure() {
  if (state.elev >= 0) return pressureAtAltitude(state.elev);
  return pressureAtDepth(-state.elev);
}

/** Relative air-column amount vs sea level (100% at 0 m). */
function airColumnFraction() {
  if (state.elev >= 0) {
    // Remaining atmosphere vs sea-level pressure
    return getExternalPressure() / SEA_P;
  }
  // Underground: show denser / taller pressure column relative to sea level
  return getExternalPressure() / SEA_P;
}

function zoneKey() {
  if (Math.abs(state.elev) < 15) return 'sea';
  return state.elev > 0 ? 'mountain' : 'under';
}

function formatElevLabel() {
  const z = zoneKey();
  if (z === 'sea') return `0 m · ${T('pos_sea')}`;
  if (z === 'mountain') return `+${Math.round(state.elev)} m · ${T('pos_mountain')}`;
  return `−${Math.round(-state.elev)} m · ${T('pos_under')}`;
}

// Antoine equation (water, P in mmHg, T in °C): log10(P) = A - B/(T+C)
const ANT = { A: 8.07131, B: 1730.63, C: 233.426 };

function vaporPressure_kPa(T) {
  const Tc = Math.max(-20, Math.min(T, 374));
  const Pmm = Math.pow(10, ANT.A - ANT.B / (Tc + ANT.C));
  return Pmm * 0.133322;
}

function boilingPoint(P_kPa) {
  const Pmm = Math.max(0.5, P_kPa / 0.133322);
  const logP = Math.log10(Pmm);
  if (logP >= ANT.A - 0.01) return 374;
  return ANT.B / (ANT.A - logP) - ANT.C;
}

function isBoiling() {
  return state.waterT >= boilingPoint(getExternalPressure()) - 0.3 && state.heatPower > 0;
}

/** Arrow count 0–25 scaled to sea-level pressure (101.3 kPa → 25 arrows). */
function pressureArrowCount(P_kPa) {
  return Math.max(0, Math.min(25, Math.round((P_kPa / SEA_P) * 25)));
}

function drawDownArrow(cx, cy, size, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cx, cy + size);
  ctx.lineTo(cx - size * 0.55, cy);
  ctx.lineTo(cx + size * 0.55, cy);
  ctx.closePath();
  ctx.fill();
  ctx.fillRect(cx - size * 0.18, cy - size * 0.85, size * 0.36, size * 0.9);
}

function drawUpArrow(cx, cy, size, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cx, cy - size);
  ctx.lineTo(cx - size * 0.55, cy);
  ctx.lineTo(cx + size * 0.55, cy);
  ctx.closePath();
  ctx.fill();
  ctx.fillRect(cx - size * 0.18, cy - size * 0.05, size * 0.36, size * 0.9);
}

function changeLanguage(l) {
  if (l !== 'en' && l !== 'ur') return;
  cur = l;
  localStorage.setItem('iqra_lang', cur);
  document.documentElement.lang = cur === 'ur' ? 'ur' : 'en';
  document.documentElement.dir = cur === 'ur' ? 'rtl' : 'ltr';
  document.getElementById('lang-select').value = cur;

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    const v = LANG[cur][k];
    if (typeof v === 'string') el.textContent = v;
  });

  const it = document.getElementById('intro-topic');
  if (it) it.textContent = LANG[cur].intro_topic;
  const il = document.getElementById('intro-loading');
  if (il) il.textContent = LANG[cur].intro_loading;

  updateReadings();
  updateTip();
  updateHeatBtn();
  document.getElementById('val-elev').textContent = formatElevLabel();
  if (document.getElementById('view-quiz') && !document.getElementById('view-quiz').classList.contains('hidden')) {
    renderQuiz();
  }
}

function switchTab(tab) {
  const sim = document.getElementById('view-sim');
  const quiz = document.getElementById('view-quiz');
  const buttons = [
    document.getElementById('tab-sim'), document.getElementById('tab-quiz'),
    document.getElementById('tab-sim-m'), document.getElementById('tab-quiz-m')
  ];
  buttons.forEach(b => b && b.classList.remove('active'));
  if (tab === 'sim') {
    sim.classList.remove('hidden'); quiz.classList.add('hidden');
    document.getElementById('tab-sim').classList.add('active');
    document.getElementById('tab-sim-m')?.classList.add('active');
    requestAnimationFrame(resizeCanvases);
  } else {
    quiz.classList.remove('hidden'); sim.classList.add('hidden');
    document.getElementById('tab-quiz').classList.add('active');
    document.getElementById('tab-quiz-m')?.classList.add('active');
    renderQuiz();
  }
}

function toggleFullScreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement) {
    (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen)?.call(el);
    document.getElementById('fs-icon').className = 'fa-solid fa-compress';
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
    document.getElementById('fs-icon').className = 'fa-solid fa-expand';
  }
}

/* ============================================================
   ELEVATION / CONTROLS
============================================================ */
function setElevation(v, fromSlider) {
  state.elev = Math.max(ELEV_MIN, Math.min(ELEV_MAX, +v));
  if (!fromSlider) {
    const sl = document.getElementById('sl-elev');
    if (sl) sl.value = state.elev;
  }
  document.getElementById('val-elev').textContent = formatElevLabel();

  // Highlight nearest preset
  document.querySelectorAll('#preset-row .preset-btn').forEach(btn => {
    const pe = +btn.dataset.elev;
    const on = Math.abs(pe - state.elev) < 5;
    btn.classList.toggle('active', on);
  });

  const bp = boilingPoint(getExternalPressure());
  if (state.waterT > bp + 2) state.waterT = bp;
  updateTip();
  updateReadings();
}

function onElevSlider() {
  setElevation(+document.getElementById('sl-elev').value, true);
}

function onHeatChange() {
  state.heatPower = +document.getElementById('sl-heat').value;
  document.getElementById('val-heat').textContent = state.heatPower + '%';
  if (state.heatPower > 0) state.heating = true;
  updateHeatBtn();
}

function toggleHeat() {
  if (!state.heating && state.heatPower === 0) {
    state.heatPower = 60;
    document.getElementById('sl-heat').value = 60;
    document.getElementById('val-heat').textContent = '60%';
  }
  state.heating = !state.heating;
  if (!state.heating) {
    state.heatPower = 0;
    document.getElementById('sl-heat').value = 0;
    document.getElementById('val-heat').textContent = '0%';
  }
  updateHeatBtn();
}

function updateHeatBtn() {
  const btn = document.getElementById('btn-heat');
  const span = btn.querySelector('span');
  if (state.heating && state.heatPower > 0) {
    btn.classList.add('active');
    if (span) span.textContent = T('btn_stop');
  } else {
    btn.classList.remove('active');
    if (span) span.textContent = T('btn_heat');
  }
}

function resetExperiment() {
  state.heatPower = 0;
  state.heating = false;
  state.waterT = 25;
  state.bubbles = [];
  document.getElementById('sl-heat').value = 0;
  document.getElementById('val-heat').textContent = '0%';
  updateHeatBtn();
  updateReadings();
}

function updateTip() {
  const map = { sea: 'tip_sea', mountain: 'tip_mountain', under: 'tip_under' };
  document.getElementById('tip-text').textContent = T(map[zoneKey()]);
}

function updateReadings() {
  const P = getExternalPressure();
  const BP = boilingPoint(P);
  const VP = vaporPressure_kPa(state.waterT);
  const frac = airColumnFraction();
  document.getElementById('read-P').textContent = P.toFixed(1) + ' kPa';
  document.getElementById('read-BP').textContent = BP.toFixed(1) + ' °C';
  document.getElementById('read-T').textContent = state.waterT.toFixed(1) + ' °C';
  document.getElementById('read-VP').textContent = VP.toFixed(1) + ' kPa';
  document.getElementById('read-pos').textContent = formatElevLabel();
  document.getElementById('read-aircol').textContent =
    pressureArrowCount(P) + ' ↓ / ' + pressureArrowCount(VP) + ' ↑';
  document.getElementById('val-elev').textContent = formatElevLabel();

  const st = document.getElementById('read-status');
  if (isBoiling()) {
    st.textContent = T('status_boiling');
    st.className = 'glass-panel rounded-xl px-4 py-3 text-sm font-bold text-center status-boil';
  } else if (state.heating && state.heatPower > 0) {
    st.textContent = T('status_heating');
    st.className = 'glass-panel rounded-xl px-4 py-3 text-sm font-bold text-center status-heat';
  } else if (state.waterT > state.ambientT + 0.5) {
    st.textContent = T('status_cooled');
    st.className = 'glass-panel rounded-xl px-4 py-3 text-sm font-bold text-center text-slate-300';
  } else {
    st.textContent = T('status_idle');
    st.className = 'glass-panel rounded-xl px-4 py-3 text-sm font-bold text-center status-ok';
  }
}

/* ============================================================
   ANNOTATION (exact logic required)
============================================================ */
let fCanvas;
let isAnnoActive = false;

function initAnnotationCanvas(w, h) {
  if (fCanvas) {
    fCanvas.setWidth(w);
    fCanvas.setHeight(h);
    fCanvas.calcOffset();
    return;
  }
  fCanvas = new fabric.Canvas('fabricLayer', {
    isDrawingMode: false,
    width: w,
    height: h
  });
  fCanvas.freeDrawingBrush.color = document.getElementById('anno-color').value;
  fCanvas.freeDrawingBrush.width = 4;

  fCanvas.on('mouse:down', function(options) {
    if (isAnnoActive && !fCanvas.isDrawingMode && options.target) {
      fCanvas.remove(options.target);
    }
  });

  const fabricContainer = document.querySelector('.canvas-container');
  if (fabricContainer) fabricContainer.style.pointerEvents = 'none';
}

function toggleAnnotationMode() {
  isAnnoActive = !isAnnoActive;
  const btn = document.getElementById('btn-anno-toggle');
  const toolbar = document.getElementById('anno-toolbar');
  const fabricContainer = document.querySelector('.canvas-container');

  if (isAnnoActive) {
    btn.classList.replace('text-slate-400', 'text-cyan-400');
    toolbar.classList.remove('max-w-0', 'opacity-0');
    toolbar.classList.add('max-w-xs', 'opacity-100');
    if (fabricContainer) fabricContainer.style.pointerEvents = 'auto';
    setAnnoMode('pen');
    expandAnnoFloatDirect();
  } else {
    btn.classList.replace('text-cyan-400', 'text-slate-400');
    toolbar.classList.remove('max-w-xs', 'opacity-100');
    toolbar.classList.add('max-w-0', 'opacity-0');
    if (fabricContainer) fabricContainer.style.pointerEvents = 'none';
    if (fCanvas) fCanvas.isDrawingMode = false;
  }
}

function setAnnoMode(mode) {
  document.getElementById('anno-pen').classList.replace('text-cyan-400', 'text-slate-400');
  document.getElementById('anno-eraser').classList.replace('text-cyan-400', 'text-slate-400');

  if (mode === 'pen') {
    document.getElementById('anno-pen').classList.replace('text-slate-400', 'text-cyan-400');
    if (fCanvas) fCanvas.isDrawingMode = true;
  } else {
    document.getElementById('anno-eraser').classList.replace('text-slate-400', 'text-cyan-400');
    if (fCanvas) fCanvas.isDrawingMode = false;
  }
}

function changeAnnoColor(color) {
  if (fCanvas) fCanvas.freeDrawingBrush.color = color;
  const cf = document.getElementById('anno-color-f');
  if (cf) cf.value = color;
  setAnnoMode('pen');
}

function clearAnnotations() {
  if (fCanvas) fCanvas.clear();
}

function toggleAnnoFloat(e) {
  e.stopPropagation();
  const card = document.getElementById('anno-float');
  const icon = document.getElementById('anno-float-icon');
  if (card.classList.contains('collapsed')) {
    expandAnnoFloatDirect();
  } else {
    card.classList.add('collapsed');
    icon.className = 'fa-solid fa-pen-nib';
  }
}
function expandAnnoFloat(e) { e.stopPropagation(); expandAnnoFloatDirect(); }
function expandAnnoFloatDirect() {
  const card = document.getElementById('anno-float');
  const icon = document.getElementById('anno-float-icon');
  card.classList.remove('collapsed');
  icon.className = 'fa-solid fa-minus';
}

/* Draggable floating card */
(function() {
  const card = () => document.getElementById('anno-float');
  let ox = 0, oy = 0, moving = false;
  document.addEventListener('mousedown', e => {
    const c = card(); if (!c) return;
    if (e.target.closest('#anno-drag-handle') && !e.target.closest('button')) {
      moving = true; ox = e.clientX - c.offsetLeft; oy = e.clientY - c.offsetTop; e.preventDefault();
    }
  });
  document.addEventListener('mousemove', e => {
    if (!moving) return;
    const c = card(); const wrap = document.getElementById('canvas-wrap');
    const r = wrap.getBoundingClientRect();
    let x = e.clientX - ox, y = e.clientY - oy;
    x = Math.max(0, Math.min(x, r.width - c.offsetWidth));
    y = Math.max(0, Math.min(y, r.height - c.offsetHeight));
    c.style.left = x + 'px'; c.style.top = y + 'px'; c.style.right = 'auto';
  });
  document.addEventListener('mouseup', () => moving = false);
})();

/* ============================================================
   ZOOM / PAN
============================================================ */
function S() { return baseScale * state.zoom; }

function zoomBy(k, cx, cy) {
  const old = state.zoom;
  state.zoom = Math.min(4, Math.max(0.45, state.zoom * k));
  const r = state.zoom / old;
  if (cx != null) {
    state.panX = cx - (cx - state.panX) * r;
    state.panY = cy - (cy - state.panY) * r;
  }
}

function resetView() {
  state.zoom = 1; state.panX = 0; state.panY = 0;
}

/* ============================================================
   CANVAS DRAWING
============================================================ */
function resizeCanvases() {
  const wrap = document.getElementById('canvas-wrap');
  if (!wrap) return;
  const rect = wrap.getBoundingClientRect();
  W = Math.max(320, Math.floor(rect.width));
  H = Math.max(240, Math.floor(rect.height));
  canvas.width = W; canvas.height = H;
  baseScale = Math.min(W / 900, H / 560);
  initAnnotationCanvas(W, H);
}

function draw() {
  if (!ctx) return;
  state.t += 0.016;
  // Physics step
  const P = getExternalPressure();
  const BP = boilingPoint(P);
  const dt = 1 / 60;

  if (state.heating && state.heatPower > 0) {
    const rate = (0.15 + state.heatPower * 0.045);
    if (state.waterT < BP) {
      state.waterT += rate * dt * 10;
      if (state.waterT > BP) state.waterT = BP;
    } else {
      state.waterT = BP; // plateau while boiling
    }
  } else {
    // cool toward ambient
    if (state.waterT > state.ambientT) {
      state.waterT -= 0.35 * dt * 10;
      if (state.waterT < state.ambientT) state.waterT = state.ambientT;
    }
  }

  // Bubbles
  if (isBoiling()) {
    if (Math.random() < 0.35) {
      state.bubbles.push({
        x: 0.42 + Math.random() * 0.16,
        y: 0.72,
        r: 2 + Math.random() * 5,
        vy: 0.4 + Math.random() * 0.8,
        life: 1
      });
    }
  }
  state.bubbles.forEach(b => { b.y -= b.vy * 0.01; b.life -= 0.012; b.x += Math.sin(state.t * 3 + b.r) * 0.0008; });
  state.bubbles = state.bubbles.filter(b => b.life > 0 && b.y > 0.35);

  updateReadings();

  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(state.panX, state.panY);
  ctx.scale(S(), S());

  drawScene();

  ctx.restore();
  requestAnimationFrame(draw);
}

function drawScene() {
  // Continuous vertical world: underground ← sea level → mountain
  // Keep the boiling lab near mid-view; world scrolls with elevation.
  const elev = state.elev;
  const pxPerM = 0.045; // visual metres→pixels
  const labScreenY = 320; // where lab sits in view coords
  const seaY = labScreenY + elev * pxPerM; // sea-level line relative to lab

  drawWorldCrossSection(seaY, elev);
  drawElevationScale(seaY, elev);
  drawAirColumnAboveLab(labScreenY, elev);
  drawBoilingLab(labScreenY);
  drawHUD(labScreenY);
}

function drawWorldCrossSection(seaY, elev) {
  // Sky / atmosphere above sea level
  const skyTop = Math.min(seaY - 420, -80);
  const gSky = ctx.createLinearGradient(0, skyTop, 0, seaY);
  gSky.addColorStop(0, '#0c4a6e');
  gSky.addColorStop(0.55, '#38bdf8');
  gSky.addColorStop(1, '#7dd3fc');
  ctx.fillStyle = gSky;
  ctx.fillRect(-80, skyTop, 1060, Math.max(20, seaY - skyTop));

  // Sun / clouds when above or near surface
  if (elev > -800) {
    ctx.fillStyle = '#fde047';
    ctx.beginPath(); ctx.arc(780, seaY - 280 - elev * 0.02, 32, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    roundedCloud(160, seaY - 200, 100);
    roundedCloud(520, seaY - 260, 120);
  }

  // Mountain silhouette above sea level (right side of world)
  ctx.fillStyle = '#475569';
  ctx.beginPath();
  ctx.moveTo(500, seaY);
  ctx.lineTo(580, seaY - 140);
  ctx.lineTo(660, seaY - 40);
  ctx.lineTo(740, seaY - 260);
  ctx.lineTo(820, seaY - 80);
  ctx.lineTo(900, seaY - 320);
  ctx.lineTo(980, seaY);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e2e8f0';
  ctx.beginPath(); ctx.moveTo(870, seaY - 250); ctx.lineTo(900, seaY - 320); ctx.lineTo(930, seaY - 245); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(710, seaY - 200); ctx.lineTo(740, seaY - 260); ctx.lineTo(770, seaY - 195); ctx.closePath(); ctx.fill();

  // Ocean band at sea level
  ctx.fillStyle = '#0284c7';
  ctx.beginPath();
  ctx.moveTo(-80, seaY);
  for (let x = -80; x < 520; x += 18) {
    ctx.lineTo(x, seaY + Math.sin(x * 0.03 + state.t) * 4);
  }
  ctx.lineTo(520, seaY + 28);
  ctx.lineTo(-80, seaY + 28);
  ctx.closePath(); ctx.fill();

  // Ground / coastal strip
  ctx.fillStyle = '#334155';
  ctx.fillRect(-80, seaY + 18, 1060, 36);

  // Underground strata below sea level
  const strata = ['#78716c', '#57534e', '#44403c', '#292524', '#1c1917', '#0c0a09'];
  strata.forEach((c, i) => {
    ctx.fillStyle = c;
    ctx.fillRect(-80, seaY + 54 + i * 70, 1060, 72);
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.strokeRect(-80, seaY + 54 + i * 70, 1060, 72);
  });

  // Underground chamber outline when below sea level
  if (elev < -50) {
    const cy = labScreenYAnchor();
    ctx.fillStyle = 'rgba(15,23,42,0.85)';
    roundRect(250, cy - 150, 420, 280, 18); ctx.fill();
    ctx.strokeStyle = 'rgba(249,115,22,0.45)'; ctx.lineWidth = 2;
    roundRect(250, cy - 150, 420, 280, 18); ctx.stroke();
  }

  // SEA LEVEL marker line across scene
  ctx.save();
  ctx.setLineDash([10, 8]);
  ctx.strokeStyle = 'rgba(248,250,252,0.85)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(120, seaY); ctx.lineTo(900, seaY); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#f8fafc';
  ctx.font = "800 14px Oxanium, sans-serif";
  ctx.textAlign = 'left';
  ctx.fillText(T('canvas_sea') + '  0 m', 130, seaY - 8);
  ctx.restore();
}

function labScreenYAnchor() { return 320; }

function drawElevationScale(seaY, elev) {
  const x = 28, top = 40, bot = 520;
  ctx.fillStyle = 'rgba(15,23,42,0.7)';
  roundRect(x - 8, top - 10, 86, bot - top + 30, 10); ctx.fill();

  ctx.strokeStyle = 'rgba(148,163,184,0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x + 18, top); ctx.lineTo(x + 18, bot); ctx.stroke();

  // Tick marks in metres relative to current view
  const pxPerM = 0.045;
  const ticks = [-4000, -2000, -1000, 0, 1000, 2500, 4000, 5000];
  ticks.forEach(m => {
    const y = seaY - m * pxPerM;
    if (y < top || y > bot) return;
    ctx.strokeStyle = m === 0 ? '#f8fafc' : 'rgba(148,163,184,0.55)';
    ctx.lineWidth = m === 0 ? 2.5 : 1;
    ctx.beginPath(); ctx.moveTo(x + 10, y); ctx.lineTo(x + 28, y); ctx.stroke();
    ctx.fillStyle = m === 0 ? '#f8fafc' : '#94a3b8';
    ctx.font = (m === 0 ? '700 11px' : '600 10px') + ' Oxanium, sans-serif';
    ctx.textAlign = 'left';
    const label = m === 0 ? '0' : (m > 0 ? '+' + m : String(m));
    ctx.fillText(label, x + 32, y + 3);
  });

  // You-are-here marker at lab height
  const labY = labScreenYAnchor();
  ctx.fillStyle = state.elev >= 0 ? '#00f3ff' : '#fb923c';
  ctx.beginPath();
  ctx.moveTo(x + 4, labY);
  ctx.lineTo(x + 16, labY - 7);
  ctx.lineTo(x + 16, labY + 7);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = '#e2e8f0';
  ctx.font = "700 11px Oxanium, sans-serif";
  ctx.textAlign = 'center';
  ctx.fillText(Math.round(elev) + ' m', x + 34, bot + 16);
}

function drawAirColumnAboveLab(labY, elev) {
  // Dark, low-visibility air mass pressing downward (not a bright neon bar)
  const frac = airColumnFraction();
  const refH = 180;
  const h = Math.max(36, Math.min(280, refH * Math.min(frac, 1.35)));
  const x = 132, w = 72;
  const top = labY - 50 - h;
  const P = getExternalPressure();
  const nAtm = pressureArrowCount(P);

  // Soft dark column body
  const g = ctx.createLinearGradient(x, top, x, labY - 40);
  g.addColorStop(0, 'rgba(15, 23, 42, 0.15)');
  g.addColorStop(0.45, 'rgba(30, 41, 59, 0.35)');
  g.addColorStop(1, 'rgba(15, 23, 42, 0.55)');
  ctx.fillStyle = g;
  roundRect(x, top, w, h, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(51, 65, 85, 0.55)';
  ctx.lineWidth = 1;
  roundRect(x, top, w, h, 8); ctx.stroke();

  // Faint sea-level reference outline (barely visible)
  ctx.strokeStyle = 'rgba(71, 85, 105, 0.35)';
  ctx.setLineDash([3, 5]);
  ctx.strokeRect(x - 3, labY - 50 - refH, w + 6, refH);
  ctx.setLineDash([]);

  // Dense dark downward arrows inside the column (= atmospheric push)
  const cols = 5;
  const rows = Math.max(1, Math.ceil(nAtm / cols));
  let drawn = 0;
  for (let r = 0; r < rows && drawn < nAtm; r++) {
    for (let c = 0; c < cols && drawn < nAtm; c++) {
      const ax = x + 10 + c * ((w - 20) / (cols - 1));
      const ay = top + 18 + r * Math.max(12, (h - 36) / Math.max(1, rows - 0.2));
      const size = 5 + (nAtm / 25) * 3;
      drawDownArrow(ax, ay, size, 'rgba(15, 23, 42, 0.72)');
      drawn++;
    }
  }

  ctx.font = "700 11px Oxanium, sans-serif";
  ctx.fillStyle = 'rgba(148, 163, 184, 0.75)';
  ctx.textAlign = 'center';
  ctx.fillText(T('canvas_air'), x + w / 2, top - 16);
  ctx.font = "600 10px Oxanium, sans-serif";
  ctx.fillText(nAtm + ' ↓ · ' + P.toFixed(1) + ' kPa', x + w / 2, top - 3);
}

function drawBoilingLab(labY) {
  const tableY = labY + 110;
  ctx.fillStyle = '#1e293b';
  roundRect(300, tableY, 340, 22, 4); ctx.fill();
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(330, tableY + 22, 18, 40);
  ctx.fillRect(590, tableY + 22, 18, 40);

  ctx.font = "800 13px Oxanium, sans-serif";
  ctx.fillStyle = '#00f3ff';
  ctx.textAlign = 'center';
  ctx.fillText(T('canvas_lab'), 470, labY - 118);

  drawBeakerAt(410, labY - 70);
  drawHeaterAt(430, tableY - 14);
  drawThermometerAt(560, labY - 90);
}

function drawBeakerAt(bx, by) {
  const bw = 120, bh = 170;
  const P = getExternalPressure();
  const VP = vaporPressure_kPa(state.waterT);
  const nAtm = pressureArrowCount(P);
  const nVap = pressureArrowCount(VP);
  const equal = Math.abs(P - VP) < 1.2 || isBoiling();
  const boil = isBoiling();

  // —— Atmosphere arrows pressing DOWN on top of the beaker (up to 25) ——
  const atmSize = 4.5 + (nAtm / 25) * 3.5;
  const atmCols = 5;
  let aDrawn = 0;
  const atmRows = Math.max(1, Math.ceil(nAtm / atmCols));
  for (let r = 0; r < atmRows && aDrawn < nAtm; r++) {
    for (let c = 0; c < atmCols && aDrawn < nAtm; c++) {
      const ax = bx + 14 + c * ((bw - 28) / Math.max(1, atmCols - 1));
      const ay = by - 8 - r * (atmSize + 7) - Math.sin(state.t * 2 + aDrawn) * 1.2;
      const col = equal
        ? 'rgba(148, 163, 184, 0.9)'
        : 'rgba(30, 41, 59, 0.92)';
      drawDownArrow(ax, ay, atmSize, col);
      aDrawn++;
    }
  }

  // Beaker glass
  ctx.strokeStyle = 'rgba(186,230,253,0.7)'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(bx, by); ctx.lineTo(bx, by + bh);
  ctx.quadraticCurveTo(bx + bw / 2, by + bh + 10, bx + bw, by + bh);
  ctx.lineTo(bx + bw, by); ctx.stroke();

  const fill = 0.72;
  const wy = by + bh * (1 - fill);
  const waterG = ctx.createLinearGradient(bx, wy, bx, by + bh);
  const hot = Math.min(1, (state.waterT - 25) / 80);
  waterG.addColorStop(0, `rgba(${56 + hot * 100},${189 - hot * 80},${248 - hot * 100},0.55)`);
  waterG.addColorStop(1, 'rgba(14,165,233,0.75)');
  ctx.fillStyle = waterG;
  ctx.beginPath();
  ctx.moveTo(bx + 4, wy);
  ctx.lineTo(bx + 4, by + bh - 4);
  ctx.quadraticCurveTo(bx + bw / 2, by + bh + 4, bx + bw - 4, by + bh - 4);
  ctx.lineTo(bx + bw - 4, wy);
  for (let i = 0; i <= 10; i++) {
    const sx = bx + 4 + (bw - 8) * (i / 10);
    const sy = wy + Math.sin(state.t * 3 + i) * (boil ? 3 : 1);
    ctx.lineTo(sx, sy);
  }
  ctx.closePath(); ctx.fill();

  // —— Vapor arrows pushing UP from inside the water (up to 25) ——
  const vapSize = 4.5 + (nVap / 25) * 3.5;
  const vapCols = 5;
  let vDrawn = 0;
  const vapRows = Math.max(1, Math.ceil(Math.max(nVap, 1) / vapCols));
  if (nVap > 0) {
    for (let r = 0; r < vapRows && vDrawn < nVap; r++) {
      for (let c = 0; c < vapCols && vDrawn < nVap; c++) {
        const ax = bx + 14 + c * ((bw - 28) / Math.max(1, vapCols - 1));
        const waterDepth = (by + bh - 10) - (wy + 8);
        const ay = (by + bh - 18) - r * Math.max(12, waterDepth / Math.max(1, vapRows)) 
          - Math.sin(state.t * 3 + vDrawn) * 2;
        const col = equal
          ? 'rgba(226, 232, 240, 0.95)'
          : `rgba(186, 230, 253, ${0.45 + 0.5 * (nVap / 25)})`;
        drawUpArrow(ax, Math.min(ay, wy + 16), vapSize, col);
        vDrawn++;
      }
    }
  }

  // Bubbles only when pressures match (boiling)
  state.bubbles.forEach(b => {
    const px = bx + b.x * bw;
    const py = by + b.y * bh;
    ctx.beginPath(); ctx.arc(px, py, b.r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,255,255,${b.life * 0.85})`;
    ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = `rgba(226,232,240,${b.life * 0.28})`; ctx.fill();
  });

  if (boil) {
    for (let i = 0; i < 6; i++) {
      const sx = bx + 18 + i * 16 + Math.sin(state.t * 2 + i) * 5;
      const sy = by - 6 - ((state.t * 45 + i * 28) % 70);
      ctx.fillStyle = `rgba(226,232,240,${0.18 + 0.12 * Math.sin(state.t + i)})`;
      ctx.beginPath(); ctx.ellipse(sx, sy, 9, 14, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Labels: arrow counts + equality cue
  ctx.textAlign = 'center';
  ctx.font = "700 11px Oxanium, sans-serif";
  ctx.fillStyle = 'rgba(148,163,184,0.95)';
  ctx.fillText(T('canvas_atm') + '  ' + nAtm, bx + bw / 2, by - 8 - atmRows * (atmSize + 7) - 6);

  ctx.fillStyle = equal ? '#f8fafc' : 'rgba(125,211,252,0.9)';
  ctx.font = "700 11px Oxanium, sans-serif";
  ctx.fillText(T('canvas_vap') + '  ' + nVap, bx + bw / 2, wy - 6);

  if (equal && (boil || VP >= P * 0.97)) {
    ctx.fillStyle = '#f97316';
    ctx.font = "800 14px Oxanium, sans-serif";
    ctx.fillText('● ' + T('canvas_equal'), bx + bw / 2, by - 8 - atmRows * (atmSize + 7) - 22);
  }

  ctx.font = "600 12px Oxanium, sans-serif";
  ctx.fillStyle = '#94a3b8';
  ctx.fillText(T('canvas_beaker'), bx + bw / 2, by + bh + 18);
}

function drawHeaterAt(hx, hy) {
  const hw = 80, hh = 18;
  ctx.fillStyle = '#334155';
  roundRect(hx, hy, hw, hh, 4); ctx.fill();
  if (state.heating && state.heatPower > 0) {
    const glow = 0.4 + 0.3 * Math.sin(state.t * 8);
    ctx.fillStyle = `rgba(249,115,22,${glow})`;
    roundRect(hx + 6, hy + 4, hw - 12, hh - 8, 3); ctx.fill();
    ctx.shadowColor = '#f97316'; ctx.shadowBlur = 18;
    ctx.fillStyle = '#fb923c';
    roundRect(hx + 16, hy + 6, hw - 32, hh - 12, 2); ctx.fill();
    ctx.shadowBlur = 0;
  } else {
    ctx.fillStyle = '#475569';
    roundRect(hx + 6, hy + 4, hw - 12, hh - 8, 3); ctx.fill();
  }
  ctx.font = "600 11px Oxanium, sans-serif";
  ctx.fillStyle = '#94a3b8';
  ctx.textAlign = 'center';
  ctx.fillText(T('canvas_heater'), hx + hw / 2, hy + hh + 12);
}

function drawThermometerAt(tx, ty) {
  ctx.fillStyle = '#e2e8f0';
  roundRect(tx, ty, 14, 150, 7); ctx.fill();
  ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1; roundRect(tx, ty, 14, 150, 7); ctx.stroke();
  ctx.beginPath(); ctx.arc(tx + 7, ty + 158, 11, 0, Math.PI * 2);
  const hot = Math.min(1, (state.waterT - 20) / 100);
  ctx.fillStyle = `rgb(${220},${40 + (1 - hot) * 80},${40})`;
  ctx.fill();
  const frac = Math.min(1, Math.max(0, state.waterT / 120));
  const mh = frac * 130;
  ctx.fillStyle = `rgb(${220},${40 + (1 - hot) * 80},${40})`;
  ctx.fillRect(tx + 4, ty + 145 - mh, 6, mh);

  ctx.font = "700 13px Oxanium, sans-serif";
  ctx.fillStyle = '#00f3ff';
  ctx.textAlign = 'left';
  ctx.fillText(state.waterT.toFixed(1) + ' ' + T('canvas_thermo'), tx + 22, ty + 18);
  ctx.font = "600 11px Oxanium, sans-serif";
  ctx.fillStyle = '#94a3b8';
  ctx.fillText('BP ' + boilingPoint(getExternalPressure()).toFixed(1) + ' °C', tx + 22, ty + 36);
}

function drawHUD() {
  const P = getExternalPressure();
  const VP = vaporPressure_kPa(state.waterT);
  const x = 640, y = 70, w = 200, h = 14;
  ctx.fillStyle = 'rgba(15,23,42,0.72)';
  roundRect(x - 12, y - 28, 230, 78, 12); ctx.fill();

  ctx.font = "600 12px Oxanium, sans-serif";
  ctx.fillStyle = '#94a3b8'; ctx.textAlign = 'left';
  ctx.fillText('P_vap  vs  P_ext', x, y - 10);

  const maxP = Math.max(P, VP, 110);
  ctx.fillStyle = '#1e293b'; roundRect(x, y, w, h, 4); ctx.fill();
  ctx.fillStyle = '#22d3ee'; roundRect(x, y, w * (VP / maxP), h, 4); ctx.fill();
  ctx.strokeStyle = '#f97316'; ctx.lineWidth = 2;
  const px = x + w * (P / maxP);
  ctx.beginPath(); ctx.moveTo(px, y - 3); ctx.lineTo(px, y + h + 3); ctx.stroke();

  ctx.fillStyle = '#67e8f9'; ctx.font = "600 11px Oxanium, sans-serif";
  ctx.fillText('VP ' + VP.toFixed(1), x, y + 30);
  ctx.fillStyle = '#fb923c';
  ctx.fillText('P ' + P.toFixed(1), x + 90, y + 30);
}

function roundedCloud(x, y, w) {
  ctx.beginPath();
  ctx.arc(x, y, w * 0.35, 0, Math.PI * 2);
  ctx.arc(x + w * 0.35, y - 10, w * 0.4, 0, Math.PI * 2);
  ctx.arc(x + w * 0.7, y, w * 0.32, 0, Math.PI * 2);
  ctx.fill();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ============================================================
   INTERACTION
============================================================ */
function setupInteraction() {
  const el = canvas;
  el.addEventListener('wheel', e => {
    if (isAnnoActive) return;
    e.preventDefault();
    zoomBy(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.offsetX, e.offsetY);
  }, { passive: false });

  el.addEventListener('mousedown', e => {
    if (isAnnoActive) return;
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    el.classList.replace('cursor-grab', 'cursor-grabbing');
  });
  window.addEventListener('mousemove', e => {
    if (!dragging || isAnnoActive) return;
    state.panX += e.clientX - lastX;
    state.panY += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
  });
  window.addEventListener('mouseup', () => {
    dragging = false;
    el.classList.replace('cursor-grabbing', 'cursor-grab');
  });

  el.addEventListener('touchstart', e => {
    if (isAnnoActive) return;
    if (e.touches.length === 2) {
      const pts = [...e.touches].map(t => ({ x: t.clientX, y: t.clientY }));
      pinch = { d: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y), z: state.zoom };
    } else if (e.touches.length === 1) {
      dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    }
  }, { passive: true });

  el.addEventListener('touchmove', e => {
    if (isAnnoActive) return;
    if (e.touches.length === 2 && pinch) {
      e.preventDefault();
      const pts = [...e.touches].map(t => ({ x: t.clientX, y: t.clientY }));
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const target = pinch.z * (d / pinch.d);
      zoomBy(target / state.zoom, (pts[0].x + pts[1].x) / 2, (pts[0].y + pts[1].y) / 2);
    } else if (dragging && e.touches.length === 1) {
      state.panX += e.touches[0].clientX - lastX;
      state.panY += e.touches[0].clientY - lastY;
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    }
  }, { passive: false });

  el.addEventListener('touchend', () => { dragging = false; pinch = null; });
}

/* ============================================================
   QUIZ
============================================================ */
let qIndex = 0, score = 0, answered = false;

function renderQuiz() {
  const Q = LANG[cur].quiz;
  document.getElementById('quiz-body').classList.remove('hidden');
  document.getElementById('quiz-result').classList.add('hidden');

  if (qIndex >= Q.length) {
    showResults();
    return;
  }
  answered = false;
  document.getElementById('quiz-progress').textContent = LANG[cur].quiz_progress(qIndex + 1, Q.length);
  document.getElementById('quiz-q').textContent = Q[qIndex].q;
  const opts = document.getElementById('quiz-opts');
  opts.innerHTML = '';
  Q[qIndex].opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'opt-btn w-full text-start px-4 py-3.5 rounded-xl font-semibold text-slate-200 bg-slate-900/50';
    b.textContent = o;
    b.onclick = () => selectAnswer(i, b);
    opts.appendChild(b);
  });
  document.getElementById('quiz-fb').classList.add('hidden');
  document.getElementById('quiz-next').classList.add('hidden');
}

function selectAnswer(i, btn) {
  if (answered) return;
  answered = true;
  const Q = LANG[cur].quiz[qIndex];
  const all = [...document.getElementById('quiz-opts').children];
  all.forEach(b => b.classList.add('locked'));
  const fb = document.getElementById('quiz-fb');
  fb.classList.remove('hidden');
  if (i === Q.a) {
    btn.classList.add('correct');
    score++;
    fb.innerHTML = `<span class="text-green-400 font-bold">${T('correct_fb')}</span><br><span class="text-slate-300">${Q.ex}</span>`;
  } else {
    btn.classList.add('wrong');
    all[Q.a].classList.add('correct');
    fb.innerHTML = `<span class="text-red-400 font-bold">${T('wrong_fb')}</span><br><span class="text-slate-300">${Q.ex}</span>`;
  }
  const next = document.getElementById('quiz-next');
  next.classList.remove('hidden');
  next.textContent = qIndex >= LANG[cur].quiz.length - 1 ? T('see_result') : T('next_q');
}

function nextQuestion() {
  qIndex++;
  renderQuiz();
}

function showResults() {
  document.getElementById('quiz-body').classList.add('hidden');
  document.getElementById('quiz-result').classList.remove('hidden');
  const pct = Math.round((score / 5) * 100);
  document.getElementById('score-pct').textContent = pct + '%';
  document.getElementById('score-frac').textContent = score + ' / 5';
  document.getElementById('score-msg').textContent =
    pct >= 80 ? T('score_msg_great') : pct >= 50 ? T('score_msg_good') : T('score_msg_low');
}

function restartQuiz() {
  qIndex = 0; score = 0; answered = false;
  renderQuiz();
}

/* ============================================================
   BOOT
============================================================ */
function boot() {
  canvas = document.getElementById('sim-canvas');
  ctx = canvas.getContext('2d');
  changeLanguage(cur);
  setElevation(0);
  resizeCanvases();
  setupInteraction();
  window.addEventListener('resize', resizeCanvases);
  requestAnimationFrame(draw);

  // Intro ~5s
  setTimeout(() => {
    const intro = document.getElementById('intro');
    intro.style.opacity = '0';
    setTimeout(() => {
      intro.style.display = 'none';
      document.getElementById('app').style.opacity = '1';
      resizeCanvases();
    }, 800);
  }, 4800);
}

if (!window.__denied) boot();
