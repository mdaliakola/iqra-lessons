/* ============================================================
   i18n
============================================================ */
function t(k){ return (LANG[curLang] && LANG[curLang][k]) || LANG.en[k] || k; }

function changeLanguage(l) {
  if (l !== 'en' && l !== 'ur') return;
  curLang = l;
  localStorage.setItem('iqra_crt_lang', l);
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ur' ? 'rtl' : 'ltr';
  document.getElementById('lang-select').value = l;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (LANG[curLang][key] !== undefined) el.textContent = LANG[curLang][key];
  });
  const introTopic = document.getElementById('intro-topic');
  if (introTopic) introTopic.textContent = t('intro_topic');
  updateControlLabels();
  renderGasButtons();
  renderDiscoveries();
  updateObservation();
  document.getElementById('tip-text').textContent = currentTip();
  if (!document.getElementById('view-quiz').classList.contains('hidden')) renderQuiz();
}

function updateControlLabels() {
  const pb = document.getElementById('power-label');
  if (pb) pb.textContent = S.power ? t('power_on') : t('power_off');
  const el = document.getElementById('e-label');
  if (el) el.textContent = S.Eon ? t('field_on') : t('field_off');
  const bl = document.getElementById('b-label');
  if (bl) bl.textContent = S.Bon ? t('field_on') : t('field_off');
  document.getElementById('e-dir-label').textContent = S.Edir > 0 ? t('e_down') : t('e_up');
  document.getElementById('b-dir-label').textContent = S.Bdir > 0 ? t('b_into') : t('b_out');
  document.getElementById('val-V').textContent = S.V + ' V';
  document.getElementById('val-E').textContent = S.Estr + '%';
  document.getElementById('val-B').textContent = S.Bstr + '%';
  document.getElementById('val-P').textContent = pressureLabel();
}

function pressureLabel() {
  if (S.pressure < 25) return t('press_high');
  if (S.pressure < 50) return t('press_med');
  if (S.pressure < 75) return t('press_low');
  return t('press_vlow');
}

function currentTip() {
  if (S.Eon) return t('tip_E');
  if (S.Bon) return t('tip_B');
  if (S.shadow) return t('tip_shadow');
  if (S.pressure < 40) return t('tip_P');
  if (S.power && S.Eon) return t('tip_charge');
  return t('tip_default');
}

============================================================ */
function switchTab(tab) {
  document.getElementById('view-sim').classList.toggle('hidden', tab !== 'sim');
  document.getElementById('view-quiz').classList.toggle('hidden', tab !== 'quiz');
  document.getElementById('tab-sim').classList.toggle('active', tab === 'sim');
  document.getElementById('tab-quiz').classList.toggle('active', tab === 'quiz');
  if (tab === 'quiz') renderQuiz();
  if (tab === 'sim') setTimeout(resizeAll, 50);
}

function toggleFullScreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement) {
    (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    document.getElementById('fs-icon').className = 'fa-solid fa-compress';
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document);
    document.getElementById('fs-icon').className = 'fa-solid fa-expand';
  }
}

/* ============================================================
   ANNOTATION (Fabric.js) — exact logic required
============================================================ */
let fCanvas;
let isAnnoActive = false;

function initAnnotationCanvas(w, h) {
  fCanvas = new fabric.Canvas('fabricLayer', {
    isDrawingMode: false,
    width: w,
    height: h
  });
  fCanvas.freeDrawingBrush.color = document.getElementById('anno-color').value;
  fCanvas.freeDrawingBrush.width = 4;

  fCanvas.on('mouse:down', function(options) {
    if(isAnnoActive && !fCanvas.isDrawingMode && options.target) {
      fCanvas.remove(options.target);
    }
  });

  const fabricContainer = document.querySelector('.canvas-container');
  if (fabricContainer) fabricContainer.style.pointerEvents = 'none';
}

function toggleAnnotationMode() {
  isAnnoActive = !isAnnoActive;
  const btn = document.getElementById('btn-anno-toggle');
  const toolbar = document.getElementById('anno-toolbar');
  const fabricContainer = document.querySelector('.canvas-container');

  if (isAnnoActive) {
    btn.classList.replace('text-slate-400', 'text-cyan-400');
    toolbar.classList.remove('max-w-0', 'opacity-0');
    toolbar.classList.add('max-w-xs', 'opacity-100');
    if(fabricContainer) fabricContainer.style.pointerEvents = 'auto';
    setAnnoMode('pen');
  } else {
    btn.classList.replace('text-cyan-400', 'text-slate-400');
    toolbar.classList.remove('max-w-xs', 'opacity-100');
    toolbar.classList.add('max-w-0', 'opacity-0');
    if(fabricContainer) fabricContainer.style.pointerEvents = 'none';
    if (fCanvas) fCanvas.isDrawingMode = false;
  }
}

function setAnnoMode(mode) {
  document.getElementById('anno-pen').classList.replace('text-cyan-400', 'text-slate-400');
  document.getElementById('anno-eraser').classList.replace('text-cyan-400', 'text-slate-400');

  if (mode === 'pen') {
    document.getElementById('anno-pen').classList.replace('text-slate-400', 'text-cyan-400');
    if(fCanvas) fCanvas.isDrawingMode = true;
  } else {
    document.getElementById('anno-eraser').classList.replace('text-slate-400', 'text-cyan-400');
    if(fCanvas) fCanvas.isDrawingMode = false;
  }
}

function changeAnnoColor(color) {
  if(fCanvas) fCanvas.freeDrawingBrush.color = color;
  setAnnoMode('pen');
}

function clearAnnotations() {
  if(fCanvas) fCanvas.clear();
}

  S.power = !S.power;
  document.getElementById('btn-power').classList.toggle('danger-on', S.power);
  document.getElementById('btn-power').classList.toggle('on', S.power);
  updateControlLabels();
  if (S.power) { markDiscovery(0); markDiscovery(2); }
  updateObservation();
  spawnBurst();
}

function toggleE() {
  S.Eon = !S.Eon;
  document.getElementById('btn-E').classList.toggle('on', S.Eon);
  updateControlLabels();
  if (S.Eon && beamActive()) { markDiscovery(4); markDiscovery(6); markDiscovery(7); }
  updateObservation();
  document.getElementById('tip-text').textContent = currentTip();
}

function toggleB() {
  S.Bon = !S.Bon;
  document.getElementById('btn-B').classList.toggle('on', S.Bon);
  updateControlLabels();
  if (S.Bon && beamActive()) { markDiscovery(5); markDiscovery(6); markDiscovery(7); }
  updateObservation();
  document.getElementById('tip-text').textContent = currentTip();
}

function reverseE() { S.Edir *= -1; updateControlLabels(); updateObservation(); }
function reverseB() { S.Bdir *= -1; updateControlLabels(); updateObservation(); }
function toggleShowE() { S.showE = !S.showE; document.getElementById('btn-showE').classList.toggle('on', S.showE); }
function toggleShowB() { S.showB = !S.showB; document.getElementById('btn-showB').classList.toggle('on', S.showB); }

function toggleShadow() {
  S.shadow = !S.shadow;
  document.getElementById('btn-shadow').classList.toggle('on', S.shadow);
  if (S.shadow && beamActive()) { markDiscovery(1); markDiscovery(3); }
  updateObservation();
  document.getElementById('tip-text').textContent = currentTip();
}

function toggleLabels() {
  S.labels = !S.labels;
  document.getElementById('btn-labels').classList.toggle('on', S.labels);
}

function onControl() {
  S.V = +document.getElementById('sl-V').value;
  S.pressure = +document.getElementById('sl-P').value;
  S.Estr = +document.getElementById('sl-E').value;
  S.Bstr = +document.getElementById('sl-B').value;
  updateControlLabels();
  updateObservation();
  document.getElementById('tip-text').textContent = currentTip();
  if (beamActive() && !S.Eon && !S.Bon) markDiscovery(1);
}

function setGas(g) {
  S.gas = g;
  renderGasButtons();
}

function renderGasButtons() {
  const grid = document.getElementById('gas-grid');
  grid.innerHTML = GASES.map(g => `
    <button onclick="setGas('${g}')" class="gas-chip toggle-btn py-2 rounded-xl font-bold text-xs ${S.gas===g?'active':''} text-slate-300 border border-slate-600">
      ${t('gas_'+g)}
    </button>`).join('');
}

function resetExperiment() {
  S.power = false; S.V = 3000; S.pressure = 72; S.gas = 'Air';
  S.Eon = false; S.Estr = 50; S.Edir = 1;
  S.Bon = false; S.Bstr = 50; S.Bdir = 1;
  S.showE = true; S.showB = true; S.shadow = false; S.labels = true;
  document.getElementById('sl-V').value = 3000;
  document.getElementById('sl-P').value = 72;
  document.getElementById('sl-E').value = 50;
  document.getElementById('sl-B').value = 50;
  document.getElementById('btn-power').classList.remove('on','danger-on');
  document.getElementById('btn-E').classList.remove('on');
  document.getElementById('btn-B').classList.remove('on');
  document.getElementById('btn-shadow').classList.remove('on');
  document.getElementById('btn-labels').classList.add('on');
  document.getElementById('btn-showE').classList.add('on');
  document.getElementById('btn-showB').classList.add('on');
  particles = [];
  updateControlLabels();
  renderGasButtons();
  updateObservation();
  document.getElementById('tip-text').textContent = currentTip();
  resetView();
}

function beamActive() {
  return S.power && S.V >= 800 && S.pressure >= 40;
}

function updateObservation() {
  let msg;
  if (!S.power) msg = t('obs_off');
  else if (S.pressure < 40) msg = t('obs_highP');
  else if (S.V < 800) msg = t('obs_lowV');
  else if (S.Eon && S.Bon) msg = t('obs_EB');
  else if (S.Eon) msg = t('obs_E');
  else if (S.Bon) msg = t('obs_B');
  else if (S.shadow) msg = t('obs_shadow');
  else msg = t('obs_straight') + ' ' + t('obs_glow');
  document.getElementById('obs-text').textContent = msg;

  const defl = Math.abs(spotY - undeflectedSpotY) * 0.05; // cm visual scale
  document.getElementById('defl-val').textContent = defl.toFixed(1) + ' cm';
}

function markDiscovery(i) {
  if (!S.discoveries[i]) {
    S.discoveries[i] = true;
    renderDiscoveries();
  }
}

function renderDiscoveries() {
  const keys = ['d1','d2','d3','d4','d5','d6','d7','d8'];
  document.getElementById('discovery-list').innerHTML = keys.map((k,i) => `
    <li class="flex items-start gap-2 ${S.discoveries[i]?'check-done':''}">
      <i class="fa-solid ${S.discoveries[i]?'fa-circle-check':'fa-circle'} mt-1 text-xs"></i>
      <span>${t(k)}</span>
    </li>`).join('');
}

/* ============================================================
   PHYSICS / PARTICLES
============================================================ */
function electronSpeed() {
  // v proportional to sqrt(V); scaled for animation
  const base = Math.sqrt(Math.max(S.V, 1) / 5000);
  return 3.2 + base * 5.5;
}

function fieldAccel() {
  // Visual scale accelerations
  const eMag = S.Eon ? (S.Estr / 100) * 0.22 * S.Edir : 0;
  // For electrons q=-e: force opposite to E. Edir=1 means E down, so a_y for electron = -eMag? 
  // E down (upper+, lower-): electron goes UP → ay negative in canvas (y increases down)
  // So ay = -Edir * strength  (Edir=1 → ay negative = up)
  const ayE = S.Eon ? -S.Edir * (S.Estr / 100) * 0.28 : 0;

  // Magnetic: B into screen (+), v to the right → for +q force is up; for -q force is down
  // v × B (into): for +q → up (ay-); for electron → down (ay+)
  const ayB = S.Bon ? S.Bdir * (S.Bstr / 100) * 0.0018 : 0; // multiplied by vx later
  return { ayE, ayB };
}

function spawnParticle() {
  if (!beamActive()) return;
  const speed = electronSpeed();
  const jitter = (Math.random() - 0.5) * 6;
  particles.push({
    x: TUBE.cathodeX + 18,
    y: TUBE.beamY + jitter,
    vx: speed,
    vy: 0,
    life: 1,
    trail: []
  });
  if (particles.length > 90) particles.shift();
}

function spawnBurst() {
  for (let i = 0; i < 12; i++) spawnParticle();
}

function stepPhysics() {
  const { ayE, ayB } = fieldAccel();
  const collideProb = Math.max(0, (100 - S.pressure) / 100) * 0.04;

  let hitSum = 0, hitN = 0;

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    // Magnetic force ~ q(v × B); for electrons, ay += sign * |v| * B
    const ay = ayE + ayB * p.vx;

    p.vx += 0; // no ax in our approx after acceleration region
    p.vy += ay;
    // slight damping of vy outside fields for stability
    if (p.x < TUBE.fieldX0 || p.x > TUBE.fieldX1) {
      if (!S.Bon || p.x < TUBE.magX0 || p.x > TUBE.magX1) p.vy *= 0.992;
    }

    p.trail.push({x:p.x, y:p.y});
    if (p.trail.length > 10) p.trail.shift();

    p.x += p.vx;
    p.y += p.vy;

    // Gas collisions scatter
    if (Math.random() < collideProb) {
      p.vy += (Math.random() - 0.5) * 1.2;
      p.vx *= 0.97;
      p.life -= 0.05;
    }

    // Opaque object occlusion
    if (S.shadow && p.x > TUBE.objectX - 8 && p.x < TUBE.objectX + 8) {
      const cy = TUBE.beamY;
      const inCross = Math.abs(p.y - cy) < 36 && (Math.abs(p.y - cy) < 8 || Math.abs(p.x - TUBE.objectX) < 4);
      // Cross bars: vertical | and horizontal —
      const vert = Math.abs(p.x - TUBE.objectX) < 5 && Math.abs(p.y - cy) < 38;
      const horiz = Math.abs(p.y - cy) < 5 && Math.abs(p.x - TUBE.objectX) < 28;
      if (vert || horiz) { particles.splice(i, 1); continue; }
    }

    // Hit screen
    if (p.x >= TUBE.screenX - 4) {
      hitSum += p.y; hitN++;
      particles.splice(i, 1);
      continue;
    }

    // Out of tube
    if (p.y < TUBE.y + 10 || p.y > TUBE.y + TUBE.h - 10 || p.x > TUBE.x + TUBE.w || p.life <= 0) {
      particles.splice(i, 1);
    }
  }

  // Estimate undeflected and actual spot via trajectory integration for display
  undeflectedSpotY = TUBE.beamY;
  spotY = predictSpotY();
  if (hitN > 0) spotY = 0.85 * spotY + 0.15 * (hitSum / hitN);

  if (beamActive() && Math.random() < 0.55) spawnParticle();
}

function predictSpotY() {
  // Integrate a representative electron from cathode to screen
  let x = TUBE.cathodeX + 18, y = TUBE.beamY;
  let vx = electronSpeed(), vy = 0;
  const { ayE, ayB } = fieldAccel();
  for (let step = 0; step < 400 && x < TUBE.screenX; step++) {
    let ay = 0;
    if (x >= TUBE.fieldX0 && x <= TUBE.fieldX1) ay += ayE;
    if (x >= TUBE.magX0 && x <= TUBE.magX1) ay += ayB * vx;
    vy += ay;
    x += vx; y += vy;
    if (S.shadow && x > TUBE.objectX - 6 && x < TUBE.objectX + 6) {
      const cy = TUBE.beamY;
      const vert = Math.abs(x - TUBE.objectX) < 5 && Math.abs(y - cy) < 38;
      const horiz = Math.abs(y - cy) < 5 && Math.abs(x - TUBE.objectX) < 28;
      if (vert || horiz) return y; // blocked — spot may split; keep last
    }
  }
  return Math.max(TUBE.y + 20, Math.min(TUBE.y + TUBE.h - 20, y));
}

/* ============================================================
   RENDERING
============================================================ */
function resizeAll() {
  wrap = document.getElementById('canvas-wrap');
  canvas = document.getElementById('sim-canvas');
  if (!wrap || !canvas) return;
  const r = wrap.getBoundingClientRect();
  if (r.width < 10 || r.height < 10) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = r.width * dpr;
  canvas.height = r.height * dpr;
  canvas.style.width = r.width + 'px';
  canvas.style.height = r.height + 'px';
  ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  if (fCanvas) {
    fCanvas.setWidth(r.width);
    fCanvas.setHeight(r.height);
    fCanvas.calcOffset();
    const fabricContainer = document.querySelector('.canvas-container');
    if (fabricContainer) fabricContainer.style.pointerEvents = isAnnoActive ? 'auto' : 'none';
  } else if (typeof fabric !== 'undefined') {
    initAnnotationCanvas(r.width, r.height);
  }

  fitView();
}

function fitView() {
  const r = wrap.getBoundingClientRect();
  const sx = r.width / WORLD.w;
  const sy = r.height / WORLD.h;
  view.scale = Math.min(sx, sy) * 0.92;
  view.x = (r.width - WORLD.w * view.scale) / 2;
  view.y = (r.height - WORLD.h * view.scale) / 2;
}

function zoomBy(f) {
  const r = wrap.getBoundingClientRect();
  const cx = r.width / 2, cy = r.height / 2;
  const wx = (cx - view.x) / view.scale;
  const wy = (cy - view.y) / view.scale;
  view.scale = Math.max(0.4, Math.min(3.5, view.scale * f));
  view.x = cx - wx * view.scale;
  view.y = cy - wy * view.scale;
}

function resetView() { fitView(); }

function worldToScreen(x, y) {
  return { x: view.x + x * view.scale, y: view.y + y * view.scale };
}

function draw() {
  if (!ctx || !wrap) return;
  const r = wrap.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);

  // Lab background
  const g = ctx.createLinearGradient(0, 0, 0, r.height);
  g.addColorStop(0, '#0b1224');
  g.addColorStop(1, '#0f172a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, r.width, r.height);

  ctx.save();
  ctx.translate(view.x, view.y);
  ctx.scale(view.scale, view.scale);

  drawApparatus();
  drawFields();
  drawGasMolecules();
  drawParticles();
  drawScreenGlow();
  if (S.shadow) drawOpaqueCross();
  if (S.labels) drawLabels();
  drawPowerSupply();

  ctx.restore();

  // Status badge
  ctx.save();
  ctx.font = "700 12px Oxanium, monospace";
  ctx.fillStyle = S.power ? '#4ade80' : '#64748b';
  ctx.textAlign = 'left';
  ctx.fillText(S.power ? '● HV ON' : '○ HV OFF', 16, r.height - 16);
  ctx.restore();
}

function roundRect(x, y, w, h, rad) {
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
}

function drawApparatus() {
  const { x, y, w, h } = TUBE;

  // Tube outer glass
  const glass = ctx.createLinearGradient(x, y, x, y + h);
  glass.addColorStop(0, 'rgba(148, 220, 255, 0.18)');
  glass.addColorStop(0.5, 'rgba(100, 180, 220, 0.08)');
  glass.addColorStop(1, 'rgba(148, 220, 255, 0.16)');
  roundRect(x, y, w, h, 70);
  ctx.fillStyle = glass;
  ctx.fill();
  ctx.strokeStyle = 'rgba(186, 230, 253, 0.55)';
  ctx.lineWidth = 3;
  ctx.stroke();

  // Inner cavity
  roundRect(x + 8, y + 10, w - 16, h - 20, 60);
  ctx.fillStyle = 'rgba(8, 15, 30, 0.55)';
  ctx.fill();

  // Glass highlight
  ctx.beginPath();
  ctx.ellipse(x + w * 0.35, y + 28, w * 0.28, 10, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  ctx.fill();

  // Cathode
  ctx.fillStyle = '#94a3b8';
  roundRect(TUBE.cathodeX - 8, TUBE.beamY - 48, 16, 96, 4);
  ctx.fill();
  ctx.fillStyle = '#64748b';
  roundRect(TUBE.cathodeX - 14, TUBE.beamY - 54, 8, 108, 3);
  ctx.fill();
  // glow if on
  if (beamActive()) {
    ctx.shadowColor = '#22d3ee';
    ctx.shadowBlur = 18;
    ctx.fillStyle = 'rgba(34,211,238,0.35)';
    ctx.beginPath();
    ctx.arc(TUBE.cathodeX + 10, TUBE.beamY, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Anode with aperture
  ctx.fillStyle = '#cbd5e1';
  roundRect(TUBE.anodeX - 6, TUBE.beamY - 55, 14, 110, 3);
  ctx.fill();
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(TUBE.anodeX + 1, TUBE.beamY, 10, 0, Math.PI * 2);
  ctx.fill();

  // E-field plates
  ctx.fillStyle = S.Edir > 0 ? '#f87171' : '#60a5fa';
  roundRect(TUBE.fieldX0, TUBE.y + 22, TUBE.fieldX1 - TUBE.fieldX0, 14, 3);
  ctx.fill();
  ctx.fillStyle = S.Edir > 0 ? '#60a5fa' : '#f87171';
  roundRect(TUBE.fieldX0, TUBE.y + h - 36, TUBE.fieldX1 - TUBE.fieldX0, 14, 3);
  ctx.fill();
  ctx.fillStyle = '#e2e8f0';
  ctx.font = "700 11px Oxanium";
  ctx.textAlign = 'center';
  ctx.fillText(S.Edir > 0 ? '+' : '−', (TUBE.fieldX0 + TUBE.fieldX1) / 2, TUBE.y + 33);
  ctx.fillText(S.Edir > 0 ? '−' : '+', (TUBE.fieldX0 + TUBE.fieldX1) / 2, TUBE.y + h - 25);

  // Fluorescent screen
  const sg = ctx.createLinearGradient(TUBE.screenX, y + 20, TUBE.screenX + 18, y + h - 20);
  sg.addColorStop(0, '#14532d');
  sg.addColorStop(0.5, '#166534');
  sg.addColorStop(1, '#14532d');
  roundRect(TUBE.screenX, y + 24, 18, h - 48, 4);
  ctx.fillStyle = sg;
  ctx.fill();
  ctx.strokeStyle = '#86efac';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Vacuum port
  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(x + w * 0.55, y + h);
  ctx.lineTo(x + w * 0.55, y + h + 36);
  ctx.stroke();
  roundRect(x + w * 0.55 - 28, y + h + 36, 56, 28, 6);
  ctx.fillStyle = '#1e293b';
  ctx.fill();
  ctx.strokeStyle = '#475569';
  ctx.stroke();
  ctx.fillStyle = '#94a3b8';
  ctx.font = "600 9px Manrope";
  ctx.textAlign = 'center';
  ctx.fillText('VACUUM', x + w * 0.55, y + h + 54);

  // Reference undeflected path
  if ((S.Eon || S.Bon) && beamActive()) {
    ctx.setLineDash([6, 6]);
    ctx.strokeStyle = 'rgba(148,163,184,0.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(TUBE.cathodeX + 20, TUBE.beamY);
    ctx.lineTo(TUBE.screenX, TUBE.beamY);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Scale ruler
  ctx.strokeStyle = 'rgba(100,116,139,0.7)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(TUBE.screenX + 30, TUBE.beamY - 60);
  ctx.lineTo(TUBE.screenX + 30, TUBE.beamY + 60);
  ctx.stroke();
  for (let i = -3; i <= 3; i++) {
    const yy = TUBE.beamY + i * 20;
    ctx.beginPath();
    ctx.moveTo(TUBE.screenX + 26, yy);
    ctx.lineTo(TUBE.screenX + 34, yy);
    ctx.stroke();
  }
}

function drawFields() {
  if (S.Eon && S.showE) {
    ctx.strokeStyle = 'rgba(250, 204, 21, 0.35)';
    ctx.lineWidth = 1;
    const n = 7;
    for (let i = 0; i < n; i++) {
      const xx = TUBE.fieldX0 + 20 + i * ((TUBE.fieldX1 - TUBE.fieldX0 - 40) / (n - 1));
      ctx.beginPath();
      if (S.Edir > 0) {
        ctx.moveTo(xx, TUBE.y + 40);
        ctx.lineTo(xx, TUBE.y + TUBE.h - 40);
      } else {
        ctx.moveTo(xx, TUBE.y + TUBE.h - 40);
        ctx.lineTo(xx, TUBE.y + 40);
      }
      ctx.stroke();
      // arrow
      const ay = S.Edir > 0 ? TUBE.y + TUBE.h - 48 : TUBE.y + 48;
      const dir = S.Edir > 0 ? 1 : -1;
      ctx.beginPath();
      ctx.moveTo(xx, ay);
      ctx.lineTo(xx - 4, ay - dir * 8);
      ctx.lineTo(xx + 4, ay - dir * 8);
      ctx.closePath();
      ctx.fillStyle = 'rgba(250, 204, 21, 0.5)';
      ctx.fill();
    }
  }

  if (S.Bon && S.showB) {
    ctx.fillStyle = 'rgba(167, 139, 250, 0.55)';
    ctx.font = "700 14px Oxanium";
    ctx.textAlign = 'center';
    for (let xi = TUBE.magX0 + 16; xi < TUBE.magX1; xi += 28) {
      for (let yi = TUBE.y + 50; yi < TUBE.y + TUBE.h - 40; yi += 28) {
        ctx.fillText(S.Bdir > 0 ? '×' : '•', xi, yi);
      }
    }
    // Mag region border
    ctx.strokeStyle = 'rgba(167, 139, 250, 0.3)';
    ctx.strokeRect(TUBE.magX0, TUBE.y + 40, TUBE.magX1 - TUBE.magX0, TUBE.h - 80);
  }
}

function drawGasMolecules() {
  const density = Math.max(2, Math.round((100 - S.pressure) / 8));
  const color = GAS_COLORS[S.gas] || '#94a3b8';
  ctx.fillStyle = color;
  // Deterministic pseudo-random positions
  let seed = S.gas.charCodeAt(0) * 17 + density;
  for (let i = 0; i < density; i++) {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    const gx = TUBE.x + 40 + (seed % (TUBE.w - 80));
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    const gy = TUBE.y + 30 + (seed % (TUBE.h - 60));
    const r = 2 + (seed % 3);
    ctx.globalAlpha = 0.35 + (S.pressure < 40 ? 0.25 : 0);
    ctx.beginPath();
    ctx.arc(gx, gy, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawParticles() {
  if (!beamActive()) return;

  // Beam glow corridor
  const grd = ctx.createLinearGradient(TUBE.cathodeX, 0, TUBE.screenX, 0);
  grd.addColorStop(0, 'rgba(34,211,238,0.0)');
  grd.addColorStop(0.2, 'rgba(34,211,238,0.12)');
  grd.addColorStop(0.8, 'rgba(52,211,153,0.1)');
  grd.addColorStop(1, 'rgba(52,211,153,0.0)');
  ctx.fillStyle = grd;
  // approximate beam band following spot
  ctx.beginPath();
  ctx.moveTo(TUBE.cathodeX + 20, TUBE.beamY - 8);
  ctx.quadraticCurveTo((TUBE.cathodeX + TUBE.screenX) / 2, (TUBE.beamY + spotY) / 2 - 10, TUBE.screenX, spotY - 10);
  ctx.lineTo(TUBE.screenX, spotY + 10);
  ctx.quadraticCurveTo((TUBE.cathodeX + TUBE.screenX) / 2, (TUBE.beamY + spotY) / 2 + 10, TUBE.cathodeX + 20, TUBE.beamY + 8);
  ctx.closePath();
  ctx.fill();

  particles.forEach(p => {
    // trail
    if (p.trail.length > 1) {
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(34,211,238,0.35)';
      ctx.lineWidth = 2;
      ctx.moveTo(p.trail[0].x, p.trail[0].y);
      for (let i = 1; i < p.trail.length; i++) ctx.lineTo(p.trail[i].x, p.trail[i].y);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3.2, 0, Math.PI * 2);
    ctx.fillStyle = '#22d3ee';
    ctx.shadowColor = '#22d3ee';
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
    // tiny minus mark
    ctx.fillStyle = '#ecfeff';
    ctx.font = "700 8px Oxanium";
    ctx.textAlign = 'center';
    ctx.fillText('−', p.x, p.y - 6);
  });
}

function drawScreenGlow() {
  if (!beamActive()) return;
  const intensity = Math.min(1, (S.V / 5000) * (S.pressure / 100) * 1.4);
  ctx.save();
  ctx.shadowColor = '#4ade80';
  ctx.shadowBlur = 25 * intensity;
  ctx.fillStyle = `rgba(74, 222, 128, ${0.35 + 0.5 * intensity})`;
  ctx.beginPath();
  ctx.ellipse(TUBE.screenX + 9, spotY, 7, 14 + 8 * intensity, 0, 0, Math.PI * 2);
  ctx.fill();

  // Shadow dark band if opaque object
  if (S.shadow) {
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
    // Cross-shaped shadow projection
    ctx.fillRect(TUBE.screenX + 2, TUBE.beamY - 36, 14, 72);
    ctx.fillRect(TUBE.screenX - 2, TUBE.beamY - 5, 22, 10);
  }
  ctx.restore();

  // Spot markers
  if (S.Eon || S.Bon) {
    ctx.fillStyle = 'rgba(148,163,184,0.7)';
    ctx.beginPath();
    ctx.arc(TUBE.screenX + 40, undeflectedSpotY, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#4ade80';
    ctx.beginPath();
    ctx.arc(TUBE.screenX + 40, spotY, 5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawOpaqueCross() {
  const cx = TUBE.objectX, cy = TUBE.beamY;
  ctx.fillStyle = '#334155';
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 2;
  // vertical
  roundRect(cx - 5, cy - 38, 10, 76, 2);
  ctx.fill(); ctx.stroke();
  // horizontal
  roundRect(cx - 28, cy - 5, 56, 10, 2);
  ctx.fill(); ctx.stroke();
}

function drawLabels() {
  const L = [
    { x: TUBE.cathodeX, y: TUBE.y - 18, text: t('lbl_cathode'), color: '#f87171' },

    { x: (TUBE.fieldX0 + TUBE.fieldX1) / 2, y: TUBE.y + TUBE.h + 18, text: t('lbl_plates'), color: '#fbbf24' },

  if (beamActive()) L.push({ x: 450, y: TUBE.beamY - 50, text: t('lbl_rays'), color: '#22d3ee' });

  L.forEach(lb => {

}

function drawPowerSupply() {
  const px = 80, py = 430;
  roundRect(px, py, 200, 90, 12);
  ctx.fillStyle = 'rgba(30,41,59,0.9)';
  ctx.fill();
  ctx.strokeStyle = S.power ? 'rgba(34,197,94,0.6)' : 'rgba(100,116,139,0.5)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#22d3ee';
  ctx.font = "700 12px Oxanium";
  ctx.textAlign = 'left';
  ctx.fillText('HV SUPPLY', px + 14, py + 24);
  ctx.fillStyle = '#e2e8f0';
  ctx.font = "700 16px Oxanium";
  ctx.fillText(S.V + ' V', px + 14, py + 50);
  ctx.fillStyle = S.power ? '#4ade80' : '#64748b';
  ctx.font = "700 12px Oxanium";
  ctx.fillText(S.power ? '● ON' : '○ OFF', px + 14, py + 72);
  ctx.fillStyle = '#f87171';
  ctx.fillText('CAT −', px + 100, py + 50);
  ctx.fillStyle = '#60a5fa';
  ctx.fillText('AN  +', px + 100, py + 72);

  // Wires
  ctx.strokeStyle = '#f87171';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(px + 40, py);
  ctx.lineTo(px + 40, TUBE.y + TUBE.h);
  ctx.lineTo(TUBE.cathodeX, TUBE.y + TUBE.h);
  ctx.lineTo(TUBE.cathodeX, TUBE.beamY + 54);
  ctx.stroke();
  ctx.strokeStyle = '#60a5fa';
  ctx.beginPath();
  ctx.moveTo(px + 160, py);
  ctx.lineTo(px + 160, TUBE.y + TUBE.h + 10);
  ctx.lineTo(TUBE.anodeX, TUBE.y + TUBE.h + 10);
  ctx.lineTo(TUBE.anodeX, TUBE.beamY + 55);
  ctx.stroke();
}

/* ============================================================
   ZOOM / PAN INPUT
============================================================ */
function setupPointer() {
  canvas.addEventListener('mousedown', e => {
    if (isAnnoActive) return;
    isPanning = true;
    canvas.classList.replace('cursor-grab', 'cursor-grabbing');
    panStart = { x: e.clientX, y: e.clientY };
    viewStart = { x: view.x, y: view.y };
  });
  window.addEventListener('mousemove', e => {
    if (!isPanning) return;
    view.x = viewStart.x + (e.clientX - panStart.x);
    view.y = viewStart.y + (e.clientY - panStart.y);
  });
  window.addEventListener('mouseup', () => {
    isPanning = false;
    if (canvas) canvas.classList.replace('cursor-grabbing', 'cursor-grab');
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const f = e.deltaY < 0 ? 1.1 : 1 / 1.1;
    const rect = wrap.getBoundingClientRect();
    const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
    const wx = (cx - view.x) / view.scale;
    const wy = (cy - view.y) / view.scale;
    view.scale = Math.max(0.4, Math.min(3.5, view.scale * f));
    view.x = cx - wx * view.scale;
    view.y = cy - wy * view.scale;
  }, { passive: false });

  // Touch pinch + pan
  let touches = {};
  canvas.addEventListener('touchstart', e => {
    if (isAnnoActive) return;
    e.preventDefault();
    for (const tch of e.changedTouches) touches[tch.identifier] = { x: tch.clientX, y: tch.clientY };
    const ids = Object.keys(touches);
    if (ids.length === 1) {
      isPanning = true;
      panStart = { x: touches[ids[0]].x, y: touches[ids[0]].y };
      viewStart = { x: view.x, y: view.y };
    } else if (ids.length === 2) {
      const a = touches[ids[0]], b = touches[ids[1]];
      pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
    }
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    if (isAnnoActive) return;
    e.preventDefault();
    for (const tch of e.changedTouches) touches[tch.identifier] = { x: tch.clientX, y: tch.clientY };
    const ids = Object.keys(touches);
    if (ids.length === 2) {
      const a = touches[ids[0]], b = touches[ids[1]];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchDist > 0) zoomBy(d / pinchDist);
      pinchDist = d;
      isPanning = false;
    } else if (ids.length === 1 && isPanning) {
      view.x = viewStart.x + (touches[ids[0]].x - panStart.x);
      view.y = viewStart.y + (touches[ids[0]].y - panStart.y);
    }
  }, { passive: false });
  canvas.addEventListener('touchend', e => {
    for (const tch of e.changedTouches) delete touches[tch.identifier];
    if (Object.keys(touches).length < 2) pinchDist = 0;
    if (Object.keys(touches).length === 0) isPanning = false;
  });
}

/* ============================================================
   QUIZ
============================================================ */
const QUIZ = [
  { q:'q1', opts:['q1a','q1b','q1c','q1d'], ans:1, exp:'q1e' },
  { q:'q2', opts:['q2a','q2b','q2c','q2d'], ans:1, exp:'q2e' },
  { q:'q3', opts:['q3a','q3b','q3c','q3d'], ans:0, exp:'q3e' },
  { q:'q4', opts:['q4a','q4b','q4c','q4d'], ans:1, exp:'q4e' },
  { q:'q5', opts:['q5a','q5b','q5c','q5d'], ans:1, exp:'q5e' },
];
let quizIdx = 0, quizScore = 0, quizLocked = false, quizDone = false, quizAnswers = [];

function renderQuiz() {
  const box = document.getElementById('quiz-box');
  if (quizDone) {
    const pct = Math.round((quizScore / QUIZ.length) * 100);
    box.innerHTML = `
      <div class="text-center space-y-6 fade-in">
        <h2 class="font-display text-2xl text-cyan-400 font-bold">${t('quiz_score')}</h2>
        <div class="text-6xl font-black text-white font-display">${quizScore}<span class="text-2xl text-slate-400">/${QUIZ.length}</span></div>
        <div class="text-xl text-slate-300">${t('quiz_pct')}: <span class="stat-val">${pct}%</span></div>
        <button onclick="restartQuiz()" class="px-8 py-3 rounded-xl font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 hover:bg-cyan-500/30 transition">
          <i class="fa-solid fa-rotate-right"></i> ${t('quiz_restart')}
        </button>
      </div>`;
    return;
  }
  const Q = QUIZ[quizIdx];
  box.innerHTML = `
    <div class="space-y-5">
      <div class="flex justify-between items-center text-sm text-slate-400">
        <span class="font-display font-bold text-cyan-400">${t('quiz_title')}</span>
        <span>${t('quiz_q')} ${quizIdx + 1} ${t('quiz_of')} ${QUIZ.length}</span>
      </div>
      <h3 class="text-lg md:text-xl font-bold text-slate-100 leading-relaxed">${t(Q.q)}</h3>
      <div class="space-y-3" id="quiz-opts">
        ${Q.opts.map((ok,i) => `
          <button onclick="answerQuiz(${i})" class="opt-btn w-full text-start px-4 py-3.5 rounded-xl text-sm md:text-base font-semibold text-slate-200 ${quizLocked?'locked':''}" id="opt-${i}">
            <span class="stat-val me-2">${String.fromCharCode(65+i)}.</span> ${t(ok)}
          </button>`).join('')}
      </div>
      <div id="quiz-feedback" class="hidden glass-panel rounded-xl p-4 text-sm"></div>
      <div class="flex justify-end">
        <button id="quiz-next" onclick="nextQuiz()" class="hidden px-6 py-3 rounded-xl font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-500/40">
          ${quizIdx === QUIZ.length - 1 ? t('quiz_finish') : t('quiz_next')}
        </button>
      </div>
    </div>`;
}

function answerQuiz(i) {
  if (quizLocked) return;
  quizLocked = true;
  const Q = QUIZ[quizIdx];
  const correct = i === Q.ans;
  if (correct) quizScore++;
  quizAnswers[quizIdx] = i;
  document.querySelectorAll('.opt-btn').forEach(b => b.classList.add('locked'));
  document.getElementById('opt-' + Q.ans).classList.add('correct');
  if (!correct) document.getElementById('opt-' + i).classList.add('wrong');
  const fb = document.getElementById('quiz-feedback');
  fb.classList.remove('hidden');
  fb.innerHTML = `<div class="font-bold mb-1 ${correct?'text-green-400':'text-red-400'}">${correct ? t('quiz_correct') : t('quiz_wrong')}</div>
    <div class="text-slate-300"><span class="text-slate-500">${t('quiz_explain')}:</span> ${t(Q.exp)}</div>`;
  document.getElementById('quiz-next').classList.remove('hidden');
}

function nextQuiz() {
  if (quizIdx >= QUIZ.length - 1) { quizDone = true; renderQuiz(); return; }
  quizIdx++;
  quizLocked = false;
  renderQuiz();
}

function restartQuiz() {
  quizIdx = 0; quizScore = 0; quizLocked = false; quizDone = false; quizAnswers = [];
  renderQuiz();
}

/* ============================================================
   LOOP / BOOT
============================================================ */
function loop() {
  stepPhysics();
  draw();
  // lightweight obs update for deflection readout
  const defl = Math.abs(spotY - undeflectedSpotY) * 0.05;
  const el = document.getElementById('defl-val');
  if (el) el.textContent = defl.toFixed(1) + ' cm';
  animId = requestAnimationFrame(loop);
}

function boot() {
  changeLanguage(curLang);
  renderGasButtons();
  renderDiscoveries();
  document.getElementById('tip-text').textContent = currentTip();
  updateObservation();

  setTimeout(() => {
    const intro = document.getElementById('intro');
    intro.style.opacity = '0';
    setTimeout(() => {
      intro.style.display = 'none';
      const app = document.getElementById('app');
      app.style.opacity = '1';
      resizeAll();
      setupPointer();
      loop();
    }, 800);
  }, 5000);

  window.addEventListener('resize', () => { resizeAll(); });
}

boot();
</script>
