<style>
/* Jameel Noori Nastaliq — preferred Urdu font */
@font-face {
  font-family: 'Jameel Noori Nastaliq';
  src: url('https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoNastaliqUrdu/NotoNastaliqUrdu-Regular.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Jameel Noori Nastaliq';
  src: url('https://fonts.gstatic.com/s/notonastaliqurdu/v20/IuY0AF1fVWPbIPWghJFXNGAW9OX-02U.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

/* ==================== BASE CSS (IQRA DESIGN SYSTEM) ==================== */
/* Custom Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #0f172a; }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #475569; }

/* RTL Styling Adjustments for Urdu with Jameel Noori Nastaliq */
[dir="rtl"] .rtl-flip { transform: scaleX(-1); }
[dir="rtl"] {
  font-family: 'Jameel Noori Nastaliq', 'Noto Nastaliq Urdu', serif !important;
  line-height: 2.3 !important;
}

/* Glassmorphism Classes */
.glass-panel {
  background: rgba(15, 23, 42, 0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.1);
}
.glass-card {
  background: rgba(30, 41, 59, 0.6);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.08);
}

/* Pulse Glow Effects */
.glow-cyan { box-shadow: 0 0 20px rgba(0, 243, 255, 0.35); }
.glow-red { box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
.glow-green { box-shadow: 0 0 20px rgba(34, 197, 94, 0.35); }

/* Canvas styling */
canvas { touch-action: none; }

/* Custom Slider Styling */
input[type=range] {
  -webkit-appearance: none;
  background: #334155;
  border-radius: 8px;
  height: 8px;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  height: 20px;
  width: 20px;
  border-radius: 50%;
  background: #00f3ff;
  cursor: pointer;
  box-shadow: 0 0 10px #00f3ff;
  transition: transform 0.1s ease;
}
input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
input[type=range]:disabled::-webkit-slider-thumb { background: #64748b; box-shadow: none; cursor: not-allowed; }

/* ==================== Extended design language ==================== */
body {
  font-family: 'Manrope', sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  overflow: hidden;
}
.font-display { font-family: 'Oxanium', 'Manrope', sans-serif; }
[dir="rtl"] .font-display { font-family: 'Jameel Noori Nastaliq', 'Noto Nastaliq Urdu', serif; }
[dir="rtl"] body, [dir="rtl"] { font-size: 1.08em; }

.bg-grid {
  background-image:
    linear-gradient(rgba(0,243,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,243,255,0.04) 1px, transparent 1px);
  background-size: 44px 44px;
}

/* Intro */
#intro {
  position: fixed; inset: 0; z-index: 100;
  background: radial-gradient(ellipse at center, #10233f 0%, #0f172a 65%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity .7s ease;
}
.intro-title {
  font-family: 'Oxanium', sans-serif;
  font-weight: 800; letter-spacing: .14em;
  background: linear-gradient(92deg, #00f3ff, #7dd3fc, #00f3ff);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: introZoom 1.6s cubic-bezier(.2,.8,.2,1) both, glowPulse 2s ease-in-out infinite;
}
.intro-topic {
  color: #94a3b8; letter-spacing: .28em;
  animation: introFade 1.4s .35s ease both;
}
.intro-ring {
  width: 160px; height: 160px; border-radius: 50%;
  border: 2px solid rgba(0,243,255,.35);
  box-shadow: 0 0 60px rgba(0,243,255,.25), inset 0 0 40px rgba(0,243,255,.12);
  display:flex; align-items:center; justify-content:center;
  animation: ringSpin 2.4s linear infinite, introZoom 1.2s ease both;
  margin-bottom: 28px; position: relative;
}
.intro-ring::before {
  content:''; position:absolute; inset:-10px; border-radius:50%;
  border-top: 2px solid #00f3ff; border-right: 2px solid transparent;
  border-bottom: 2px solid transparent; border-left: 2px solid transparent;
}
@keyframes ringSpin { to { transform: rotate(360deg); } }
@keyframes introZoom { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
@keyframes introFade { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes glowPulse {
  0%,100% { text-shadow: 0 0 24px rgba(0,243,255,.55); }
  50% { text-shadow: 0 0 54px rgba(0,243,255,.9); }
}

/* Tabs */
.tab-btn {
  position: relative; transition: color .25s ease, background-color .25s ease;
  border-radius: 12px;
}
.tab-btn.active {
  color: #00f3ff; background: rgba(0,243,255,.08);
  box-shadow: inset 0 0 0 1px rgba(0,243,255,.35), 0 0 18px rgba(0,243,255,.15);
}
.view { animation: viewIn .35s ease both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.toggle-btn {
  transition: background-color .25s ease, color .25s ease, box-shadow .25s ease, transform .15s ease;
  border: 1px solid rgba(255,255,255,.1);
}
.toggle-btn:active { transform: scale(.96); }
.toggle-btn.active {
  background: rgba(0,243,255,.12); color: #00f3ff;
  border-color: rgba(0,243,255,.5); box-shadow: 0 0 16px rgba(0,243,255,.25);
}
.toggle-btn.on-batt {
  background: rgba(34,197,94,.14); color: #4ade80;
  border-color: rgba(34,197,94,.5); box-shadow: 0 0 16px rgba(34,197,94,.25);
}

.opt-btn {
  transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .12s ease;
  border: 1px solid rgba(255,255,255,.1);
}
.opt-btn:not(.locked):hover { border-color: rgba(0,243,255,.45); background: rgba(0,243,255,.06); }
.opt-btn:not(.locked):active { transform: scale(.98); }
.opt-btn.correct { background: rgba(34,197,94,.16); border-color:#22c55e; box-shadow: 0 0 18px rgba(34,197,94,.3); }
.opt-btn.wrong { background: rgba(239,68,68,.14); border-color:#ef4444; box-shadow: 0 0 18px rgba(239,68,68,.3); }

.zoom-btn {
  width: 42px; height: 42px; border-radius: 12px;
  background: rgba(15,23,42,.8); border:1px solid rgba(255,255,255,.12);
  color:#00f3ff; display:flex; align-items:center; justify-content:center;
  backdrop-filter: blur(8px); cursor:pointer;
  transition: background-color .2s ease, box-shadow .2s ease, transform .12s ease;
}
.zoom-btn:hover { background: rgba(0,243,255,.12); box-shadow: 0 0 14px rgba(0,243,255,.25); }
.zoom-btn:active { transform: scale(.92); }

.stat-val { font-family: 'Oxanium', monospace; color:#00f3ff; }
[dir="rtl"] .stat-val { font-family: 'Oxanium', monospace !important; line-height: 1.4 !important; }
.num { font-family:'Oxanium', monospace !important; line-height:1.4 !important; direction:ltr; unicode-bidi:embed; }

.fade-in { animation: viewIn .4s ease both; }
.score-ring { filter: drop-shadow(0 0 14px rgba(0,243,255,.5)); }

/* Fabric overlay sits above sim canvas */
#canvas-wrap .canvas-container {
  position: absolute !important;
  inset: 0;
  width: 100% !important;
  height: 100% !important;
  pointer-events: none;
  z-index: 20;
}
#fabricLayer, .upper-canvas, .lower-canvas {
  width: 100% !important;
  height: 100% !important;
}

/* Floating annotation mini-card (collapsible companion to header toolbar) */
#anno-float {
  position: absolute;
  z-index: 25;
  top: 12px;
  inset-inline-start: 12px;
  transition: all .3s ease;
  pointer-events: auto;
}
#anno-float.minimized .anno-float-body { display: none; }
#anno-float.minimized { width: auto; }
</style>
</head>
<body class="bg-grid">

<!-- ===================== INTRO (~5s) ===================== -->
<div id="intro">
  <div class="intro-ring"><i class="fa-solid fa-bolt text-5xl text-cyan-300" style="filter:drop-shadow(0 0 14px rgba(0,243,255,.8))"></i></div>
  <div class="intro-title text-4xl sm:text-5xl lg:text-6xl">IQRA VIRTUAL LAB</div>
  <div class="intro-topic text-base md:text-lg mt-5 font-bold uppercase tracking-widest" id="intro-topic">CURRENT THROUGH A WIRE</div>

    <span data-i18n="loading">Loading interactive lab...</span>

</div>

<!-- ===================== APP ===================== -->
<div id="app" class="h-screen flex flex-col opacity-0 transition-opacity duration-700">

  <!-- HEADER -->
  <header class="glass-panel flex items-center justify-between px-3 md:px-6 py-3 z-30 gap-2">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-10 h-10 rounded-xl bg-slate-900 border border-cyan-500/40 glow-cyan flex items-center justify-center shrink-0">
        <i class="fa-solid fa-bolt text-cyan-400"></i>
      </div>
      <div class="min-w-0">
        <div class="font-display font-extrabold tracking-widest text-cyan-400 text-sm md:text-base truncate" style="font-family:'Oxanium',sans-serif !important;">IQRA VIRTUAL LAB</div>
        <div class="text-xs text-slate-400 truncate" data-i18n="topic"></div>
      </div>
    </div>

    <nav class="flex items-center gap-1 md:gap-2 glass-card rounded-2xl p-1.5 shrink-0">
      <button id="tab-sim" onclick="switchTab('sim')" class="tab-btn active px-3 md:px-6 py-2.5 font-bold text-sm md:text-base text-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-house"></i><span data-i18n="tab_sim"></span>
      </button>
      <button id="tab-quiz" onclick="switchTab('quiz')" class="tab-btn px-3 md:px-6 py-2.5 font-bold text-sm md:text-base text-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-clipboard-question"></i><span data-i18n="tab_quiz"></span>
      </button>
    </nav>

    <div class="flex items-center gap-3">
      <!-- Annotation Toolbar (Hidden by default) -->
      <div id="anno-toolbar" class="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 transition-all duration-300 max-w-0 overflow-hidden opacity-0">
        <input type="color" id="anno-color" value="#00f3ff" onchange="changeAnnoColor(this.value)" class="w-6 h-6 cursor-pointer bg-transparent border-0 p-0" title="Color">
        <button id="anno-pen" onclick="setAnnoMode('pen')" class="text-cyan-400 p-1.5 rounded hover:bg-slate-700 transition" title="Pen"><i class="fa-solid fa-pen"></i></button>
        <button id="anno-eraser" onclick="setAnnoMode('eraser')" class="text-slate-400 p-1.5 rounded hover:bg-slate-700 transition" title="Eraser"><i class="fa-solid fa-eraser"></i></button>
        <button onclick="clearAnnotations()" class="text-red-400 p-1.5 rounded hover:bg-slate-700 transition" title="Clear All"><i class="fa-solid fa-trash-can"></i></button>
      </div>

      <!-- Annotation Toggle Button -->
      <button id="btn-anno-toggle" onclick="toggleAnnotationMode()" class="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 flex items-center justify-center border border-slate-700 transition" title="Toggle Annotation">
        <i class="fa-solid fa-pen-nib"></i>
      </button>

      <!-- Language Selector -->
      <div class="relative">
        <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-slate-900 border border-slate-700 text-cyan-400 text-sm rounded-lg focus:ring-cyan-500 focus:border-cyan-500 px-3 py-2 cursor-pointer font-bold outline-none">
          <option value="en">🌐 English</option>
          <option value="ur">🌐 اردو</option>
          <option value="hi" disabled>🌐 हिंदी (Soon)</option>
          <option value="bn" disabled>🌐 বাংলা (Soon)</option>
          <option value="ta" disabled>🌐 தமிழ் (Soon)</option>
        </select>
      </div>

      <!-- Fullscreen Button -->
      <button onclick="toggleFullScreen()" class="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-400 flex items-center justify-center border border-slate-700 transition" title="Toggle Fullscreen">
        <i class="fa-solid fa-expand" id="fs-icon"></i>
      </button>
    </div>
  </header>

  <!-- ===================== SIMULATION VIEW ===================== -->
  <main id="view-sim" class="view flex-1 flex flex-col lg:flex-row gap-4 p-3 md:p-4 min-h-0 overflow-y-auto lg:overflow-hidden">

    <!-- CANVAS AREA -->
    <section class="flex-1 flex flex-col gap-3 min-h-0 min-w-0">
      <div id="canvas-wrap" class="glass-card rounded-2xl relative flex-1 min-h-[340px] overflow-hidden">
        <canvas id="sim-canvas" class="absolute inset-0 w-full h-full cursor-grab"></canvas>
        <canvas id="fabricLayer"></canvas>

        <!-- Collapsible floating annotation companion card -->
        <div id="anno-float" class="minimized glass-panel rounded-xl shadow-lg hidden">
          <div class="flex items-center gap-2 px-2 py-1.5">
            <button onclick="toggleAnnoFloat()" class="w-8 h-8 rounded-lg bg-slate-800 text-cyan-400 flex items-center justify-center border border-slate-700" title="Minimize">
              <i class="fa-solid fa-pen-ruler text-sm" id="anno-float-icon"></i>
            </button>
            <div class="anno-float-body flex items-center gap-2 pe-1">
              <span class="text-xs text-slate-400 font-bold" data-i18n="anno_label">Annotate</span>
              <button onclick="setAnnoMode('pen')" class="text-cyan-400 p-1 rounded hover:bg-slate-700"><i class="fa-solid fa-pen text-xs"></i></button>
              <button onclick="setAnnoMode('eraser')" class="text-slate-400 p-1 rounded hover:bg-slate-700"><i class="fa-solid fa-eraser text-xs"></i></button>
              <button onclick="clearAnnotations()" class="text-red-400 p-1 rounded hover:bg-slate-700"><i class="fa-solid fa-trash-can text-xs"></i></button>

          </div>
        </div>

          <button class="zoom-btn" onclick="zoomBy(1/1.2)" title="−"><i class="fa-solid fa-minus"></i></button>
          <button class="zoom-btn" onclick="resetView()" title="Reset"><i class="fa-solid fa-crosshairs"></i></button>
        </div>

        <div id="state-badge" class="absolute top-3 glass-panel rounded-xl px-4 py-2 text-xs md:text-sm text-cyan-300 pointer-events-none z-10" style="inset-inline-start:12px">
          <i class="fa-solid fa-circle-info"></i> <span id="state-badge-text"></span>
        </div>
      </div>
    </section>

    <!-- SIDE PANEL -->
    <aside class="w-full lg:w-[340px] xl:w-[380px] flex flex-col gap-3 lg:overflow-y-auto lg:min-h-0 shrink-0 pb-2">

      <!-- Battery / Circuit -->
      <div class="glass-card rounded-2xl p-5 space-y-4">
        <h2 class="font-display font-bold text-base text-cyan-400 flex items-center gap-2">
          <i class="fa-solid fa-car-battery"></i><span data-i18n="ctrl_circuit"></span>

          <i class="fa-solid fa-power-off"></i><span id="batt-label"></span>
        </button>
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-bold text-slate-300" data-i18n="voltage"></label>

        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-bold text-slate-300" data-i18n="resistance"></label>

          </div>
          <input type="range" id="sl-r" class="w-full" min="1" max="20" step="0.5" value="5" oninput="onControls()">
        </div>
      </div>

      <!-- Overlays -->
      <div class="glass-card rounded-2xl p-5 space-y-3">
        <h2 class="font-display font-bold text-base text-cyan-400 flex items-center gap-2">
          <i class="fa-solid fa-eye"></i><span data-i18n="ctrl_overlay"></span>
        </h2>
        <button id="btn-e-flow" onclick="toggleOverlay('showEFlow')" class="toggle-btn active w-full px-4 py-3 rounded-xl font-bold text-sm text-slate-300 flex items-center justify-center gap-2">

        <button id="btn-i-flow" onclick="toggleOverlay('showIFlow')" class="toggle-btn active w-full px-4 py-3 rounded-xl font-bold text-sm text-slate-300 flex items-center justify-center gap-2">
          <i class="fa-solid fa-arrow-right-long"></i><span data-i18n="show_i_flow"></span>
        </button>

          <i class="fa-solid fa-location-arrow"></i><span data-i18n="show_arrows"></span>
        </button>
      </div>

        <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
          <span class="text-sm text-slate-400" data-i18n="obs_current"></span>
          <span class="stat-val text-sm num" id="obs-i">0.00 A</span>
        </div>
        <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">

          <span class="stat-val text-sm num" id="obs-vd">0.00</span>

          <span class="text-sm font-bold text-slate-100 text-end" id="obs-edir"></span>

        <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">

          <span class="text-sm font-bold text-slate-100 text-end" id="obs-idir"></span>
        </div>
        <div class="glass-panel rounded-xl px-4 py-3 text-sm font-bold text-center text-cyan-200" id="obs-state"></div>

      <!-- Concept Tip -->
      <div class="glass-card rounded-2xl p-5">
        <h2 class="font-display font-bold text-base text-green-400 flex items-center gap-2 mb-2">

        </h2>
        <p class="text-sm text-slate-300 leading-relaxed" id="tip-text"></p>
      </div>
    </aside>
  </main>

      <div id="quiz-box" class="glass-card rounded-2xl p-6 md:p-8"></div>
    </div>

/* ============================================================
   GLOBAL STATE
============================================================ */
let cur = localStorage.getItem('iqra_lang') || 'en';
const state = {
  batteryOn: false,
  voltage: 0,
  resistance: 5,
  showEFlow: true,
  showIFlow: true,
  showArrows: true,
  zoom: 1,
  panX: 0,
  panY: 0
};
const T = k => LANG[cur][k];

/* ============================================================
   ELECTRONS
============================================================ */
const N_E = 42;
const electrons = [];
function initElectrons(W, H) {
  electrons.length = 0;
  const wire = getWireRect(W, H);
  for (let i = 0; i < N_E; i++) {
    electrons.push({
      x: wire.x + 18 + Math.random() * (wire.w - 36),
      y: wire.y + 16 + Math.random() * (wire.h - 32),
      vx: (Math.random() - 0.5) * 2.2,
      vy: (Math.random() - 0.5) * 2.2,
      r: 9 + Math.random() * 2
    });
  }
}

function getWireRect(W, H) {
  const w = Math.min(W * 0.78, 720);
  const h = Math.min(H * 0.28, 160);
  return { x: (W - w) / 2, y: H * 0.32, w, h };
}

function effectiveVoltage() {
  return state.batteryOn ? state.voltage : 0;
}

function currentAmps() {
  const V = effectiveVoltage();
  if (V <= 0) return 0;
  return V / state.resistance;
}

function driftSpeed() {
  // Relative visual drift proportional to V/R
  return currentAmps() * 0.85;
}

/* ============================================================
   LANGUAGE / TABS / FULLSCREEN
============================================================ */
function changeLanguage(l) {
  cur = l;
  localStorage.setItem('iqra_lang', l);
  document.documentElement.setAttribute('dir', l === 'ur' ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', l);
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (typeof T(key) === 'string') el.textContent = T(key);
  });
  updateReadouts();
  renderQuiz();
}
function toggleFullScreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
    const ic = document.getElementById('fs-icon');
    if (ic) { ic.classList.remove('fa-expand'); ic.classList.add('fa-compress'); }
  } else {
    document.exitFullscreen();
    const ic = document.getElementById('fs-icon');
    if (ic) { ic.classList.remove('fa-compress'); ic.classList.add('fa-expand'); }
  }
}
document.addEventListener('fullscreenchange', () => {
  const ic = document.getElementById('fs-icon');
  if (!ic) return;
  if (document.fullscreenElement) { ic.classList.remove('fa-expand'); ic.classList.add('fa-compress'); }
  else { ic.classList.remove('fa-compress'); ic.classList.add('fa-expand'); }
});

function switchTab(t) {
  document.getElementById('view-sim').classList.toggle('hidden', t !== 'sim');
  document.getElementById('view-quiz').classList.toggle('hidden', t !== 'quiz');
  document.getElementById('tab-sim').classList.toggle('active', t === 'sim');
  document.getElementById('tab-quiz').classList.toggle('active', t === 'quiz');
  if (t === 'sim') { fitCanvas(); }
}

/* ============================================================
   CONTROLS
============================================================ */
function toggleBattery() {
  state.batteryOn = !state.batteryOn;
  if (!state.batteryOn) {
    state.voltage = 0;
    document.getElementById('sl-v').value = 0;
  } else if (state.voltage < 3) {
    state.voltage = 6;
    document.getElementById('sl-v').value = 6;
  }
  updateReadouts();
}
function toggleOverlay(key) {
  state[key] = !state[key];
  const map = { showEFlow: 'btn-e-flow', showIFlow: 'btn-i-flow', showArrows: 'btn-arrows' };
  document.getElementById(map[key]).classList.toggle('active', state[key]);
}
function onControls() {
  state.voltage = parseFloat(document.getElementById('sl-v').value);
  state.resistance = parseFloat(document.getElementById('sl-r').value);
  if (state.voltage > 0 && !state.batteryOn) {
    state.batteryOn = true;
  }
  updateReadouts();
}
function updateReadouts() {
  const V = effectiveVoltage();
  const I = currentAmps();
  const vd = driftSpeed();
  document.getElementById('val-v').textContent = V.toFixed(1) + ' V';
  document.getElementById('val-r').textContent = state.resistance.toFixed(1) + ' Ω';
  document.getElementById('obs-i').textContent = I.toFixed(2) + ' A';
  document.getElementById('obs-vd').textContent = vd.toFixed(2);
  document.getElementById('obs-edir').textContent = V > 0 ? T('dir_e') : T('dir_none');
  document.getElementById('obs-idir').textContent = V > 0 ? T('dir_i') : T('dir_none');
  document.getElementById('obs-state').textContent = V > 0 ? T('state_drift') : T('state_random');
  document.getElementById('state-badge-text').textContent = V > 0 ? T('badge_on') : T('badge_off');
  document.getElementById('batt-label').textContent = state.batteryOn ? T('batt_on') : T('batt_off');
  const bb = document.getElementById('btn-battery');
  bb.classList.toggle('on-batt', state.batteryOn);
  bb.classList.toggle('active', state.batteryOn);

  let tip = T('tip_off');
  if (V > 0 && V < 8) tip = T('tip_on');
  if (V >= 8 || (V > 0 && state.resistance <= 3)) tip = T('tip_high');
  document.getElementById('tip-text').textContent = tip;

  document.getElementById('sl-v').disabled = false;
}

/* ============================================================
   CANVAS / ZOOM / PAN
============================================================ */
const canvas = document.getElementById('sim-canvas');
const ctx = canvas.getContext('2d');
let baseScale = 1;
let W = 800, H = 500;
let dragging = false, lastX = 0, lastY = 0;
let pinch = null;

function fitCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  const rect = wrap.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(320, Math.floor(rect.width));
  H = Math.max(280, Math.floor(rect.height));
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  baseScale = Math.min(W / 900, H / 560);
  if (electrons.length === 0) initElectrons(900, 560);
  if (fCanvas) {
    fCanvas.setWidth(W);
    fCanvas.setHeight(H);
    fCanvas.calcOffset();
  } else {
    initAnnotationCanvas(W, H);
    const fabricContainer = document.querySelector('.canvas-container');
    if (fabricContainer) fabricContainer.style.pointerEvents = 'none';
  }
}

function S() { return baseScale * state.zoom; }
function TX(x) { return state.panX + x * S(); }
function TY(y) { return state.panY + y * S(); }

function zoomBy(k, cx, cy) {
  const old = state.zoom;
  state.zoom = Math.min(4, Math.max(0.45, state.zoom * k));
  const r = state.zoom / old;
  const px = cx != null ? cx : W / 2;
  const py = cy != null ? cy : H / 2;
  state.panX = px - (px - state.panX) * r;
  state.panY = py - (py - state.panY) * r;
}
function resetView() {
  state.zoom = 1;
  state.panX = (W - 900 * baseScale) / 2;
  state.panY = (H - 560 * baseScale) / 2;
}

/* Pointer interactions on sim canvas */
canvas.addEventListener('pointerdown', e => {
  if (isAnnoActive) return;
  dragging = true;
  lastX = e.clientX; lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
  canvas.classList.replace('cursor-grab', 'cursor-grabbing');
});
canvas.addEventListener('pointermove', e => {
  if (!dragging || isAnnoActive) return;
  state.panX += e.clientX - lastX;
  state.panY += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener('pointerup', () => {
  dragging = false;
  canvas.classList.replace('cursor-grabbing', 'cursor-grab');
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  zoomBy(e.deltaY < 0 ? 1.1 : 1/1.1, e.clientX - rect.left, e.clientY - rect.top);
}, { passive: false });

canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    const pts = [...e.touches].map(t => ({ x: t.clientX, y: t.clientY }));
    pinch = { d: Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y), z: state.zoom, cx: (pts[0].x+pts[1].x)/2, cy: (pts[0].y+pts[1].y)/2 };
  }
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinch) {
    e.preventDefault();
    const pts = [...e.touches].map(t => ({ x: t.clientX, y: t.clientY }));
    const d = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    const target = pinch.z * (d / pinch.d);
    const rect = canvas.getBoundingClientRect();
    zoomBy(target / state.zoom, (pts[0].x+pts[1].x)/2 - rect.left, (pts[0].y+pts[1].y)/2 - rect.top);
  }
}, { passive: false });
canvas.addEventListener('touchend', () => { pinch = null; });

/* ============================================================
   DRAWING
============================================================ */
function drawScene() {
  ctx.clearRect(0, 0, W, H);

  // Soft vignette background inside canvas
  const g = ctx.createRadialGradient(W/2, H/2, 40, W/2, H/2, Math.max(W,H)*0.7);
  g.addColorStop(0, 'rgba(15,30,55,0.35)');
  g.addColorStop(1, 'rgba(15,23,42,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(state.panX, state.panY);
  ctx.scale(S(), S());

  const VW = 900, VH = 560;
  const wire = getWireRect(VW, VH);
  const V = effectiveVoltage();

  // Title strip
  drawLabel(VW/2, 36, T('lbl_wire'), '#7dd3fc', 18, true);

  // Wire body
  roundRect(wire.x, wire.y, wire.w, wire.h, 18);
  const wg = ctx.createLinearGradient(wire.x, wire.y, wire.x, wire.y + wire.h);
  wg.addColorStop(0, '#d6b56d');
  wg.addColorStop(0.45, '#c4a35a');
  wg.addColorStop(1, '#9a7b3c');
  ctx.fillStyle = wg;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Inner metallic sheen
  roundRect(wire.x + 6, wire.y + 6, wire.w - 12, wire.h - 12, 14);
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fill();

  // Terminal polarity
  if (state.batteryOn || V > 0) {
    drawPole(wire.x - 8, wire.y + wire.h/2, '+', '#22c55e');
    drawPole(wire.x + wire.w + 8, wire.y + wire.h/2, '−', '#ef4444');
  }

  // Electrons
  updateElectrons(wire, V);
  for (const e of electrons) {
    // body
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    ctx.fillStyle = '#64748b';
    ctx.fill();
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // e label
    ctx.fillStyle = '#e2e8f0';
    ctx.font = "bold 11px 'Oxanium', monospace";
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('e', e.x, e.y + 0.5);

    if (state.showArrows) {
      const speed = Math.hypot(e.vx, e.vy) || 0.01;
      const ux = e.vx / speed, uy = e.vy / speed;
      const len = V > 0 ? 16 : 12;
      drawArrowHead(e.x + ux * (e.r + 2), e.y + uy * (e.r + 2), ux, uy, len, '#0f172a');
    }
  }

  // Callout to one electron
  if (electrons[0]) {
    const e0 = electrons[0];
    ctx.strokeStyle = 'rgba(0,243,255,0.45)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(e0.x + 12, e0.y - 12);
    ctx.lineTo(wire.x + wire.w - 40, wire.y - 28);
    ctx.stroke();
    drawLabel(wire.x + wire.w - 40, wire.y - 40, T('lbl_electron'), '#94a3b8', 13, true);
  }

  // Direction overlays
  if (V > 0) {
    if (state.showEFlow) {
      drawFlowBanner(wire.x + wire.w/2, wire.y - 58, T('lbl_e_flow'), -1, '#38bdf8');
    }
    if (state.showIFlow) {
      drawFlowBanner(wire.x + wire.w/2, wire.y + wire.h + 50, T('lbl_i_flow'), 1, '#fbbf24');
    }
  }

  // Battery / cell
  drawBattery(VW, VH, V);

  ctx.restore();
}

function updateElectrons(wire, V) {
  const drift = -driftSpeed(); // toward + (left)
  const thermal = V > 0 ? 1.4 : 2.0;
  for (const e of electrons) {
    // Random thermal kick
    e.vx += (Math.random() - 0.5) * 0.55;
    e.vy += (Math.random() - 0.5) * 0.55;
    // Damping toward thermal + drift
    e.vx += (drift - e.vx) * (V > 0 ? 0.04 : 0.02);
    e.vy *= 0.985;
    // Clamp speed
    const maxSp = thermal + Math.abs(drift) * 1.2;
    const sp = Math.hypot(e.vx, e.vy);
    if (sp > maxSp) { e.vx *= maxSp/sp; e.vy *= maxSp/sp; }

    e.x += e.vx;
    e.y += e.vy;

    // Bounce / wrap inside wire
    const pad = e.r + 4;
    if (e.y < wire.y + pad) { e.y = wire.y + pad; e.vy = Math.abs(e.vy); }
    if (e.y > wire.y + wire.h - pad) { e.y = wire.y + wire.h - pad; e.vy = -Math.abs(e.vy); }

    if (V > 0) {
      // Wrap horizontally to simulate continuous flow
      if (e.x < wire.x + pad) e.x = wire.x + wire.w - pad;
      if (e.x > wire.x + wire.w - pad) e.x = wire.x + pad;
    } else {
      if (e.x < wire.x + pad) { e.x = wire.x + pad; e.vx = Math.abs(e.vx); }
      if (e.x > wire.x + wire.w - pad) { e.x = wire.x + wire.w - pad; e.vx = -Math.abs(e.vx); }
    }
  }
}

function drawBattery(VW, VH, V) {
  const cx = VW / 2;
  const topY = getWireRect(VW, VH).y + getWireRect(VW, VH).h + 110;
  const on = state.batteryOn || V > 0;

  // Leads
  ctx.strokeStyle = on ? 'rgba(148,163,184,0.85)' : 'rgba(71,85,105,0.7)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(getWireRect(VW, VH).x, getWireRect(VW, VH).y + getWireRect(VW, VH).h);
  ctx.lineTo(getWireRect(VW, VH).x, topY + 20);
  ctx.lineTo(cx - 40, topY + 20);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(getWireRect(VW, VH).x + getWireRect(VW, VH).w, getWireRect(VW, VH).y + getWireRect(VW, VH).h);
  ctx.lineTo(getWireRect(VW, VH).x + getWireRect(VW, VH).w, topY + 20);
  ctx.lineTo(cx + 40, topY + 20);
  ctx.stroke();

  // Cell symbol: long | short
  ctx.strokeStyle = on ? '#22c55e' : '#64748b';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(cx - 18, topY);
  ctx.lineTo(cx - 18, topY + 40);
  ctx.stroke(); // positive long
  ctx.strokeStyle = on ? '#ef4444' : '#64748b';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(cx + 18, topY + 8);
  ctx.lineTo(cx + 18, topY + 32);
  ctx.stroke(); // negative short

  // Gap bridge when off
  if (!on) {
    ctx.setLineDash([6, 6]);
    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - 10, topY + 20);
    ctx.lineTo(cx + 10, topY + 20);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.fillStyle = on ? '#86efac' : '#94a3b8';
  ctx.font = urFont(14);
  ctx.textAlign = 'center';
  ctx.fillText(T('lbl_cell'), cx, topY + 68);
  ctx.fillStyle = '#4ade80';
  ctx.font = "bold 16px 'Oxanium', monospace";
  ctx.fillText('+', cx - 18, topY - 8);
  ctx.fillStyle = '#f87171';
  ctx.fillText('−', cx + 18, topY - 8);

  // Glow when on
  if (on && V > 0) {
    ctx.beginPath();
    ctx.arc(cx, topY + 20, 36 + V, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0,243,255,${0.04 + V * 0.008})`;
    ctx.fill();
  }
}

function drawPole(x, y, sym, color) {
  ctx.beginPath();
  ctx.arc(x, y, 16, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(15,23,42,0.9)';
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.font = "bold 18px 'Oxanium', monospace";
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(sym, x, y + 1);
}

function drawFlowBanner(x, y, text, dir, color) {
  // dir: -1 left, +1 right
  const w = Math.min(420, 28 + text.length * (cur === 'ur' ? 11 : 8));
  roundRect(x - w/2, y - 18, w, 36, 10);
  ctx.fillStyle = 'rgba(15,23,42,0.82)';
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.fillStyle = color;
  ctx.font = urFont(13);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);

  // Arrow beside banner
  const ax = dir < 0 ? x - w/2 - 28 : x + w/2 + 28;
  drawArrowHead(ax - dir * 18, y, dir, 0, 28, color);
}

function drawArrowHead(x, y, ux, uy, len, color) {
  const ex = x + ux * len, ey = y + uy * len;
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(ex, ey);
  ctx.stroke();
  const px = -uy, py = ux;
  ctx.beginPath();
  ctx.moveTo(ex, ey);
  ctx.lineTo(ex - ux * 8 + px * 5, ey - uy * 8 + py * 5);
  ctx.lineTo(ex - ux * 8 - px * 5, ey - uy * 8 - py * 5);
  ctx.closePath();
  ctx.fill();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function urFont(sz) {
  if (cur === 'ur') return `600 ${sz}px 'Jameel Noori Nastaliq','Noto Nastaliq Urdu',serif`;
  return `700 ${sz}px 'Manrope',sans-serif`;
}
function drawLabel(x, y, text, color, size, center) {
  ctx.fillStyle = color;
  ctx.font = urFont(size);
  ctx.textAlign = center ? 'center' : 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
}

/* ============================================================
   ANNOTATION (EXACT LOGIC AS REQUIRED)
============================================================ */
let fCanvas;
let isAnnoActive = false;

function initAnnotationCanvas(w, h) {
  fCanvas = new fabric.Canvas('fabricLayer', {
    isDrawingMode: false,
    width: w,
    height: h
  });
  fCanvas.freeDrawingBrush.color = document.getElementById('anno-color').value;
  fCanvas.freeDrawingBrush.width = 4;

  fCanvas.on('mouse:down', function(options) {
    if (isAnnoActive && !fCanvas.isDrawingMode && options.target) {
      fCanvas.remove(options.target);
    }
  });
}

function toggleAnnotationMode() {
  isAnnoActive = !isAnnoActive;
  const btn = document.getElementById('btn-anno-toggle');
  const toolbar = document.getElementById('anno-toolbar');
  const fabricContainer = document.querySelector('.canvas-container');
  const flo = document.getElementById('anno-float');

  if (isAnnoActive) {
    btn.classList.replace('text-slate-400', 'text-cyan-400');
    toolbar.classList.remove('max-w-0', 'opacity-0');
    toolbar.classList.add('max-w-xs', 'opacity-100');
    if (fabricContainer) fabricContainer.style.pointerEvents = 'auto';
    flo.classList.remove('hidden');
    flo.classList.remove('minimized');
    setAnnoMode('pen');
  } else {
    btn.classList.replace('text-cyan-400', 'text-slate-400');
    toolbar.classList.remove('max-w-xs', 'opacity-100');
    toolbar.classList.add('max-w-0', 'opacity-0');
    if (fabricContainer) fabricContainer.style.pointerEvents = 'none';
    flo.classList.add('hidden');
    if (fCanvas) fCanvas.isDrawingMode = false;
  }
}

function setAnnoMode(mode) {
  document.getElementById('anno-pen').classList.replace('text-cyan-400', 'text-slate-400');
  document.getElementById('anno-eraser').classList.replace('text-cyan-400', 'text-slate-400');

  if (mode === 'pen') {
    document.getElementById('anno-pen').classList.replace('text-slate-400', 'text-cyan-400');
    if (fCanvas) fCanvas.isDrawingMode = true;
  } else {
    document.getElementById('anno-eraser').classList.replace('text-slate-400', 'text-cyan-400');
    if (fCanvas) fCanvas.isDrawingMode = false;
  }
}

function changeAnnoColor(color) {
  if (fCanvas) fCanvas.freeDrawingBrush.color = color;
  setAnnoMode('pen');
}

function clearAnnotations() {
  if (fCanvas) fCanvas.clear();
}

function toggleAnnoFloat() {
  document.getElementById('anno-float').classList.toggle('minimized');
}

/* Make floating card lightly draggable */
(function() {
  const el = document.getElementById('anno-float');
  let dx=0, dy=0, ox=0, oy=0, on=false;
  el.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    on = true; ox = e.clientX; oy = e.clientY;
    const r = el.getBoundingClientRect();
    const wr = document.getElementById('canvas-wrap').getBoundingClientRect();
    dx = r.left - wr.left; dy = r.top - wr.top;
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', e => {
    if (!on) return;
    const wr = document.getElementById('canvas-wrap').getBoundingClientRect();
    let nx = dx + (e.clientX - ox);
    let ny = dy + (e.clientY - oy);
    nx = Math.max(4, Math.min(wr.width - 60, nx));
    ny = Math.max(4, Math.min(wr.height - 40, ny));
    el.style.left = nx + 'px';
    el.style.top = ny + 'px';
    el.style.right = 'auto';
    el.style.insetInlineStart = 'auto';
  });
  el.addEventListener('pointerup', () => { on = false; });
})();

/* ============================================================
   QUIZ
============================================================ */
const quiz = { i: 0, answers: Array(5).fill(null), done: false };
function restartQuiz() { quiz.i = 0; quiz.answers = Array(5).fill(null); quiz.done = false; renderQuiz(); }
function answer(oi) {
  if (quiz.answers[quiz.i] !== null) return;
  quiz.answers[quiz.i] = oi; renderQuiz();
}
function nextQ() {
  if (quiz.i < 4) quiz.i++; else quiz.done = true;
  renderQuiz();
}
function renderQuiz() {
  const box = document.getElementById('quiz-box');
  const Q = LANG[cur].quiz;
  if (quiz.done) {
    const score = quiz.answers.reduce((s, a, i) => s + (a === Q[i].a ? 1 : 0), 0);
    const pct = Math.round(score / 5 * 100);
    const msg = pct >= 80 ? T('score_msg_great') : pct >= 60 ? T('score_msg_good') : T('score_msg_low');
    const circ = 2 * Math.PI * 54;
    box.innerHTML = `
      <div class="fade-in text-center py-6">
        <h2 class="font-display text-lg font-bold text-cyan-400 mb-6">${T('final_score')}</h2>
        <div class="relative inline-block score-ring">
          <svg width="140" height="140" viewBox="0 0 140 140">
            <circle cx="70" cy="70" r="54" fill="none" stroke="#334155" stroke-width="10"/>
            <circle cx="70" cy="70" r="54" fill="none" stroke="#00f3ff" stroke-width="10" stroke-linecap="round"
              stroke-dasharray="${circ}" stroke-dashoffset="${circ * (1 - pct/100)}" transform="rotate(-90 70 70)"/>
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span class="num text-3xl font-extrabold text-cyan-300">${score}/5</span>
            <span class="num text-sm text-slate-400">${pct}%</span>
          </div>
        </div>
        <p class="mt-6 text-base text-slate-300">${msg}</p>
        <button onclick="restartQuiz()" class="mt-8 px-8 py-3.5 rounded-xl bg-cyan-500/15 border border-cyan-400/50 text-cyan-300 font-bold glow-cyan hover:bg-cyan-500/25 transition">
          <i class="fa-solid fa-rotate-right"></i> ${T('restart')}
        </button>
      </div>`;
    return;
  }
  const q = Q[quiz.i], picked = quiz.answers[quiz.i];
  const opts = q.opts.map((o, oi) => {
    let cls = 'opt-btn';
    if (picked !== null) {
      cls += ' locked';
      if (oi === q.a) cls += ' correct';
      else if (oi === picked) cls += ' wrong';
    }
    return `<button onclick="answer(${oi})" class="${cls} w-full text-start px-5 py-4 rounded-xl glass-panel text-sm md:text-base font-bold text-slate-200 flex items-center gap-3">
      <span class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-600 flex items-center justify-center text-cyan-400 num shrink-0">${String.fromCharCode(65+oi)}</span>
      <span>${o}</span>
    </button>`;
  }).join('');
  const fb = picked === null ? '' : `
    <div class="fade-in mt-5 rounded-xl px-5 py-4 ${picked === q.a ? 'bg-green-500/10 border border-green-500/40 glow-green' : 'bg-red-500/10 border border-red-500/40 glow-red'}">
      <div class="font-bold ${picked === q.a ? 'text-green-400' : 'text-red-400'} mb-1">
        <i class="fa-solid ${picked === q.a ? 'fa-circle-check' : 'fa-circle-xmark'}"></i> ${picked === q.a ? T('correct_fb') : T('wrong_fb')}
      </div>
      <p class="text-sm text-slate-300 leading-relaxed">${q.ex}</p>
    </div>
    <button onclick="nextQ()" class="mt-5 w-full px-6 py-3.5 rounded-xl bg-cyan-500/15 border border-cyan-400/50 text-cyan-300 font-bold hover:bg-cyan-500/25 transition">
      ${quiz.i < 4 ? T('next_q') : T('see_result')} <i class="fa-solid fa-arrow-right rtl-flip"></i>
    </button>`;
  box.innerHTML = `
    <div class="fade-in">
      <div class="flex items-center justify-between mb-5">
        <h2 class="font-display text-lg font-bold text-cyan-400">${T('quiz_title')}</h2>
        <span class="text-sm text-slate-400 font-bold">${T('quiz_progress')(quiz.i+1,5)}</span>
      </div>
      <div class="flex gap-1.5 mb-6">${[0,1,2,3,4].map(i =>
        `<div class="h-1.5 flex-1 rounded-full ${i < quiz.i || quiz.answers[i] !== null ? 'bg-cyan-400' : i === quiz.i ? 'bg-cyan-700' : 'bg-slate-700'}"></div>`).join('')}
      </div>
      <p class="text-base md:text-lg font-bold text-slate-100 mb-6 leading-relaxed">${q.q}</p>
      <div class="space-y-3">${opts}</div>
      ${fb}
    </div>`;
}

/* ============================================================
   ANIMATION LOOP & INIT
============================================================ */
function loop() {
  if (!window.__denied) drawScene();
  requestAnimationFrame(loop);
}

window.addEventListener('resize', () => {
  fitCanvas();
  resetView();
});

document.getElementById('lang-select').value = cur;
changeLanguage(cur);
document.getElementById('intro-topic').textContent = T('intro_topic');

setTimeout(() => {
  const intro = document.getElementById('intro'), app = document.getElementById('app');
  if (window.__denied || !intro || !app) return;
  intro.style.opacity = '0';
  app.style.opacity = '1';
  setTimeout(() => intro.remove(), 750);
  fitCanvas();
  resetView();
  updateReadouts();
}, 5000);

fitCanvas();
resetView();
updateReadouts();
renderQuiz();
requestAnimationFrame(loop);
</script>
