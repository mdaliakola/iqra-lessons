<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IQRA VIRTUAL LAB — Electrolysis of Water</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&family=Manrope:wght@400;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/jameel-noori-nastaleeq" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<style>
  @font-face {
    font-family: 'Jameel Noori Nastaliq';
    src: url('https://fonts.cdnfonts.com/s/15794/Jameel Noori Nastaleeq.woff') format('woff');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  /* Custom Scrollbar */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: #0f172a;
  }
  ::-webkit-scrollbar-thumb {
    background: #334155;
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #475569;
  }

  /* RTL Styling Adjustments for Urdu with Jameel Noori Nastaliq */
  [dir="rtl"] .rtl-flip {
    transform: scaleX(-1);
  }
  [dir="rtl"] {
    font-family: 'Jameel Noori Nastaliq', 'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', serif !important;
    line-height: 2.3 !important;
  }

  /* Glassmorphism Classes */
  .glass-panel {
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .glass-card {
    background: rgba(30, 41, 59, 0.6);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  /* Pulse Glow Effects */
  .glow-cyan {
    box-shadow: 0 0 20px rgba(0, 243, 255, 0.35);
  }
  .glow-red {
    box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
  }
  .glow-green {
    box-shadow: 0 0 20px rgba(34, 197, 94, 0.35);
  }

  /* Canvas styling */
  canvas {
    touch-action: none;
  }

  /* Custom Slider Styling */
  input[type=range] {
    -webkit-appearance: none;
    background: #334155;
    border-radius: 8px;
    height: 8px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    height: 20px;
    width: 20px;
    border-radius: 50%;
    background: #00f3ff;
    cursor: pointer;
    box-shadow: 0 0 10px #00f3ff;
    transition: transform 0.1s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
  }

  body {
    font-family: 'Manrope', sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    overflow: hidden;
  }
  .font-display { font-family: 'Oxanium', 'Manrope', sans-serif; }
  [dir="rtl"] .font-display { font-family: 'Jameel Noori Nastaliq', 'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', serif; }
  [dir="rtl"] body, [dir="rtl"] { font-size: 1.08em; }

  .bg-grid {
    background-image:
      linear-gradient(rgba(0,243,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,243,255,0.04) 1px, transparent 1px);
    background-size: 44px 44px;
  }

  #intro {
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(ellipse at center, #10233f 0%, #0f172a 65%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity .7s ease;
  }
  .intro-title {
    font-family: 'Oxanium', sans-serif;
    font-weight: 800; letter-spacing: .14em;
    background: linear-gradient(92deg, #00f3ff, #7dd3fc, #00f3ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: introZoom 1.6s cubic-bezier(.2,.8,.2,1) both, glowPulse 2s ease-in-out infinite;
  }
  .intro-topic {
    color: #94a3b8; letter-spacing: .28em;
    animation: introFade 1.4s .35s ease both;
  }
  .intro-ring {
    width: 168px; height: 168px; border-radius: 50%;
    border: 2px solid rgba(0,243,255,.35);
    box-shadow: 0 0 60px rgba(0,243,255,.25), inset 0 0 40px rgba(0,243,255,.12);
    display:flex; align-items:center; justify-content:center;
    animation: ringSpin 2.4s linear infinite, introZoom 1.2s ease both;
    margin-bottom: 28px; position: relative;
  }
  .intro-ring::before {
    content:''; position:absolute; inset:-10px; border-radius:50%;
    border-top: 2px solid #00f3ff; border-right: 2px solid transparent;
    border-bottom: 2px solid transparent; border-left: 2px solid transparent;
    animation: ringSpin 1.4s linear infinite;
  }
  @keyframes ringSpin { to { transform: rotate(360deg); } }
  @keyframes introZoom { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
  @keyframes introFade { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes glowPulse {
    0%,100% { text-shadow: 0 0 24px rgba(0,243,255,.55); }
    50% { text-shadow: 0 0 54px rgba(0,243,255,.9); }
  }

  .tab-btn {
    position: relative; transition: color .25s ease, background-color .25s ease;
    border-radius: 12px;
  }
  .tab-btn.active {
    color: #00f3ff;
    background: rgba(0,243,255,.08);
    box-shadow: inset 0 0 0 1px rgba(0,243,255,.35), 0 0 18px rgba(0,243,255,.15);
  }
  .view { animation: viewIn .35s ease both; }
  @keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .seg-btn {
    transition: background-color .25s ease, color .25s ease, box-shadow .25s ease, transform .15s ease;
    border: 1px solid rgba(255,255,255,.1);
  }
  .seg-btn:active { transform: scale(.96); }
  .seg-btn.active {
    background: rgba(0,243,255,.12); color: #00f3ff;
    border-color: rgba(0,243,255,.5); box-shadow: 0 0 16px rgba(0,243,255,.25);
  }

  .opt-btn {
    transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .12s ease;
    border: 1px solid rgba(255,255,255,.1);
  }
  .opt-btn:not(.locked):hover { border-color: rgba(0,243,255,.45); background: rgba(0,243,255,.06); }
  .opt-btn:not(.locked):active { transform: scale(.98); }
  .opt-btn.correct { background: rgba(34,197,94,.16); border-color:#22c55e; box-shadow: 0 0 18px rgba(34,197,94,.3); }
  .opt-btn.wrong { background: rgba(239,68,68,.14); border-color:#ef4444; box-shadow: 0 0 18px rgba(239,68,68,.3); }

  .zoom-btn {
    width: 52px; height: 52px; border-radius: 14px;
    font-size: 1.25rem;
    background: rgba(15,23,42,.8); border:1px solid rgba(255,255,255,.12);
    color:#00f3ff; display:flex; align-items:center; justify-content:center;
    backdrop-filter: blur(8px); cursor:pointer;
    transition: background-color .2s ease, box-shadow .2s ease, transform .12s ease;
  }
  .zoom-btn:hover { background: rgba(0,243,255,.12); box-shadow: 0 0 14px rgba(0,243,255,.25); }
  .zoom-btn:active { transform: scale(.92); }

  .stat-val { font-family: 'Oxanium', monospace; color:#00f3ff; font-size: 1.35rem; }
  [dir="rtl"] .stat-val { font-family: 'Oxanium', monospace !important; line-height: 1.4 !important; }
  .num { font-family:'Oxanium', monospace !important; line-height:1.4 !important; direction:ltr; unicode-bidi:embed; }
  .board-ui { font-size: 1.15rem; }
  .board-ui .font-bold, aside .font-bold { font-size: 1.2rem; }
  #observe-text, #test-feedback, #power-label { font-size: 1.2rem; line-height: 1.55; }
  [dir="rtl"] #observe-text, [dir="rtl"] #test-feedback { font-size: 1.35rem; line-height: 2.2; }

  #fabricLayer, .canvas-container {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    pointer-events: none;
  }
  .canvas-container canvas { position: absolute !important; left: 0; top: 0; }

  #anno-float {
    position: absolute;
    top: 12px;
    inset-inline-end: 64px;
    z-index: 20;
    transition: max-width .35s ease, max-height .35s ease, opacity .25s ease, padding .25s ease;
    overflow: hidden;
  }
  #anno-float.collapsed {
    max-width: 48px;
    max-height: 48px;
    padding: 0;
  }
  #anno-float.collapsed #anno-float-body { opacity: 0; pointer-events: none; height: 0; }

  .power-knob {
    width: 72px; height: 72px; border-radius: 50%;
    border: 3px solid #334155;
    background: radial-gradient(circle at 35% 30%, #475569, #0f172a);
    box-shadow: inset 0 0 12px rgba(0,0,0,.6);
    transition: box-shadow .3s ease, border-color .3s ease;
  }
  .power-knob.on {
    border-color: #22c55e;
    box-shadow: 0 0 22px rgba(34,197,94,.45), inset 0 0 12px rgba(34,197,94,.2);
  }

  #sim-viewport { cursor: grab; background: #f4f7fb; }
  #sim-viewport.panning { cursor: grabbing; }

  .gas-bar {
    height: 10px; border-radius: 999px; background: #1e293b; overflow: hidden;
    border: 1px solid rgba(255,255,255,.08);
  }
  .gas-bar > span { display:block; height:100%; border-radius:999px; transition: width .2s linear; }
</style>
</head>
<body class="bg-grid">

<div id="intro">
  <div class="intro-ring"><i class="fa-solid fa-bolt text-5xl text-cyan-300" style="filter:drop-shadow(0 0 14px rgba(0,243,255,.8))"></i></div>
  <div class="intro-title text-4xl sm:text-5xl lg:text-6xl">IQRA VIRTUAL LAB</div>
  <div class="intro-topic text-base md:text-lg mt-5 font-bold uppercase tracking-widest" id="intro-topic">ELECTROLYSIS OF WATER</div>
</div>

<div id="app" class="h-screen flex flex-col opacity-0 transition-opacity duration-700">

  <header class="glass-panel flex items-center justify-between px-3 md:px-6 py-3 z-30 gap-2">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-10 h-10 rounded-xl bg-slate-900 border border-cyan-500/40 glow-cyan flex items-center justify-center shrink-0">
        <i class="fa-solid fa-flask-vial text-cyan-400"></i>
      </div>
      <div class="min-w-0">
        <div class="font-display font-extrabold tracking-widest text-cyan-400 text-base md:text-xl truncate" style="font-family:'Oxanium',sans-serif !important;">IQRA VIRTUAL LAB</div>
        <div class="text-sm md:text-base text-slate-200 truncate font-bold" data-i18n="topic"></div>
      </div>
    </div>

    <nav class="flex items-center gap-2 glass-card rounded-2xl p-1.5 shrink-0">
      <button id="tab-sim" onclick="switchTab('sim')" class="tab-btn active px-3 md:px-6 py-2.5 font-extrabold text-base md:text-lg text-slate-200 flex items-center gap-2">
        <i class="fa-solid fa-house"></i><span data-i18n="tab_sim"></span>
      </button>
      <button id="tab-quiz" onclick="switchTab('quiz')" class="tab-btn px-3 md:px-6 py-2.5 font-extrabold text-base md:text-lg text-slate-200 flex items-center gap-2">
        <i class="fa-solid fa-clipboard-question"></i><span data-i18n="tab_quiz"></span>
      </button>
    </nav>

    <div class="flex items-center gap-3">
      <!-- Annotation Toolbar (Hidden by default) -->
      <div id="anno-toolbar" class="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 transition-all duration-300 max-w-0 overflow-hidden opacity-0">
        <input type="color" id="anno-color" value="#00f3ff" onchange="changeAnnoColor(this.value)" class="w-6 h-6 cursor-pointer bg-transparent border-0 p-0" title="Color">
        <button id="anno-pen" onclick="setAnnoMode('pen')" class="text-cyan-400 p-1.5 rounded hover:bg-slate-700 transition" title="Pen"><i class="fa-solid fa-pen"></i></button>
        <button id="anno-eraser" onclick="setAnnoMode('eraser')" class="text-slate-400 p-1.5 rounded hover:bg-slate-700 transition" title="Eraser"><i class="fa-solid fa-eraser"></i></button>
        <button onclick="clearAnnotations()" class="text-red-400 p-1.5 rounded hover:bg-slate-700 transition" title="Clear All"><i class="fa-solid fa-trash-can"></i></button>
      </div>

      <!-- Annotation Toggle Button -->
      <button id="btn-anno-toggle" onclick="toggleAnnotationMode()" class="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 flex items-center justify-center border border-slate-700 transition" title="Toggle Annotation">
        <i class="fa-solid fa-pen-nib"></i>
      </button>

      <!-- Language Selector -->
      <div class="relative">
        <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-slate-900 border border-slate-700 text-cyan-400 text-sm rounded-lg focus:ring-cyan-500 focus:border-cyan-500 px-3 py-2 cursor-pointer font-bold outline-none">
          <option value="en">🌐 English</option>
          <option value="ur">🌐 اردو</option>
          <option value="hi" disabled>🌐 हिंदी (Soon)</option>
          <option value="bn" disabled>🌐 বাংলা (Soon)</option>
          <option value="ta" disabled>🌐 தமிழ் (Soon)</option>
        </select>
      </div>

      <!-- Fullscreen Button -->
      <button onclick="toggleFullScreen()" class="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-400 flex items-center justify-center border border-slate-700 transition" title="Toggle Fullscreen">
        <i class="fa-solid fa-expand" id="fs-icon"></i>
      </button>
    </div>
  </header>

  <main id="view-sim" class="view flex-1 flex flex-col gap-3 p-3 md:p-4 min-h-0 overflow-hidden">

    <section class="flex-1 flex flex-col min-h-0 min-w-0">
      <div id="sim-viewport" class="rounded-2xl relative flex-1 min-h-[360px] overflow-hidden border border-slate-600">
        <canvas id="simCanvas" class="absolute inset-0 w-full h-full"></canvas>
        <canvas id="fabricLayer"></canvas>

        <div class="absolute bottom-3 flex flex-col gap-2 z-10" style="inset-inline-end:12px" dir="ltr">
          <button class="zoom-btn" onclick="zoomBy(1.2)" title="+"><i class="fa-solid fa-plus"></i></button>
          <button class="zoom-btn" onclick="zoomBy(1/1.2)" title="−"><i class="fa-solid fa-minus"></i></button>
          <button class="zoom-btn" onclick="resetView()" title="Reset"><i class="fa-solid fa-crosshairs"></i></button>
        </div>

        <div id="anno-float" class="glass-panel rounded-2xl p-2 glow-cyan collapsed">
          <div class="flex items-center gap-1">
            <button onclick="toggleAnnoFloat()" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-cyan-400 flex items-center justify-center border border-slate-700" id="anno-float-min" title="Annotation">
              <i class="fa-solid fa-pencil" id="anno-float-icon"></i>
            </button>
            <div id="anno-float-body" class="flex items-center gap-1 pr-1 transition-opacity duration-200">
              <input type="color" value="#00f3ff" onchange="document.getElementById('anno-color').value=this.value; changeAnnoColor(this.value)" class="w-8 h-8 cursor-pointer bg-transparent border-0 p-0 rounded">
              <button onclick="setAnnoMode('pen')" class="w-10 h-10 rounded-xl text-cyan-400 hover:bg-slate-700"><i class="fa-solid fa-pen"></i></button>
              <button onclick="setAnnoMode('eraser')" class="w-10 h-10 rounded-xl text-slate-300 hover:bg-slate-700"><i class="fa-solid fa-eraser"></i></button>
              <button onclick="clearAnnotations()" class="w-10 h-10 rounded-xl text-red-400 hover:bg-slate-700"><i class="fa-solid fa-trash-can"></i></button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <aside class="glass-card rounded-2xl px-4 py-3 flex flex-wrap items-center gap-4 shrink-0 board-ui">
      <button id="power-btn" onclick="togglePower()" class="power-knob flex items-center justify-center text-slate-400 shrink-0" title="Power">
        <i class="fa-solid fa-power-off text-2xl"></i>
      </button>
      <div class="min-w-[140px]">
        <div class="text-sm uppercase tracking-widest text-slate-300 font-extrabold" data-i18n="circuit"></div>
        <div id="power-label" class="font-extrabold text-white"></div>
      </div>
      <div class="flex-1 min-w-[220px] max-w-md">
        <div class="flex items-center justify-between">
          <span class="font-extrabold text-white" data-i18n="voltage"></span>
          <span class="stat-val num" id="volt-val">9.0 V</span>
        </div>
        <input id="volt-slider" type="range" min="0" max="12" step="0.1" value="9" oninput="setVoltage(this.value)">
      </div>
      <div class="min-w-[180px]">
        <div class="flex justify-between"><span id="h2-name" class="text-sky-300 font-extrabold"></span><span class="stat-val num" id="h2-ml">0.0 mL</span></div>
        <div class="gas-bar mt-1"><span id="h2-bar" style="width:0%;background:#0077b6"></span></div>
        <div class="flex justify-between mt-2"><span id="ox-name" class="text-red-400 font-extrabold"></span><span class="stat-val num" id="ox-ml">0.0 mL</span></div>
        <div class="gas-bar mt-1"><span id="ox-bar" style="width:0%;background:#d90429"></span></div>
      </div>
      <div class="font-extrabold text-white"><span data-i18n="ratio"></span> <span class="stat-val num" id="ratio-val">—</span></div>
      <p id="observe-text" class="flex-1 min-w-[200px] text-slate-100"></p>
      <button onclick="runPopTest()" class="rounded-xl px-4 py-3 bg-slate-800 border border-sky-400 font-extrabold text-sky-300"><span data-i18n="pop_test"></span></button>
      <button onclick="runSplintTest()" class="rounded-xl px-4 py-3 bg-slate-800 border border-red-400 font-extrabold text-red-300"><span data-i18n="splint_test"></span></button>
      <p id="test-feedback" class="min-w-[160px] text-cyan-200 font-bold"></p>
      <button onclick="resetExperiment()" class="rounded-xl px-4 py-3 bg-slate-800 border border-slate-500 font-extrabold text-white"><i class="fa-solid fa-rotate-right text-cyan-400"></i> <span data-i18n="reset"></span></button>
    </aside>
  </main>

  <main id="view-quiz" class="view hidden flex-1 min-h-0 overflow-y-auto p-4 md:p-8">
    <div class="max-w-3xl mx-auto glass-card rounded-3xl p-6 md:p-10">
      <div class="flex items-center justify-between gap-3 mb-6">
        <h2 class="font-display text-2xl font-extrabold text-cyan-400" data-i18n="quiz_title"></h2>
        <div class="text-slate-400 font-bold"><span id="q-progress" class="num"></span></div>
      </div>
      <div id="quiz-body"></div>
    </div>
  </main>
</div>

<script>
const LANG = {
  en: {
    topic: "Electrolysis of Water",
    tab_sim: "Simulation",
    tab_quiz: "Quiz",
    circuit: "Circuit",
    power_on: "Current flowing",
    power_off: "Circuit open",
    voltage: "Voltage",

    pop_test: "Pop test",
    splint_test: "Glowing splint",
    reset: "Reset",
    water: "Water (H₂O)",
    platinum: "Platinum electrodes",
    o2_bubbles: "Oxygen bubbles",
    h2_bubbles: "Hydrogen bubbles",
    power_supply: "Power supply 9 to 12 volt",
    caption: "Electrolysis of water",

    e_anode: "E° = +1.23 V",

    legend_e: "e⁻ in the wire",

    legend_h2o: "H₂O",
    e_from: "e⁻ leave here",

    hint_full: "A tube is full. Reset, or test the gases.",

    quiz_title: "Concept Check",

    quiz: [

        options: ["Anode (positive)", "Cathode (negative)", "Both equally", "The battery terminal only"],
        a: 1,
        explain: "H⁺ ions gain electrons (reduction) at the cathode, so H₂ forms there."
      },
      {
        q: "In the electrolysis of acidified water, the collected volumes of H₂ and O₂ are about",
        options: ["1 : 1", "1 : 2", "2 : 1", "4 : 1"],
        a: 2,
        explain: "The equation 2H₂O → 2H₂ + O₂ produces twice as many H₂ molecules as O₂ molecules, so the volume ratio is 2 : 1."
      },
      {
        q: "Why is a little dilute sulfuric acid (or alkali) added to the water?",
        options: ["To colour the water", "To make water a better conductor", "To stop hydrogen forming", "To heat the beaker"],
        a: 1,
        explain: "Pure water has very few ions. The acid or alkali supplies ions so current can flow."
      },

function applyI18n() {
  document.documentElement.lang = cur === 'ur' ? 'ur' : 'en';
  document.documentElement.dir = cur === 'ur' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (T()[k] != null) el.textContent = T()[k];
  });
  document.getElementById('lang-select').value = cur;
  document.getElementById('anno-color').title = cur === 'ur' ? 'رنگ' : 'Color';
  document.getElementById('anno-pen').title = cur === 'ur' ? 'قلم' : 'Pen';
  document.getElementById('anno-eraser').title = cur === 'ur' ? 'مٹانے والا' : 'Eraser';
  document.getElementById('btn-anno-toggle').title = cur === 'ur' ? 'اشارہ کاری' : 'Toggle Annotation';
  updatePowerLabel();
  updateMeters();
  updateObserve();
  if (document.getElementById('view-quiz') && !document.getElementById('view-quiz').classList.contains('hidden')) renderQuiz();
}

function changeLanguage(v) {
  if (v !== 'en' && v !== 'ur') return;
  cur = v;
  localStorage.setItem('iqra-lang', cur);
  applyI18n();
}

function switchTab(name) {
  document.getElementById('view-sim').classList.toggle('hidden', name !== 'sim');
  document.getElementById('view-quiz').classList.toggle('hidden', name !== 'quiz');
  document.getElementById('tab-sim').classList.toggle('active', name === 'sim');
  document.getElementById('tab-quiz').classList.toggle('active', name === 'quiz');
  if (name === 'quiz') renderQuiz();
  if (name === 'sim') requestAnimationFrame(() => { fitView(); resizeCanvases(); });
}

function toggleFullScreen() {
  const root = document.documentElement;
  if (!document.fullscreenElement) {
    (root.requestFullscreen || root.webkitRequestFullscreen || root.msRequestFullscreen).call(root);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }
}
document.addEventListener('fullscreenchange', () => {
  const icon = document.getElementById('fs-icon');
  if (icon) icon.className = document.fullscreenElement ? 'fa-solid fa-compress' : 'fa-solid fa-expand';
});

function initAnnotationCanvas(w, h) {
  fCanvas = new fabric.Canvas('fabricLayer', {
    isDrawingMode: false,
    width: w,
    height: h
  });
  fCanvas.freeDrawingBrush.color = document.getElementById('anno-color').value;
  fCanvas.freeDrawingBrush.width = 4;
  fCanvas.on('mouse:down', function(options) {
    if (isAnnoActive && !fCanvas.isDrawingMode && options.target) {
      fCanvas.remove(options.target);
    }
  });
  const fabricContainer = document.querySelector('.canvas-container');
  if (fabricContainer) fabricContainer.style.pointerEvents = 'none';
}

function toggleAnnotationMode() {
  isAnnoActive = !isAnnoActive;
  const btn = document.getElementById('btn-anno-toggle');
  const toolbar = document.getElementById('anno-toolbar');
  const fabricContainer = document.querySelector('.canvas-container');

  if (isAnnoActive) {
    btn.classList.replace('text-slate-400', 'text-cyan-400');
    toolbar.classList.remove('max-w-0', 'opacity-0');
    toolbar.classList.add('max-w-xs', 'opacity-100');
    if (fabricContainer) fabricContainer.style.pointerEvents = 'auto';
    setAnnoMode('pen');
    const box = document.getElementById('anno-float');
    box.classList.remove('collapsed');
    annoFloatOpen = true;
  } else {
    btn.classList.replace('text-cyan-400', 'text-slate-400');
    toolbar.classList.remove('max-w-xs', 'opacity-100');
    toolbar.classList.add('max-w-0', 'opacity-0');
    if (fabricContainer) fabricContainer.style.pointerEvents = 'none';
    if (fCanvas) fCanvas.isDrawingMode = false;
  }
}

function setAnnoMode(mode) {
  document.getElementById('anno-pen').classList.replace('text-cyan-400', 'text-slate-400');
  document.getElementById('anno-eraser').classList.replace('text-cyan-400', 'text-slate-400');
  if (mode === 'pen') {
    document.getElementById('anno-pen').classList.replace('text-slate-400', 'text-cyan-400');
    if (fCanvas) fCanvas.isDrawingMode = true;
  } else {
    document.getElementById('anno-eraser').classList.replace('text-slate-400', 'text-cyan-400');
    if (fCanvas) fCanvas.isDrawingMode = false;
  }
}

function producing() {
  return state.power && state.voltage >= 1.23;
}

function togglePower() {
  state.power = !state.power;
  const btn = document.getElementById('power-btn');
  btn.classList.toggle('on', state.power);
  btn.classList.toggle('text-emerald-400', state.power);
  btn.classList.toggle('text-slate-400', !state.power);
  updatePowerLabel();
  updateObserve();
}

function updatePowerLabel() {
  document.getElementById('power-label').textContent = state.power ? t('power_on') : t('power_off');
}

function setVoltage(v) {
  state.voltage = parseFloat(v);
  document.getElementById('volt-val').textContent = state.voltage.toFixed(1) + ' V';
  updateObserve();
}

function resetExperiment() {
  state.h2 = 0;
  state.ox = 0;
  bubbles.length = 0;
  electrons.length = 0;
  protons.length = 0;
  mols.length = 0;
  document.getElementById('test-feedback').textContent = '';
  updateMeters();
  updateObserve();
}

function updateMeters() {
  document.getElementById('h2-name').textContent = t('h2');
  document.getElementById('ox-name').textContent = t('o2');
  document.getElementById('h2-ml').textContent = state.h2.toFixed(1) + ' mL';
  document.getElementById('ox-ml').textContent = state.ox.toFixed(1) + ' mL';
  document.getElementById('h2-bar').style.width = (100 * state.h2 / state.maxH2) + '%';
  document.getElementById('ox-bar').style.width = (100 * state.ox / state.maxOx) + '%';
  if (state.ox > 0.4) {
    document.getElementById('ratio-val').textContent = (state.h2 / state.ox).toFixed(2) + ' : 1';
  } else {
    document.getElementById('ratio-val').textContent = '—';
  }
}

function updateObserve() {
  let msg = t('hint_off');
  if (!state.power) msg = t('hint_off');
  else if (state.voltage < 1.23) msg = t('hint_low');
  else if (state.h2 >= state.maxH2 - 0.2 || state.ox >= state.maxOx - 0.2) msg = t('hint_full');
  else if (state.h2 > 12) msg = t('hint_ratio');
  else msg = t('hint_run');
  document.getElementById('observe-text').textContent = msg;
}

function runPopTest() {
  const el = document.getElementById('test-feedback');
  if (state.h2 < 8) { el.textContent = t('pop_need'); el.className = 'min-h-[1.6em] text-sky-300 font-bold'; return; }
  state.flash = 1;
  state.h2 = Math.max(0, state.h2 - 6);
  el.textContent = t('pop_ok');
  el.className = 'min-h-[1.6em] text-emerald-300 font-bold';
  updateMeters();
}

function runSplintTest() {
  const el = document.getElementById('test-feedback');
  if (state.ox < 5) { el.textContent = t('splint_need'); el.className = 'min-h-[1.6em] text-red-300 font-bold'; return; }
  state.splint = 1;
  state.ox = Math.max(0, state.ox - 4);
  el.textContent = t('splint_o2');
  el.className = 'min-h-[1.6em] text-emerald-300 font-bold';
  updateMeters();
}

function resizeCanvases() {
  const wrap = document.getElementById('sim-viewport');
  if (!wrap) return;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const canvas = document.getElementById('simCanvas');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, w * dpr);
  canvas.height = Math.max(1, h * dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  if (fCanvas) {
    fCanvas.setWidth(w);
    fCanvas.setHeight(h);
    fCanvas.renderAll();
  }
}

function fitView() {
  const wrap = document.getElementById('sim-viewport');
  if (!wrap) return;
  const pad = 28;
  baseScale = Math.min((wrap.clientWidth - pad) / WORLD_W, (wrap.clientHeight - pad) / WORLD_H);
  cam.s = baseScale;
  cam.x = (wrap.clientWidth - WORLD_W * cam.s) / 2;
  cam.y = (wrap.clientHeight - WORLD_H * cam.s) / 2;
}

function zoomBy(f, cx, cy) {
  const wrap = document.getElementById('sim-viewport');
  const px = cx != null ? cx : wrap.clientWidth / 2;
  const py = cy != null ? cy : wrap.clientHeight / 2;
  const wx = (px - cam.x) / cam.s;
  const wy = (py - cam.y) / cam.s;
  cam.s = Math.max(baseScale * 0.8, Math.min(baseScale * 4.2, cam.s * f));
  cam.x = px - wx * cam.s;
  cam.y = py - wy * cam.s;
}

function resetView() { fitView(); }

function worldFromEvent(e) {
  const r = document.getElementById('sim-viewport').getBoundingClientRect();
  const x = (e.clientX ?? e.touches[0].clientX) - r.left;
  const y = (e.clientY ?? e.touches[0].clientY) - r.top;
  return { x, y };
}

function bindZoomPan() {
  const wrap = document.getElementById('sim-viewport');
  wrap.addEventListener('wheel', e => {
    if (isAnnoActive) return;
    e.preventDefault();
    const p = worldFromEvent(e);
    zoomBy(e.deltaY < 0 ? 1.12 : 1 / 1.12, p.x, p.y);
  }, { passive: false });

  wrap.addEventListener('click', e => {
    if (isAnnoActive || e.target.closest('#anno-float') || e.target.closest('.zoom-btn')) return;
    const p = worldFromEvent(e);
    const wx = (p.x - cam.x) / cam.s;
    const wy = (p.y - cam.y) / cam.s;
    if (wx >= SWITCH_BOX.x && wx <= SWITCH_BOX.x + SWITCH_BOX.w && wy >= SWITCH_BOX.y && wy <= SWITCH_BOX.y + SWITCH_BOX.h) {
      togglePower();
    }
  });

  wrap.addEventListener('mousedown', e => {
    if (isAnnoActive || e.target.closest('#anno-float') || e.target.closest('.zoom-btn')) return;
    const p = worldFromEvent(e);
    const wx = (p.x - cam.x) / cam.s;
    const wy = (p.y - cam.y) / cam.s;
    if (wx >= SWITCH_BOX.x && wx <= SWITCH_BOX.x + SWITCH_BOX.w && wy >= SWITCH_BOX.y && wy <= SWITCH_BOX.y + SWITCH_BOX.h) return;
    panning = true;
    wrap.classList.add('panning');
    panStart = { x: p.x, y: p.y, cx: cam.x, cy: cam.y };
  });
  window.addEventListener('mousemove', e => {
    if (!panning) return;
    const p = worldFromEvent(e);
    cam.x = panStart.cx + (p.x - panStart.x);
    cam.y = panStart.cy + (p.y - panStart.y);
  });
  window.addEventListener('mouseup', () => { panning = false; wrap.classList.remove('panning'); });

  wrap.addEventListener('touchstart', e => {
    if (isAnnoActive) return;
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinch = { dist: Math.hypot(dx, dy), s: cam.s };
    } else if (e.touches.length === 1) {
      panning = true;
      const p = worldFromEvent(e);
      panStart = { x: p.x, y: p.y, cx: cam.x, cy: cam.y };
    }
  }, { passive: true });
  wrap.addEventListener('touchmove', e => {
    if (isAnnoActive) return;
    if (e.touches.length === 2 && pinch) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      const r = wrap.getBoundingClientRect();
      const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left;
      const my = (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top;
      zoomBy(dist / pinch.dist, mx, my);
      pinch.dist = dist;
    } else if (panning && e.touches.length === 1) {
      const p = worldFromEvent(e);
      cam.x = panStart.cx + (p.x - panStart.x);
      cam.y = panStart.cy + (p.y - panStart.y);
    }
  }, { passive: false });
  wrap.addEventListener('touchend', () => { panning = false; pinch = null; });
}

function roundRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function ink(ctx, text, x, y, opt) {
  opt = opt || {};
  const ur = cur === 'ur' && !opt.chem;
  const size = opt.size || (ur ? 34 : 30);
  ctx.save();
  ctx.font = opt.chem
    ? `800 ${size}px Manrope, Arial, sans-serif`
    : (ur ? `700 ${size}px 'Jameel Noori Nastaliq','Noto Nastaliq Urdu',serif` : `800 ${size}px Manrope, Arial, sans-serif`);
  ctx.textAlign = opt.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = opt.color || INK;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function arrow(ctx, x1, y1, x2, y2, color) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - 14 * Math.cos(a - 0.45), y2 - 14 * Math.sin(a - 0.45));
  ctx.lineTo(x2 - 14 * Math.cos(a + 0.45), y2 - 14 * Math.sin(a + 0.45));
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function tubeMouth(tube) { return tube.y + tube.h; }
function tubeCx(tube) { return tube.x + tube.w / 2; }
function gasHeight(tube, fill, maxFrac) {
  return Math.max(0, fill) * (tube.h - 90) * maxFrac;
}
function gasInterfaceY(tube, fill, maxFrac) {
  return tube.y + 10 + gasHeight(tube, fill, maxFrac);
}

function ePath() {
  const ax = tubeCx(ANODE);
  const cx = tubeCx(CATHODE);
  const ey = tubeMouth(ANODE) - 48;
  const wy = BEAKER.y + BEAKER.h + 70;
  return [
    { x: ax, y: ey },
    { x: ax, y: wy },
    { x: 848, y: wy },
    { x: 980, y: wy },
    { x: cx, y: wy },
    { x: cx, y: ey }
  ];
}

function alongPath(path, t) {
  let len = 0;
  const segs = [];
  for (let i = 0; i < path.length - 1; i++) {
    const d = Math.hypot(path[i + 1].x - path[i].x, path[i + 1].y - path[i].y);
    segs.push(d);
    len += d;
  }
  let dist = ((t % 1) + 1) % 1 * len;
  for (let i = 0; i < segs.length; i++) {
    if (dist <= segs[i]) {
      const u = segs[i] ? dist / segs[i] : 0;
      return {
        x: path[i].x + (path[i + 1].x - path[i].x) * u,
        y: path[i].y + (path[i + 1].y - path[i].y) * u
      };
    }
    dist -= segs[i];
  }
  return path[path.length - 1];
}

function spawnParticles(dt) {
  const ax = tubeCx(ANODE);
  const cx = tubeCx(CATHODE);
  const ey = tubeMouth(ANODE) - 48;
  if (mols.filter(m => m.kind === 'h2o').length < 14) {
    mols.push({
      kind: 'h2o',
      x: BEAKER.x + 40 + Math.random() * (BEAKER.w - 80),
      y: WATER_Y + 30 + Math.random() * 280,
      vy: 0,
      life: 8
    });
  }
  if (!producing()) return;
  const rate = 0.5 + state.voltage * 0.18;
  if (electrons.length < 28 && Math.random() < dt * rate * 10) {
    electrons.push({ t: 0, speed: 0.18 + state.voltage * 0.012 });
  }
  if (protons.length < 36 && Math.random() < dt * rate * 12) {
    protons.push({
      x: ax + (Math.random() - 0.5) * 28,
      y: ey - 6,
      phase: 'down'
    });
  }
  if (bubbles.length < 40) {
    const n = Math.min(3, rate * dt * 9);
    for (let i = 0; i < n; i++) {
      bubbles.push({ side: 'H', x: cx + (Math.random() - 0.5) * 28, y: ey, r: 3.5 + Math.random() * 3, v: 42 + Math.random() * 28 });
      if (Math.random() < 0.5) {
        bubbles.push({ side: 'O', x: ax + (Math.random() - 0.5) * 28, y: ey, r: 3.2 + Math.random() * 2.8, v: 38 + Math.random() * 24 });
      }
    }
  }
  if (Math.random() < dt * rate * 4) {
    mols.push({ kind: 'o2', x: ax + (Math.random() - 0.4) * 20, y: ey - 8, vy: -36, life: 4 });
  }
  if (Math.random() < dt * rate * 8) {
    mols.push({ kind: 'h2', x: cx + (Math.random() - 0.4) * 20, y: ey - 8, vy: -42, life: 4 });
  }
}

function step(dt) {
  spawnParticles(dt);
  if (producing()) {
    const k = 0.42 * Math.max(0, state.voltage - 1.23);
    const dh = k * dt * 2.6;
    state.h2 = Math.min(state.maxH2, state.h2 + dh);
    state.ox = Math.min(state.maxOx, state.ox + dh / 2);
  }
  const oFill = state.ox / state.maxOx;
  const hFill = state.h2 / state.maxH2;
  const oTop = gasInterfaceY(ANODE, oFill, 1);
  const hTop = gasInterfaceY(CATHODE, hFill, 1);

  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.y -= b.v * dt;
    const iface = b.side === 'H' ? hTop : oTop;
    const tube = b.side === 'H' ? CATHODE : ANODE;
    if (b.x < tube.x + 8 || b.x > tube.x + tube.w - 8) b.x = tubeCx(tube) + (Math.random() - 0.5) * 20;
    if (b.y <= iface + 8) bubbles.splice(i, 1);
  }

  for (let i = electrons.length - 1; i >= 0; i--) {
    if (!producing()) { electrons.splice(i, 1); continue; }
    electrons[i].t += electrons[i].speed * dt;
    if (electrons[i].t >= 1) electrons.splice(i, 1);
  }

  const ax = tubeCx(ANODE);
  const cx = tubeCx(CATHODE);
  const mouth = tubeMouth(ANODE);
  const ey = mouth - 48;
  const crossY = mouth + 22;
  for (let i = protons.length - 1; i >= 0; i--) {
    const p = protons[i];
    if (!producing()) continue;
    if (p.phase === 'down') {
      p.y += 55 * dt;
      p.x += (ax - p.x) * 2 * dt;
      if (p.y >= crossY) p.phase = 'across';
    } else if (p.phase === 'across') {
      p.x += 70 * dt;
      p.y += (crossY - p.y) * 4 * dt;
      if (p.x >= cx) p.phase = 'up';
    } else {
      p.y -= 55 * dt;
      p.x += (cx - p.x) * 3 * dt;
      if (p.y <= ey) protons.splice(i, 1);
    }
  }

  for (let i = mols.length - 1; i >= 0; i--) {
    const m = mols[i];
    m.y += (m.vy || 0) * dt;
    m.life -= dt;
    if (m.kind === 'h2o') {
      m.x += Math.sin(m.y * 0.04) * 8 * dt;
      if (m.y < WATER_Y + 10 || m.y > tubeMouth(ANODE) + 10) mols.splice(i, 1);
    } else {
      const iface = m.kind === 'h2' ? hTop : oTop;
      if (m.y <= iface + 6 || m.life <= 0) mols.splice(i, 1);
    }
  }

  state.dash += dt * (producing() ? 55 : 0);
  if (state.flash > 0) state.flash = Math.max(0, state.flash - dt * 2.2);
  if (state.splint > 0) state.splint = Math.max(0, state.splint - dt * 1.4);
}

function drawApparatus(ctx) {
  const L = T();
  ctx.fillStyle = '#f7f9fc';
  ctx.fillRect(0, 0, WORLD_W, WORLD_H);

  ink(ctx, L.anode_ox, 250, 80, { color: RED, size: 36 });
  ink(ctx, '2H₂O(l) → O₂(g)', 250, 145, { color: RED, size: 28, chem: true });
  ink(ctx, '+ 4H⁺(aq) + 4e⁻', 250, 192, { color: RED, size: 28, chem: true });
  ink(ctx, 'E° = +1.23 V', 250, 250, { color: RED, size: 32, chem: true });
  ink(ctx, L.e_from, 250, 310, { color: RED, size: 24 });

  ink(ctx, L.cathode_red, 1670, 80, { color: BLUE, size: 36 });
  ink(ctx, '2H⁺(aq) + 2e⁻', 1670, 145, { color: BLUE, size: 28, chem: true });
  ink(ctx, '→ H₂(g)', 1670, 192, { color: BLUE, size: 28, chem: true });
  ink(ctx, 'E° = 0.00 V', 1670, 250, { color: BLUE, size: 32, chem: true });
  ink(ctx, L.e_to, 1670, 310, { color: BLUE, size: 24 });

  const bx = BEAKER.x, by = BEAKER.y, bw = BEAKER.w, bh = BEAKER.h, br = 32;

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(bx + 10, WATER_Y);
  ctx.lineTo(bx + 10, by + bh - br);
  ctx.quadraticCurveTo(bx + 10, by + bh - 8, bx + br, by + bh - 8);
  ctx.lineTo(bx + bw - br, by + bh - 8);
  ctx.quadraticCurveTo(bx + bw - 10, by + bh - 8, bx + bw - 10, by + bh - br);
  ctx.lineTo(bx + bw - 10, WATER_Y);
  ctx.closePath();
  ctx.fillStyle = WATER;
  ctx.fill();
  ctx.restore();

  drawCollectingTube(ctx, ANODE, state.ox / state.maxOx, 1);
  drawCollectingTube(ctx, CATHODE, state.h2 / state.maxH2, 1);

  ctx.strokeStyle = INK;
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.moveTo(bx, by + 36);
  ctx.lineTo(bx, by + bh - br);
  ctx.quadraticCurveTo(bx, by + bh, bx + br, by + bh);
  ctx.lineTo(bx + bw - br, by + bh);
  ctx.quadraticCurveTo(bx + bw, by + bh, bx + bw, by + bh - br);
  ctx.lineTo(bx + bw, by + 36);
  ctx.stroke();
  ctx.beginPath();
  ctx.lineWidth = 8;
  ctx.moveTo(bx - 14, by + 34);
  ctx.lineTo(bx + bw + 14, by + 34);
  ctx.stroke();

  drawPlatinumBlock(ctx, tubeCx(ANODE), tubeMouth(ANODE) - 48);
  drawPlatinumBlock(ctx, tubeCx(CATHODE), tubeMouth(CATHODE) - 48);

  mols.forEach(m => drawMol(ctx, m));
  protons.forEach(p => drawProton(ctx, p.x, p.y));
  bubbles.forEach(b => {
    ctx.beginPath();
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = b.side === 'O' ? RED : BLUE;
    ctx.lineWidth = 2;
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  });

  const path = ePath();
  if (producing()) {
    ctx.save();
    ctx.strokeStyle = '#b45309';
    ctx.lineWidth = 3;
    ctx.setLineDash([7, 7]);
    ctx.lineDashOffset = -state.dash;
    ctx.beginPath();
    ctx.moveTo(path[0].x, path[0].y);
    path.slice(1).forEach(pt => ctx.lineTo(pt.x, pt.y));
    ctx.stroke();
    ctx.restore();
  }
  electrons.forEach(e => {
    const pt = alongPath(path, e.t);
    drawElectron(ctx, pt.x, pt.y);
  });

  ink(ctx, 'O₂', tubeCx(ANODE), ANODE.y - 22, { color: RED, size: 40, chem: true });
  ink(ctx, 'H₂', tubeCx(CATHODE), CATHODE.y - 22, { color: BLUE, size: 40, chem: true });
  ink(ctx, L.anode + '  (+)', tubeCx(ANODE), tubeMouth(ANODE) + 28, { color: RED, size: 28 });
  ink(ctx, L.cathode + '  (−)', tubeCx(CATHODE), tubeMouth(CATHODE) + 28, { color: BLUE, size: 28 });
  ink(ctx, L.platinum, 960, 430, { color: INK, size: 24 });
  ink(ctx, L.water, 960, BEAKER.y + BEAKER.h + 28, { color: INK, size: 28 });
  ink(ctx, L.o2_bubbles, 430, 390, { color: RED, size: 24, align: 'right' });
  arrow(ctx, 442, 390, ANODE.x - 6, 450, RED);
  ink(ctx, L.h2_bubbles, 1495, 390, { color: BLUE, size: 24, align: 'left' });
  arrow(ctx, 1482, 390, CATHODE.x + CATHODE.w + 6, 450, BLUE);

  drawBottomCircuit(ctx, L);
  drawLegend(ctx, L);
  ink(ctx, L.caption, 960, 1046, { color: INK, size: 34 });

  if (state.flash > 0) {
    ctx.fillStyle = `rgba(2, 62, 138, ${state.flash * 0.3})`;
    ctx.beginPath();
    ctx.arc(tubeCx(CATHODE), CATHODE.y + 40, 60 * state.flash, 0, Math.PI * 2);
    ctx.fill();
  }
  if (state.splint > 0) {
    ctx.strokeStyle = `rgba(193, 18, 31, ${state.splint})`;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(tubeCx(ANODE), ANODE.y + 20);
    ctx.lineTo(tubeCx(ANODE) + 70, ANODE.y - 50);
    ctx.stroke();
  }
}

function drawCollectingTube(ctx, tube, fill, maxFrac) {
  const x = tube.x, y = tube.y, w = tube.w, h = tube.h;
  const gasH = gasHeight(tube, fill, maxFrac);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x + 5, y + h);
  ctx.lineTo(x + 5, y + 40);
  ctx.bezierCurveTo(x + 5, y + 4, x + w - 5, y + 4, x + w - 5, y + 40);
  ctx.lineTo(x + w - 5, y + h);
  ctx.closePath();
  ctx.clip();
  ctx.fillStyle = WATER_IN;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = 'rgba(255,255,255,0.96)';
  ctx.fillRect(x, y, w, gasH + 10);
  ctx.strokeStyle = 'rgba(14,116,144,0.7)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + 6, y + 10 + gasH);
  ctx.lineTo(x + w - 6, y + 10 + gasH);
  ctx.stroke();
  ctx.restore();

  ctx.beginPath();
  ctx.moveTo(x, y + h);
  ctx.lineTo(x, y + 40);
  ctx.bezierCurveTo(x, y, x + w, y, x + w, y + 40);
  ctx.lineTo(x + w, y + h);
  ctx.strokeStyle = INK;
  ctx.lineWidth = 5;
  ctx.stroke();
}

function drawPlatinumBlock(ctx, cx, cy) {
  const g = ctx.createLinearGradient(cx - 28, cy, cx + 28, cy);
  g.addColorStop(0, '#6b7280');
  g.addColorStop(0.45, '#e5e7eb');
  g.addColorStop(1, '#4b5563');
  ctx.fillStyle = g;
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.rect(cx - 28, cy - 22, 56, 44);
  ctx.fill();
  ctx.stroke();
}

function drawElectron(ctx, x, y) {
  ctx.beginPath();
  ctx.fillStyle = '#9a3412';
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.5;
  ctx.arc(x, y, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#fff7ed';
  ctx.font = '800 11px Manrope, Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('e⁻', x, y + 0.5);
}

function drawProton(ctx, x, y) {
  ctx.beginPath();
  ctx.fillStyle = '#9f1239';
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.5;
  ctx.arc(x, y, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#fff1f2';
  ctx.font = '800 11px Manrope, Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('H⁺', x, y + 0.5);
}

function drawMol(ctx, m) {
  ctx.save();
  ctx.translate(m.x, m.y);
  if (m.kind === 'h2o') {
    ctx.fillStyle = '#dc2626';
    ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f8fafc';
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(-7, -6, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(7, -5, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  } else if (m.kind === 'o2') {
    ctx.fillStyle = '#dc2626';
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(-6, 0, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(6, 0, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  } else {
    ctx.fillStyle = '#e0f2fe';
    ctx.strokeStyle = BLUE;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(-5, 0, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(5, 0, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function drawLegend(ctx, L) {
  const x = 40, y = 820;
  roundRect(ctx, x, y, 430, 200, 16);
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = INK;
  ctx.lineWidth = 3;
  ctx.fill();
  ctx.stroke();
  drawElectron(ctx, x + 28, y + 40);
  ink(ctx, L.legend_e, x + 52, y + 40, { color: INK, size: 22, align: 'left' });
  drawProton(ctx, x + 28, y + 88);
  ink(ctx, L.legend_h, x + 52, y + 88, { color: INK, size: 22, align: 'left' });
  drawMol(ctx, { kind: 'h2o', x: x + 28, y: y + 136 });
  ink(ctx, L.legend_h2o + '  →  O₂ + H⁺ + e⁻', x + 52, y + 136, { color: INK, size: 20, align: 'left', chem: true });
  drawMol(ctx, { kind: 'h2', x: x + 28, y: y + 176 });
  ink(ctx, 'H⁺ + e⁻  →  H₂', x + 52, y + 176, { color: INK, size: 20, align: 'left', chem: true });
}

function drawBottomCircuit(ctx, L) {
  const ax = tubeCx(ANODE);
  const cx = tubeCx(CATHODE);
  const ey = tubeMouth(ANODE) - 26;
  const wy = BEAKER.y + BEAKER.h + 70;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineWidth = 5;
  ctx.strokeStyle = INK;
  ctx.beginPath();
  ctx.moveTo(ax, ey);
  ctx.lineTo(ax, wy);
  ctx.lineTo(848, wy);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx, ey);
  ctx.lineTo(cx, wy);
  ctx.lineTo(SWITCH_BOX.x + SWITCH_BOX.w, wy);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(SWITCH_BOX.x, wy);
  ctx.lineTo(980, wy);
  ctx.stroke();

  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(860, wy - 28);
  ctx.lineTo(860, wy + 28);
  ctx.stroke();
  ctx.lineWidth = 11;
  ctx.beginPath();
  ctx.moveTo(888, wy - 42);
  ctx.lineTo(888, wy + 42);
  ctx.stroke();
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(916, wy - 28);
  ctx.lineTo(916, wy + 28);
  ctx.moveTo(932, wy - 28);
  ctx.lineTo(932, wy + 28);
  ctx.stroke();

  ink(ctx, '+', 836, wy, { color: RED, size: 34, chem: true });
  ink(ctx, '−', 958, wy, { color: BLUE, size: 34, chem: true });
  ink(ctx, L.power_supply, 890, wy + 78, { color: INK, size: 26 });

  const sx = SWITCH_BOX.x, sy = SWITCH_BOX.y, sw = SWITCH_BOX.w, sh = SWITCH_BOX.h;
  ctx.fillStyle = state.power ? '#dcfce7' : '#ffffff';
  ctx.strokeStyle = INK;
  ctx.lineWidth = 4;
  roundRect(ctx, sx, sy, sw, sh, 10);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.arc(sx + 28, wy, 7, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx + sw - 28, wy, 7, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(sx + 28, wy);
  if (state.power) ctx.lineTo(sx + sw - 28, wy);
  else ctx.lineTo(sx + sw - 34, sy + 14);
  ctx.stroke();
  ctx.restore();
}

function loop(ts) {
  if (!lastTs) lastTs = ts;
  const dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  if (simReady) {
    step(dt);
    meterAcc += dt;
    if (meterAcc > 0.12) { meterAcc = 0; updateMeters(); updateObserve(); }
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr * cam.s, 0, 0, dpr * cam.s, dpr * cam.x, dpr * cam.y);
    drawApparatus(ctx);
  }
  requestAnimationFrame(loop);
}

function renderQuiz() {
  const box = document.getElementById('quiz-body');
  const Q = T().quiz;
  if (quizIndex >= Q.length) {
    const pct = Math.round(100 * quizScore / Q.length);
    box.innerHTML = `
      <div class="text-center space-y-4 fade-in">
        <div class="text-slate-400 font-bold" data-keep>${t('score')}</div>
        <div class="text-6xl font-black text-cyan-400 font-display num">${quizScore} / ${Q.length}</div>
        <div class="text-xl text-slate-300">${t('percent')}: <span class="stat-val num">${pct}%</span></div>
        <p class="text-slate-400">${pct === 100 ? t('perfect') : t('retry')}</p>
        <button onclick="restartQuiz()" class="mt-4 px-8 py-3 rounded-2xl bg-cyan-500/20 border border-cyan-400 text-cyan-300 font-bold glow-cyan">${t('restart')}</button>
      </div>`;
    document.getElementById('q-progress').textContent = '';
    return;
  }
  const item = Q[quizIndex];
  document.getElementById('q-progress').textContent = `${t('q_of')} ${quizIndex + 1} / ${Q.length}`;
  const letters = ['A', 'B', 'C', 'D'];
  box.innerHTML = `
    <p class="text-2xl md:text-3xl font-bold text-white mb-6 leading-relaxed">${item.q}</p>
    <div class="space-y-3" id="opts"></div>
    <p id="explain" class="mt-5 text-lg text-slate-100 min-h-[2.5em] font-bold"></p>
    <div class="mt-4 flex justify-end">
      <button id="next-q" class="hidden px-6 py-3 rounded-xl bg-slate-800 border border-cyan-500/40 text-cyan-300 font-bold">${quizIndex === Q.length - 1 ? t('see_score') : t('next')}</button>
    </div>`;
  const opts = document.getElementById('opts');
  item.options.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt-btn w-full text-start rounded-2xl px-4 py-4 font-bold text-slate-200 bg-slate-900/40 flex items-center gap-3';
    b.innerHTML = `<span class="num w-9 h-9 rounded-lg bg-slate-800 border border-slate-600 flex items-center justify-center text-cyan-400">${letters[i]}</span><span>${opt}</span>`;
    b.onclick = () => pickOpt(i, item, b, opts);
    opts.appendChild(b);
  });
  document.getElementById('next-q').onclick = () => { quizIndex++; quizLocked = false; renderQuiz(); };
}

function pickOpt(i, item, btn, opts) {
  if (quizLocked) return;
  quizLocked = true;
  [...opts.children].forEach(c => c.classList.add('locked'));
  if (i === item.a) {
    btn.classList.add('correct');
    quizScore++;
  } else {
    btn.classList.add('wrong');
    opts.children[item.a].classList.add('correct');
  }
  document.getElementById('explain').textContent = t('explain') + ': ' + item.explain;
  document.getElementById('next-q').classList.remove('hidden');
}

function restartQuiz() {
  quizIndex = 0;
  quizScore = 0;
  quizLocked = false;
  renderQuiz();
}

function boot() {
  applyI18n();
  setVoltage(state.voltage);
  updateMeters();
  const wrap = document.getElementById('sim-viewport');
  resizeCanvases();
  fitView();
  initAnnotationCanvas(wrap.clientWidth, wrap.clientHeight);
  bindZoomPan();
  simReady = true;
  window.addEventListener('resize', () => { resizeCanvases(); fitView(); });
  requestAnimationFrame(loop);
}

window.addEventListener('load', () => {
  setTimeout(() => {
    const intro = document.getElementById('intro');
    intro.style.opacity = '0';
    setTimeout(() => {
      intro.style.display = 'none';
      const app = document.getElementById('app');
      app.classList.remove('opacity-0');
      app.classList.add('opacity-100');
      boot();
    }, 700);
  }, 5000);
});
</script>
</body>
</html>
