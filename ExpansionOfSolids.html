<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IQRA VIRTUAL LAB — Expansion of Solids</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&family=Manrope:wght@400;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Jameel Noori Nastaliq';
  src: url('https://cdn.jsdelivr.net/gh/fomalhautb/jameel-noori-nastaleeq@master/JameelNooriNastaleeq.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

/* Custom Scrollbar */
::-webkit-scrollbar {
width: 6px;
height: 6px;
}
::-webkit-scrollbar-track {
background: #0f172a;
}
::-webkit-scrollbar-thumb {
background: #334155;
border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
background: #475569;
}

/* RTL Styling Adjustments for Urdu with Jameel Noori Nastaliq */
[dir="rtl"] .rtl-flip {
transform: scaleX(-1);
}
[dir="rtl"] {
font-family: 'Jameel Noori Nastaliq', 'Noto Nastaliq Urdu', serif !important;
line-height: 2.3 !important;
}

/* Glassmorphism Classes */
.glass-panel {
background: rgba(15, 23, 42, 0.75);
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
border: 1px solid rgba(255, 255, 255, 0.1);
}

.glass-card {
background: rgba(30, 41, 59, 0.6);
backdrop-filter: blur(12px);
border: 1px solid rgba(255, 255, 255, 0.08);
}

/* Pulse Glow Effects */
.glow-cyan {
box-shadow: 0 0 20px rgba(0, 243, 255, 0.35);
}
.glow-red {
box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
}
.glow-green {
box-shadow: 0 0 20px rgba(34, 197, 94, 0.35);
}

/* Canvas styling */
canvas {
touch-action: none;
}

/* Custom Slider Styling */
input[type=range] {
-webkit-appearance: none;
background: #334155;
border-radius: 8px;
height: 8px;
}
input[type=range]::-webkit-slider-thumb {
-webkit-appearance: none;
height: 20px;
width: 20px;
border-radius: 50%;
background: #00f3ff;
cursor: pointer;
box-shadow: 0 0 10px #00f3ff;
transition: transform 0.1s ease;
}
input[type=range]::-webkit-slider-thumb:hover {
transform: scale(1.2);
}

/* ============ Extended design language (same system) ============ */
body {
  font-family: 'Manrope', sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  overflow: hidden;
}
.font-display { font-family: 'Oxanium', 'Manrope', sans-serif; }
[dir="rtl"] .font-display { font-family: 'Jameel Noori Nastaliq', 'Noto Nastaliq Urdu', serif; }
[dir="rtl"] body, [dir="rtl"] { font-size: 1.08em; }

.bg-grid {
  background-image:
    linear-gradient(rgba(0,243,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,243,255,0.04) 1px, transparent 1px);
  background-size: 44px 44px;
}

#intro {
  position: fixed; inset: 0; z-index: 100;
  background: radial-gradient(ellipse at center, #1a1520 0%, #0f172a 55%, #0b1220 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity .8s ease;
}
.intro-title {
  font-family: 'Oxanium', sans-serif;
  font-weight: 800; letter-spacing: .14em;
  background: linear-gradient(92deg, #00f3ff, #7dd3fc, #00f3ff);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: introZoom 1.6s cubic-bezier(.2,.8,.2,1) both, glowPulse 2s ease-in-out infinite;
}
.intro-topic {
  color: #94a3b8; letter-spacing: .22em;
  animation: introFade 1.4s .35s ease both;
}
.intro-ring {
  width: 160px; height: 160px; border-radius: 50%;
  border: 2px solid rgba(0,243,255,.35);
  box-shadow: 0 0 60px rgba(0,243,255,.25), inset 0 0 40px rgba(0,243,255,.12);
  display:flex; align-items:center; justify-content:center;
  animation: ringSpin 2.4s linear infinite, introZoom 1.2s ease both;
  margin-bottom: 28px; position: relative;
}
.intro-ring::before {
  content:''; position:absolute; inset:-10px; border-radius:50%;
  border-top: 2px solid #00f3ff; border-right: 2px solid transparent;
  border-bottom: 2px solid transparent; border-left: 2px solid transparent;
}
@keyframes ringSpin { to { transform: rotate(360deg); } }
@keyframes introZoom { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
@keyframes introFade { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes glowPulse {
  0%,100% { text-shadow: 0 0 24px rgba(0,243,255,.55); }
  50% { text-shadow: 0 0 54px rgba(0,243,255,.9); }
}

.tab-btn {
  position: relative; transition: color .25s ease, background-color .25s ease;
  border-radius: 12px;
}
.tab-btn.active {
  color: #00f3ff; background: rgba(0,243,255,.08);
  box-shadow: inset 0 0 0 1px rgba(0,243,255,.35), 0 0 18px rgba(0,243,255,.15);
}
.view { animation: viewIn .35s ease both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.mode-btn {
  transition: background-color .25s ease, color .25s ease, box-shadow .25s ease, transform .15s ease;
  border: 1px solid rgba(255,255,255,.1);
}
.mode-btn:active { transform: scale(.96); }
.mode-btn.active {
  background: rgba(0,243,255,.12); color: #00f3ff;
  border-color: rgba(0,243,255,.5); box-shadow: 0 0 16px rgba(0,243,255,.25);
}

.toggle-btn {
  transition: background-color .25s ease, color .25s ease, box-shadow .25s ease, transform .15s ease;
  border: 1px solid rgba(255,255,255,.1);
}
.toggle-btn:active { transform: scale(.96); }
.toggle-btn.on {
  background: rgba(239,68,68,.18); color: #f87171;
  border-color: rgba(239,68,68,.55); box-shadow: 0 0 16px rgba(239,68,68,.3);
}

.mat-chip {
  transition: background-color .2s ease, color .2s ease, border-color .2s ease, box-shadow .2s ease;
  border: 1px solid rgba(255,255,255,.1);
}
.mat-chip.active {
  background: rgba(0,243,255,.14); color:#00f3ff; border-color: rgba(0,243,255,.5);
  box-shadow: 0 0 12px rgba(0,243,255,.2);
}

.pred-btn {
  transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease;
  border: 1px solid rgba(255,255,255,.1);
}
.pred-btn.selected {
  background: rgba(0,243,255,.14); color:#00f3ff; border-color: rgba(0,243,255,.5);
}
.pred-btn.correct { background: rgba(34,197,94,.16); border-color:#22c55e; }
.pred-btn.wrong { background: rgba(239,68,68,.14); border-color:#ef4444; }

.opt-btn {
  transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .12s ease;
  border: 1px solid rgba(255,255,255,.1);
}
.opt-btn:not(.locked):hover { border-color: rgba(0,243,255,.45); background: rgba(0,243,255,.06); }
.opt-btn:not(.locked):active { transform: scale(.98); }
.opt-btn.correct { background: rgba(34,197,94,.16); border-color:#22c55e; box-shadow: 0 0 18px rgba(34,197,94,.3); }
.opt-btn.wrong { background: rgba(239,68,68,.14); border-color:#ef4444; box-shadow: 0 0 18px rgba(239,68,68,.3); }

.zoom-btn {
  width: 42px; height: 42px; border-radius: 12px;
  background: rgba(15,23,42,.8); border:1px solid rgba(255,255,255,.12);
  color:#00f3ff; display:flex; align-items:center; justify-content:center;
  backdrop-filter: blur(8px); cursor:pointer;
  transition: background-color .2s ease, box-shadow .2s ease, transform .12s ease;
}
.zoom-btn:hover { background: rgba(0,243,255,.12); box-shadow: 0 0 14px rgba(0,243,255,.25); }
.zoom-btn:active { transform: scale(.92); }

.stat-val { font-family: 'Oxanium', monospace; color:#00f3ff; }
[dir="rtl"] .stat-val { font-family: 'Oxanium', monospace !important; line-height: 1.4 !important; }
.num { font-family:'Oxanium', monospace !important; line-height:1.4 !important; direction:ltr; unicode-bidi:embed; }
.fade-in { animation: viewIn .4s ease both; }

#canvas-wrap .canvas-container {
  position: absolute !important;
  inset: 0;
  width: 100% !important;
  height: 100% !important;
  pointer-events: none;
  z-index: 20;
}
#fabricLayer, .upper-canvas {
  width: 100% !important;
  height: 100% !important;
}

/* Floating annotation controls card (minimizable) */
#anno-float {
  position: absolute;
  z-index: 35;
  top: 56px;
  inset-inline-start: 12px;
  transition: all .35s cubic-bezier(.2,.8,.2,1);
  max-width: 280px;
}
#anno-float.minimized {
  max-width: 48px;
}
#anno-float.minimized .anno-float-body { display: none; }
#anno-float.hidden-panel { display: none; }
.anno-float-handle { cursor: grab; }
.anno-float-handle:active { cursor: grabbing; }
</style>
</head>
<body class="bg-grid">

<!-- INTRO -->
<div id="intro">
  <div class="intro-ring"><i class="fa-solid fa-temperature-high text-5xl text-orange-300" style="filter:drop-shadow(0 0 14px rgba(251,146,60,.8))"></i></div>
  <div class="intro-title text-4xl sm:text-5xl lg:text-6xl">IQRA VIRTUAL LAB</div>
  <div class="intro-topic text-sm md:text-lg mt-5 font-bold uppercase text-center px-6" id="intro-topic">EXPANSION OF SOLIDS</div>
  <div class="mt-8 text-slate-500 text-sm tracking-widest uppercase animate-pulse" data-i18n="loading">Loading Virtual Laboratory...</div>
</div>

<!-- APP -->
<div id="app" class="h-screen flex flex-col opacity-0 transition-opacity duration-700">

  <!-- HEADER -->
  <header class="glass-panel flex items-center justify-between px-3 md:px-6 py-3 z-30 gap-2">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-10 h-10 rounded-xl bg-slate-900 border border-cyan-500/40 glow-cyan flex items-center justify-center shrink-0">
        <i class="fa-solid fa-flask text-cyan-400"></i>
      </div>
      <div class="min-w-0">
        <div class="font-display font-extrabold tracking-widest text-cyan-400 text-sm md:text-base truncate" style="font-family:'Oxanium',sans-serif !important;">IQRA VIRTUAL LAB</div>
        <div class="text-xs text-slate-400 truncate" data-i18n="topic"></div>
      </div>
    </div>

    <nav class="flex items-center gap-2 glass-card rounded-2xl p-1.5 shrink-0">
      <button id="tab-sim" onclick="switchTab('sim')" class="tab-btn active px-3 md:px-6 py-2.5 font-bold text-sm md:text-base text-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-house"></i><span data-i18n="tab_sim"></span>
      </button>
      <button id="tab-quiz" onclick="switchTab('quiz')" class="tab-btn px-3 md:px-6 py-2.5 font-bold text-sm md:text-base text-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-clipboard-question"></i><span data-i18n="tab_quiz"></span>
      </button>
    </nav>

    <div class="flex items-center gap-3">
      <!-- Annotation Toolbar (Hidden by default) -->
      <div id="anno-toolbar" class="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 transition-all duration-300 max-w-0 overflow-hidden opacity-0">
        <input type="color" id="anno-color" value="#00f3ff" onchange="changeAnnoColor(this.value)" class="w-6 h-6 cursor-pointer bg-transparent border-0 p-0" title="Color">
        <button id="anno-pen" onclick="setAnnoMode('pen')" class="text-cyan-400 p-1.5 rounded hover:bg-slate-700 transition" title="Pen"><i class="fa-solid fa-pen"></i></button>
        <button id="anno-eraser" onclick="setAnnoMode('eraser')" class="text-slate-400 p-1.5 rounded hover:bg-slate-700 transition" title="Eraser"><i class="fa-solid fa-eraser"></i></button>
        <button onclick="clearAnnotations()" class="text-red-400 p-1.5 rounded hover:bg-slate-700 transition" title="Clear All"><i class="fa-solid fa-trash-can"></i></button>
      </div>

      <!-- Annotation Toggle Button -->
      <button id="btn-anno-toggle" onclick="toggleAnnotationMode()" class="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 flex items-center justify-center border border-slate-700 transition" title="Toggle Annotation">
        <i class="fa-solid fa-pen-nib"></i>
      </button>

      <!-- Language Selector -->
      <div class="relative">
        <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-slate-900 border border-slate-700 text-cyan-400 text-sm rounded-lg focus:ring-cyan-500 focus:border-cyan-500 px-3 py-2 cursor-pointer font-bold outline-none">
          <option value="en">🌐 English</option>
          <option value="ur">🌐 اردو</option>
          <option value="hi" disabled>🌐 हिंदी (Soon)</option>
          <option value="bn" disabled>🌐 বাংলা (Soon)</option>
          <option value="ta" disabled>🌐 தமிழ் (Soon)</option>
        </select>
      </div>

      <!-- Fullscreen Button -->
      <button onclick="toggleFullScreen()" class="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-400 flex items-center justify-center border border-slate-700 transition" title="Toggle Fullscreen">
        <i class="fa-solid fa-expand" id="fs-icon"></i>
      </button>
    </div>
  </header>

  <!-- SIMULATION -->
  <main id="view-sim" class="view flex-1 flex flex-col lg:flex-row gap-3 p-3 md:p-4 min-h-0 overflow-y-auto lg:overflow-hidden">

    <section class="flex-1 flex flex-col gap-3 min-h-0 min-w-0">
      <!-- Mode selector -->
      <div class="glass-card rounded-2xl p-2 flex flex-wrap gap-2">
        <button id="mode-linear" onclick="setMode('linear')" class="mode-btn active flex-1 min-w-[110px] px-3 py-2.5 rounded-xl font-bold text-xs md:text-sm text-slate-300 flex items-center justify-center gap-2">
          <i class="fa-solid fa-ruler-horizontal"></i><span data-i18n="mode_linear"></span>
        </button>
        <button id="mode-micro" onclick="setMode('micro')" class="mode-btn flex-1 min-w-[110px] px-3 py-2.5 rounded-xl font-bold text-xs md:text-sm text-slate-300 flex items-center justify-center gap-2">
          <i class="fa-solid fa-atom"></i><span data-i18n="mode_micro"></span>
        </button>
        <button id="mode-compare" onclick="setMode('compare')" class="mode-btn flex-1 min-w-[110px] px-3 py-2.5 rounded-xl font-bold text-xs md:text-sm text-slate-300 flex items-center justify-center gap-2">
          <i class="fa-solid fa-not-equal"></i><span data-i18n="mode_compare"></span>
        </button>
        <button id="mode-hole" onclick="setMode('hole')" class="mode-btn flex-1 min-w-[110px] px-3 py-2.5 rounded-xl font-bold text-xs md:text-sm text-slate-300 flex items-center justify-center gap-2">
          <i class="fa-solid fa-circle-dot"></i><span data-i18n="mode_hole"></span>
        </button>
        <button id="mode-area" onclick="setMode('area')" class="mode-btn flex-1 min-w-[110px] px-3 py-2.5 rounded-xl font-bold text-xs md:text-sm text-slate-300 flex items-center justify-center gap-2">
          <i class="fa-solid fa-cube"></i><span data-i18n="mode_area"></span>
        </button>
      </div>

      <div id="canvas-wrap" class="glass-card rounded-2xl relative flex-1 min-h-[320px] overflow-hidden">
        <canvas id="sim-canvas" class="absolute inset-0 w-full h-full cursor-grab"></canvas>
        <canvas id="fabricLayer"></canvas>

        <!-- Floating annotation controls card -->
        <div id="anno-float" class="hidden-panel glass-panel rounded-2xl shadow-2xl overflow-hidden">
          <div class="anno-float-handle flex items-center justify-between gap-2 px-3 py-2 border-b border-slate-700/60 bg-slate-900/60">
            <div class="flex items-center gap-2 text-cyan-400 text-xs font-bold">
              <i class="fa-solid fa-pen-ruler"></i>
              <span class="anno-float-title" data-i18n="anno_title">Annotate</span>
            </div>
            <button onclick="toggleAnnoFloatMin()" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center border border-slate-700" title="Minimize">
              <i id="anno-min-icon" class="fa-solid fa-minus"></i>
            </button>
          </div>
          <div class="anno-float-body p-3 flex items-center gap-2 flex-wrap">
            <input type="color" id="anno-color-float" value="#00f3ff" onchange="syncAnnoColor(this.value)" class="w-8 h-8 cursor-pointer bg-transparent border-0 p-0" title="Color">
            <button onclick="setAnnoMode('pen')" class="w-9 h-9 rounded-lg bg-slate-800 text-cyan-400 border border-slate-700 hover:bg-slate-700"><i class="fa-solid fa-pen"></i></button>
            <button onclick="setAnnoMode('eraser')" class="w-9 h-9 rounded-lg bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700"><i class="fa-solid fa-eraser"></i></button>
            <button onclick="clearAnnotations()" class="w-9 h-9 rounded-lg bg-slate-800 text-red-400 border border-slate-700 hover:bg-slate-700"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        </div>

        <div class="absolute bottom-3 flex flex-col gap-2 z-30" style="inset-inline-end:12px" dir="ltr">
          <button class="zoom-btn" onclick="zoomBy(1.2)" title="+"><i class="fa-solid fa-plus"></i></button>
          <button class="zoom-btn" onclick="zoomBy(1/1.2)" title="−"><i class="fa-solid fa-minus"></i></button>
          <button class="zoom-btn" onclick="resetView()" title="Reset"><i class="fa-solid fa-crosshairs"></i></button>
        </div>

        <div class="absolute top-3 glass-panel rounded-xl px-3 py-2 text-xs text-cyan-300 pointer-events-none z-10" style="inset-inline-start:12px">
          <i class="fa-solid fa-hand-pointer"></i> <span data-i18n="drag_hint"></span>
        </div>
        <div class="absolute top-3 glass-panel rounded-xl px-3 py-1.5 text-[10px] text-amber-300/90 pointer-events-none z-10 max-w-[46%] text-end" style="inset-inline-end:12px">
          <span data-i18n="magnify_note"></span>
        </div>
      </div>

      <!-- Live formula / observation strip -->
      <div class="glass-card rounded-2xl p-4 flex flex-col md:flex-row gap-3 md:items-center">
        <div class="flex items-center gap-2 shrink-0">
          <i class="fa-solid fa-eye text-cyan-400"></i>
          <span class="font-display font-bold text-cyan-400 text-sm" data-i18n="obs_title"></span>
        </div>
        <p id="obs-text" class="text-sm text-slate-300 leading-relaxed flex-1"></p>
        <div class="glass-panel rounded-xl px-4 py-2 text-center shrink-0" dir="ltr">
          <div class="text-[10px] uppercase tracking-wider text-slate-500" data-i18n="formula_label"></div>
          <div id="formula-val" class="stat-val text-sm md:text-base num">ΔL = α L ΔT</div>
        </div>
      </div>
    </section>

    <!-- CONTROLS -->
    <aside class="w-full lg:w-[360px] xl:w-[400px] flex flex-col gap-3 lg:overflow-y-auto lg:min-h-0 shrink-0 pb-2">

      <!-- Heat & Temperature -->
      <div class="glass-card rounded-2xl p-4 space-y-4">
        <h2 class="font-display font-bold text-sm text-cyan-400 flex items-center gap-2">
          <i class="fa-solid fa-fire"></i><span data-i18n="heat_title"></span>
        </h2>
        <button id="btn-heat" onclick="toggleHeat()" class="toggle-btn w-full py-3 rounded-xl font-bold text-sm text-slate-300 flex items-center justify-center gap-2">
          <i class="fa-solid fa-power-off"></i><span id="heat-label" data-i18n="heat_off"></span>
        </button>
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-bold text-slate-300" data-i18n="t1_label"></label>
            <span class="stat-val text-sm num" id="val-T1">20 °C</span>
          </div>
          <input type="range" id="sl-T1" class="w-full" min="0" max="80" step="1" value="20" oninput="onControl()">
        </div>
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-bold text-slate-300" data-i18n="t2_label"></label>
            <span class="stat-val text-sm num" id="val-T2">20 °C</span>
          </div>
          <input type="range" id="sl-T2" class="w-full" min="0" max="200" step="1" value="80" oninput="onControl()">
        </div>
        <div class="glass-panel rounded-xl px-3 py-2 flex justify-between items-center">
          <span class="text-xs text-slate-400" data-i18n="dT_label"></span>
          <span class="stat-val text-sm num" id="val-dT">0 °C</span>
        </div>
      </div>

      <!-- Material & Length -->
      <div id="panel-material" class="glass-card rounded-2xl p-4 space-y-4">
        <h2 class="font-display font-bold text-sm text-cyan-400 flex items-center gap-2">
          <i class="fa-solid fa-flask-vial"></i><span data-i18n="mat_title"></span>
        </h2>
        <div class="grid grid-cols-2 gap-2" id="mat-grid"></div>
        <div id="compare-mat-row" class="hidden space-y-2">
          <label class="text-xs font-bold text-slate-400" data-i18n="mat_b"></label>
          <div class="grid grid-cols-2 gap-2" id="mat-grid-b"></div>
        </div>
        <div id="length-row">
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-bold text-slate-300" data-i18n="L0_label"></label>
            <span class="stat-val text-sm num" id="val-L0">1.00 m</span>
          </div>
          <input type="range" id="sl-L0" class="w-full" min="0.5" max="3" step="0.1" value="1.0" oninput="onControl()">
        </div>

const view = { scale: 1, x: 0, y: 0 };
let dragging = false, lastX = 0, lastY = 0;
let pinchDist = 0;
let quizIdx = 0, quizScore = 0, quizAnswered = false, quizDone = false;
let atoms = [];
let annoFloatMin = false;

function t(key) {
  const L = LANG[cur] || LANG.en;
  const v = L[key];
  return typeof v === 'function' ? v : (v != null ? v : (LANG.en[key] ?? key));
}

/* ============================================================
   LANGUAGE
============================================================ */
function changeLanguage(lang) {
  if (lang !== 'en' && lang !== 'ur') return;
  cur = lang;
  localStorage.setItem('iqra_lang', cur);
  document.documentElement.lang = cur === 'ur' ? 'ur' : 'en';
  document.documentElement.dir = cur === 'ur' ? 'rtl' : 'ltr';
  document.getElementById('lang-select').value = cur;
  applyI18n();
  buildMaterialGrids();
  updateObservation();
  if (!document.getElementById('view-quiz').classList.contains('hidden')) renderQuiz();
}

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const val = t(key);
    if (typeof val === 'string') el.textContent = val;
  });
  const intro = document.getElementById('intro-topic');
  if (intro) intro.textContent = t('intro_topic');
  updateControlLabels();
  document.getElementById('tip-text').textContent = currentTip();
}

/* ============================================================
   TABS / FULLSCREEN
============================================================ */
function switchTab(tab) {
  document.getElementById('view-sim').classList.toggle('hidden', tab !== 'sim');
  document.getElementById('view-quiz').classList.toggle('hidden', tab !== 'quiz');
  document.getElementById('tab-sim').classList.toggle('active', tab === 'sim');
  document.getElementById('tab-quiz').classList.toggle('active', tab === 'quiz');
  if (tab === 'quiz') renderQuiz();
  if (tab === 'sim') setTimeout(resizeAll, 50);
}

function toggleFullScreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement) {
    (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
    document.getElementById('fs-icon').className = 'fa-solid fa-compress';
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document);
    document.getElementById('fs-icon').className = 'fa-solid fa-expand';
  }
}

/* ============================================================
   ANNOTATION (Fabric.js) — exact logic required
============================================================ */
let fCanvas;
let isAnnoActive = false;

function initAnnotationCanvas(w, h) {
    fCanvas = new fabric.Canvas('fabricLayer', {
        isDrawingMode: false,
        width: w,
        height: h
    });
    fCanvas.freeDrawingBrush.color = document.getElementById('anno-color').value;
    fCanvas.freeDrawingBrush.width = 4;
    
    // Eraser logic via click
    fCanvas.on('mouse:down', function(options) {
        if(isAnnoActive && !fCanvas.isDrawingMode && options.target) {
            fCanvas.remove(options.target);
        }
    });
}

function toggleAnnotationMode() {
    isAnnoActive = !isAnnoActive;
    const btn = document.getElementById('btn-anno-toggle');
    const toolbar = document.getElementById('anno-toolbar');
    
    // Assumes the container of the canvas has class/id handling pointer-events
    const fabricContainer = document.querySelector('.canvas-container');

    if (isAnnoActive) {
        btn.classList.replace('text-slate-400', 'text-cyan-400');
        toolbar.classList.remove('max-w-0', 'opacity-0');
        toolbar.classList.add('max-w-xs', 'opacity-100');
        if(fabricContainer) fabricContainer.style.pointerEvents = 'auto';
        setAnnoMode('pen');
        document.getElementById('anno-float').classList.remove('hidden-panel');
    } else {
        btn.classList.replace('text-cyan-400', 'text-slate-400');
        toolbar.classList.remove('max-w-xs', 'opacity-100');
        toolbar.classList.add('max-w-0', 'opacity-0');
        if(fabricContainer) fabricContainer.style.pointerEvents = 'none';
        if (fCanvas) fCanvas.isDrawingMode = false;
        document.getElementById('anno-float').classList.add('hidden-panel');
    }
}

function setAnnoMode(mode) {
    document.getElementById('anno-pen').classList.replace('text-cyan-400', 'text-slate-400');
    document.getElementById('anno-eraser').classList.replace('text-cyan-400', 'text-slate-400');
    
    if (mode === 'pen') {
        document.getElementById('anno-pen').classList.replace('text-slate-400', 'text-cyan-400');
        if(fCanvas) fCanvas.isDrawingMode = true;
    } else {
        document.getElementById('anno-eraser').classList.replace('text-slate-400', 'text-cyan-400');
        if(fCanvas) fCanvas.isDrawingMode = false;
    }
}

function changeAnnoColor(color) {
    if(fCanvas) fCanvas.freeDrawingBrush.color = color;
    const fl = document.getElementById('anno-color-float');
    if (fl) fl.value = color;
    setAnnoMode('pen');
}

function syncAnnoColor(color) {
  document.getElementById('anno-color').value = color;
  changeAnnoColor(color);
}

function clearAnnotations() {
    if(fCanvas) fCanvas.clear();
}

function toggleAnnoFloatMin() {
  annoFloatMin = !annoFloatMin;
  const el = document.getElementById('anno-float');
  el.classList.toggle('minimized', annoFloatMin);
  document.getElementById('anno-min-icon').className = annoFloatMin ? 'fa-solid fa-plus' : 'fa-solid fa-minus';
}

function setupAnnoDrag() {
  const card = document.getElementById('anno-float');
  const handle = card.querySelector('.anno-float-handle');
  let ox = 0, oy = 0, draggingCard = false;
  handle.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    draggingCard = true;
    const r = card.getBoundingClientRect();
    const wrapEl = document.getElementById('canvas-wrap').getBoundingClientRect();
    ox = e.clientX - r.left;
    oy = e.clientY - r.top;
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove', e => {
    if (!draggingCard) return;
    const wrapEl = document.getElementById('canvas-wrap');
    const wr = wrapEl.getBoundingClientRect();
    const nx = e.clientX - wr.left - ox;
    const ny = e.clientY - wr.top - oy;
    card.style.left = Math.max(4, Math.min(wr.width - 48, nx)) + 'px';
    card.style.top = Math.max(4, Math.min(wr.height - 48, ny)) + 'px';
    card.style.insetInlineStart = 'auto';
  });
  handle.addEventListener('pointerup', () => { draggingCard = false; });
}

/* ============================================================
   CONTROLS
============================================================ */
function setMode(mode) {
  S.mode = mode;
  ['linear','micro','compare','hole','area'].forEach(m => {
    document.getElementById('mode-' + m).classList.toggle('active', m === mode);
  });
  document.getElementById('panel-hole').classList.toggle('hidden', mode !== 'hole');
  document.getElementById('compare-mat-row').classList.toggle('hidden', mode !== 'compare');
  document.getElementById('length-row').classList.toggle('hidden', mode === 'micro' || mode === 'hole');
  if (mode === 'micro') initAtoms();
  if (mode === 'hole') {
    S.prediction = null;
    S.holeRevealed = false;
    S.heat = false;
    document.getElementById('btn-heat').classList.remove('on');
    [0,1,2].forEach(i => {
      const b = document.getElementById('pred-' + i);
      b.classList.remove('selected','correct','wrong');
    });
    document.getElementById('pred-feedback').classList.add('hidden');
  }
  updateControlLabels();
  updateObservation();
  document.getElementById('tip-text').textContent = currentTip();
}

function toggleHeat() {
  if (S.mode === 'hole' && S.prediction === null) {
    // Require prediction first
    document.getElementById('obs-text').textContent = t('obs_hole_wait');
    return;
  }
  S.heat = !S.heat;
  document.getElementById('btn-heat').classList.toggle('on', S.heat);
  updateControlLabels();
  if (S.mode === 'hole' && S.heat) {
    S.holeRevealed = true;
    revealPrediction();
  }
  updateObservation();
}

function onControl() {
  S.T1 = +document.getElementById('sl-T1').value;
  S.T2 = +document.getElementById('sl-T2').value;
  S.L0 = +document.getElementById('sl-L0').value;
  S.magIdx = +document.getElementById('sl-mag').value;
  if (S.T2 < S.T1) {
    S.T2 = S.T1;
    document.getElementById('sl-T2').value = S.T2;
  }
  if (!S.heat) S.Tnow = S.T1;
  updateControlLabels();
  updateMeasurements();
  updateObservation();
}

function selectMat(id, which) {
  if (which === 'b') S.matB = id;
  else S.mat = id;
  buildMaterialGrids();
  updateMeasurements();
  updateObservation();
}

function buildMaterialGrids() {
  const mk = (gridId, active, which) => {
    const g = document.getElementById(gridId);
    g.innerHTML = '';
    Object.keys(MATERIALS).forEach(id => {
      const m = MATERIALS[id];
      const b = document.createElement('button');
      b.className = 'mat-chip px-2 py-2.5 rounded-xl font-bold text-xs text-slate-300' + (active === id ? ' active' : '');
      b.textContent = t(m.key);
      b.onclick = () => selectMat(id, which);
      g.appendChild(b);
    });
  };
  mk('mat-grid', S.mat, 'a');
  mk('mat-grid-b', S.matB, 'b');
}

function makePrediction(i) {
  if (S.holeRevealed) return;
  S.prediction = i;
  [0,1,2].forEach(j => {
    document.getElementById('pred-' + j).classList.toggle('selected', j === i);
  });
  updateObservation();
}

function revealPrediction() {
  const fb = document.getElementById('pred-feedback');
  fb.classList.remove('hidden');
  const correct = 2;
  [0,1,2].forEach(j => {
    const b = document.getElementById('pred-' + j);
    b.classList.remove('selected');
    if (j === correct) b.classList.add('correct');
    else if (j === S.prediction) b.classList.add('wrong');
  });
  fb.textContent = S.prediction === correct ? t('pred_ok') : t('pred_bad');
  fb.className = 'text-sm leading-relaxed ' + (S.prediction === correct ? 'text-green-400' : 'text-amber-300');
}

function updateControlLabels() {
  document.getElementById('heat-label').textContent = S.heat ? t('heat_on') : t('heat_off');
  document.getElementById('val-T1').textContent = S.T1 + ' °C';
  document.getElementById('val-T2').textContent = S.T2 + ' °C';
  const dT = Math.max(0, effectiveT() - S.T1);
  document.getElementById('val-dT').textContent = dT.toFixed(1) + ' °C';
  document.getElementById('val-L0').textContent = S.L0.toFixed(2) + ' m';
  document.getElementById('val-mag').textContent = MAG_LEVELS[S.magIdx] + '×';
  updateMeasurements();
}

function effectiveT() { return S.Tnow; }

function dT() { return Math.max(0, effectiveT() - S.T1); }

function calcDL(matId, L) {
  const a = MATERIALS[matId].alpha;
  return a * L * dT();
}

function formatAlpha(a) {
  const exp = (a * 1e6).toFixed(1);
  return exp + '×10⁻⁶ /°C';
}

function formatLen(m) {
  if (Math.abs(m) < 1e-4) return (m * 1e6).toFixed(2) + ' μm';
  if (Math.abs(m) < 1e-2) return (m * 1e3).toFixed(3) + ' mm';
  return m.toFixed(6) + ' m';
}

function updateMeasurements() {
  const mat = MATERIALS[S.mat];
  const dL = calcDL(S.mat, S.L0);
  const L2 = S.L0 + dL;
  const mag = MAG_LEVELS[S.magIdx];
  document.getElementById('m-alpha').textContent = formatAlpha(mat.alpha);
  document.getElementById('m-L1').textContent = S.L0.toFixed(6) + ' m';
  document.getElementById('m-L2').textContent = L2.toFixed(6) + ' m';
  document.getElementById('m-dL').textContent = formatLen(dL);
  document.getElementById('m-vis').textContent = formatLen(dL * mag);

  if (S.mode === 'area') {
    document.getElementById('formula-val').textContent = 'σ≈2α · β≈3α';
  } else if (S.mode === 'micro') {
    document.getElementById('formula-val').textContent = 'T ↑ → spacing ↑';
  } else if (S.mode === 'hole') {
    document.getElementById('formula-val').textContent = 'd₂ = d₁(1+αΔT)';
  } else {
    document.getElementById('formula-val').textContent = 'ΔL = α L ΔT';
  }
}

function currentTip() {
  return t('tip_' + (S.mode === 'area' ? 'area' : S.mode === 'hole' ? 'hole' : S.mode === 'compare' ? 'compare' : S.mode === 'micro' ? 'micro' : 'linear'));
}

function updateObservation() {
  let key;
  if (S.mode === 'linear') key = S.heat && dT() > 0.5 ? 'obs_linear_hot' : 'obs_linear_cold';
  else if (S.mode === 'micro') key = dT() > 5 ? 'obs_micro_hot' : 'obs_micro_cold';
  else if (S.mode === 'compare') key = 'obs_compare';
  else if (S.mode === 'hole') key = S.holeRevealed ? 'obs_hole_expand' : 'obs_hole_wait';
  else key = 'obs_area';
  document.getElementById('obs-text').textContent = t(key);
  document.getElementById('tip-text').textContent = currentTip();
}

/* ============================================================
   ATOMS (micro mode)
============================================================ */
function initAtoms() {
  atoms = [];
  const cols = 8, rows = 6;
  const spacing = 48;
  const ox = WORLD.w / 2 - (cols - 1) * spacing / 2;
  const oy = WORLD.h / 2 - (rows - 1) * spacing / 2 + 10;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      atoms.push({
        bx: ox + c * spacing,
        by: oy + r * spacing,
        phase: Math.random() * Math.PI * 2,
        speed: 0.8 + Math.random() * 0.6
      });
    }
  }
}

/* ============================================================
   ZOOM / PAN / RESIZE
============================================================ */
function resizeAll() {
  wrap = document.getElementById('canvas-wrap');
  canvas = document.getElementById('sim-canvas');
  if (!wrap || !canvas) return;
  const r = wrap.getBoundingClientRect();
  if (r.width < 10 || r.height < 10) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = r.width * dpr;
  canvas.height = r.height * dpr;
  canvas.style.width = r.width + 'px';
  canvas.style.height = r.height + 'px';
  ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  if (fCanvas) {
    fCanvas.setWidth(r.width);
    fCanvas.setHeight(r.height);
    fCanvas.calcOffset();
    const fabricContainer = document.querySelector('.canvas-container');
    if (fabricContainer) fabricContainer.style.pointerEvents = isAnnoActive ? 'auto' : 'none';
  } else if (typeof fabric !== 'undefined') {
    initAnnotationCanvas(r.width, r.height);
    const fabricContainer = document.querySelector('.canvas-container');
    if (fabricContainer) fabricContainer.style.pointerEvents = 'none';
  }
  fitView();
}

function fitView() {
  if (!wrap) return;
  const r = wrap.getBoundingClientRect();
  const sx = r.width / WORLD.w;
  const sy = r.height / WORLD.h;
  view.scale = Math.min(sx, sy) * 0.94;
  view.x = (r.width - WORLD.w * view.scale) / 2;
  view.y = (r.height - WORLD.h * view.scale) / 2;
}

function zoomBy(f) {
  if (!wrap) return;
  const r = wrap.getBoundingClientRect();
  const cx = r.width / 2, cy = r.height / 2;
  const wx = (cx - view.x) / view.scale;
  const wy = (cy - view.y) / view.scale;
  view.scale = Math.max(0.4, Math.min(3.5, view.scale * f));
  view.x = cx - wx * view.scale;
  view.y = cy - wy * view.scale;
}

function resetView() { fitView(); }

function setupPointer() {
  const el = document.getElementById('sim-canvas');
  el.addEventListener('pointerdown', e => {
    if (isAnnoActive) return;
    dragging = true;
    lastX = e.clientX; lastY = e.clientY;
    el.setPointerCapture(e.pointerId);
    el.classList.replace('cursor-grab', 'cursor-grabbing');
  });
  el.addEventListener('pointermove', e => {
    if (!dragging || isAnnoActive) return;
    view.x += e.clientX - lastX;
    view.y += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
  });
  el.addEventListener('pointerup', () => {
    dragging = false;
    el.classList.replace('cursor-grabbing', 'cursor-grab');
  });
  el.addEventListener('wheel', e => {
    e.preventDefault();
    const r = wrap.getBoundingClientRect();
    const cx = e.clientX - r.left, cy = e.clientY - r.top;
    const wx = (cx - view.x) / view.scale;
    const wy = (cy - view.y) / view.scale;
    const f = e.deltaY < 0 ? 1.12 : 1/1.12;
    view.scale = Math.max(0.4, Math.min(3.5, view.scale * f));
    view.x = cx - wx * view.scale;
    view.y = cy - wy * view.scale;
  }, { passive: false });

  // Pinch zoom
  el.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchDist = Math.hypot(dx, dy);
    }
  }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pinchDist > 0) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const d = Math.hypot(dx, dy);
      zoomBy(d / pinchDist);
      pinchDist = d;
    }
  }, { passive: false });
}

/* ============================================================
   PHYSICS ANIMATION
============================================================ */
function tickPhysics(dt) {
  S.animT += dt;
  const target = S.heat ? S.T2 : S.T1;
  const rate = 28; // °C per second toward target
  if (S.Tnow < target) S.Tnow = Math.min(target, S.Tnow + rate * dt);
  else if (S.Tnow > target) S.Tnow = Math.max(target, S.Tnow - rate * dt);
  updateControlLabels();
}

/* ============================================================
   DRAWING HELPERS
============================================================ */
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function heatGlow(x, y, w, intensity) {
  if (intensity <= 0) return;
  const g = ctx.createRadialGradient(x + w/2, y, 4, x + w/2, y, w * 0.7);
  g.addColorStop(0, `rgba(251,146,60,${0.35 * intensity})`);
  g.addColorStop(1, 'rgba(251,146,60,0)');
  ctx.fillStyle = g;
  ctx.fillRect(x - 40, y - 40, w + 80, 100);
}

function drawLabBench() {
  // ambient
  const g = ctx.createLinearGradient(0, 0, 0, WORLD.h);
  g.addColorStop(0, '#0b1224');
  g.addColorStop(0.7, '#111827');
  g.addColorStop(1, '#0f172a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, WORLD.w, WORLD.h);

  // subtle grid
  ctx.strokeStyle = 'rgba(0,243,255,0.04)';
  ctx.lineWidth = 1;
  for (let x = 0; x < WORLD.w; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD.h); ctx.stroke();
  }
  for (let y = 0; y < WORLD.h; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD.w, y); ctx.stroke();
  }

  // bench
  ctx.fillStyle = '#1e293b';
  roundRect(40, 430, WORLD.w - 80, 70, 12);
  ctx.fill();
  ctx.fillStyle = '#334155';
  roundRect(40, 430, WORLD.w - 80, 14, 8);
  ctx.fill();
}

function drawThermometer(x, y, T) {
  const h = 120;
  const frac = Math.max(0, Math.min(1, (T - 0) / 200));
  ctx.fillStyle = '#cbd5e1';
  roundRect(x, y, 14, h, 7);
  ctx.fill();
  ctx.fillStyle = '#0f172a';
  roundRect(x + 3, y + 6, 8, h - 28, 4);
  ctx.fill();
  const fillH = (h - 36) * frac;
  ctx.fillStyle = frac > 0.6 ? '#ef4444' : frac > 0.3 ? '#f97316' : '#38bdf8';
  ctx.fillRect(x + 3, y + 6 + (h - 36 - fillH), 8, fillH);
  ctx.beginPath();
  ctx.arc(x + 7, y + h - 8, 12, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#e2e8f0';
  ctx.font = '700 12px Oxanium, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(T.toFixed(0) + '°C', x + 7, y - 10);
}

function drawText(str, x, y, opt = {}) {
  ctx.fillStyle = opt.color || '#94a3b8';
  ctx.font = opt.font || '600 13px Manrope, sans-serif';
  if (cur === 'ur') ctx.font = opt.font || "600 15px 'Jameel Noori Nastaliq', 'Noto Nastaliq Urdu', serif";
  ctx.textAlign = opt.align || 'left';
  ctx.textBaseline = opt.base || 'middle';
  ctx.fillText(str, x, y);
}

/* ============================================================
   MODE RENDERERS
============================================================ */
function drawLinear() {
  drawLabBench();
  const mat = MATERIALS[S.mat];
  const dL = calcDL(S.mat, S.L0);
  const mag = MAG_LEVELS[S.magIdx];
  const basePx = 420 * (S.L0 / 1.5);
  const expandPx = Math.min(180, dL * mag * 8000); // visual exaggeration mapped
  const rodX = 140;
  const rodY = 300;
  const rodH = 28;
  const rodW = basePx + expandPx;

  // fixed clamp
  ctx.fillStyle = '#475569';
  roundRect(rodX - 36, rodY - 18, 40, rodH + 36, 6);
  ctx.fill();
  ctx.fillStyle = '#64748b';
  roundRect(rodX - 40, rodY - 8, 18, rodH + 16, 4);
  ctx.fill();

  // heater
  const heatX = rodX + 40, heatY = rodY + 55, heatW = Math.min(rodW - 40, 280);
  const intensity = S.heat ? Math.min(1, dT() / 60) : 0;
  heatGlow(heatX, heatY, heatW, intensity);
  ctx.fillStyle = intensity > 0 ? '#7f1d1d' : '#334155';
  roundRect(heatX, heatY, heatW, 18, 6);
  ctx.fill();
  // coils
  ctx.strokeStyle = intensity > 0 ? '#f97316' : '#64748b';
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i < heatW - 10; i += 14) {
    ctx.moveTo(heatX + 8 + i, heatY + 4);
    ctx.quadraticCurveTo(heatX + 8 + i + 7, heatY + (i % 28 < 14 ? 16 : 2), heatX + 8 + i + 14, heatY + 4);
  }
  ctx.stroke();
  if (intensity > 0) {
    for (let i = 0; i < 8; i++) {
      const fx = heatX + 20 + i * (heatW / 8) + Math.sin(S.animT * 4 + i) * 3;
      const fy = heatY - 8 - (S.animT * 40 + i * 12) % 40;
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = '#fb923c';
      ctx.beginPath(); ctx.arc(fx, fy, 4, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // rod
  const rg = ctx.createLinearGradient(rodX, 0, rodX, rodY + rodH);
  rg.addColorStop(0, '#ffffff55');
  rg.addColorStop(0.35, mat.color);
  rg.addColorStop(1, mat.accent);
  ctx.fillStyle = rg;
  roundRect(rodX, rodY, rodW, rodH, 6);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // free-end marker
  ctx.fillStyle = '#00f3ff';
  ctx.shadowColor = '#00f3ff';
  ctx.shadowBlur = 12;
  ctx.fillRect(rodX + rodW - 3, rodY - 10, 4, rodH + 20);
  ctx.shadowBlur = 0;

  // ghost original end
  if (expandPx > 1) {
    ctx.strokeStyle = 'rgba(148,163,184,0.5)';
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(rodX + basePx, rodY - 16);
    ctx.lineTo(rodX + basePx, rodY + rodH + 16);
    ctx.stroke();
    ctx.setLineDash([]);
    drawText('L₁', rodX + basePx, rodY - 24, { align: 'center', color: '#94a3b8', font: '700 12px Oxanium' });
    drawText('L₂', rodX + rodW, rodY - 24, { align: 'center', color: '#00f3ff', font: '700 12px Oxanium' });
  }

  // ruler
  const rulerY = rodY + 100;
  ctx.fillStyle = '#0f172a';
  roundRect(rodX, rulerY, basePx + 40, 22, 4);
  ctx.fill();
  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = '#94a3b8';
  ctx.font = '700 10px Oxanium';
  for (let i = 0; i <= 10; i++) {
    const xx = rodX + (basePx * i) / 10;
    ctx.beginPath();
    ctx.moveTo(xx, rulerY);
    ctx.lineTo(xx, rulerY + (i % 5 === 0 ? 14 : 8));
    ctx.stroke();
  }

  drawThermometer(40, 180, effectiveT());
  drawText(t('lbl_fixed'), rodX - 16, rodY - 36, { align: 'center', color: '#94a3b8' });
  drawText(t('lbl_free'), rodX + rodW, rodY + rodH + 28, { align: 'center', color: '#00f3ff' });
  drawText(t('lbl_heater'), heatX + heatW / 2, heatY + 36, { align: 'center' });
  drawText(t(mat.key) + '  ·  α = ' + formatAlpha(mat.alpha), WORLD.w / 2, 70, {
    align: 'center', color: '#e2e8f0', font: cur === 'ur' ? "700 18px 'Jameel Noori Nastaliq'" : '700 18px Oxanium'
  });
  drawText('ΔL = ' + formatLen(dL) + '   ·   ' + MAG_LEVELS[S.magIdx] + '×', WORLD.w / 2, 100, {
    align: 'center', color: '#00f3ff', font: '700 16px Oxanium'
  });
}

function drawMicro() {
  drawLabBench();
  ctx.fillStyle = 'rgba(15,23,42,0.65)';
  roundRect(120, 80, WORLD.w - 240, 340, 20);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,243,255,0.2)';
  ctx.stroke();

  const heatFrac = Math.min(1, dT() / 100);
  const amp = 2 + heatFrac * 14;
  const spacingGrow = 1 + heatFrac * 0.18;
  const mat = MATERIALS[S.mat];

  if (!atoms.length) initAtoms();

  // bonds
  ctx.strokeStyle = `rgba(148,163,184,${0.25 + heatFrac * 0.2})`;
  ctx.lineWidth = 1.5;
  const cols = 8;
  for (let i = 0; i < atoms.length; i++) {
    const a = atoms[i];
    const ax = a.bx * spacingGrow + (WORLD.w / 2) * (1 - spacingGrow) + Math.sin(S.animT * a.speed * (1 + heatFrac * 3) + a.phase) * amp;
    const ay = a.by * spacingGrow + (WORLD.h / 2) * (1 - spacingGrow) * 0.3 + Math.cos(S.animT * a.speed * (1 + heatFrac * 3) + a.phase * 1.3) * amp;
    a._x = ax; a._y = ay;
  }
  for (let i = 0; i < atoms.length; i++) {
    const c = i % cols, r = Math.floor(i / cols);
    const neighbors = [];
    if (c < cols - 1) neighbors.push(i + 1);
    if (r < 5) neighbors.push(i + cols);
    neighbors.forEach(j => {
      ctx.beginPath();
      ctx.moveTo(atoms[i]._x, atoms[i]._y);
      ctx.lineTo(atoms[j]._x, atoms[j]._y);
      ctx.stroke();
    });
  }

  atoms.forEach(a => {
    const grd = ctx.createRadialGradient(a._x - 3, a._y - 3, 2, a._x, a._y, 14);
    grd.addColorStop(0, '#fff');
    grd.addColorStop(0.4, mat.color);
    grd.addColorStop(1, mat.accent);
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(a._x, a._y, 11, 0, Math.PI * 2);
    ctx.fill();
    if (heatFrac > 0.2) {
      ctx.strokeStyle = `rgba(251,146,60,${0.3 + heatFrac * 0.5})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(a._x, a._y, 14 + amp * 0.3, 0, Math.PI * 2);
      ctx.stroke();
    }
  });

  drawThermometer(50, 160, effectiveT());
  drawText(t('lbl_lattice'), WORLD.w / 2, 50, {
    align: 'center', color: '#e2e8f0', font: cur === 'ur' ? "700 20px 'Jameel Noori Nastaliq'" : '700 20px Oxanium'
  });
  drawText(t('lbl_cold') + ' ←→ ' + t('lbl_hot'), WORLD.w / 2, 455, {
    align: 'center', color: heatFrac > 0.4 ? '#fb923c' : '#38bdf8'
  });
}

function drawCompare() {
  drawLabBench();
  const pairs = [
    { id: S.mat, y: 200, label: 'A' },
    { id: S.matB, y: 310, label: 'B' }
  ];
  pairs.forEach(p => {
    const mat = MATERIALS[p.id];
    const dL = calcDL(p.id, S.L0);
    const mag = MAG_LEVELS[S.magIdx];
    const basePx = 380;
    const expandPx = Math.min(160, dL * mag * 8000);
    const rodX = 160;
    ctx.fillStyle = '#475569';
    roundRect(rodX - 30, p.y - 10, 32, 40, 5);
    ctx.fill();
    const rg = ctx.createLinearGradient(0, p.y, 0, p.y + 22);
    rg.addColorStop(0, mat.color);
    rg.addColorStop(1, mat.accent);
    ctx.fillStyle = rg;
    roundRect(rodX, p.y, basePx + expandPx, 22, 5);
    ctx.fill();
    ctx.fillStyle = '#00f3ff';
    ctx.fillRect(rodX + basePx + expandPx - 2, p.y - 6, 3, 34);
    if (expandPx > 1) {
      ctx.strokeStyle = 'rgba(148,163,184,0.45)';
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(rodX + basePx, p.y - 12);
      ctx.lineTo(rodX + basePx, p.y + 34);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    drawText(p.label + ' · ' + t(mat.key), rodX, p.y - 18, { color: '#e2e8f0' });
    drawText('α = ' + formatAlpha(mat.alpha) + '   ΔL = ' + formatLen(dL), rodX + basePx + expandPx + 16, p.y + 12, {
      color: '#00f3ff', font: '700 13px Oxanium'
    });
  });

  // heater shared
  const intensity = S.heat ? Math.min(1, dT() / 60) : 0;
  heatGlow(200, 360, 300, intensity);
  ctx.fillStyle = intensity > 0 ? '#7f1d1d' : '#334155';
  roundRect(200, 370, 300, 16, 6);
  ctx.fill();
  drawThermometer(50, 180, effectiveT());
  drawText(t('lbl_compare_title'), WORLD.w / 2, 60, {
    align: 'center', color: '#e2e8f0', font: cur === 'ur' ? "700 20px 'Jameel Noori Nastaliq'" : '700 20px Oxanium'
  });
}

function drawHole() {
  drawLabBench();
  const mat = MATERIALS[S.mat];
  const alpha = mat.alpha;
  const grow = 1 + alpha * dT() * MAG_LEVELS[S.magIdx] * 40; // exaggerated
  const cx = WORLD.w / 2, cy = 270;
  const plate = 220 * grow;
  const hole = 70 * grow;

  // plate
  const g = ctx.createLinearGradient(cx - plate, cy - plate * 0.7, cx + plate, cy + plate * 0.7);
  g.addColorStop(0, mat.color);
  g.addColorStop(1, mat.accent);
  ctx.fillStyle = g;
  roundRect(cx - plate / 2, cy - plate / 2, plate, plate, 16);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // hole (cut out by drawing bench color)
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, hole / 2, 0, Math.PI * 2);
  ctx.fillStyle = '#0b1224';
  ctx.fill();
  ctx.strokeStyle = '#00f3ff';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#00f3ff';
  ctx.shadowBlur = 10;
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.restore();

  // original hole ghost
  if (grow > 1.01) {
    ctx.strokeStyle = 'rgba(148,163,184,0.55)';
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.arc(cx, cy, 35, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // heater under plate
  const intensity = S.heat ? Math.min(1, dT() / 60) : 0;
  heatGlow(cx - 120, cy + plate / 2 + 20, 240, intensity);
  ctx.fillStyle = intensity > 0 ? '#7f1d1d' : '#334155';
  roundRect(cx - 120, cy + plate / 2 + 30, 240, 16, 6);
  ctx.fill();

  drawThermometer(60, 160, effectiveT());
  drawText(t('lbl_plate'), cx, cy - plate / 2 - 24, { align: 'center', color: '#e2e8f0' });
  drawText(t('lbl_hole'), cx, cy, { align: 'center', color: '#00f3ff', font: '700 14px Oxanium' });
  drawText(t('lbl_hole_title'), WORLD.w / 2, 55, {
    align: 'center', color: '#e2e8f0', font: cur === 'ur' ? "700 20px 'Jameel Noori Nastaliq'" : '700 20px Oxanium'
  });
}

function drawArea() {
  drawLabBench();
  const mat = MATERIALS[S.mat];
  const a = mat.alpha;
  const dTval = dT();
  const mag = MAG_LEVELS[S.magIdx];
  const linearGrow = 1 + a * dTval * mag * 25;

  // Sheet (2D)
  const sx = 180, sy = 160;
  const side0 = 140;
  const side = side0 * linearGrow;
  ctx.fillStyle = 'rgba(15,23,42,0.5)';
  roundRect(100, 90, 320, 300, 16);
  ctx.fill();
  // original ghost
  ctx.strokeStyle = 'rgba(148,163,184,0.4)';
  ctx.setLineDash([4, 4]);
  ctx.strokeRect(sx, sy, side0, side0);
  ctx.setLineDash([]);
  const g1 = ctx.createLinearGradient(sx, sy, sx + side, sy + side);
  g1.addColorStop(0, mat.color);
  g1.addColorStop(1, mat.accent);
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = g1;
  ctx.fillRect(sx, sy, side, side);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = '#00f3ff';
  ctx.strokeRect(sx, sy, side, side);
  const A1 = side0 * side0;
  const A2 = A1 * (1 + 2 * a * dTval);
  drawText(t('lbl_sheet'), 260, 120, { align: 'center', color: '#e2e8f0' });
  drawText('A₂/A₁ ≈ ' + (A2 / A1).toFixed(5), 260, 380, { align: 'center', color: '#00f3ff', font: '700 13px Oxanium' });

  // Cube (3D isometric)
  const cx = 680, cy = 280;
  const s0 = 70;
  const s = s0 * linearGrow;
  function iso(x, y, z) {
    return { x: cx + (x - z) * 0.9, y: cy + y + (x + z) * 0.5 };
  }
  const pts = [
    iso(0,0,0), iso(s,0,0), iso(s,0,s), iso(0,0,s),
    iso(0,-s,0), iso(s,-s,0), iso(s,-s,s), iso(0,-s,s)
  ];
  // ghost
  const gpts = [
    iso(0,0,0), iso(s0,0,0), iso(s0,0,s0), iso(0,0,s0),
    iso(0,-s0,0), iso(s0,-s0,0), iso(s0,-s0,s0), iso(0,-s0,s0)
  ];
  ctx.strokeStyle = 'rgba(148,163,184,0.35)';
  ctx.setLineDash([3, 3]);
  [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]].forEach(([i,j]) => {
    ctx.beginPath(); ctx.moveTo(gpts[i].x, gpts[i].y); ctx.lineTo(gpts[j].x, gpts[j].y); ctx.stroke();
  });
  ctx.setLineDash([]);

  // faces
  ctx.fillStyle = mat.accent;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y); ctx.lineTo(pts[1].x, pts[1].y);
  ctx.lineTo(pts[5].x, pts[5].y); ctx.lineTo(pts[4].x, pts[4].y); ctx.closePath(); ctx.fill();
  ctx.fillStyle = mat.color;
  ctx.beginPath();
  ctx.moveTo(pts[1].x, pts[1].y); ctx.lineTo(pts[2].x, pts[2].y);
  ctx.lineTo(pts[6].x, pts[6].y); ctx.lineTo(pts[5].x, pts[5].y); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e2e8f0aa';
  ctx.beginPath();
  ctx.moveTo(pts[4].x, pts[4].y); ctx.lineTo(pts[5].x, pts[5].y);
  ctx.lineTo(pts[6].x, pts[6].y); ctx.lineTo(pts[7].x, pts[7].y); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#00f3ff';
  ctx.lineWidth = 1.5;
  [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]].forEach(([i,j]) => {
    ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke();
  });

  const V1 = 1, V2 = 1 + 3 * a * dTval;
  drawText(t('lbl_cube'), cx, 120, { align: 'center', color: '#e2e8f0' });
  drawText('V₂/V₁ ≈ ' + V2.toFixed(5), cx, 400, { align: 'center', color: '#00f3ff', font: '700 13px Oxanium' });

  drawThermometer(40, 160, effectiveT());
  drawText(t('lbl_area_title'), WORLD.w / 2, 50, {
    align: 'center', color: '#e2e8f0', font: cur === 'ur' ? "700 20px 'Jameel Noori Nastaliq'" : '700 20px Oxanium'
  });
}

function draw() {
  if (!ctx || !wrap) return;
  const r = wrap.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  ctx.save();
  ctx.translate(view.x, view.y);
  ctx.scale(view.scale, view.scale);

  if (S.mode === 'linear') drawLinear();
  else if (S.mode === 'micro') drawMicro();
  else if (S.mode === 'compare') drawCompare();
  else if (S.mode === 'hole') drawHole();
  else drawArea();

  ctx.restore();
}

/* ============================================================
   QUIZ
============================================================ */
function renderQuiz() {
  const box = document.getElementById('quiz-box');
  const quiz = (LANG[cur] || LANG.en).quiz;
  if (quizDone) {
    const pct = Math.round((quizScore / quiz.length) * 100);
    const msg = pct >= 80 ? t('score_msg_great') : pct >= 50 ? t('score_msg_good') : t('score_msg_low');
    box.innerHTML = `
      <div class="text-center space-y-6 fade-in">
        <h2 class="font-display font-bold text-2xl text-cyan-400">${t('final_score')}</h2>
        <div class="stat-val text-5xl num">${quizScore} / ${quiz.length}</div>
        <div class="text-3xl font-bold text-slate-200 num">${pct}%</div>
        <p class="text-slate-300">${msg}</p>
        <button onclick="restartQuiz()" class="px-8 py-3 rounded-xl bg-cyan-500/20 border border-cyan-400 text-cyan-300 font-bold hover:bg-cyan-500/30 transition">${t('restart')}</button>
      </div>`;
    return;
  }
  const q = quiz[quizIdx];
  const progress = typeof t('quiz_progress') === 'function' ? LANG[cur].quiz_progress(quizIdx + 1, quiz.length) : `Q ${quizIdx + 1}`;
  let opts = q.opts.map((o, i) =>
    `<button class="opt-btn w-full text-start px-4 py-3 rounded-xl text-slate-200 mb-2 ${quizAnswered ? 'locked' : ''}" id="opt-${i}" onclick="answerQuiz(${i})">${String.fromCharCode(65 + i)}. ${o}</button>`
  ).join('');
  box.innerHTML = `
    <div class="space-y-5">
      <div class="flex justify-between items-center gap-3">
        <h2 class="font-display font-bold text-xl text-cyan-400">${t('quiz_title')}</h2>
        <span class="text-sm text-slate-400">${progress}</span>
      </div>
      <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
        <div class="h-full bg-cyan-400 transition-all" style="width:${((quizIdx + (quizAnswered?1:0))/quiz.length)*100}%"></div>
      </div>
      <p class="text-lg font-bold text-slate-100 leading-relaxed">${q.q}</p>
      <div>${opts}</div>
      <div id="quiz-fb" class="hidden glass-panel rounded-xl p-4 text-sm"></div>
      <div class="flex justify-end">
        <button id="quiz-next" onclick="nextQuiz()" class="hidden px-6 py-2.5 rounded-xl bg-cyan-500/20 border border-cyan-400 text-cyan-300 font-bold">${quizIdx >= quiz.length - 1 ? t('see_result') : t('next_q')}</button>
      </div>
    </div>`;
}

function answerQuiz(i) {
  if (quizAnswered) return;
  quizAnswered = true;
  const q = (LANG[cur] || LANG.en).quiz[quizIdx];
  const correct = i === q.a;
  if (correct) quizScore++;
  document.getElementById('opt-' + q.a).classList.add('correct');
  if (!correct) document.getElementById('opt-' + i).classList.add('wrong');
  document.querySelectorAll('.opt-btn').forEach(b => b.classList.add('locked'));
  const fb = document.getElementById('quiz-fb');
  fb.classList.remove('hidden');
  fb.innerHTML = `<span class="font-bold ${correct ? 'text-green-400' : 'text-red-400'}">${correct ? t('correct_fb') : t('wrong_fb')}</span>
    <p class="mt-2 text-slate-300">${q.ex}</p>`;
  document.getElementById('quiz-next').classList.remove('hidden');
}

function nextQuiz() {
  const quiz = (LANG[cur] || LANG.en).quiz;
  if (quizIdx >= quiz.length - 1) {
    quizDone = true;
    renderQuiz();
    return;
  }
  quizIdx++;
  quizAnswered = false;
  renderQuiz();
}

function restartQuiz() {
  quizIdx = 0; quizScore = 0; quizAnswered = false; quizDone = false;
  renderQuiz();
}

/* ============================================================
   MAIN LOOP / BOOT
============================================================ */
let lastTs = 0;
function loop(ts) {
  if (window.__denied) return;
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
  lastTs = ts;
  tickPhysics(dt);
  draw();
  requestAnimationFrame(loop);
}

function boot() {
  changeLanguage(cur);
  buildMaterialGrids();
  initAtoms();
  setupPointer();
  setupAnnoDrag();
  resizeAll();
  updateObservation();
  window.addEventListener('resize', resizeAll);
  document.addEventListener('fullscreenchange', () => {
    document.getElementById('fs-icon').className = document.fullscreenElement ? 'fa-solid fa-compress' : 'fa-solid fa-expand';
    setTimeout(resizeAll, 100);
  });

  // Intro animation ~5s
  setTimeout(() => {
    const intro = document.getElementById('intro');
    intro.style.opacity = '0';
    setTimeout(() => {
      intro.style.display = 'none';
      document.getElementById('app').style.opacity = '1';
      resizeAll();
      requestAnimationFrame(loop);
    }, 800);
  }, 4800);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
