  /* ============================================================

  #introOverlay.intro-hide{ opacity:0; visibility:hidden; pointer-events:none; }
  .intro-logo{

  .intro-ring{

  @keyframes introFadeUp{
    0%{opacity:0; transform:translateY(14px);}
    100%{opacity:1; transform:translateY(0);}
  }
  @keyframes introRingPulse{
    0%{opacity:0; transform:scale(.6);}
    40%{opacity:1;}
    100%{opacity:0; transform:scale(1.35);}
  }

  .tab-btn{

  .quiz-option .opt-letter{

  .quiz-option.correct-answer .opt-letter{ background:#22c55e; color:#04120a; }
  .quiz-option.wrong-answer{ border-color:#ef4444; background:rgba(239,68,68,.15); }
  .quiz-option.wrong-answer .opt-letter{ background:#ef4444; color:#1a0505; }
  .quiz-option.locked{ cursor:default; }
  .quiz-option.dim{ opacity:.5; }

  .progress-track{ height:8px; border-radius:999px; background:rgba(255,255,255,.08); overflow:hidden; }
  .progress-fill{ height:100%; background:linear-gradient(90deg,#0891b2,#00f3ff); border-radius:999px; transition:width .4s ease; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:rgba(15,23,42,.95); border:1px solid rgba(0,243,255,.3); color:#e2e8f0;
    padding:12px 22px; border-radius:12px; font-size:.9rem; z-index:200; opacity:0;

  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @keyframes pulseGlowDot{
    0%,100%{ opacity:1; filter:drop-shadow(0 0 4px #00f3ff); }

  }
  .pulse-focus{ animation:pulseGlowDot 1.4s ease-in-out infinite; }

  @keyframes spinSlowIdle{ from{ transform:rotateY(0deg);} to{ transform:rotateY(360deg);} }

  input[type=range]:disabled{ opacity:.35; }
  input[type=range]::-moz-range-thumb{
    height:20px; width:20px; border-radius:50%; background:#00f3ff; border:none; cursor:pointer;
    box-shadow:0 0 10px #00f3ff;
  }

  .drag-handle{ cursor:grab; }
  .drag-handle:active{ cursor:grabbing; }

  ::selection{ background:rgba(0,243,255,.3); }

  @media (max-width:767px){
    .intro-logo{ font-size:2.1rem; }
    .tab-btn{ padding:9px 14px; font-size:.85rem; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }
