function conducts() {
  if (!sim.switchClosed) return 0;
  if (sim.substance === 'nacl_molten') return 0.95;
  return 0;
}
function currentAmps() {
  const c = conducts();
  if (!c) return 0;
  return +(c * 0.52).toFixed(2);
}

function spawnParticles() {
  sim.ions = []; sim.waters = []; sim.bubbles = []; sim.deposits = []; sim.sparks = []; sim.follow = null;
  if (sim.substance === 'water') {
    spawnWaters(14);
    return;
  }
  for (let i = 0; i < 6; i++) {
    sim.ions.push({ id:'na'+i, kind:'Na+', q:1, x:rndX(), y:rndY(), vx:rndV(), vy:rndV(), locked:false });
    sim.ions.push({ id:'cl'+i, kind:'Cl-', q:-1, x:rndX(), y:rndY(), vx:rndV(), vy:rndV(), locked:false });
  }
}
function spawnWaters(n) {
  sim.waters = [];
  for (let i=0;i<n;i++) sim.waters.push({ x:rndX(), y:rndY(), vx:rndV()*0.4, vy:rndV()*0.4 });
}
function rndX(){ return LIQ.x+24+Math.random()*(LIQ.w-48); }
function rndY(){ return LIQ.y+24+Math.random()*(LIQ.h-48); }
function rndV(){ return (Math.random()-0.5)*0.7; }

function spawnElectrons() {
  sim.electrons = [];
  for (let i=0;i<32;i++) sim.electrons.push({ id:'e'+i, kind:'e', s:i*22, seg: i<16?0:1 });

function wireBlue() {
  const mx = BATT.x + 32, my = BATT.y;
  return [
    {x: mx, y: my},
    {x: mx, y: 648},
    {x: 34, y: 648},
    {x: 34, y: 88},
    {x: CAT.x, y: 88},
    {x: CAT.x, y: CAT.y1}
  ];
}
function wireRedParts() {
  const px = BATT.x + 138, py = BATT.y;
  const toSwitch = [
    {x: px, y: py},
    {x: 1295, y: py},
    {x: 1295, y: SW.y},
    {x: SW.x + 78, y: SW.y}
  ];
  const fromSwitch = [
    {x: SW.x + 12, y: SW.y},
    {x: BULB.x + 40, y: SW.y},
    {x: BULB.x + 40, y: AMM.y},
    {x: AMM.x, y: AMM.y},
    {x: ANO.x, y: AMM.y},
    {x: ANO.x, y: ANO.y1}
  ];
  if (sim.switchClosed) return [toSwitch.concat([{x: SW.x + 12, y: SW.y}]).concat(fromSwitch.slice(1))];
  return [toSwitch, fromSwitch];
}
function wireSegments() {
  return [wireBlue()].concat(wireRedParts());
}

function pathLen(pts){ let L=0; for(let i=1;i<pts.length;i++) L+=Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y); return L||1; }
function pointOnPath(pts,s){
  let rem=((s%pathLen(pts))+pathLen(pts))%pathLen(pts);
  for(let i=1;i<pts.length;i++){
    const d=Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y);
    if(rem<=d){ const k=d?rem/d:0; return {x:pts[i-1].x+(pts[i].x-pts[i-1].x)*k, y:pts[i-1].y+(pts[i].y-pts[i-1].y)*k}; }
    rem-=d;
  }
  return pts[pts.length-1];
}

function fitView(){
  const c=canvas();
  const sx=c.width/(window.devicePixelRatio||1)/WORLD.w;
  const sy=c.height/(window.devicePixelRatio||1)/WORLD.h;
  view.minScale=Math.min(sx,sy)*0.94;
  view.scale=view.minScale;
  view.panX=(c.width/(window.devicePixelRatio||1)-WORLD.w*view.scale)/2;
  view.panY=(c.height/(window.devicePixelRatio||1)-WORLD.h*view.scale)/2;
}
function zoomBy(f){
  const c=canvas(); const w=c.width/(window.devicePixelRatio||1), h=c.height/(window.devicePixelRatio||1);
  const ns=Math.max(view.minScale*0.8, Math.min(3.2, view.scale*f));
  const k=ns/view.scale; view.panX=w/2-(w/2-view.panX)*k; view.panY=h/2-(h/2-view.panY)*k; view.scale=ns;
}
function resetView(){ fitView(); }
function screenToWorld(x,y){ return {x:(x-view.panX)/view.scale, y:(y-view.panY)/view.scale}; }

let dragging=false, lastX=0, lastY=0, pointers=new Map(), downPt=null;
function setupPointer(){
  const c=canvas();
  c.addEventListener('pointerdown', e=>{
    if(isAnnoActive) return;
    c.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
    downPt={x:e.offsetX,y:e.offsetY, t:Date.now()};
    const wpt=screenToWorld(e.offsetX,e.offsetY);
    if(hitSwitch(wpt.x,wpt.y)){ toggleCircuit(); downPt=null; return; }
    dragging=true; lastX=e.offsetX; lastY=e.offsetY; c.style.cursor='grabbing';
  });
  c.addEventListener('pointermove', e=>{
    if(isAnnoActive) return;
    if(pointers.has(e.pointerId)) pointers.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
    if(pointers.size===2){
      const pts=[...pointers.values()]; const d=Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      if(c._pinch) zoomBy(d/c._pinch); c._pinch=d; return;
    }
    if(!dragging) return;
    view.panX+=e.offsetX-lastX; view.panY+=e.offsetY-lastY; lastX=e.offsetX; lastY=e.offsetY;
  });
  const up=e=>{
    pointers.delete(e.pointerId); c._pinch=null; dragging=false; c.style.cursor='grab';
    if(downPt && Math.hypot(e.offsetX-downPt.x,e.offsetY-downPt.y)<8){
      tryFollow(screenToWorld(e.offsetX,e.offsetY));
    }
    downPt=null;
  };
  c.addEventListener('pointerup', up);
  c.addEventListener('pointercancel', up);
  c.addEventListener('wheel', e=>{ e.preventDefault(); zoomBy(e.deltaY<0?1.08:1/1.08); }, {passive:false});
}
function hitSwitch(x,y){ return x>SW.x-10 && x<SW.x+100 && y>SW.y-40 && y<SW.y+50; }

function tryFollow(wpt){
  let best=null, bd=28;
  if(sim.showIons) sim.ions.forEach(p=>{
    if(p.kind==='mol') return;
    const d=Math.hypot(p.x-wpt.x,p.y-wpt.y);
    if(d<bd){ bd=d; best=p; }
  });
  if(sim.showE && currentAmps()>0.05){
    const segs=wireSegments();
    sim.electrons.forEach(el=>{
      const pts=segs[el.seg]||segs[0];
      const p=pointOnPath(pts, el.s);
      const d=Math.hypot(p.x-wpt.x,p.y-wpt.y);
      if(d<bd){ bd=d; best=el; }
    });
  }
  sim.follow=best;
  updateObservation();
}

function bounce(p){
  if(p.x<LIQ.x+18){p.x=LIQ.x+18;p.vx=Math.abs(p.vx)*0.4;}
  if(p.x>LIQ.x+LIQ.w-18){p.x=LIQ.x+LIQ.w-18;p.vx=-Math.abs(p.vx)*0.4;}
  if(p.y<LIQ.y+18){p.y=LIQ.y+18;p.vy=Math.abs(p.vy)*0.4;}
  if(p.y>LIQ.y+LIQ.h-18){p.y=LIQ.y+LIQ.h-18;p.vy=-Math.abs(p.vy)*0.4;}
}

function stepParticles(){
  if(sim.paused) return;
  sim.tick++;
  if(sim.anodeCool>0) sim.anodeCool--;
  if(sim.cathodeCool>0) sim.cathodeCool--;
  const I=currentAmps();
  const field = I>0.05 ? 0.09 : 0;

  sim.ions.forEach(p=>{
    if(p.merging){
      p.x += (p.tx - p.x)*0.12;
      p.y += (p.ty - p.y)*0.12;
      return;
    }
    p.vx += (Math.random()-0.5)*0.035;
    p.vy += (Math.random()-0.5)*0.035;
    if(field && p.q) p.vx += (p.q>0?-1:1)*field;
    p.vx*=0.94; p.vy*=0.94;
    p.x+=p.vx; p.y+=p.vy;
    bounce(p);
  });
  sim.waters.forEach(w=>{
    w.vx+=(Math.random()-0.5)*0.04; w.vy+=(Math.random()-0.5)*0.04;
    w.vx*=0.97; w.vy*=0.97; w.x+=w.vx; w.y+=w.vy; bounce(w);
  });

  if(I>0.08 && sim.substance==='nacl_molten'){
    if(sim.cathodeCool===0) cathodeReaction();
    if(sim.anodeCool===0) anodeReaction();
  }

  sim.bubbles.forEach(b=>{ b.y+=b.vy; b.x+=Math.sin(sim.tick/8+b.ph)*0.55; b.r=Math.min(16, b.r+0.06); });
  sim.bubbles = sim.bubbles.filter(b=> b.y>70);
  sim.sparks.forEach(s=>{ s.y+=s.vy; s.life--; });
  sim.sparks = sim.sparks.filter(s=>s.life>0);
  if(sim.deposits.length>18) sim.deposits.shift();

  const segs=wireSegments();
  const speed = I>0.05 ? 2.6 : 0;
  sim.electrons.forEach(e=>{ e.s+=speed; if(e.seg>=segs.length) e.seg=0; });
  if(sim.flashC>0) sim.flashC--;
  if(sim.flashA>0) sim.flashA--;
}

function cathodeReaction(){
  const na = sim.ions.find(p=>p.kind==='Na+' && !p.merging && Math.abs(p.x-CAT.x)<42 && p.y>320 && p.y<530);
  if(!na) return;
  sim.flashC=22;
  sim.cathodeCool=70;
  sim.deposits.push({x:CAT.x + (Math.random()*10-18), y: na.y});
  if(sim.follow===na) sim.follow=null;
  sim.ions = sim.ions.filter(p=>p!==na);
  if(sim.ions.filter(p=>p.kind==='Na+').length<4){
    sim.ions.push({ id:'na'+sim.tick, kind:'Na+', q:1, x:LIQ.x+LIQ.w-40, y:rndY(), vx:-0.4, vy:rndV(), locked:false });
  }
}
function anodeReaction(){
  const cl = sim.ions.filter(p=>p.kind==='Cl-' && !p.merging && Math.abs(p.x-ANO.x)<48 && p.y>320 && p.y<530);
  if(cl.length<2) return;
  const a=cl[0], b=cl[1];
  a.merging=true; b.merging=true;
  a.tx=ANO.x-16; a.ty=410;
  b.tx=ANO.x-16; b.ty=430;
  sim.anodeCool=85;
  setTimeout(()=>{
    if(!sim.ions.includes(a) && !sim.ions.includes(b)) return;
    sim.flashA=22;
    sim.ions = sim.ions.filter(p=>p!==a && p!==b);
    if(sim.follow===a || sim.follow===b) sim.follow=null;
    sim.bubbles.push({kind:'Cl2', x:ANO.x-20, y:400, vy:-2.4, r:9, ph:Math.random()*6});
    sim.sparks.push({x:ANO.x, y:390, vy:-3.2, life:48});
    sim.sparks.push({x:ANO.x+5, y:400, vy:-3.4, life:48});
    if(sim.ions.filter(p=>p.kind==='Cl-').length<4){
      sim.ions.push({ id:'clA'+sim.tick, kind:'Cl-', q:-1, x:LIQ.x+36, y:rndY(), vx:0.4, vy:rndV(), locked:false });
      sim.ions.push({ id:'clB'+sim.tick, kind:'Cl-', q:-1, x:LIQ.x+50, y:rndY(), vx:0.35, vy:rndV(), locked:false });
    }
  }, 420);
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function drawLab(ctx){
  const dpr=window.devicePixelRatio||1;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,canvas().width,canvas().height);
  ctx.save();
  ctx.translate(view.panX, view.panY);
  ctx.scale(view.scale, view.scale);
  ctx.fillStyle='#0b1220'; roundRect(ctx,0,0,WORLD.w,WORLD.h,24); ctx.fill();
  drawCaption(ctx);
  drawWires(ctx);
  drawAmmeter(ctx);
  drawSwitch(ctx);
  drawBulb(ctx);
  drawBattery(ctx);
  drawBeaker(ctx);
  drawSummary(ctx);
  ctx.restore();
}

function urFont(){ return currentLang==='ur' ? 'Noto Nastaliq Urdu' : 'Manrope'; }
function drawCaption(ctx){
  ctx.fillStyle='#67e8f9'; ctx.font='700 18px '+urFont(); ctx.textAlign='left';
  ctx.fillText(currentLang==='ur' ? 'الیکٹرولیسس: تار میں الیکٹران، محلول میں آئن' : 'Electrolysis: electrons in the wire, ions in the solution', 36, 40);
}

function strokePath(ctx,pts){ if(!pts.length) return; ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y); ctx.stroke(); }

function drawWires(ctx){
  function paint(pts, edge, fill) {
    if (!pts || !pts.length) return;
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.strokeStyle=edge; ctx.lineWidth=14; strokePath(ctx,pts);
    ctx.strokeStyle=fill; ctx.lineWidth=8; strokePath(ctx,pts);
  }
  paint(wireBlue(), '#0e7490', COL_NEG);
  wireRedParts().forEach(pts => paint(pts, '#9f1239', COL_POS));

  ctx.font='700 13px '+urFont(); ctx.textAlign='left';
  ctx.fillStyle=COL_NEG;
  ctx.fillText(currentLang==='ur' ? 'نیلی تار  −  کیتھوڈ' : 'Blue wire  −  cathode', 48, 72);
  ctx.fillStyle=COL_POS;
  ctx.textAlign='right';
  ctx.fillText(currentLang==='ur' ? 'لال تار  +  اینوڈ' : 'Red wire  +  anode', 1320, 72);

  if(currentAmps()>0.05){
    const segs=wireSegments();
    sim.electrons.forEach(e=>{
      const pts=segs[e.seg]||segs[0];
      const p=pointOnPath(pts,e.s);
      const followed = sim.follow && sim.follow.id===e.id;
      ctx.beginPath(); ctx.fillStyle='#fef08a'; ctx.shadowColor='#fde047'; ctx.shadowBlur=followed?18:10;
      ctx.arc(p.x,p.y, followed?6:3.6, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
      if(followed){ ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke(); }
    });
    drawFlowArrows(ctx);
  }
}

function drawFlowArrows(ctx){
  const I=currentAmps(); if(I<0.05) return;
  ctx.font='700 12px Oxanium'; ctx.textAlign='center';
  ctx.fillStyle=COL_NEG;
  ctx.fillText(currentLang==='ur' ? 'e− → کیتھوڈ' : 'e− → cathode', 90, 430);
  ctx.fillStyle=COL_POS;
  ctx.fillText(currentLang==='ur' ? 'e− → بیٹری +' : 'e− → battery +', 1180, 250);
  if(sim.showIons && sim.substance==='nacl_molten'){
    ctx.fillStyle='#fb923c'; ctx.fillText('Na+ →', 230, 268);
    ctx.fillStyle='#34d399'; ctx.fillText('← Cl−', 340, 268);
  }
}

function drawAmmeter(ctx){
  const x=AMM.x, y=AMM.y;
  ctx.fillStyle='#1e293b'; ctx.beginPath(); ctx.arc(x,y,26,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=COL_POS; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle='#fda4af'; ctx.font='800 11px Oxanium'; ctx.textAlign='center';
  ctx.fillText('A', x, y+4);
  ctx.font='600 11px '+urFont();
  ctx.fillText(currentAmps().toFixed(2)+' A', x, y+48);
}

function drawSwitch(ctx){
  const x=SW.x, y=SW.y;
  ctx.fillStyle='#1e293b'; roundRect(ctx,x,y-24,92,48,8); ctx.fill();
  ctx.strokeStyle=COL_POS; ctx.lineWidth=1.6; ctx.stroke();
  ctx.fillStyle='#fda4af'; ctx.beginPath(); ctx.arc(x+14,y,5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+74,y,5,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(x+14,y);
  if(sim.switchClosed) ctx.lineTo(x+74,y); else ctx.lineTo(x+66,y-26); ctx.stroke();
  ctx.fillStyle=COL_POS; ctx.font='600 12px '+urFont(); ctx.textAlign='center';
  ctx.fillText(t('key_switch'), x+46, y+40);
}

function drawBulb(ctx){
  const x=BULB.x, y=BULB.y, I=currentAmps(), on=I>0.08;
  if(on){
    const g=ctx.createRadialGradient(x+40,y+28,4,x+40,y+28,68);
    g.addColorStop(0,'rgba(253,224,71,0.9)'); g.addColorStop(1,'rgba(251,191,36,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x+40,y+28,68,0,Math.PI*2); ctx.fill();
  }
  ctx.beginPath(); ctx.fillStyle=on?'rgba(254,240,138,0.9)':'rgba(148,163,184,0.22)';
  ctx.strokeStyle='#94a3b8'; ctx.lineWidth=3;
  ctx.arc(x+40,y+22,26,Math.PI,0); ctx.lineTo(x+56,y+48); ctx.lineTo(x+24,y+48); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#475569'; roundRect(ctx,x+28,y+48,24,16,3); ctx.fill();
  ctx.fillStyle='#fda4af'; ctx.font='600 12px '+urFont(); ctx.textAlign='center';
  ctx.fillText(currentLang==='ur'?'بلب':'Bulb', x+40, y-8);
}

function drawBattery(ctx){
  const x=BATT.x, y=BATT.y, w=BATT.w, h=BATT.h;
  ctx.fillStyle='#1e293b'; roundRect(ctx,x,y,w,h,12); ctx.fill();
  ctx.strokeStyle='#64748b'; ctx.stroke();
  ctx.fillStyle='rgba(56,189,248,0.22)'; roundRect(ctx,x+8,y+8,70,80,8); ctx.fill();
  ctx.fillStyle='rgba(239,68,68,0.22)'; roundRect(ctx,x+92,y+8,70,80,8); ctx.fill();
  ctx.fillStyle='#0f172a'; ctx.fillRect(x+22,y-10,28,12);
  ctx.fillStyle='#ef4444'; ctx.fillRect(x+120,y-10,28,12);
  ctx.fillStyle='#e2e8f0'; ctx.font='800 22px Oxanium'; ctx.textAlign='center';
  ctx.fillText('6 V', x+w/2, y+40);
  ctx.font='800 18px Oxanium'; ctx.fillStyle=COL_NEG; ctx.fillText('−', x+40, y+70);
  ctx.fillStyle=COL_POS; ctx.fillText('+', x+132, y+70);
  ctx.fillStyle='#67e8f9'; ctx.font='600 13px '+urFont();
  ctx.fillText(currentLang==='ur'?'بیٹری':'Battery', x+w/2, y+h+20);
}

function drawBeaker(ctx){
  const x=70,y=210,w=420,h=420;
  const liquid = sim.substance==='nacl_molten'?'rgba(249,115,22,0.32)':'rgba(56,189,248,0.28)';
  ctx.fillStyle=liquid;
  ctx.beginPath(); ctx.moveTo(x+10,y+68); ctx.lineTo(x+10,y+h-34); ctx.quadraticCurveTo(x+10,y+h-8,x+36,y+h-8);
  ctx.lineTo(x+w-36,y+h-8); ctx.quadraticCurveTo(x+w-10,y+h-8,x+w-10,y+h-34); ctx.lineTo(x+w-10,y+68); ctx.closePath(); ctx.fill();

  ctx.strokeStyle='rgba(226,232,240,0.5)'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+h-30); ctx.quadraticCurveTo(x,y+h,x+30,y+h);
  ctx.lineTo(x+w-30,y+h); ctx.quadraticCurveTo(x+w,y+h,x+w,y+h-30); ctx.lineTo(x+w,y); ctx.stroke();

  ctx.fillStyle='#92400e'; roundRect(ctx,x+24,y+10,w-48,20,4); ctx.fill();
  drawElectrode(ctx, CAT.x, y+18, currentLang==='ur'?'کیتھوڈ −':'Cathode −', sim.flashC, COL_NEG);
  drawElectrode(ctx, ANO.x, y+18, currentLang==='ur'?'اینوڈ +':'Anode +', sim.flashA, COL_POS);

  if(sim.substance==='water'){
    sim.waters.forEach(w=>{
      ctx.beginPath(); ctx.fillStyle='rgba(125,211,252,0.55)'; ctx.arc(w.x,w.y,11,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#0f172a'; ctx.font='700 8px Oxanium'; ctx.textAlign='center'; ctx.fillText('H2O', w.x, w.y+3);
    });
  }
  sim.ions.forEach(p=>drawParticle(ctx,p));
  sim.sparks.forEach(s=>{
    ctx.beginPath(); ctx.fillStyle='#22d3ee'; ctx.shadowColor='#22d3ee'; ctx.shadowBlur=14;
    ctx.arc(s.x,s.y,4.5,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
    ctx.fillStyle='#ecfeff'; ctx.font='800 9px Oxanium'; ctx.textAlign='center';
    ctx.fillText('e−', s.x+14, s.y+3);
  });
  sim.bubbles.forEach(b=>{
    ctx.beginPath();
    ctx.fillStyle = b.kind==='H2' ? 'rgba(226,232,240,0.55)' : 'rgba(163,230,53,0.45)';
    ctx.strokeStyle = b.kind==='H2' ? '#e2e8f0' : '#a3e635';
    ctx.lineWidth=1.5; ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#0f172a'; ctx.font='700 8px Oxanium'; ctx.textAlign='center';
    ctx.fillText(b.kind, b.x, b.y+4);
  });
  sim.deposits.forEach(d=>{
    ctx.beginPath(); ctx.fillStyle='#e2e8f0'; ctx.shadowColor='#94a3b8'; ctx.shadowBlur=8;
    ctx.arc(d.x,d.y,10,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
    ctx.fillStyle='#0f172a'; ctx.font='800 9px Oxanium'; ctx.textAlign='center'; ctx.fillText('Na', d.x, d.y+3);
  });

  if(!sim.switchClosed){
    ctx.fillStyle='rgba(148,163,184,0.9)'; ctx.font='700 13px '+urFont(); ctx.textAlign='center';
    ctx.fillText(t('no_net'), x+w/2, y+h-24);
  }
  ctx.fillStyle='#e2e8f0'; ctx.font='600 13px '+urFont(); ctx.textAlign='center';
  const sol= sim.substance==='water' ? (currentLang==='ur'?'مقطر پانی':'Distilled water') : (currentLang==='ur'?'پگھلا ہوا NaCl محلول':'Molten NaCl solution');
  ctx.fillText(sol, x+w/2, y+h+26);
  ctx.fillStyle='#67e8f9'; ctx.font='600 12px '+urFont();
  ctx.fillText(currentLang==='ur'?'بیکر':'Beaker', x+w/2, y-8);
}

function drawElectrode(ctx,x,y,label,flash,color){
  ctx.fillStyle = flash? '#fef08a' : color;
  roundRect(ctx,x-9,y,18,340,5); ctx.fill();
  ctx.fillStyle='#0f172a'; roundRect(ctx,x-4,y+8,8,320,3); ctx.fill();
  ctx.fillStyle=color; ctx.font='700 13px '+urFont(); ctx.textAlign='center';
  ctx.fillText(label, x, y-8);
}

function drawParticle(ctx,p){
  const followed = sim.follow && sim.follow.id===p.id;
  const r = followed? 18 : (p.tiny?8:15);
  let col='#fbbf24';
  if(p.kind==='Na+'||p.kind==='H+') col='#fb923c';
  else if(p.kind==='Cl-') col='#34d399';
  else if(p.kind==='OH-') col='#a78bfa';
  ctx.beginPath(); ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=followed?16:8;
  ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  if(followed){ ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke(); }
  ctx.fillStyle='#0f172a'; ctx.font='800 11px Oxanium'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(p.kind, p.x, p.y+0.5);
  ctx.textBaseline='alphabetic';
}

function drawSummary(ctx){
  const y=WORLD.h-78;
  ctx.fillStyle='rgba(15,23,42,0.9)'; roundRect(ctx,36,y,WORLD.w-72,62,14); ctx.fill();
  ctx.strokeStyle='rgba(0,243,255,0.25)'; ctx.stroke();
  ctx.fillStyle='#e2e8f0'; ctx.font='600 13px '+urFont(); ctx.textAlign='left';
  const bits=[t('sum_wire'), t('sum_sol'), t('sum_cat'), t('sum_an')];
  ctx.fillText(bits.join('   ·   '), 52, y+24);
  ctx.fillStyle='#67e8f9'; ctx.font='600 12px '+urFont();
  ctx.fillText(t('banner'), 52, y+48);
}

let quizIndex=0, quizScore=0, quizLocked=false, quizChosen=-1;
function renderQuiz(){
  const res=document.getElementById('quiz-result'), play=document.getElementById('quiz-play');
  if(quizIndex>=QUIZ.length){
    play.classList.add('hidden'); res.classList.remove('hidden');
    document.getElementById('score-num').textContent=quizScore+' / 5';
    document.getElementById('score-pct').textContent=Math.round((quizScore/5)*100)+' %';
    return;
  }
  play.classList.remove('hidden'); res.classList.add('hidden');
  const item=QUIZ[quizIndex];
  document.getElementById('quiz-progress').textContent=(quizIndex+1)+' / 5';
  document.getElementById('quiz-q').textContent=t(item.q);
  const box=document.getElementById('quiz-opts'); box.innerHTML='';
  item.opts.forEach((k,i)=>{
    const b=document.createElement('button');
    b.className='opt-btn w-full text-start px-4 py-3 rounded-xl font-semibold';
    b.textContent=t(k);
    if(quizLocked){ b.classList.add('locked'); if(i===item.ans) b.classList.add('correct'); else if(i===quizChosen) b.classList.add('wrong'); }
    else b.onclick=()=>pickAnswer(i);
    box.appendChild(b);
  });
  const ex=document.getElementById('quiz-explain'), next=document.getElementById('quiz-next');
  if(quizLocked){ ex.textContent=t(item.exp); ex.classList.remove('hidden'); next.classList.remove('hidden'); }
  else { ex.classList.add('hidden'); next.classList.add('hidden'); }
}
function pickAnswer(i){ if(quizLocked) return; quizLocked=true; quizChosen=i; if(i===QUIZ[quizIndex].ans) quizScore++; renderQuiz(); }
function nextQuestion(){ quizIndex++; quizLocked=false; quizChosen=-1; renderQuiz(); }
function restartQuiz(){ quizIndex=0; quizScore=0; quizLocked=false; quizChosen=-1; renderQuiz(); }

let viewFitted=false;
function resizeAll(){
  const wrap=document.getElementById('sim-viewport'); if(!wrap) return;
  const w=wrap.clientWidth, h=wrap.clientHeight, dpr=window.devicePixelRatio||1;
  const c=canvas();
  c.width=Math.max(1,w*dpr); c.height=Math.max(1,h*dpr); c.style.width=w+'px'; c.style.height=h+'px';
  if(!fCanvas){
    initAnnotationCanvas(w,h);
    const fabricContainer=document.querySelector('.canvas-container');
    if(fabricContainer) fabricContainer.style.pointerEvents='none';
  } else { fCanvas.setWidth(w); fCanvas.setHeight(h); fCanvas.calcOffset(); }
  if(!viewFitted){ fitView(); viewFitted=true; }
}
function loop(){
  stepParticles();
  const ctx=ctx2d();
  if(ctx && !document.getElementById('view-sim').classList.contains('hidden')) drawLab(ctx);
  requestAnimationFrame(loop);
}
function boot(){
  changeLanguage(currentLang);
  setSubstance('nacl_molten');
  spawnElectrons();
  setupPointer();
  window.addEventListener('resize', resizeAll);
  setTimeout(()=>{
    const intro=document.getElementById('intro');
    intro.style.opacity='0';
    document.getElementById('app').classList.remove('opacity-0');
    setTimeout(()=>{ intro.style.display='none'; resizeAll(); }, 700);
  }, 5000);
  requestAnimationFrame(loop);
}
boot();
</script>
