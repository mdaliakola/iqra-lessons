<style>

  font-family: 'Jameel Noori Nastaliq';

}

/* Custom Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #0f172a; }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #475569; }

/* RTL Styling Adjustments for Urdu with Jameel Noori Nastaliq */
[dir="rtl"] .rtl-flip { transform: scaleX(-1); }
[dir="rtl"] {
  font-family: 'Jameel Noori Nastaliq', 'Noto Nastaliq Urdu', serif !important;
  line-height: 2.3 !important;
}

/* Glassmorphism Classes */
.glass-panel {
  background: rgba(15, 23, 42, 0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.1);
}
.glass-card {
  background: rgba(30, 41, 59, 0.6);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.08);
}

/* Pulse Glow Effects */
.glow-cyan { box-shadow: 0 0 20px rgba(0, 243, 255, 0.35); }
.glow-red { box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
.glow-green { box-shadow: 0 0 20px rgba(34, 197, 94, 0.35); }

/* Canvas styling */
canvas { touch-action: none; }

/* Custom Slider Styling */
input[type=range] {
  -webkit-appearance: none;
  background: #334155;
  border-radius: 8px;
  height: 8px;
  width: 100%;
  outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  height: 20px;
  width: 20px;
  border-radius: 50%;
  background: #00f3ff;
  cursor: pointer;
  box-shadow: 0 0 10px #00f3ff;
  transition: transform 0.1s ease;
}
input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }

body {
  font-family: 'Manrope', sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  overflow: hidden;
  margin: 0;
}
.font-display { font-family: 'Oxanium', 'Manrope', sans-serif; }
[dir="rtl"] .font-display { font-family: 'Jameel Noori Nastaliq', 'Noto Nastaliq Urdu', serif; }
[dir="rtl"] body, [dir="rtl"] { font-size: 1.08em; }

.bg-grid {
  background-image:
    linear-gradient(rgba(0,243,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,243,255,0.04) 1px, transparent 1px);
  background-size: 44px 44px;
}

#intro {
  position: fixed; inset: 0; z-index: 100;
  background: radial-gradient(ellipse at center, #10233f 0%, #0f172a 65%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity .7s ease;
}
.intro-title {
  font-family: 'Oxanium', sans-serif;
  font-weight: 800; letter-spacing: .14em;
  background: linear-gradient(92deg, #00f3ff, #7dd3fc, #00f3ff);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: introZoom 1.6s cubic-bezier(.2,.8,.2,1) both, glowPulse 2s ease-in-out infinite;
}
.intro-topic {
  color: #94a3b8; letter-spacing: .12em;
  animation: introFade 1.4s .35s ease both;
  text-align: center;
  max-width: 90vw;
}
.intro-ring {
  width: 160px; height: 160px; border-radius: 50%;
  border: 2px solid rgba(0,243,255,.35);
  box-shadow: 0 0 60px rgba(0,243,255,.25), inset 0 0 40px rgba(0,243,255,.12);
  display:flex; align-items:center; justify-content:center;
  animation: ringSpin 2.4s linear infinite, introZoom 1.2s ease both;
  margin-bottom: 28px; position: relative;
}
.intro-ring::before {
  content:''; position:absolute; inset:-10px; border-radius:50%;
  border-top: 2px solid #00f3ff; border-right: 2px solid transparent;
  border-bottom: 2px solid transparent; border-left: 2px solid transparent;
}
@keyframes ringSpin { to { transform: rotate(360deg); } }
@keyframes introZoom { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
@keyframes introFade { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes glowPulse {
  0%,100% { text-shadow: 0 0 24px rgba(0,243,255,.55); }
  50% { text-shadow: 0 0 54px rgba(0,243,255,.9); }
}

.tab-btn {
  position: relative; transition: color .25s ease, background-color .25s ease;
  border-radius: 12px;
}
.tab-btn.active {
  color: #00f3ff;
  background: rgba(0,243,255,.08);
  box-shadow: inset 0 0 0 1px rgba(0,243,255,.35), 0 0 18px rgba(0,243,255,.15);
}
.view { animation: viewIn .35s ease both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.mode-btn {
  transition: background-color .25s ease, color .25s ease, box-shadow .25s ease, transform .15s ease;
  border: 1px solid rgba(255,255,255,.1);
}
.mode-btn:active { transform: scale(.96); }
.mode-btn.active {
  background: rgba(0,243,255,.12); color: #00f3ff;
  border-color: rgba(0,243,255,.5); box-shadow: 0 0 16px rgba(0,243,255,.25);
}

.opt-btn {
  transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .12s ease;
  border: 1px solid rgba(255,255,255,.1);
}
.opt-btn:not(.locked):hover { border-color: rgba(0,243,255,.45); background: rgba(0,243,255,.06); }
.opt-btn:not(.locked):active { transform: scale(.98); }
.opt-btn.correct { background: rgba(34,197,94,.16); border-color:#22c55e; box-shadow: 0 0 18px rgba(34,197,94,.3); }
.opt-btn.wrong { background: rgba(239,68,68,.14); border-color:#ef4444; box-shadow: 0 0 18px rgba(239,68,68,.3); }

.zoom-btn {
  width: 42px; height: 42px; border-radius: 12px;
  background: rgba(15,23,42,.8); border:1px solid rgba(255,255,255,.12);
  color:#00f3ff; display:flex; align-items:center; justify-content:center;
  backdrop-filter: blur(8px); cursor:pointer;
  transition: background-color .2s ease, box-shadow .2s ease, transform .12s ease;
}
.zoom-btn:hover { background: rgba(0,243,255,.12); box-shadow: 0 0 14px rgba(0,243,255,.25); }
.zoom-btn:active { transform: scale(.92); }

.stat-val { font-family: 'Oxanium', monospace; color:#00f3ff; }
[dir="rtl"] .stat-val { font-family: 'Oxanium', monospace !important; line-height: 1.4 !important; }
.num { font-family:'Oxanium', monospace !important; line-height:1.4 !important; direction:ltr; unicode-bidi:embed; }

#sim-viewport .canvas-container {
  position: absolute !important;
  left: 0; top: 0;
  width: 100% !important;
  height: 100% !important;
  pointer-events: none;
  z-index: 25;
}
#fabricLayer { z-index: 25; }

#float-tools {
  transition: max-height .35s ease, opacity .25s ease, padding .25s ease, width .3s ease;
}
#float-tools.collapsed {
  max-height: 52px;
  width: 52px;
  overflow: hidden;
  padding: 6px;
}
#float-tools.collapsed .float-body { display: none; }

.switch-track {
  width: 72px; height: 36px; border-radius: 999px;
  background: #334155; position: relative; cursor: pointer;
  border: 1px solid rgba(255,255,255,.12);
  transition: background .2s ease, box-shadow .2s ease;
}
.switch-track.on { background: rgba(34,197,94,.35); box-shadow: 0 0 18px rgba(34,197,94,.35); }
.switch-knob {
  position: absolute; top: 3px; left: 3px;
  width: 28px; height: 28px; border-radius: 50%;
  background: #94a3b8; transition: transform .2s ease, background .2s ease;
}
.switch-track.on .switch-knob { transform: translateX(36px); background: #22c55e; }
[dir="rtl"] .switch-track.on .switch-knob { transform: translateX(-36px); }

.obs-live { animation: viewIn .4s ease both; }
</style>

<body class="bg-grid">

<div id="intro">
  <div class="intro-ring"><i class="fa-solid fa-bolt text-5xl text-cyan-300" style="filter:drop-shadow(0 0 14px rgba(0,243,255,.8))"></i></div>
  <div class="intro-title text-4xl sm:text-5xl lg:text-6xl">IQRA VIRTUAL LAB</div>
  <div class="intro-topic text-base md:text-xl mt-5 font-bold" id="intro-topic"></div>
</div>

<div id="app" class="h-screen flex flex-col opacity-0 transition-opacity duration-700">

  <header class="glass-panel flex items-center justify-between px-4 md:px-6 py-3 z-30 gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-10 h-10 rounded-xl bg-slate-900 border border-cyan-500/40 glow-cyan flex items-center justify-center shrink-0">
        <i class="fa-solid fa-flask text-cyan-400"></i>
      </div>
      <div class="min-w-0">
        <div class="font-display font-extrabold tracking-widest text-cyan-400 text-sm md:text-base truncate" style="font-family:'Oxanium',sans-serif !important;">IQRA VIRTUAL LAB</div>
        <div class="text-xs text-slate-400 truncate" data-i18n="topic"></div>
      </div>
    </div>

    <nav class="flex items-center gap-2 glass-card rounded-2xl p-1.5 shrink-0">
      <button id="tab-sim" onclick="switchTab('sim')" class="tab-btn active px-3 md:px-6 py-2.5 font-bold text-sm md:text-base text-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-house"></i><span data-i18n="tab_sim"></span>
      </button>
      <button id="tab-quiz" onclick="switchTab('quiz')" class="tab-btn px-3 md:px-6 py-2.5 font-bold text-sm md:text-base text-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-clipboard-question"></i><span data-i18n="tab_quiz"></span>
      </button>
    </nav>

    <div class="flex items-center gap-3">
      <!-- Annotation Toolbar (Hidden by default) -->
      <div id="anno-toolbar" class="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 transition-all duration-300 max-w-0 overflow-hidden opacity-0">
        <input type="color" id="anno-color" value="#00f3ff" onchange="changeAnnoColor(this.value)" class="w-6 h-6 cursor-pointer bg-transparent border-0 p-0" title="Color">
        <button id="anno-pen" onclick="setAnnoMode('pen')" class="text-cyan-400 p-1.5 rounded hover:bg-slate-700 transition" title="Pen"><i class="fa-solid fa-pen"></i></button>
        <button id="anno-eraser" onclick="setAnnoMode('eraser')" class="text-slate-400 p-1.5 rounded hover:bg-slate-700 transition" title="Eraser"><i class="fa-solid fa-eraser"></i></button>
        <button onclick="clearAnnotations()" class="text-red-400 p-1.5 rounded hover:bg-slate-700 transition" title="Clear All"><i class="fa-solid fa-trash-can"></i></button>
      </div>

      <!-- Annotation Toggle Button -->
      <button id="btn-anno-toggle" onclick="toggleAnnotationMode()" class="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 flex items-center justify-center border border-slate-700 transition" title="Toggle Annotation">
        <i class="fa-solid fa-pen-nib"></i>
      </button>

      <!-- Language Selector -->
      <div class="relative">
        <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-slate-900 border border-slate-700 text-cyan-400 text-sm rounded-lg focus:ring-cyan-500 focus:border-cyan-500 px-3 py-2 cursor-pointer font-bold outline-none">
          <option value="en">🌐 English</option>
          <option value="ur">🌐 اردو</option>
          <option value="hi" disabled>🌐 हिंदी (Soon)</option>
          <option value="bn" disabled>🌐 বাংলা (Soon)</option>
          <option value="ta" disabled>🌐 தமிழ் (Soon)</option>
        </select>
      </div>

      <!-- Fullscreen Button -->
      <button onclick="toggleFullScreen()" class="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-400 flex items-center justify-center border border-slate-700 transition" title="Toggle Fullscreen">
        <i class="fa-solid fa-expand" id="fs-icon"></i>
      </button>
    </div>
  </header>

  <main id="view-sim" class="view flex-1 flex flex-col lg:flex-row gap-4 p-4 min-h-0 overflow-hidden">

    <section class="flex-1 flex flex-col min-h-0 min-w-0 relative">
      <div id="sim-viewport" class="glass-card rounded-2xl relative flex-1 min-h-[320px] overflow-hidden">
        <canvas id="simCanvas" class="absolute inset-0 w-full h-full cursor-grab"></canvas>
        <canvas id="fabricLayer"></canvas>

        <div id="float-tools" class="absolute top-3 glass-panel rounded-2xl p-3 z-30 glow-cyan" style="inset-inline-end:12px; max-height: 280px; width: 168px;">
          <div class="flex items-center justify-between gap-2">
            <span class="text-xs font-bold text-cyan-300 float-body" data-i18n="view_tools"></span>
            <button onclick="toggleFloatTools()" class="zoom-btn" style="width:36px;height:36px" title="Minimize">
              <i id="float-min-icon" class="fa-solid fa-minus"></i>
            </button>
          </div>
          <div class="float-body mt-2 flex flex-col gap-2">
            <button class="zoom-btn w-full" onclick="zoomBy(1.2)"><i class="fa-solid fa-plus"></i></button>
            <button class="zoom-btn w-full" onclick="zoomBy(1/1.2)"><i class="fa-solid fa-minus"></i></button>
            <button class="zoom-btn w-full" onclick="resetView()"><i class="fa-solid fa-crosshairs"></i></button>
          </div>
        </div>

        <div class="absolute bottom-3 glass-panel rounded-xl px-3 py-2 text-xs text-cyan-200 z-10 pointer-events-none" style="inset-inline-start:12px">
          <i class="fa-solid fa-hand-pointer"></i> <span data-i18n="canvas_hint"></span>
        </div>
      </div>
    </section>

    <aside class="w-full lg:w-[340px] shrink-0 flex flex-col gap-3 overflow-y-auto min-h-0">
      <div class="glass-card rounded-2xl p-4">
        <div class="text-xs uppercase tracking-widest text-slate-400 mb-3 font-bold" data-i18n="sample"></div>
        <div class="grid grid-cols-1 gap-2">
          <button id="sub-nacl_aq" onclick="setSubstance('nacl_aq')" class="mode-btn active px-3 py-3 rounded-xl font-bold text-sm text-slate-300 text-start flex items-center gap-2">
            <i class="fa-solid fa-droplet text-sky-400"></i><span data-i18n="sub_nacl_aq"></span>
          </button>
          <button id="sub-nacl_solid" onclick="setSubstance('nacl_solid')" class="mode-btn px-3 py-3 rounded-xl font-bold text-sm text-slate-300 text-start flex items-center gap-2">
            <i class="fa-solid fa-gem text-violet-300"></i><span data-i18n="sub_nacl_solid"></span>
          </button>
          <button id="sub-nacl_molten" onclick="setSubstance('nacl_molten')" class="mode-btn px-3 py-3 rounded-xl font-bold text-sm text-slate-300 text-start flex items-center gap-2">
            <i class="fa-solid fa-fire text-orange-400"></i><span data-i18n="sub_nacl_molten"></span>
          </button>
          <button id="sub-sugar" onclick="setSubstance('sugar')" class="mode-btn px-3 py-3 rounded-xl font-bold text-sm text-slate-300 text-start flex items-center gap-2">
            <i class="fa-solid fa-cubes-stacked text-amber-300"></i><span data-i18n="sub_sugar"></span>
          </button>
          <button id="sub-water" onclick="setSubstance('water')" class="mode-btn px-3 py-3 rounded-xl font-bold text-sm text-slate-300 text-start flex items-center gap-2">
            <i class="fa-solid fa-glass-water text-blue-300"></i><span data-i18n="sub_water"></span>
          </button>
        </div>
      </div>

      <div class="glass-card rounded-2xl p-4 space-y-4">
        <div class="flex items-center justify-between gap-3">
          <span class="font-bold" data-i18n="key_switch"></span>
          <div id="ui-switch" class="switch-track" onclick="toggleCircuit()">
            <div class="switch-knob"></div>
          </div>
        </div>
        <div>
          <div class="flex justify-between text-sm mb-2">
            <span data-i18n="concentration"></span>
            <span class="stat-val num" id="conc-val">0.50 M</span>
          </div>
          <input type="range" id="conc-slider" min="0.05" max="1.2" step="0.05" value="0.50" oninput="setConcentration(this.value)">
        </div>
        <div>
          <div class="flex justify-between text-sm mb-2">
            <span data-i18n="voltage"></span>
            <span class="stat-val num" id="volt-val">6.0 V</span>
          </div>
          <input type="range" id="volt-slider" min="1" max="12" step="0.5" value="6" oninput="setVoltage(this.value)">
        </div>
        <button onclick="resetExperiment()" class="w-full py-3 rounded-xl font-bold bg-slate-800 border border-slate-600 hover:border-cyan-400 text-cyan-300">
          <i class="fa-solid fa-rotate-left"></i> <span data-i18n="reset_exp"></span>
        </button>
      </div>

      <div class="glass-card rounded-2xl p-4">
        <div class="text-xs uppercase tracking-widest text-slate-400 mb-3 font-bold" data-i18n="live_meters"></div>
        <div class="grid grid-cols-2 gap-2 text-sm">
          <div class="bg-slate-900/70 rounded-xl p-3">
            <div class="text-slate-400" data-i18n="current"></div>
            <div class="stat-val text-lg num" id="meter-i">0.00 A</div>
          </div>
          <div class="bg-slate-900/70 rounded-xl p-3">
            <div class="text-slate-400" data-i18n="bulb_state"></div>
            <div class="stat-val text-lg" id="meter-bulb"></div>
          </div>
          <div class="bg-slate-900/70 rounded-xl p-3 col-span-2">
            <div class="text-slate-400" data-i18n="carriers"></div>
            <div class="stat-val text-base" id="meter-carriers"></div>
          </div>
        </div>
      </div>

      <div class="glass-card rounded-2xl p-4 flex-1">
        <div class="text-xs uppercase tracking-widest text-slate-400 mb-2 font-bold" data-i18n="observe"></div>
        <p id="observe-text" class="obs-live text-sm text-slate-200 leading-relaxed"></p>
        <div class="mt-3 flex flex-wrap gap-2 text-xs">
          <span class="px-2 py-1 rounded-full bg-orange-500/20 text-orange-300 border border-orange-400/30">Na<sup>+</sup></span>
          <span class="px-2 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-400/30">Cl<sup>−</sup></span>
          <span class="px-2 py-1 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-400/30" data-i18n="legend_e"></span>
        </div>
      </div>
    </aside>
  </main>

  <main id="view-quiz" class="hidden view flex-1 overflow-y-auto p-4 md:p-8">
    <div class="max-w-3xl mx-auto glass-card rounded-2xl p-6 md:p-8">
      <div id="quiz-play">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-xl font-bold text-cyan-300" data-i18n="quiz_title"></h2>
          <span class="stat-val num" id="quiz-progress">1 / 5</span>
        </div>
        <p id="quiz-q" class="text-lg md:text-xl font-semibold mb-5"></p>
        <div id="quiz-opts" class="flex flex-col gap-3"></div>
        <p id="quiz-explain" class="mt-4 text-sm text-slate-300 hidden"></p>
        <button id="quiz-next" onclick="nextQuestion()" class="hidden mt-6 w-full py-3 rounded-xl font-bold bg-cyan-500/20 border border-cyan-400 text-cyan-200 glow-cyan">
          <span data-i18n="next_q"></span>
        </button>
      </div>
      <div id="quiz-result" class="hidden text-center py-6">

        <p class="stat-val text-4xl mb-2 num" id="score-num"></p>
        <p class="text-lg text-slate-300 mb-6"><span data-i18n="percentage"></span>: <span class="stat-val num" id="score-pct"></span></p>
        <button onclick="restartQuiz()" class="px-8 py-3 rounded-xl font-bold bg-cyan-500/20 border border-cyan-400 text-cyan-200 glow-cyan">
          <i class="fa-solid fa-rotate-right"></i> <span data-i18n="restart_quiz"></span>
        </button>
      </div>
    </div>
  </main>

function t(key) {
  return (LANG[currentLang] && LANG[currentLang][key]) || LANG.en[key] || key;
}

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  const intro = document.getElementById('intro-topic');
  if (intro) intro.textContent = t('intro_topic');
  updateMeters();
  updateObservation();
  if (!document.getElementById('view-quiz').classList.contains('hidden')) renderQuiz();
}

function changeLanguage(lang) {
  if (lang !== 'en' && lang !== 'ur') return;
  currentLang = lang;
  localStorage.setItem('iqra-lang', lang);
  document.documentElement.lang = lang === 'ur' ? 'ur' : 'en';
  document.documentElement.dir = lang === 'ur' ? 'rtl' : 'ltr';
  const sel = document.getElementById('lang-select');
  if (sel) sel.value = lang;
  applyI18n();
}

function switchTab(name) {
  document.getElementById('view-sim').classList.toggle('hidden', name !== 'sim');
  document.getElementById('view-quiz').classList.toggle('hidden', name !== 'quiz');
  document.getElementById('tab-sim').classList.toggle('active', name === 'sim');
  document.getElementById('tab-quiz').classList.toggle('active', name === 'quiz');
  if (name === 'sim') requestAnimationFrame(resizeAll);
  if (name === 'quiz') renderQuiz();
}

function toggleFullScreen() {
  const root = document.documentElement;
  if (!document.fullscreenElement) {
    (root.requestFullscreen || root.webkitRequestFullscreen || root.msRequestFullscreen).call(root);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document);
  }
}
document.addEventListener('fullscreenchange', () => {
  const ic = document.getElementById('fs-icon');
  if (ic) ic.className = document.fullscreenElement ? 'fa-solid fa-compress' : 'fa-solid fa-expand';
});

let fCanvas;
let isAnnoActive = false;

function initAnnotationCanvas(w, h) {
    fCanvas = new fabric.Canvas('fabricLayer', {
        isDrawingMode: false,
        width: w,
        height: h
    });
    fCanvas.freeDrawingBrush.color = document.getElementById('anno-color').value;
    fCanvas.freeDrawingBrush.width = 4;

    fCanvas.on('mouse:down', function(options) {
        if(isAnnoActive && !fCanvas.isDrawingMode && options.target) {
            fCanvas.remove(options.target);
        }
    });
}

function toggleAnnotationMode() {
    isAnnoActive = !isAnnoActive;
    const btn = document.getElementById('btn-anno-toggle');
    const toolbar = document.getElementById('anno-toolbar');

    const fabricContainer = document.querySelector('.canvas-container');

    if (isAnnoActive) {
        btn.classList.replace('text-slate-400', 'text-cyan-400');
        toolbar.classList.remove('max-w-0', 'opacity-0');
        toolbar.classList.add('max-w-xs', 'opacity-100');

const WORLD = { w: 1280, h: 720 };
let view = { scale: 1, panX: 0, panY: 0, minScale: 0.4 };
let sim = {
  substance: 'nacl_aq',
  switchClosed: false,
  concentration: 0.5,
  voltage: 6,
  ions: [],
  molecules: [],
  electrons: [],
  spark: 0
};

const canvas = () => document.getElementById('simCanvas');
const ctx2d = () => canvas().getContext('2d');

function conducts() {
  if (!sim.switchClosed) return 0;
  if (sim.substance === 'nacl_aq') return 0.35 + sim.concentration * 0.9;
  if (sim.substance === 'nacl_molten') return 0.85;
  if (sim.substance === 'water') return 0.02;
  return 0;
}

function currentAmps() {
  const c = conducts();
  if (!c) return 0;
  return +(c * (sim.voltage / 6) * (sim.substance === 'nacl_aq' ? (0.4 + sim.concentration) : 1) * 0.45).toFixed(2);
}

function spawnParticles() {
  sim.ions = [];
  sim.molecules = [];
  const bx = 90, by = 250, bw = 360, bh = 330;
  const n = sim.substance === 'nacl_aq' ? Math.round(18 + sim.concentration * 55)
    : sim.substance === 'nacl_molten' ? 48
    : sim.substance === 'nacl_solid' ? 36
    : sim.substance === 'sugar' ? 22
    : 6;

  if (sim.substance === 'nacl_solid') {
    const cols = 6, rows = 6;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        sim.ions.push({
          x: bx + 70 + c * 42, y: by + 80 + r * 38,
          vx: 0, vy: 0,
          q: (r + c) % 2 === 0 ? 1 : -1,
          locked: true, phase: Math.random() * 6
        });
      }
    }
    return;
  }

  if (sim.substance === 'sugar') {
    for (let i = 0; i < n; i++) {
      sim.molecules.push({
        x: bx + 40 + Math.random() * (bw - 80),
        y: by + 50 + Math.random() * (bh - 90),
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4
      });
    }
    return;
  }

  if (sim.substance === 'water') {
    for (let i = 0; i < 4; i++) {
      sim.ions.push({
        x: bx + 50 + Math.random() * (bw - 100),
        y: by + 60 + Math.random() * (bh - 110),
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        q: i % 2 ? 1 : -1,
        locked: false, phase: 0, tiny: true
      });
    }
    return;
  }

  for (let i = 0; i < n; i++) {
    sim.ions.push({
      x: bx + 40 + Math.random() * (bw - 80),
      y: by + 50 + Math.random() * (bh - 90),
      vx: (Math.random() - 0.5) * 0.6,
      vy: (Math.random() - 0.5) * 0.6,
      q: i % 2 === 0 ? 1 : -1,
      locked: false, phase: Math.random() * 6
    });
  }
}

function spawnElectrons() {
  sim.electrons = [];
  const n = 28;
  for (let i = 0; i < n; i++) sim.electrons.push({ s: i * 18 });
}

function wireSegments() {
  const plus = { x: 1098, y: 430 };
  const minus = { x: 1012, y: 430 };
  const left = [
    { x: minus.x, y: minus.y },
    { x: minus.x, y: 168 },
    { x: 180, y: 168 },
    { x: 180, y: 210 }
  ];
  const mid = [
    { x: 360, y: 210 },
    { x: 360, y: 168 },
    { x: 800, y: 168 },
    { x: 800, y: 188 },
    { x: 1032, y: 188 }
  ];
  const right = [
    { x: 1100, y: 188 },
    { x: plus.x, y: 168 },
    { x: plus.x, y: plus.y }
  ];
  if (sim.switchClosed) return [left, mid.concat(right)];
  return [left, mid, right];
}
function wirePathLeft() { return wireSegments()[0]; }
function wirePathRight() { return wireSegments()[1]; }

function pathLen(pts) {
  let L = 0;
  for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
  return L;
}
function pointOnPath(pts, s) {
  let rem = ((s % pathLen(pts)) + pathLen(pts)) % pathLen(pts);
  for (let i = 1; i < pts.length; i++) {
    const d = Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
    if (rem <= d) {
      const k = d ? rem / d : 0;
      return { x: pts[i-1].x + (pts[i].x - pts[i-1].x) * k, y: pts[i-1].y + (pts[i].y - pts[i-1].y) * k };
    }
    rem -= d;
  }
  return pts[pts.length - 1];
}

function fitView() {
  const c = canvas();
  const sx = c.width / (window.devicePixelRatio || 1) / WORLD.w;
  const sy = c.height / (window.devicePixelRatio || 1) / WORLD.h;
  view.minScale = Math.min(sx, sy) * 0.92;
  view.scale = view.minScale;
  view.panX = (c.width / (window.devicePixelRatio || 1) - WORLD.w * view.scale) / 2;
  view.panY = (c.height / (window.devicePixelRatio || 1) - WORLD.h * view.scale) / 2;
}
function zoomBy(f) {
  const c = canvas();
  const w = c.width / (window.devicePixelRatio || 1);
  const h = c.height / (window.devicePixelRatio || 1);
  const cx = w / 2, cy = h / 2;
  const ns = Math.max(view.minScale * 0.8, Math.min(3.2, view.scale * f));
  const k = ns / view.scale;
  view.panX = cx - (cx - view.panX) * k;
  view.panY = cy - (cy - view.panY) * k;
  view.scale = ns;
}
function resetView() { fitView(); }

let dragging = false, lastX = 0, lastY = 0, pointers = new Map();

function screenToWorld(x, y) {
  return { x: (x - view.panX) / view.scale, y: (y - view.panY) / view.scale };
}

function setupPointer() {
  const c = canvas();
  c.addEventListener('pointerdown', e => {
    if (isAnnoActive) return;
    c.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
    const wpt = screenToWorld(e.offsetX, e.offsetY);
    if (hitSwitch(wpt.x, wpt.y)) { toggleCircuit(); return; }
    dragging = true;
    lastX = e.offsetX; lastY = e.offsetY;
    c.style.cursor = 'grabbing';
  });
  c.addEventListener('pointermove', e => {
    if (isAnnoActive) return;
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
    if (pointers.size === 2) {
      const pts = [...pointers.values()];
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (c._pinch) zoomBy(d / c._pinch);
      c._pinch = d;
      return;
    }
    if (!dragging) return;
    view.panX += e.offsetX - lastX;
    view.panY += e.offsetY - lastY;
    lastX = e.offsetX; lastY = e.offsetY;
  });
  const up = e => {
    pointers.delete(e.pointerId);
    c._pinch = null;
    dragging = false;
    c.style.cursor = 'grab';
  };
  c.addEventListener('pointerup', up);
  c.addEventListener('pointercancel', up);
  c.addEventListener('wheel', e => {
    e.preventDefault();
    zoomBy(e.deltaY < 0 ? 1.08 : 1/1.08);
  }, { passive: false });
}

function hitSwitch(x, y) {
  return x > 1000 && x < 1120 && y > 95 && y < 210;
}

function stepParticles() {
  const I = currentAmps();
  const field = sim.switchClosed && I > 0.05 ? (sim.voltage / 6) * 0.085 * (I > 0.1 ? 1 : 0.2) : 0;
  const bx = 110, by = 280, bw = 320, bh = 280;
  const cathodeX = 180, anodeX = 360;

  sim.ions.forEach(p => {
    if (p.locked) {
      p.x += Math.sin(performance.now() / 180 + p.phase) * 0.15;
      p.y += Math.cos(performance.now() / 200 + p.phase) * 0.15;
      return;
    }
    p.vx += (Math.random() - 0.5) * 0.04;
    p.vy += (Math.random() - 0.5) * 0.04;
    if (field) {
      p.vx += (p.q > 0 ? -1 : 1) * field;
    }
    p.vx *= 0.96; p.vy *= 0.96;
    p.x += p.vx; p.y += p.vy;
    if (p.x < bx) { p.x = bx; p.vx *= -0.4; }
    if (p.x > bx + bw) { p.x = bx + bw; p.vx *= -0.4; }
    if (p.y < by) { p.y = by; p.vy *= -0.4; }
    if (p.y > by + bh) { p.y = by + bh; p.vy *= -0.4; }
    if (field && p.q > 0 && Math.abs(p.x - cathodeX) < 18) p.vx *= 0.3;
    if (field && p.q < 0 && Math.abs(p.x - anodeX) < 18) p.vx *= 0.3;
  });

  sim.molecules.forEach(m => {
    m.vx += (Math.random() - 0.5) * 0.03;
    m.vy += (Math.random() - 0.5) * 0.03;
    m.vx *= 0.98; m.vy *= 0.98;
    m.x += m.vx; m.y += m.vy;
    if (m.x < bx) { m.x = bx; m.vx *= -1; }
    if (m.x > bx + bw) { m.x = bx + bw; m.vx *= -1; }
    if (m.y < by) { m.y = by; m.vy *= -1; }
    if (m.y > by + bh) { m.y = by + bh; m.vy *= -1; }
  });

  const speed = I > 0.08 ? 2.2 * (sim.voltage / 6) : 0;
  sim.electrons.forEach(e => { e.s += speed; });
}

function drawLab(ctx) {
  ctx.clearRect(0, 0, canvas().width, canvas().height);
  ctx.save();
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.translate(view.panX, view.panY);
  ctx.scale(view.scale, view.scale);

  ctx.fillStyle = '#0b1220';
  roundRect(ctx, 0, 0, WORLD.w, WORLD.h, 24);
  ctx.fill();

  drawTitle(ctx);
  drawWires(ctx);
  drawSwitch(ctx);
  drawBulb(ctx);
  drawBattery(ctx);
  drawBeaker(ctx);
  drawMicroCallout(ctx);
  drawLegend(ctx);

  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawTitle(ctx) {
  ctx.fillStyle = '#67e8f9';
  ctx.font = '700 22px Manrope, sans-serif';
  ctx.textAlign = 'left';
  const caption = currentLang === 'ur' ? '5.8 محلول کی برقی ایصالیت کی جانچ' : '5.8 Testing the electrical conductivity of a solution';
  ctx.fillText(caption, 40, 48);
}

function strokePath(ctx, pts) {
  if (!pts.length) return;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
}
function drawWires(ctx) {
  const paths = wireSegments();
  paths.forEach(pts => {
    ctx.strokeStyle = '#111827';
    ctx.lineWidth = 7;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    strokePath(ctx, pts);
    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 4;
    strokePath(ctx, pts);
  });

  if (currentAmps() > 0.08) {
    const left = wirePathLeft();
    const right = wirePathRight();
    sim.electrons.forEach((e, i) => {
      const pts = i % 2 === 0 ? left : right;
      const p = pointOnPath(pts, e.s);
      ctx.beginPath();
      ctx.fillStyle = '#22d3ee';
      ctx.shadowColor = '#22d3ee';
      ctx.shadowBlur = 12;
      ctx.arc(p.x, p.y, 3.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    });
  }
}

function drawIon(ctx, p) {

  ctx.beginPath();
  ctx.fillStyle = p.q > 0 ? '#fb923c' : '#34d399';
  ctx.shadowColor = ctx.fillStyle;
  ctx.shadowBlur = 10;
  ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#0f172a';
  ctx.font = '800 10px Oxanium, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(p.tiny ? (p.q > 0 ? 'H+' : 'OH−') : (p.q > 0 ? 'Na+' : 'Cl−'), p.x, p.y + 0.5);
  ctx.textBaseline = 'alphabetic';
}

function underwaterText() {
  if (currentLang === 'ur') {
    if (sim.substance === 'nacl_aq') return ['NaCl(s) → Na+(aq) + Cl−(aq)', 'مثبت آئن کیتھوڈ، منفی اینوڈ'];
    if (sim.substance === 'nacl_solid') return ['NaCl(s) جالی میں بند', 'کوئی آزاد بہاؤ نہیں'];
    if (sim.substance === 'nacl_molten') return ['NaCl(l) → Na+ + Cl−', 'پگھلنے سے آئن آزاد'];
    if (sim.substance === 'sugar') return ['C₁₂H₂₂O₁₁ سالمے غیر چارج شدہ', 'رو کا راستہ نہیں'];
    return ['H₂O میں بہت کم آئن', 'موصلیت نہ ہونے کے برابر'];
  }
  if (sim.substance === 'nacl_aq') return ['NaCl dissociates: NaCl → Na+ + Cl−', 'Na+ → cathode (−)   Cl− → anode (+)'];
  if (sim.substance === 'nacl_solid') return ['Ionic lattice: ions vibrate, cannot travel', 'No mobile charge between electrodes'];
  if (sim.substance === 'nacl_molten') return ['Heat melts the lattice: NaCl(l) → Na+ + Cl−', 'Same ions, now free to carry current'];
  if (sim.substance === 'sugar') return ['Molecular solute stays C₁₂H₂₂O₁₁', 'Neutral particles cannot complete a circuit'];
  return ['Distilled water: almost no ions', 'Need an electrolyte to light the bulb'];
}

let quizIndex = 0, quizScore = 0, quizLocked = false, quizChosen = -1;

function renderQuiz() {
  const res = document.getElementById('quiz-result');
  const play = document.getElementById('quiz-play');
  if (quizIndex >= QUIZ.length) {
    play.classList.add('hidden');
    res.classList.remove('hidden');
    document.getElementById('score-num').textContent = quizScore + ' / 5';
    document.getElementById('score-pct').textContent = Math.round((quizScore / 5) * 100) + ' %';
    return;
  }
  play.classList.remove('hidden');
  res.classList.add('hidden');
  const item = QUIZ[quizIndex];
  document.getElementById('quiz-progress').textContent = (quizIndex + 1) + ' / 5';
  document.getElementById('quiz-q').textContent = t(item.q);
  const box = document.getElementById('quiz-opts');
  box.innerHTML = '';
  item.opts.forEach((k, i) => {
    const b = document.createElement('button');
    b.className = 'opt-btn w-full text-start px-4 py-3 rounded-xl font-semibold';
    b.textContent = t(k);
    if (quizLocked) {
      b.classList.add('locked');
      if (i === item.ans) b.classList.add('correct');
      else if (i === quizChosen) b.classList.add('wrong');
    } else {
      b.onclick = () => pickAnswer(i);
    }
    box.appendChild(b);
  });
  const ex = document.getElementById('quiz-explain');
  const next = document.getElementById('quiz-next');
  if (quizLocked) {
    ex.textContent = t(item.exp);
    ex.classList.remove('hidden');
    next.classList.remove('hidden');
  } else {
    ex.classList.add('hidden');
    next.classList.add('hidden');
  }
}

function pickAnswer(i) {
  if (quizLocked) return;
  quizLocked = true;
  quizChosen = i;
  if (i === QUIZ[quizIndex].ans) quizScore++;
  renderQuiz();
}
function nextQuestion() {
  quizIndex++;
  quizLocked = false;
  quizChosen = -1;
  renderQuiz();
}
function restartQuiz() {
  quizIndex = 0; quizScore = 0; quizLocked = false; quizChosen = -1;
  renderQuiz();
}

let viewFitted = false;
function resizeAll() {
  const wrap = document.getElementById('sim-viewport');
  if (!wrap) return;
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  const c = canvas();
  c.width = Math.max(1, w * dpr);
  c.height = Math.max(1, h * dpr);
  c.style.width = w + 'px';
  c.style.height = h + 'px';
  if (!fCanvas) {
    initAnnotationCanvas(w, h);
    const fabricContainer = document.querySelector('.canvas-container');
    if (fabricContainer) {
      fabricContainer.style.pointerEvents = 'none';
    }
  } else {
    fCanvas.setWidth(w);
    fCanvas.setHeight(h);
    fCanvas.calcOffset();
  }
  if (!viewFitted) {
    fitView();
    viewFitted = true;
  }
}

function loop() {
  stepParticles();
  const ctx = ctx2d();
  if (ctx && !document.getElementById('view-sim').classList.contains('hidden')) drawLab(ctx);
  requestAnimationFrame(loop);
}

function boot() {
  changeLanguage(currentLang);
  setSubstance('nacl_aq');
  spawnElectrons();
  setupPointer();
  window.addEventListener('resize', resizeAll);
  setTimeout(() => {
    const intro = document.getElementById('intro');
    intro.style.opacity = '0';
    document.getElementById('app').classList.remove('opacity-0');
    setTimeout(() => { intro.style.display = 'none'; resizeAll(); }, 700);
  }, 5000);
  requestAnimationFrame(loop);
}

boot();
</script>
