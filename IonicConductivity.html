<html lang="en" dir="ltr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IQRA VIRTUAL LAB — Electrical Conductivity in Ionic Compounds</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Oxanium:wght@500;700;800&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

<style>
@font-face {
  font-family: 'Jameel Noori Nastaliq';
  font-style: normal;
  font-weight: 400;
  src: local('Noto Nastaliq Urdu'), local('Jameel Noori Nastaleeq');
  font-display: swap;
}

/* Custom Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #0f172a; }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #475569; }

/* RTL Styling Adjustments for Urdu with Jameel Noori Nastaliq */
[dir="rtl"] .rtl-flip { transform: scaleX(-1); }
[dir="rtl"] {
  font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaliq', serif !important;
  line-height: 2.3 !important;
}

/* Glassmorphism Classes */
.glass-panel {
  background: rgba(15, 23, 42, 0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.1);
}
.glass-card {
  background: rgba(30, 41, 59, 0.6);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.08);
}

/* Pulse Glow Effects */
.glow-cyan { box-shadow: 0 0 20px rgba(0, 243, 255, 0.35); }
.glow-red { box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
.glow-green { box-shadow: 0 0 20px rgba(34, 197, 94, 0.35); }

/* Canvas styling */
canvas { touch-action: none; }

/* Custom Slider Styling */
input[type=range] {
  -webkit-appearance: none;
  background: #334155;
  border-radius: 8px;
  height: 8px;
  width: 100%;
  outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  height: 20px;
  width: 20px;
  border-radius: 50%;
  background: #00f3ff;
  cursor: pointer;
  box-shadow: 0 0 10px #00f3ff;
  transition: transform 0.1s ease;
}
input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
input[type=checkbox] { accent-color: #00f3ff; width: 18px; height: 18px; cursor: pointer; }

body {
  font-family: 'Manrope', sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  overflow: hidden;
  margin: 0;
}
.font-display { font-family: 'Oxanium', 'Manrope', sans-serif; }
[dir="rtl"] .font-display { font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaliq', serif; }
[dir="rtl"] body, [dir="rtl"] { font-size: 1.08em; }

.bg-grid {
  background-image:
    linear-gradient(rgba(0,243,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,243,255,0.04) 1px, transparent 1px);
  background-size: 44px 44px;
}

#intro {
  position: fixed; inset: 0; z-index: 100;
  background: radial-gradient(ellipse at center, #10233f 0%, #0f172a 65%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity .7s ease;
}
.intro-title {
  font-family: 'Oxanium', sans-serif;
  font-weight: 800; letter-spacing: .14em;
  background: linear-gradient(92deg, #00f3ff, #7dd3fc, #00f3ff);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: introZoom 1.6s cubic-bezier(.2,.8,.2,1) both, glowPulse 2s ease-in-out infinite;
}
.intro-topic {
  color: #94a3b8; letter-spacing: .12em;
  animation: introFade 1.4s .35s ease both;
  text-align: center;
  max-width: 90vw;
}
.intro-ring {
  width: 160px; height: 160px; border-radius: 50%;
  border: 2px solid rgba(0,243,255,.35);
  box-shadow: 0 0 60px rgba(0,243,255,.25), inset 0 0 40px rgba(0,243,255,.12);
  display:flex; align-items:center; justify-content:center;
  animation: ringSpin 2.4s linear infinite, introZoom 1.2s ease both;
  margin-bottom: 28px; position: relative;
}
.intro-ring::before {
  content:''; position:absolute; inset:-10px; border-radius:50%;
  border-top: 2px solid #00f3ff; border-right: 2px solid transparent;
  border-bottom: 2px solid transparent; border-left: 2px solid transparent;
}
@keyframes ringSpin { to { transform: rotate(360deg); } }
@keyframes introZoom { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
@keyframes introFade { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes glowPulse {
  0%,100% { text-shadow: 0 0 24px rgba(0,243,255,.55); }
  50% { text-shadow: 0 0 54px rgba(0,243,255,.9); }
}

.tab-btn {
  position: relative; transition: color .25s ease, background-color .25s ease;
  border-radius: 12px;
}
.tab-btn.active {
  color: #00f3ff;
  background: rgba(0,243,255,.08);
  box-shadow: inset 0 0 0 1px rgba(0,243,255,.35), 0 0 18px rgba(0,243,255,.15);
}
.view { animation: viewIn .35s ease both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.mode-btn {
  transition: background-color .25s ease, color .25s ease, box-shadow .25s ease, transform .15s ease;
  border: 1px solid rgba(255,255,255,.1);
}
.mode-btn:active { transform: scale(.96); }
.mode-btn.active {
  background: rgba(0,243,255,.12); color: #00f3ff;
  border-color: rgba(0,243,255,.5); box-shadow: 0 0 16px rgba(0,243,255,.25);
}

.opt-btn {
  transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .12s ease;
  border: 1px solid rgba(255,255,255,.1);
}
.opt-btn:not(.locked):hover { border-color: rgba(0,243,255,.45); background: rgba(0,243,255,.06); }
.opt-btn:not(.locked):active { transform: scale(.98); }
.opt-btn.correct { background: rgba(34,197,94,.16); border-color:#22c55e; box-shadow: 0 0 18px rgba(34,197,94,.3); }
.opt-btn.wrong { background: rgba(239,68,68,.14); border-color:#ef4444; box-shadow: 0 0 18px rgba(239,68,68,.3); }

.zoom-btn {
  width: 42px; height: 42px; border-radius: 12px;
  background: rgba(15,23,42,.8); border:1px solid rgba(255,255,255,.12);
  color:#00f3ff; display:flex; align-items:center; justify-content:center;
  backdrop-filter: blur(8px); cursor:pointer;
  transition: background-color .2s ease, box-shadow .2s ease, transform .12s ease;
}
.zoom-btn:hover { background: rgba(0,243,255,.12); box-shadow: 0 0 14px rgba(0,243,255,.25); }
.zoom-btn:active { transform: scale(.92); }

.stat-val { font-family: 'Oxanium', monospace; color:#00f3ff; }
[dir="rtl"] .stat-val { font-family: 'Oxanium', monospace !important; line-height: 1.4 !important; }
.num { font-family:'Oxanium', monospace !important; line-height:1.4 !important; direction:ltr; unicode-bidi:embed; }

#sim-viewport .canvas-container {
  position: absolute !important;
  left: 0; top: 0;
  width: 100% !important;
  height: 100% !important;
  pointer-events: none;
  z-index: 25;
}
#fabricLayer { z-index: 25; }

#float-tools {
  transition: max-height .35s ease, opacity .25s ease, padding .25s ease, width .3s ease;
}
#float-tools.collapsed {
  max-height: 52px;
  width: 52px;
  overflow: hidden;
  padding: 6px;
}
#float-tools.collapsed .float-body { display: none; }

.switch-track {
  width: 72px; height: 36px; border-radius: 999px;
  background: #334155; position: relative; cursor: pointer;
  border: 1px solid rgba(255,255,255,.12);
  transition: background .2s ease, box-shadow .2s ease;
}
.switch-track.on { background: rgba(34,197,94,.35); box-shadow: 0 0 18px rgba(34,197,94,.35); }
.switch-knob {
  position: absolute; top: 3px; left: 3px;
  width: 28px; height: 28px; border-radius: 50%;
  background: #94a3b8; transition: transform .2s ease, background .2s ease;
}
.switch-track.on .switch-knob { transform: translateX(36px); background: #22c55e; }
[dir="rtl"] .switch-track.on .switch-knob { transform: translateX(-36px); }

.obs-live { animation: viewIn .4s ease both; }
.toggle-row { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 0; font-size:13px; }
</style>
</head>
<body class="bg-grid">

<div id="intro">
  <div class="intro-ring"><i class="fa-solid fa-bolt text-5xl text-cyan-300" style="filter:drop-shadow(0 0 14px rgba(0,243,255,.8))"></i></div>
  <div class="intro-title text-4xl sm:text-5xl lg:text-6xl">IQRA VIRTUAL LAB</div>
  <div class="intro-topic text-base md:text-xl mt-5 font-bold" id="intro-topic"></div>
</div>

<div id="app" class="h-screen flex flex-col opacity-0 transition-opacity duration-700">

  <header class="glass-panel flex items-center justify-between px-4 md:px-6 py-3 z-30 gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-10 h-10 rounded-xl bg-slate-900 border border-cyan-500/40 glow-cyan flex items-center justify-center shrink-0">
        <i class="fa-solid fa-flask text-cyan-400"></i>
      </div>
      <div class="min-w-0">
        <div class="font-display font-extrabold tracking-widest text-cyan-400 text-sm md:text-base truncate" style="font-family:'Oxanium',sans-serif !important;">IQRA VIRTUAL LAB</div>
        <div class="text-xs text-slate-400 truncate" data-i18n="topic"></div>
      </div>
    </div>

    <nav class="flex items-center gap-2 glass-card rounded-2xl p-1.5 shrink-0">
      <button id="tab-sim" onclick="switchTab('sim')" class="tab-btn active px-3 md:px-6 py-2.5 font-bold text-sm md:text-base text-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-house"></i><span data-i18n="tab_sim"></span>
      </button>
      <button id="tab-quiz" onclick="switchTab('quiz')" class="tab-btn px-3 md:px-6 py-2.5 font-bold text-sm md:text-base text-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-clipboard-question"></i><span data-i18n="tab_quiz"></span>
      </button>
    </nav>

    <div class="flex items-center gap-3">
      <div id="anno-toolbar" class="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 transition-all duration-300 max-w-0 overflow-hidden opacity-0">
        <input type="color" id="anno-color" value="#00f3ff" onchange="changeAnnoColor(this.value)" class="w-6 h-6 cursor-pointer bg-transparent border-0 p-0" title="Color">
        <button id="anno-pen" onclick="setAnnoMode('pen')" class="text-cyan-400 p-1.5 rounded hover:bg-slate-700 transition" title="Pen"><i class="fa-solid fa-pen"></i></button>
        <button id="anno-eraser" onclick="setAnnoMode('eraser')" class="text-slate-400 p-1.5 rounded hover:bg-slate-700 transition" title="Eraser"><i class="fa-solid fa-eraser"></i></button>
        <button onclick="clearAnnotations()" class="text-red-400 p-1.5 rounded hover:bg-slate-700 transition" title="Clear All"><i class="fa-solid fa-trash-can"></i></button>
      </div>

      <button id="btn-anno-toggle" onclick="toggleAnnotationMode()" class="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 flex items-center justify-center border border-slate-700 transition" title="Toggle Annotation">
        <i class="fa-solid fa-pen-nib"></i>
      </button>

      <div class="relative">
        <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-slate-900 border border-slate-700 text-cyan-400 text-sm rounded-lg focus:ring-cyan-500 focus:border-cyan-500 px-3 py-2 cursor-pointer font-bold outline-none">
          <option value="en">🌐 English</option>
          <option value="ur">🌐 اردو</option>
          <option value="hi" disabled>🌐 हिंदी (Soon)</option>
          <option value="bn" disabled>🌐 বাংলা (Soon)</option>
          <option value="ta" disabled>🌐 தமிழ் (Soon)</option>
        </select>
      </div>

      <button onclick="toggleFullScreen()" class="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-400 flex items-center justify-center border border-slate-700 transition" title="Toggle Fullscreen">
        <i class="fa-solid fa-expand" id="fs-icon"></i>
      </button>
    </div>
  </header>

  <main id="view-sim" class="view flex-1 flex flex-col lg:flex-row gap-4 p-4 min-h-0 overflow-hidden">

    <section class="flex-1 flex flex-col min-h-0 min-w-0 relative">
      <div id="sim-viewport" class="glass-card rounded-2xl relative flex-1 min-h-[320px] overflow-hidden">
        <canvas id="simCanvas" class="absolute inset-0 w-full h-full cursor-grab"></canvas>
        <canvas id="fabricLayer"></canvas>

        <div id="float-tools" class="absolute top-3 glass-panel rounded-2xl p-3 z-30 glow-cyan" style="inset-inline-end:12px; max-height: 280px; width: 168px;">
          <div class="flex items-center justify-between gap-2">
            <span class="text-xs font-bold text-cyan-300 float-body" data-i18n="view_tools"></span>
            <button onclick="toggleFloatTools()" class="zoom-btn" style="width:36px;height:36px" title="Minimize">
              <i id="float-min-icon" class="fa-solid fa-minus"></i>
            </button>
          </div>
          <div class="float-body mt-2 flex flex-col gap-2">
            <button class="zoom-btn w-full" onclick="zoomBy(1.2)"><i class="fa-solid fa-plus"></i></button>
            <button class="zoom-btn w-full" onclick="zoomBy(1/1.2)"><i class="fa-solid fa-minus"></i></button>
            <button class="zoom-btn w-full" onclick="resetView()"><i class="fa-solid fa-crosshairs"></i></button>
          </div>
        </div>

        <div class="absolute bottom-3 glass-panel rounded-xl px-3 py-2 text-xs text-cyan-200 z-10 pointer-events-none max-w-[70%]" style="inset-inline-start:12px">
          <i class="fa-solid fa-hand-pointer"></i> <span data-i18n="canvas_hint"></span>
        </div>
      </div>
    </section>

    <aside class="w-full lg:w-[360px] shrink-0 flex flex-col gap-3 overflow-y-auto min-h-0">
      <div class="glass-card rounded-2xl p-4">
        <div class="text-xs uppercase tracking-widest text-slate-400 mb-3 font-bold" data-i18n="sample"></div>
        <div class="grid grid-cols-1 gap-2">
          <button id="sub-nacl_aq" onclick="setSubstance('nacl_aq')" class="mode-btn active px-3 py-2.5 rounded-xl font-bold text-sm text-slate-300 text-start flex items-center gap-2">
            <i class="fa-solid fa-droplet text-sky-400"></i><span data-i18n="sub_nacl_aq"></span>
          </button>
          <button id="sub-nacl_molten" onclick="setSubstance('nacl_molten')" class="mode-btn px-3 py-2.5 rounded-xl font-bold text-sm text-slate-300 text-start flex items-center gap-2">
            <i class="fa-solid fa-fire text-orange-400"></i><span data-i18n="sub_nacl_molten"></span>
          </button>
          <button id="sub-nacl_solid" onclick="setSubstance('nacl_solid')" class="mode-btn px-3 py-2.5 rounded-xl font-bold text-sm text-slate-300 text-start flex items-center gap-2">
            <i class="fa-solid fa-gem text-violet-300"></i><span data-i18n="sub_nacl_solid"></span>
          </button>
          <button id="sub-sugar" onclick="setSubstance('sugar')" class="mode-btn px-3 py-2.5 rounded-xl font-bold text-sm text-slate-300 text-start flex items-center gap-2">
            <i class="fa-solid fa-cubes-stacked text-amber-300"></i><span data-i18n="sub_sugar"></span>
          </button>
          <button id="sub-water" onclick="setSubstance('water')" class="mode-btn px-3 py-2.5 rounded-xl font-bold text-sm text-slate-300 text-start flex items-center gap-2">
            <i class="fa-solid fa-glass-water text-blue-300"></i><span data-i18n="sub_water"></span>
          </button>
        </div>
      </div>

      <div class="glass-card rounded-2xl p-4 space-y-3">
        <div class="flex items-center justify-between gap-3">
          <span class="font-bold" data-i18n="key_switch"></span>
          <div id="ui-switch" class="switch-track" onclick="toggleCircuit()">
            <div class="switch-knob"></div>
          </div>
        </div>
        <div class="flex gap-2">
          <button onclick="togglePause()" class="flex-1 py-2.5 rounded-xl font-bold bg-slate-800 border border-slate-600 text-cyan-300">
            <i id="pause-icon" class="fa-solid fa-pause"></i> <span id="pause-lbl" data-i18n="pause"></span>
          </button>
          <button onclick="resetExperiment()" class="flex-1 py-2.5 rounded-xl font-bold bg-slate-800 border border-slate-600 text-cyan-300">
            <i class="fa-solid fa-rotate-left"></i> <span data-i18n="reset_exp"></span>
          </button>
        </div>
        <div>
          <div class="flex justify-between text-sm mb-1"><span data-i18n="concentration"></span><span class="stat-val num" id="conc-val">1.00 M</span></div>
          <input type="range" id="conc-slider" min="0.1" max="2" step="0.1" value="1" oninput="setConcentration(this.value)">
        </div>
        <div>
          <div class="flex justify-between text-sm mb-1"><span data-i18n="voltage"></span><span class="stat-val num" id="volt-val">6.0 V</span></div>
          <input type="range" id="volt-slider" min="1" max="12" step="0.5" value="6" oninput="setVoltage(this.value)">
        </div>
        <div>
          <div class="flex justify-between text-sm mb-1"><span data-i18n="e_speed"></span><span class="stat-val num" id="espeed-val">1.0×</span></div>
          <input type="range" id="espeed-slider" min="0.3" max="2.5" step="0.1" value="1" oninput="sim.eSpeed=parseFloat(this.value);document.getElementById('espeed-val').textContent=parseFloat(this.value).toFixed(1)+'×'">
        </div>
        <div>
          <div class="flex justify-between text-sm mb-1"><span data-i18n="ion_speed"></span><span class="stat-val num" id="ispeed-val">1.0×</span></div>
          <input type="range" id="ispeed-slider" min="0.3" max="2.5" step="0.1" value="1" oninput="sim.ionSpeed=parseFloat(this.value);document.getElementById('ispeed-val').textContent=parseFloat(this.value).toFixed(1)+'×'">
        </div>
        <div>
          <div class="flex justify-between text-sm mb-1"><span data-i18n="pcount"></span><span class="stat-val num" id="pcount-val">40</span></div>
          <input type="range" id="pcount-slider" min="12" max="80" step="2" value="40" oninput="setParticleCount(this.value)">
        </div>
        <label class="toggle-row"><span data-i18n="show_e"></span><input type="checkbox" id="chk-e" checked onchange="sim.showE=this.checked"></label>
        <label class="toggle-row"><span data-i18n="show_ions"></span><input type="checkbox" id="chk-ions" checked onchange="sim.showIons=this.checked"></label>
        <label class="toggle-row"><span data-i18n="show_rxn"></span><input type="checkbox" id="chk-rxn" checked onchange="sim.showRxn=this.checked"></label>
        <button onclick="clearFollow()" class="w-full py-2 rounded-xl font-bold bg-slate-900 border border-slate-600 text-sm text-slate-200">
          <i class="fa-solid fa-crosshairs"></i> <span data-i18n="clear_follow"></span>
        </button>
      </div>

      <div class="glass-card rounded-2xl p-4">
        <div class="text-xs uppercase tracking-widest text-slate-400 mb-3 font-bold" data-i18n="live_meters"></div>
        <div class="grid grid-cols-1 gap-2 text-sm">
          <div class="bg-slate-900/70 rounded-xl p-3 flex justify-between"><span data-i18n="i_wire"></span><span class="stat-val num" id="meter-wire">0.00 A</span></div>
          <div class="bg-slate-900/70 rounded-xl p-3 flex justify-between"><span data-i18n="i_ion"></span><span class="stat-val num" id="meter-ion">0.00 A</span></div>
          <div class="bg-slate-900/70 rounded-xl p-3 flex justify-between"><span data-i18n="circuit"></span><span class="stat-val" id="meter-circuit"></span></div>
          <div class="bg-slate-900/70 rounded-xl p-3 flex justify-between"><span data-i18n="bulb_state"></span><span class="stat-val" id="meter-bulb"></span></div>
        </div>
      </div>

      <div class="glass-card rounded-2xl p-4">
        <div class="text-xs uppercase tracking-widest text-slate-400 mb-2 font-bold" data-i18n="observe"></div>
        <p id="observe-text" class="obs-live text-sm text-slate-200"></p>
        <p id="follow-text" class="mt-2 text-xs text-cyan-300 hidden"></p>
      </div>
    </aside>
  </main>

  <main id="view-quiz" class="hidden view flex-1 overflow-y-auto p-4 md:p-8">
    <div class="max-w-3xl mx-auto glass-card rounded-2xl p-6 md:p-8">
      <div id="quiz-play">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-xl font-bold text-cyan-300" data-i18n="quiz_title"></h2>
          <span class="stat-val num" id="quiz-progress">1 / 5</span>
        </div>
        <p id="quiz-q" class="text-lg md:text-xl font-semibold mb-5"></p>
        <div id="quiz-opts" class="flex flex-col gap-3"></div>
        <p id="quiz-explain" class="mt-4 text-sm text-slate-300 hidden"></p>
        <button id="quiz-next" onclick="nextQuestion()" class="hidden mt-6 w-full py-3 rounded-xl font-bold bg-cyan-500/20 border border-cyan-400 text-cyan-200 glow-cyan">
          <span data-i18n="next_q"></span>
        </button>
      </div>
      <div id="quiz-result" class="hidden text-center py-6">
        <i class="fa-solid fa-trophy text-5xl text-amber-400 mb-4"></i>

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  const intro = document.getElementById('intro-topic');
  if (intro) intro.textContent = t('intro_topic');
  const pl = document.getElementById('pause-lbl');
  if (pl) pl.textContent = sim.paused ? t('play') : t('pause');
  updateMeters();

  if (!document.getElementById('view-quiz').classList.contains('hidden')) renderQuiz();
}
function changeLanguage(lang) {
  if (lang !== 'en' && lang !== 'ur') return;
  currentLang = lang;
  localStorage.setItem('iqra-lang', lang);
  document.documentElement.lang = lang === 'ur' ? 'ur' : 'en';
  document.documentElement.dir = lang === 'ur' ? 'rtl' : 'ltr';
  const sel = document.getElementById('lang-select');
  if (sel) sel.value = lang;

}
function switchTab(name) {
  document.getElementById('view-sim').classList.toggle('hidden', name !== 'sim');

  document.getElementById('tab-sim').classList.toggle('active', name === 'sim');
  document.getElementById('tab-quiz').classList.toggle('active', name === 'quiz');
  if (name === 'sim') requestAnimationFrame(resizeAll);
  if (name === 'quiz') renderQuiz();
}
function toggleFullScreen() {
  const root = document.documentElement;
  if (!document.fullscreenElement) (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
  else (document.exitFullscreen || document.webkitExitFullscreen).call(document);
}
document.addEventListener('fullscreenchange', () => {

});

let fCanvas, isAnnoActive = false;
function initAnnotationCanvas(w, h) {
    fCanvas = new fabric.Canvas('fabricLayer', { isDrawingMode: false, width: w, height: h });
    fCanvas.freeDrawingBrush.color = document.getElementById('anno-color').value;
    fCanvas.freeDrawingBrush.width = 4;
    fCanvas.on('mouse:down', function(options) {
        if(isAnnoActive && !fCanvas.isDrawingMode && options.target) fCanvas.remove(options.target);
    });
}
function toggleAnnotationMode() {
    isAnnoActive = !isAnnoActive;
    const btn = document.getElementById('btn-anno-toggle');
    const toolbar = document.getElementById('anno-toolbar');
    const fabricContainer = document.querySelector('.canvas-container');
    if (isAnnoActive) {
        btn.classList.replace('text-slate-400', 'text-cyan-400');
        toolbar.classList.remove('max-w-0', 'opacity-0');
        toolbar.classList.add('max-w-xs', 'opacity-100');
        if(fabricContainer) fabricContainer.style.pointerEvents = 'auto';
        setAnnoMode('pen');
    } else {
        btn.classList.replace('text-cyan-400', 'text-slate-400');
        toolbar.classList.remove('max-w-xs', 'opacity-100');
        toolbar.classList.add('max-w-0', 'opacity-0');
        if(fabricContainer) fabricContainer.style.pointerEvents = 'none';
        if (fCanvas) fCanvas.isDrawingMode = false;
    }
}
function setAnnoMode(mode) {
    document.getElementById('anno-pen').classList.replace('text-cyan-400', 'text-slate-400');
    document.getElementById('anno-eraser').classList.replace('text-cyan-400', 'text-slate-400');
    if (mode === 'pen') {
        document.getElementById('anno-pen').classList.replace('text-slate-400', 'text-cyan-400');
        if(fCanvas) fCanvas.isDrawingMode = true;
    } else {
        document.getElementById('anno-eraser').classList.replace('text-slate-400', 'text-cyan-400');
        if(fCanvas) fCanvas.isDrawingMode = false;
    }
}
function changeAnnoColor(color) { if(fCanvas) fCanvas.freeDrawingBrush.color = color; setAnnoMode('pen'); }
function clearAnnotations() { if(fCanvas) fCanvas.clear(); }

function conducts() {
  if (!sim.switchClosed) return 0;
  if (sim.substance === 'nacl_aq') return 0.45 + sim.concentration * 0.55;
  if (sim.substance === 'nacl_molten') return 0.95;
  if (sim.substance === 'water') return 0.015;
  return 0;
}
function currentAmps() {
  const c = conducts();
  if (!c) return 0;
  return +(c * (sim.voltage / 6) * 0.55).toFixed(2);
}

function spawnParticles() {
  sim.ions = []; sim.waters = []; sim.bubbles = []; sim.deposits = []; sim.follow = null;
  const n = sim.pCount;
  if (sim.substance === 'nacl_solid') {
    for (let r = 0; r < 6; r++) for (let c = 0; c < 6; c++) {
      sim.ions.push({ id:'i'+r+c, kind:(r+c)%2? 'Cl-':'Na+', q:(r+c)%2?-1:1, x: LIQ.x+50+c*48, y: LIQ.y+40+r*40, vx:0, vy:0, locked:true, phase:Math.random()*6 });
    }
    return;
  }
  if (sim.substance === 'sugar') {
    for (let i=0;i<n;i++) sim.ions.push({ id:'s'+i, kind:'mol', q:0, x:rndX(), y:rndY(), vx:rndV(), vy:rndV(), locked:false });
    return;
  }
  if (sim.substance === 'water') {
    for (let i=0;i<6;i++) sim.ions.push({ id:'w'+i, kind:i%2?'H+':'OH-', q:i%2?1:-1, x:rndX(), y:rndY(), vx:rndV(), vy:rndV(), locked:false, tiny:true });
    spawnWaters(18);
    return;
  }
  for (let i=0;i<n;i++) {
    const pos = i%2===0;
    sim.ions.push({ id:'p'+i, kind: pos?'Na+':'Cl-', q: pos?1:-1, x:rndX(), y:rndY(), vx:rndV(), vy:rndV(), locked:false });
  }
  if (sim.substance === 'nacl_aq') spawnWaters(16);
}
function spawnWaters(n) {
  sim.waters = [];
  for (let i=0;i<n;i++) sim.waters.push({ x:rndX(), y:rndY(), vx:rndV()*0.4, vy:rndV()*0.4 });
}
function rndX(){ return LIQ.x+24+Math.random()*(LIQ.w-48); }
function rndY(){ return LIQ.y+24+Math.random()*(LIQ.h-48); }
function rndV(){ return (Math.random()-0.5)*0.7; }

function spawnElectrons() {
  sim.electrons = [];
  for (let i=0;i<32;i++) sim.electrons.push({ id:'e'+i, kind:'e', s:i*22, seg: i<16?0:1 });
}

function wireSegments() {
  const minus = { x: 1095, y: 500 };
  const plus = { x: 1218, y: 500 };
  const left = [
    {x:minus.x,y:minus.y},{x:minus.x,y:118},{x:CAT.x,y:118},{x:CAT.x,y:CAT.y0}
  ];
  const mid = [
    {x:ANO.x,y:ANO.y0},{x:ANO.x,y:118},{x:640,y:118},{x:820,y:118},{x:820,y:148},{x:1008,y:148}
  ];
  const right = [
    {x:1095,y:148},{x:plus.x,y:118},{x:plus.x,y:plus.y}
  ];
  if (sim.switchClosed) return [left, mid.concat(right)];
  return [left, mid, right];
}

function pathLen(pts){ let L=0; for(let i=1;i<pts.length;i++) L+=Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y); return L||1; }
function pointOnPath(pts,s){
  let rem=((s%pathLen(pts))+pathLen(pts))%pathLen(pts);
  for(let i=1;i<pts.length;i++){
    const d=Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y);
    if(rem<=d){ const k=d?rem/d:0; return {x:pts[i-1].x+(pts[i].x-pts[i-1].x)*k, y:pts[i-1].y+(pts[i].y-pts[i-1].y)*k}; }
    rem-=d;
  }
  return pts[pts.length-1];
}

function setSubstance(id) {
  sim.substance = id;
  ['nacl_aq','nacl_solid','nacl_molten','sugar','water'].forEach(s => {
    const el = document.getElementById('sub-'+s);
    if (el) el.classList.toggle('active', s===id);
  });
  document.getElementById('conc-slider').disabled = id !== 'nacl_aq';
  spawnParticles();
  updateObservation(); updateMeters();
}
function setConcentration(v){ sim.concentration=parseFloat(v); document.getElementById('conc-val').textContent=sim.concentration.toFixed(2)+' M'; if(sim.substance==='nacl_aq') spawnParticles(); updateMeters(); }
function setVoltage(v){ sim.voltage=parseFloat(v); document.getElementById('volt-val').textContent=sim.voltage.toFixed(1)+' V'; updateMeters(); }
function setParticleCount(v){ sim.pCount=parseInt(v,10); document.getElementById('pcount-val').textContent=sim.pCount; spawnParticles(); }
function toggleCircuit(){ sim.switchClosed=!sim.switchClosed; document.getElementById('ui-switch').classList.toggle('on', sim.switchClosed); updateObservation(); updateMeters(); }
function togglePause(){
  sim.paused=!sim.paused;
  document.getElementById('pause-icon').className = sim.paused ? 'fa-solid fa-play' : 'fa-solid fa-pause';
  document.getElementById('pause-lbl').textContent = sim.paused ? t('play') : t('pause');
}
function resetExperiment(){
  sim.switchClosed=false; sim.paused=false; sim.voltage=6; sim.concentration=1; sim.eSpeed=1; sim.ionSpeed=1; sim.pCount=40; sim.follow=null;
  document.getElementById('ui-switch').classList.remove('on');
  document.getElementById('volt-slider').value=6; document.getElementById('conc-slider').value=1;
  document.getElementById('espeed-slider').value=1; document.getElementById('ispeed-slider').value=1; document.getElementById('pcount-slider').value=40;
  document.getElementById('espeed-val').textContent='1.0×'; document.getElementById('ispeed-val').textContent='1.0×';
  document.getElementById('pause-icon').className='fa-solid fa-pause';
  setVoltage(6); setConcentration(1); setParticleCount(40); setSubstance('nacl_aq'); resetView();
}
function clearFollow(){ sim.follow=null; updateObservation(); }

function updateMeters(){
  const I=currentAmps();
  document.getElementById('meter-wire').textContent=I.toFixed(2)+' A';
  document.getElementById('meter-ion').textContent=I.toFixed(2)+' A';
  document.getElementById('meter-circuit').textContent = (I>0.05)? t('closed') : t('open');
  document.getElementById('meter-bulb').textContent = (I>0.08)? t('bulb_on') : t('bulb_off');
}
function updateObservation(){
  const el=document.getElementById('observe-text');
  if(!el) return;
  if(!sim.switchClosed) el.textContent=t('obs_open');
  else el.textContent=t({nacl_aq:'obs_nacl_aq', nacl_solid:'obs_solid', nacl_molten:'obs_molten', sugar:'obs_sugar', water:'obs_water'}[sim.substance]);
  const ft=document.getElementById('follow-text');
  if(sim.follow){
    ft.classList.remove('hidden');
    const k=sim.follow.kind;
    ft.textContent = k==='e' ? t('follow_e') : k==='Cl-' ? t('follow_cl') : k==='OH-' ? t('follow_oh') : (sim.substance==='nacl_molten'? t('follow_na_molten'): t('follow_na_aq'));
  } else ft.classList.add('hidden');
}

function toggleFloatTools(){
  const box=document.getElementById('float-tools');
  const ic=document.getElementById('float-min-icon');
  box.classList.toggle('collapsed');
  ic.className = box.classList.contains('collapsed') ? 'fa-solid fa-up-right-and-down-left-from-center' : 'fa-solid fa-minus';
}
function fitView(){
  const c=canvas();
  const sx=c.width/(window.devicePixelRatio||1)/WORLD.w;
  const sy=c.height/(window.devicePixelRatio||1)/WORLD.h;
  view.minScale=Math.min(sx,sy)*0.94;
  view.scale=view.minScale;
  view.panX=(c.width/(window.devicePixelRatio||1)-WORLD.w*view.scale)/2;
  view.panY=(c.height/(window.devicePixelRatio||1)-WORLD.h*view.scale)/2;
}
function zoomBy(f){
  const c=canvas(); const w=c.width/(window.devicePixelRatio||1), h=c.height/(window.devicePixelRatio||1);
  const ns=Math.max(view.minScale*0.8, Math.min(3.2, view.scale*f));
  const k=ns/view.scale; view.panX=w/2-(w/2-view.panX)*k; view.panY=h/2-(h/2-view.panY)*k; view.scale=ns;
}
function resetView(){ fitView(); }
function screenToWorld(x,y){ return {x:(x-view.panX)/view.scale, y:(y-view.panY)/view.scale}; }

let dragging=false, lastX=0, lastY=0, pointers=new Map(), downPt=null;
function setupPointer(){
  const c=canvas();
  c.addEventListener('pointerdown', e=>{
    if(isAnnoActive) return;
    c.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
    downPt={x:e.offsetX,y:e.offsetY, t:Date.now()};
    const wpt=screenToWorld(e.offsetX,e.offsetY);
    if(hitSwitch(wpt.x,wpt.y)){ toggleCircuit(); downPt=null; return; }
    dragging=true; lastX=e.offsetX; lastY=e.offsetY; c.style.cursor='grabbing';
  });
  c.addEventListener('pointermove', e=>{
    if(isAnnoActive) return;
    if(pointers.has(e.pointerId)) pointers.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
    if(pointers.size===2){
      const pts=[...pointers.values()]; const d=Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      if(c._pinch) zoomBy(d/c._pinch); c._pinch=d; return;
    }
    if(!dragging) return;
    view.panX+=e.offsetX-lastX; view.panY+=e.offsetY-lastY; lastX=e.offsetX; lastY=e.offsetY;
  });
  const up=e=>{
    pointers.delete(e.pointerId); c._pinch=null; dragging=false; c.style.cursor='grab';
    if(downPt && Math.hypot(e.offsetX-downPt.x,e.offsetY-downPt.y)<8){
      tryFollow(screenToWorld(e.offsetX,e.offsetY));
    }
    downPt=null;
  };
  c.addEventListener('pointerup', up);
  c.addEventListener('pointercancel', up);
  c.addEventListener('wheel', e=>{ e.preventDefault(); zoomBy(e.deltaY<0?1.08:1/1.08); }, {passive:false});
}
function hitSwitch(x,y){ return x>990 && x<1140 && y>90 && y<200; }

function tryFollow(wpt){
  let best=null, bd=28;
  if(sim.showIons) sim.ions.forEach(p=>{
    if(p.kind==='mol') return;
    const d=Math.hypot(p.x-wpt.x,p.y-wpt.y);
    if(d<bd){ bd=d; best=p; }
  });
  if(sim.showE && currentAmps()>0.05){
    const segs=wireSegments();
    sim.electrons.forEach(el=>{
      const pts=segs[el.seg]||segs[0];
      const p=pointOnPath(pts, el.s);
      const d=Math.hypot(p.x-wpt.x,p.y-wpt.y);
      if(d<bd){ bd=d; best=el; }
    });
  }
  sim.follow=best;
  updateObservation();
}

function bounce(p){
  if(p.x<LIQ.x+16){p.x=LIQ.x+16;p.vx=Math.abs(p.vx);}
  if(p.x>LIQ.x+LIQ.w-16){p.x=LIQ.x+LIQ.w-16;p.vx=-Math.abs(p.vx);}
  if(p.y<LIQ.y+16){p.y=LIQ.y+16;p.vy=Math.abs(p.vy);}
  if(p.y>LIQ.y+LIQ.h-16){p.y=LIQ.y+LIQ.h-16;p.vy=-Math.abs(p.vy);}
  [CAT,ANO].forEach(el=>{
    if(Math.abs(p.x-el.x)<16 && p.y>el.y0+20 && p.y<el.y1){
      p.x += p.x<el.x ? -4 : 4; p.vx *= -0.5;
    }
  });
}

function stepParticles(){
  if(sim.paused) return;
  sim.tick++;
  const I=currentAmps();
  const field = I>0.05 ? (sim.voltage/6)*0.07*sim.ionSpeed : 0;
  const sp=sim.ionSpeed;

  sim.ions.forEach(p=>{
    if(p.locked){
      p.x += Math.sin(sim.tick/18 + p.phase)*0.12;
      p.y += Math.cos(sim.tick/20 + p.phase)*0.12;
      return;
    }
    p.vx += (Math.random()-0.5)*0.05*sp;
    p.vy += (Math.random()-0.5)*0.05*sp;
    if(field && p.q) p.vx += (p.q>0?-1:1)*field;
    p.vx*=0.96; p.vy*=0.96;
    p.x+=p.vx; p.y+=p.vy;
    bounce(p);
  });
  sim.waters.forEach(w=>{
    w.vx+=(Math.random()-0.5)*0.03; w.vy+=(Math.random()-0.5)*0.03;
    if(field){ /* water stays, some drift toward cathode for highlight */ w.vx += -field*0.15; }
    w.vx*=0.97; w.vy*=0.97; w.x+=w.vx; w.y+=w.vy; bounce(w);
  });

  if(sim.showRxn && I>0.08 && (sim.substance==='nacl_aq' || sim.substance==='nacl_molten')){
    if(sim.tick%28===0) cathodeReaction();
    if(sim.tick%32===0) anodeReaction();
  }

  sim.bubbles.forEach(b=>{ b.y+=b.vy; b.x+=Math.sin(sim.tick/10+b.ph)*0.4; b.r+=0.02; });
  sim.bubbles = sim.bubbles.filter(b=> b.y>90);
  if(sim.deposits.length>40) sim.deposits.shift();

  const segs=wireSegments();
  const speed = I>0.05 ? 2.4*sim.eSpeed*(sim.voltage/6) : 0;
  sim.electrons.forEach(e=>{ e.s+=speed; if(e.seg>=segs.length) e.seg=0; });
  if(sim.flashC>0) sim.flashC--;
  if(sim.flashA>0) sim.flashA--;
}

function cathodeReaction(){
  if(sim.substance==='nacl_aq'){
    sim.flashC=18;
    sim.bubbles.push({kind:'H2', x:CAT.x+18, y:420, vy:-1.4, r:5, ph:Math.random()*6});
    sim.ions.push({id:'oh'+sim.tick, kind:'OH-', q:-1, x:CAT.x+28, y:430, vx:0.8, vy:(Math.random()-0.5), locked:false});
    if (sim.ions.length > sim.pCount + 24) {
      const i = sim.ions.findIndex(p => p.kind === 'OH-' && sim.follow !== p);
      if (i >= 0) sim.ions.splice(i, 1);
    }
  } else if(sim.substance==='nacl_molten'){
    const na = sim.ions.find(p=>p.kind==='Na+' && Math.abs(p.x-CAT.x)<50);
    if(na){
      sim.flashC=18;
      sim.deposits.push({x:CAT.x-10+(Math.random()*8-4), y:380+Math.random()*80});
      na.x=rndX(); na.y=rndY();
    }
  }
}
function anodeReaction(){
  const cl = sim.ions.filter(p=>p.kind==='Cl-' && Math.abs(p.x-ANO.x)<55);
  if(cl.length>=1){
    sim.flashA=18;
    const victim=cl[0];
    victim.x=rndX(); victim.y=rndY();
    sim.bubbles.push({kind:'Cl2', x:ANO.x-18, y:410, vy:-1.15, r:6, ph:Math.random()*6});
  }
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function drawLab(ctx){
  const dpr=window.devicePixelRatio||1;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,canvas().width,canvas().height);
  ctx.save();
  ctx.translate(view.panX, view.panY);
  ctx.scale(view.scale, view.scale);
  ctx.fillStyle='#0b1220'; roundRect(ctx,0,0,WORLD.w,WORLD.h,24); ctx.fill();
  drawCaption(ctx);
  drawWires(ctx);
  drawAmmeter(ctx);
  drawSwitch(ctx);
  drawBulb(ctx);
  drawBattery(ctx);
  drawBeaker(ctx);
  drawReactions(ctx);
  drawSummary(ctx);
  ctx.restore();
}

function urFont(){ return currentLang==='ur' ? 'Noto Nastaliq Urdu' : 'Manrope'; }
function drawCaption(ctx){
  ctx.fillStyle='#67e8f9'; ctx.font='700 18px '+urFont(); ctx.textAlign='left';
  ctx.fillText(currentLang==='ur' ? 'الیکٹرولیسس: تار میں الیکٹران، محلول میں آئن' : 'Electrolysis: electrons in the wire, ions in the solution', 36, 40);
}

function strokePath(ctx,pts){ if(!pts.length) return; ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y); ctx.stroke(); }

function drawWires(ctx){
  const segs=wireSegments();
  segs.forEach(pts=>{
    ctx.strokeStyle='#0f172a'; ctx.lineWidth=8; ctx.lineJoin='round'; ctx.lineCap='round'; strokePath(ctx,pts);
    ctx.strokeStyle='#64748b'; ctx.lineWidth=4; strokePath(ctx,pts);
  });
  if(currentAmps()>0.05){
    ctx.save(); ctx.setLineDash([10,8]); ctx.strokeStyle='rgba(251,191,36,0.55)'; ctx.lineWidth=2;
    segs.forEach(pts=>strokePath(ctx,pts));
    ctx.restore();
    if(sim.showE){
      sim.electrons.forEach(e=>{
        const pts=segs[e.seg]||segs[0];
        const p=pointOnPath(pts,e.s);
        const followed = sim.follow && sim.follow.id===e.id;
        ctx.beginPath(); ctx.fillStyle='#22d3ee'; ctx.shadowColor='#22d3ee'; ctx.shadowBlur=followed?18:10;
        ctx.arc(p.x,p.y, followed?6:3.3, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
        if(followed){ ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke(); }
      });
    }
    drawFlowArrows(ctx);
  }
}

function drawFlowArrows(ctx){
  const I=currentAmps(); if(I<0.05) return;
  ctx.fillStyle='#22d3ee'; ctx.font='700 11px Oxanium'; ctx.textAlign='center';
  ctx.fillText(currentLang==='ur' ? 'e− → کیتھوڈ' : 'e− toward cathode', 430, 102);
  if(sim.showIons && (sim.substance==='nacl_aq'||sim.substance==='nacl_molten')){
    ctx.fillStyle='#fb923c'; ctx.fillText('Na+ →', 230, 268);
    ctx.fillStyle='#34d399'; ctx.fillText('← Cl−', 340, 268);
  }
}

function drawAmmeter(ctx){
  const x=620,y=78;
  ctx.fillStyle='#1e293b'; ctx.beginPath(); ctx.arc(x,y,28,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#00f3ff'; ctx.lineWidth=2; ctx.stroke();

function drawSwitch(ctx){

  ctx.beginPath(); ctx.arc(x+74,y+2,5,0,Math.PI*2); ctx.fill();

function drawBulb(ctx){

function drawBattery(ctx){

function drawBeaker(ctx){
  const x=70,y=210,w=420,h=420;
  const liquid = sim.substance==='nacl_solid'?'rgba(148,163,184,0.12)': sim.substance==='nacl_molten'?'rgba(249,115,22,0.30)':'rgba(56,189,248,0.26)';
  ctx.fillStyle=liquid;
  ctx.beginPath(); ctx.moveTo(x+10,y+68); ctx.lineTo(x+10,y+h-34); ctx.quadraticCurveTo(x+10,y+h-8,x+36,y+h-8);
  ctx.lineTo(x+w-36,y+h-8); ctx.quadraticCurveTo(x+w-10,y+h-8,x+w-10,y+h-34); ctx.lineTo(x+w-10,y+68); ctx.closePath(); ctx.fill();

  ctx.strokeStyle='rgba(226,232,240,0.5)'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+h-30); ctx.quadraticCurveTo(x,y+h,x+30,y+h);
  ctx.lineTo(x+w-30,y+h); ctx.quadraticCurveTo(x+w,y+h,x+w,y+h-30); ctx.lineTo(x+w,y); ctx.stroke();

  ctx.fillStyle='#92400e'; roundRect(ctx,x+24,y+10,w-48,20,4); ctx.fill();
  drawElectrode(ctx, CAT.x, y+18, currentLang==='ur'?'کیتھوڈ −':'Cathode −', sim.flashC);
  drawElectrode(ctx, ANO.x, y+18, currentLang==='ur'?'اینوڈ +':'Anode +', sim.flashA);

  if(sim.showRxn && sim.substance==='nacl_aq'){
    sim.waters.forEach(w=>{
      ctx.beginPath(); ctx.fillStyle='rgba(125,211,252,0.35)'; ctx.arc(w.x,w.y,7,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#e0f2fe'; ctx.font='700 8px Oxanium'; ctx.textAlign='center'; ctx.fillText('H2O', w.x, w.y+3);
    });
  }
  if(sim.showIons){
    sim.ions.forEach(p=>drawParticle(ctx,p));
  }
  sim.bubbles.forEach(b=>{
    ctx.beginPath();
    ctx.fillStyle = b.kind==='H2' ? 'rgba(226,232,240,0.55)' : 'rgba(163,230,53,0.45)';
    ctx.strokeStyle = b.kind==='H2' ? '#e2e8f0' : '#a3e635';
    ctx.lineWidth=1.5; ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#0f172a'; ctx.font='700 8px Oxanium'; ctx.textAlign='center';
    ctx.fillText(b.kind, b.x, b.y+3);
  });
  sim.deposits.forEach(d=>{
    ctx.beginPath(); ctx.fillStyle='#cbd5e1'; ctx.arc(d.x,d.y,7,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#0f172a'; ctx.font='700 8px Oxanium'; ctx.textAlign='center'; ctx.fillText('Na', d.x, d.y+3);
  });

  if(!sim.switchClosed){
    ctx.fillStyle='rgba(148,163,184,0.9)'; ctx.font='700 13px '+urFont(); ctx.textAlign='center';
    ctx.fillText(t('no_net'), x+w/2, y+h-24);
  }
  ctx.fillStyle='#e2e8f0'; ctx.font='600 13px '+urFont(); ctx.textAlign='center';
  const sol={nacl_aq: currentLang==='ur'?'سوڈیم کلورائڈ کا محلول':'Concentrated NaCl(aq)', nacl_solid: currentLang==='ur'?'ٹھوس NaCl':'Solid NaCl', nacl_molten: currentLang==='ur'?'پگھلا NaCl':'Molten NaCl', sugar: currentLang==='ur'?'چینی کا محلول':'Sugar solution', water: currentLang==='ur'?'مقطر پانی':'Distilled water'}[sim.substance];
  ctx.fillText(sol, x+w/2, y+h+26);
  ctx.fillStyle='#67e8f9'; ctx.font='600 12px '+urFont();
  ctx.fillText(currentLang==='ur'?'بیکر':'Beaker', x+w/2, y-8);
}

function drawElectrode(ctx,x,y,label,flash){
  ctx.fillStyle = flash? '#67e8f9' : '#94a3b8';
  roundRect(ctx,x-7,y,14,330,3); ctx.fill();
  ctx.fillStyle='#67e8f9'; ctx.font='600 12px '+urFont(); ctx.textAlign='center';
  ctx.fillText(label, x, y-6);
}

function drawParticle(ctx,p){
  const followed = sim.follow && sim.follow.id===p.id;
  const r = followed? 15 : (p.tiny?7:11);
  let col='#fbbf24';
  if(p.kind==='Na+'||p.kind==='H+') col='#fb923c';
  else if(p.kind==='Cl-') col='#34d399';
  else if(p.kind==='OH-') col='#a78bfa';
  ctx.beginPath(); ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=followed?16:8;
  ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  if(followed){ ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke(); }
  ctx.fillStyle='#0f172a'; ctx.font='800 9px Oxanium'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(p.kind==='mol'?'C₁₂H₂₂O₁₁':p.kind, p.x, p.y+0.5);
  ctx.textBaseline='alphabetic';
}

function drawReactions(ctx){
  if(!sim.showRxn) return;
  const x=540, y=210, w=500, h=250;
  ctx.fillStyle='rgba(15,23,42,0.82)'; roundRect(ctx,x,y,w,h,16); ctx.fill();
  ctx.strokeStyle='rgba(0,243,255,0.3)'; ctx.stroke();
  ctx.fillStyle='#67e8f9'; ctx.font='700 15px '+urFont(); ctx.textAlign='left';
  ctx.fillText(currentLang==='ur'?'الیکٹروڈ تعاملات':'Electrode reactions', x+18, y+28);
  ctx.font='600 13px '+urFont(); ctx.fillStyle='#e2e8f0';
  if(sim.substance==='nacl_aq'){
    ctx.fillStyle='#7dd3fc'; ctx.fillText(t('red')+'  |  '+t('rxn_h2'), x+18, y+64);
    ctx.fillStyle='#86efac'; ctx.fillText(t('ox')+'  |  '+t('rxn_cl'), x+18, y+98);
    wrapText(ctx, currentLang==='ur' ? 'Na+ کیتھوڈ پر جم نہیں سکتا — پانی الیکٹران لے لیتا ہے، H2 کے بلبلے اٹھتے ہیں، OH− پھیل جاتی ہے۔' : 'Na+ does not become metal here. Water takes the electron, H2 bubbles rise, OH− spreads.', x+18, y+132, w-36, currentLang==='ur'?32:20);
  } else if(sim.substance==='nacl_molten'){
    ctx.fillStyle='#7dd3fc'; ctx.fillText(t('red')+'  |  '+t('rxn_na'), x+18, y+64);
    ctx.fillStyle='#86efac'; ctx.fillText(t('ox')+'  |  '+t('rxn_cl'), x+18, y+98);
    wrapText(ctx, currentLang==='ur' ? 'پانی نہیں، اس لیے سوڈیم دھات کیتھوڈ پر جمے گی۔ یہ “اگر ایسا ہو؟” موڈ ہے۔' : 'No water, so sodium metal can deposit. This is the What-if? melt mode.', x+18, y+132, w-36, currentLang==='ur'?32:20);
  } else {
    wrapText(ctx, t({nacl_solid:'obs_solid', sugar:'obs_sugar', water:'obs_water'}[sim.substance]), x+18, y+70, w-36, currentLang==='ur'?32:20);
  }
  ctx.fillStyle='#fbbf24'; ctx.font='600 12px '+urFont();
  ctx.fillText(currentLang==='ur'?'تار = الیکٹران    محلول = آئن':'WIRE = electrons     SOLUTION = ions', x+18, y+228);
}

function wrapText(ctx, text, x, y, maxW, lh){
  const words=text.split(' '); let line='', yy=y;
  words.forEach(w=>{
    const test=line+w+' ';
    if(ctx.measureText(test).width>maxW){ ctx.fillStyle='#cbd5e1'; ctx.fillText(line,x,yy); line=w+' '; yy+=lh; }
    else line=test;
  });
  ctx.fillStyle='#cbd5e1'; ctx.fillText(line,x,yy);
}

function drawSummary(ctx){
  const y=WORLD.h-78;
  ctx.fillStyle='rgba(15,23,42,0.9)'; roundRect(ctx,36,y,WORLD.w-72,62,14); ctx.fill();
  ctx.strokeStyle='rgba(0,243,255,0.25)'; ctx.stroke();
  ctx.fillStyle='#e2e8f0'; ctx.font='600 13px '+urFont(); ctx.textAlign='left';
  const bits=[t('sum_wire'), t('sum_sol'), t('sum_cat'), t('sum_an')];
  ctx.fillText(bits.join('   ·   '), 52, y+24);
  ctx.fillStyle='#67e8f9'; ctx.font='600 12px '+urFont();
  ctx.fillText(t('banner'), 52, y+48);
}

let quizIndex=0, quizScore=0, quizLocked=false, quizChosen=-1;
function renderQuiz(){
  const res=document.getElementById('quiz-result'), play=document.getElementById('quiz-play');
  if(quizIndex>=QUIZ.length){
    play.classList.add('hidden'); res.classList.remove('hidden');
    document.getElementById('score-num').textContent=quizScore+' / 5';
    document.getElementById('score-pct').textContent=Math.round((quizScore/5)*100)+' %';
    return;
  }
  play.classList.remove('hidden'); res.classList.add('hidden');
  const item=QUIZ[quizIndex];
  document.getElementById('quiz-progress').textContent=(quizIndex+1)+' / 5';
  document.getElementById('quiz-q').textContent=t(item.q);
  const box=document.getElementById('quiz-opts'); box.innerHTML='';
  item.opts.forEach((k,i)=>{
    const b=document.createElement('button');
    b.className='opt-btn w-full text-start px-4 py-3 rounded-xl font-semibold';
    b.textContent=t(k);
    if(quizLocked){ b.classList.add('locked'); if(i===item.ans) b.classList.add('correct'); else if(i===quizChosen) b.classList.add('wrong'); }
    else b.onclick=()=>pickAnswer(i);
    box.appendChild(b);
  });
  const ex=document.getElementById('quiz-explain'), next=document.getElementById('quiz-next');
  if(quizLocked){ ex.textContent=t(item.exp); ex.classList.remove('hidden'); next.classList.remove('hidden'); }
  else { ex.classList.add('hidden'); next.classList.add('hidden'); }
}
function pickAnswer(i){ if(quizLocked) return; quizLocked=true; quizChosen=i; if(i===QUIZ[quizIndex].ans) quizScore++; renderQuiz(); }
function nextQuestion(){ quizIndex++; quizLocked=false; quizChosen=-1; renderQuiz(); }
function restartQuiz(){ quizIndex=0; quizScore=0; quizLocked=false; quizChosen=-1; renderQuiz(); }

let viewFitted=false;
function resizeAll(){
  const wrap=document.getElementById('sim-viewport'); if(!wrap) return;
  const w=wrap.clientWidth, h=wrap.clientHeight, dpr=window.devicePixelRatio||1;
  const c=canvas();
  c.width=Math.max(1,w*dpr); c.height=Math.max(1,h*dpr); c.style.width=w+'px'; c.style.height=h+'px';
  if(!fCanvas){
    initAnnotationCanvas(w,h);
    const fabricContainer=document.querySelector('.canvas-container');
    if(fabricContainer) fabricContainer.style.pointerEvents='none';
  } else { fCanvas.setWidth(w); fCanvas.setHeight(h); fCanvas.calcOffset(); }
  if(!viewFitted){ fitView(); viewFitted=true; }
}
function loop(){
  stepParticles();
  const ctx=ctx2d();
  if(ctx && !document.getElementById('view-sim').classList.contains('hidden')) drawLab(ctx);
  requestAnimationFrame(loop);
}
function boot(){
  changeLanguage(currentLang);
  setSubstance('nacl_aq');
  spawnElectrons();
  setupPointer();
  window.addEventListener('resize', resizeAll);
  setTimeout(()=>{
    const intro=document.getElementById('intro');
    intro.style.opacity='0';
    document.getElementById('app').classList.remove('opacity-0');
    setTimeout(()=>{ intro.style.display='none'; resizeAll(); }, 700);
  }, 5000);
  requestAnimationFrame(loop);
}
boot();
</script>
