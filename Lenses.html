<style>
  /* Custom Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #0f172a; }

  [dir="rtl"] .rtl-flip { transform: scaleX(-1); }
  [dir="rtl"] {
    font-family: 'Jameel Noori Nastaliq', 'Noto Nastaliq Urdu', serif !important;

  input[type=range] {

  #intro {
    position: fixed; inset: 0; z-index: 100;

  .intro-title {
    font-family: 'Oxanium', sans-serif;
    font-weight: 800; letter-spacing: .14em;
    background: linear-gradient(92deg, #00f3ff, #7dd3fc, #00f3ff);

    animation: introZoom 1.6s cubic-bezier(.2,.8,.2,1) both, glowPulse 2s ease-in-out infinite;
  }
  .intro-topic {
    color: #94a3b8; letter-spacing: .35em;
    animation: introFade 1.4s .35s ease both;
  }
  .intro-ring {
    width: 160px; height: 160px; border-radius: 50%;
    border: 2px solid rgba(0,243,255,.35);
    box-shadow: 0 0 60px rgba(0,243,255,.25), inset 0 0 40px rgba(0,243,255,.12);
    display:flex; align-items:center; justify-content:center;
    animation: ringSpin 2.4s linear infinite, introZoom 1.2s ease both;
    margin-bottom: 28px; position: relative;
  }
  .intro-ring::before {
    content:''; position:absolute; inset:-10px; border-radius:50%;
    border-top: 2px solid #00f3ff; border-right: 2px solid transparent;
    border-bottom: 2px solid transparent; border-left: 2px solid transparent;
  }
  @keyframes ringSpin { to { transform: rotate(360deg); } }
  @keyframes introZoom { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
  @keyframes introFade { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes glowPulse {
    0%,100% { text-shadow: 0 0 24px rgba(0,243,255,.55); }
    50% { text-shadow: 0 0 54px rgba(0,243,255,.9); }
  }

  /* Tabs */
  .tab-btn {
    position: relative; transition: color .25s ease, background-color .25s ease;
    border-radius: 12px;
  }
  .tab-btn.active { color: #00f3ff; background: rgba(0,243,255,.08); box-shadow: inset 0 0 0 1px rgba(0,243,255,.35), 0 0 18px rgba(0,243,255,.15); }
  .view { animation: viewIn .35s ease both; }
  @keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* Mode pills */
  .mode-btn {
    transition: background-color .25s ease, color .25s ease, box-shadow .25s ease, transform .15s ease;
    border: 1px solid rgba(255,255,255,.1);
  }
  .mode-btn:active { transform: scale(.96); }
  .mode-btn.active {
    background: rgba(0,243,255,.12); color: #00f3ff;
    border-color: rgba(0,243,255,.5); box-shadow: 0 0 16px rgba(0,243,255,.25);
  }

  /* Segmented (eye defect) */
  .seg-btn.active { background: rgba(0,243,255,.14); color:#00f3ff; border-color: rgba(0,243,255,.5); }

  /* Toggle switch */
  .switch { position: relative; width: 58px; height: 30px; flex: none; }
  .switch input { display:none; }
  .switch .track {
    position:absolute; inset:0; border-radius:999px; background:#334155;
    transition: background-color .25s ease; cursor:pointer;
  }
  .switch .track::after {
    content:''; position:absolute; top:3px; left:3px; width:24px; height:24px;
    border-radius:50%; background:#94a3b8; transition: transform .25s ease, background-color .25s ease;
  }
  .switch input:checked + .track { background: rgba(34,197,94,.5); }
  .switch input:checked + .track::after { transform: translateX(28px); background:#22c55e; box-shadow:0 0 12px rgba(34,197,94,.8); }
  [dir="rtl"] .switch .track::after { left:auto; right:3px; }
  [dir="rtl"] .switch input:checked + .track::after { transform: translateX(-28px); }

  /* Quiz options */
  .opt-btn {
    transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .12s ease;
    border: 1px solid rgba(255,255,255,.1);
  }
  .opt-btn:not(.locked):hover { border-color: rgba(0,243,255,.45); background: rgba(0,243,255,.06); }
  .opt-btn:not(.locked):active { transform: scale(.98); }
  .opt-btn.correct { background: rgba(34,197,94,.16); border-color:#22c55e; box-shadow: 0 0 18px rgba(34,197,94,.3); }
  .opt-btn.wrong { background: rgba(239,68,68,.14); border-color:#ef4444; box-shadow: 0 0 18px rgba(239,68,68,.3); }

  .zoom-btn {
    width: 42px; height: 42px; border-radius: 12px;
    background: rgba(15,23,42,.8); border:1px solid rgba(255,255,255,.12);
    color:#00f3ff; display:flex; align-items:center; justify-content:center;
    backdrop-filter: blur(8px); cursor:pointer;
    transition: background-color .2s ease, box-shadow .2s ease, transform .12s ease;
  }
  .zoom-btn:hover { background: rgba(0,243,255,.12); box-shadow: 0 0 14px rgba(0,243,255,.25); }
  .zoom-btn:active { transform: scale(.92); }

  .stat-val { font-family: 'Oxanium', monospace; color:#00f3ff; }
  [dir="rtl"] .stat-val { font-family: 'Oxanium', monospace !important; line-height: 1.4 !important; }
  .num { font-family:'Oxanium', monospace !important; line-height:1.4 !important; direction:ltr; unicode-bidi:embed; }

  .fade-in { animation: viewIn .4s ease both; }
  .score-ring { filter: drop-shadow(0 0 14px rgba(0,243,255,.5)); }
</style>

        <i class="fa-solid fa-house"></i><span data-i18n="tab_sim"></span>

      <button id="tab-quiz" data-testid="tab-quiz" onclick="switchTab('quiz')" class="tab-btn px-4 md:px-6 py-2.5 font-bold text-sm md:text-base text-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-clipboard-question"></i><span data-i18n="tab_quiz"></span>
      </button>
    </nav>

    <!-- TOP RIGHT: LANGUAGE DROPDOWN & FULLSCREEN -->
    <div class="flex items-center gap-3">
      <div class="relative">
        <select id="lang-select" data-testid="lang-select" onchange="changeLanguage(this.value)" class="bg-slate-900 border border-slate-700 text-cyan-400 text-sm rounded-lg focus:ring-cyan-500 focus:border-cyan-500 px-3 py-2 cursor-pointer font-bold">

          <option value="ur">🌐 اردو</option>

      <button data-testid="fullscreen-btn" onclick="toggleFullScreen()" class="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-400 flex items-center justify-center border border-slate-700 transition" title="Toggle Fullscreen">
        <i class="fa-solid fa-expand"></i>
      </button>
    </div>
  </header>

  <!-- ===================== SIMULATION VIEW ===================== -->
  <main id="view-sim" class="view flex-1 flex flex-col lg:flex-row gap-4 p-4 min-h-0 overflow-y-auto lg:overflow-hidden">

    <!-- CANVAS AREA -->
    <section class="flex-1 flex flex-col gap-3 min-h-0 min-w-0">
      <!-- Mode selector -->
      <div class="glass-card rounded-2xl p-2 flex flex-wrap gap-2">
        <button id="mode-convex" data-testid="mode-convex" onclick="setMode('convex')" class="mode-btn active flex-1 min-w-[130px] px-4 py-3 rounded-xl font-bold text-sm md:text-base text-slate-300 flex items-center justify-center gap-2">
          <i class="fa-solid fa-circle-half-stroke"></i><span data-i18n="mode_convex"></span>
        </button>
        <button id="mode-concave" data-testid="mode-concave" onclick="setMode('concave')" class="mode-btn flex-1 min-w-[130px] px-4 py-3 rounded-xl font-bold text-sm md:text-base text-slate-300 flex items-center justify-center gap-2">
          <i class="fa-regular fa-hourglass"></i><span data-i18n="mode_concave"></span>
        </button>
        <button id="mode-eye" data-testid="mode-eye" onclick="setMode('eye')" class="mode-btn flex-1 min-w-[130px] px-4 py-3 rounded-xl font-bold text-sm md:text-base text-slate-300 flex items-center justify-center gap-2">
          <i class="fa-regular fa-eye"></i><span data-i18n="mode_eye"></span>
        </button>
      </div>

      <!-- Canvas -->
      <div id="canvas-wrap" class="glass-card rounded-2xl relative flex-1 min-h-[320px] overflow-hidden">

      <div id="panel-lens" class="glass-card rounded-2xl p-5 space-y-6">

        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-bold text-slate-300" data-i18n="obj_dist"></label>
            <span class="stat-val text-sm num" id="val-do">30.0 cm</span>
          </div>
          <input type="range" data-testid="slider-object-distance" id="sl-do" class="w-full" min="4" max="70" step="0.5" value="30" oninput="onSlider()">
        </div>
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-bold text-slate-300" data-i18n="focal_len"></label>
            <span class="stat-val text-sm num" id="val-f">12.0 cm</span>

        </div>
      </div>

      <!-- CONTROLS: EYE -->
      <div id="panel-eye" class="glass-card rounded-2xl p-5 space-y-6 hidden">
        <h2 class="font-display font-bold text-base text-cyan-400 flex items-center gap-2">

        <div>

          <input type="range" data-testid="slider-severity" id="sl-sev" class="w-full" min="10" max="100" step="5" value="50" oninput="onSlider()">

        <div class="flex items-center justify-between gap-3 glass-panel rounded-xl px-4 py-3">

        </div>

            <span class="text-sm font-bold text-slate-100 text-end" id="obs-objpos" data-testid="obs-object-position"></span>
          </div>
          <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
            <span class="text-sm text-slate-400" data-i18n="img_dist"></span>
            <span class="stat-val text-sm num" id="obs-v" data-testid="obs-image-distance"></span>
          </div>
          <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">

            <span class="stat-val text-sm num" id="obs-m"></span>

        <div id="obs-eye" class="space-y-3 hidden">

        </h2>
        <p class="text-sm text-slate-300 leading-relaxed" id="tip-text"></p>
      </div>
    </aside>

/* ============================================================
   GLOBAL STATE
============================================================ */
let cur = localStorage.getItem('iqra_lang') || 'en';
const state = {
  mode: 'convex',           // convex | concave | eye
  dObj: 30, f: 12, hObj: 5,
  defect: 'myopia', severity: 50, corrected: false,
  zoom: 1, panX: 0, panY: 0
};
const T = k => LANG[cur][k];

/* ============================================================
   LANGUAGE SYSTEM
============================================================ */
function changeLanguage(l) {
  cur = l;
  localStorage.setItem('iqra_lang', l);
  document.documentElement.setAttribute('dir', l === 'ur' ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', l);
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
  updateReadouts();
  renderQuiz();
  requestAnimationFrame(draw);
}
function toggleFullScreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
}

/* ============================================================
   TABS
============================================================ */
function switchTab(t) {
  document.getElementById('view-sim').classList.toggle('hidden', t !== 'sim');
  document.getElementById('view-quiz').classList.toggle('hidden', t !== 'quiz');
  document.getElementById('tab-sim').classList.toggle('active', t === 'sim');
  document.getElementById('tab-quiz').classList.toggle('active', t === 'quiz');
  if (t === 'sim') { fitCanvas(); requestAnimationFrame(draw); }
}

/* ============================================================
   MODES & CONTROLS
============================================================ */
function setMode(m) {
  state.mode = m;
  ['convex','concave','eye'].forEach(x =>
    document.getElementById('mode-'+x).classList.toggle('active', x === m));
  document.getElementById('panel-lens').classList.toggle('hidden', m === 'eye');
  document.getElementById('panel-eye').classList.toggle('hidden', m !== 'eye');
  document.getElementById('obs-lens').classList.toggle('hidden', m === 'eye');
  document.getElementById('obs-eye').classList.toggle('hidden', m !== 'eye');
  document.getElementById('drag-hint').style.display = (m === 'eye') ? 'none' : '';
  resetView(false);
  updateReadouts();
  requestAnimationFrame(draw);
}
function setDefect(d) {
  state.defect = d;
  document.getElementById('seg-myopia').classList.toggle('active', d === 'myopia');
  document.getElementById('seg-hyper').classList.toggle('active', d === 'hyper');
  updateReadouts(); requestAnimationFrame(draw);
}
function onSlider() {
  state.dObj = +document.getElementById('sl-do').value;
  state.f = +document.getElementById('sl-f').value;
  state.hObj = +document.getElementById('sl-ho').value;
  state.severity = +document.getElementById('sl-sev').value;
  state.corrected = document.getElementById('chk-correct').checked;
  updateReadouts(); requestAnimationFrame(draw);
}

/* ============================================================
   OPTICS PHYSICS  (1/v - 1/u = 1/f, real-is-positive layout)
============================================================ */
function computeLens() {
  const f = state.mode === 'convex' ? state.f : -state.f;
  const u = state.dObj;
  if (Math.abs(u - f) < 0.25 && f > 0) return { infinity: true };
  const v = (f * u) / (u - f);          // v>0 : real image right side
  const m = -v / u;                     // m<0 inverted
  return { infinity: false, v, m, hi: m * state.hObj };
}
function classifyConvex() {
  const { dObj: u, f } = state, e = 0.26;
  if (Math.abs(u - 2*f) < e) return 'at2F';
  if (u > 2*f) return 'beyond2F';
  if (Math.abs(u - f) < e) return 'atF';
  if (u > f) return 'between';
  return 'inside';
}
function updateReadouts() {
  const el = id => document.getElementById(id);
  el('val-do').textContent = state.dObj.toFixed(1) + ' cm';
  el('val-f').textContent = state.f.toFixed(1) + ' cm';
  el('val-ho').textContent = state.hObj.toFixed(1) + ' cm';
  el('val-sev').textContent = state.severity + '%';
  el('sl-do').value = state.dObj;

  if (state.mode === 'eye') {
    const key = 'eye_' + (state.defect === 'myopia' ? 'myopia' : 'hyper') + (state.corrected ? '_ok' : '_bad');
    const st = el('eye-status');
    st.textContent = T(key);
    st.className = 'glass-panel rounded-xl px-4 py-3 text-sm leading-relaxed ' + (state.corrected ? 'text-green-300 glow-green' : 'text-red-300 glow-red');
    el('tip-text').textContent = T(state.defect === 'myopia' ? 'tip_eye_myopia' : 'tip_eye_hyper');
    return;
  }

  const r = computeLens();
  let posKey, iposKey, szKey, natKey, tip;
  if (state.mode === 'convex') {
    posKey = { beyond2F:'pos_beyond2F', at2F:'pos_at2F', between:'pos_between', atF:'pos_atF', inside:'pos_inside' }[classifyConvex()];
    tip = classifyConvex() === 'atF' ? 'tip_convex_atF' : 'tip_convex';
  } else { posKey = 'pos_any'; tip = 'tip_concave'; }

  if (r.infinity) {
    el('obs-v').textContent = '∞';
    el('obs-size').textContent = T('sz_vlarge');
    el('obs-m').textContent = '∞';
    el('obs-nature').textContent = T('img_at_infinity');
    el('obs-nature').className = 'glass-panel rounded-xl px-4 py-3 text-sm font-bold text-center text-amber-300';
  } else {
    const am = Math.abs(r.m);
    if (state.mode === 'concave') szKey = am < 0.35 ? 'sz_vsmall' : 'sz_smaller';
    else if (am > 3) szKey = 'sz_vlarge';
    else if (am > 1.05) szKey = 'sz_larger';
    else if (am >= 0.95) szKey = 'sz_same';
    else szKey = am < 0.2 ? 'sz_point' : 'sz_smaller';
    natKey = r.v > 0 ? 'nat_real_inv' : 'nat_virt_erect';
    el('obs-v').textContent = Math.abs(r.v).toFixed(1) + ' cm';
    el('obs-size').textContent = T(szKey);
    el('obs-m').textContent = r.m.toFixed(2) + '×';
    el('obs-nature').textContent = T(natKey);
    el('obs-nature').className = 'glass-panel rounded-xl px-4 py-3 text-sm font-bold text-center ' + (r.v > 0 ? 'text-red-300' : 'text-green-300');
  }
  el('obs-objpos').textContent = T(posKey);
  el('tip-text').textContent = T(tip);
}

/* ============================================================
   CANVAS + ZOOM/PAN
============================================================ */
const canvas = document.getElementById('sim-canvas');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, baseScale = 8;

function fitCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  const dpr = window.devicePixelRatio || 1;
  W = wrap.clientWidth; H = wrap.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  baseScale = Math.min(W / 150, H / 42);
}
function S() { return baseScale * state.zoom; }
function X(wx) { return W/2 + wx * S() + state.panX; }
function Y(wy) { return H/2 - wy * S() + state.panY; }
function zoomBy(k, cx, cy) {
  const old = state.zoom;
  state.zoom = Math.min(4, Math.max(0.4, state.zoom * k));
  const r = state.zoom / old;
  cx = cx ?? W/2; cy = cy ?? H/2;
  state.panX = (state.panX + W/2 - cx) * r + cx - W/2;
  state.panY = (state.panY + H/2 - cy) * r + cy - H/2;
  requestAnimationFrame(draw);
}
function resetView(redraw = true) {
  state.zoom = 1; state.panX = 0; state.panY = 0;
  if (redraw) requestAnimationFrame(draw);
}

/* ---------- pointer interaction: drag object / pan / pinch ---------- */
let dragging = null, lastP = null, pinch = null;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  const p = { x: e.offsetX, y: e.offsetY, id: e.pointerId };
  if (pinchPts.size === 1) { pinchPts.set(e.pointerId, p); startPinch(); return; }
  pinchPts.set(e.pointerId, p);
  if (state.mode !== 'eye') {
    const ox = X(-state.dObj), oy1 = Y(0), oy2 = Y(state.hObj);
    if (Math.abs(p.x - ox) < 26 && p.y > Math.min(oy1, oy2) - 26 && p.y < Math.max(oy1, oy2) + 26) {
      dragging = 'object'; canvas.style.cursor = 'ew-resize'; return;
    }
  }
  dragging = 'pan'; lastP = p; canvas.style.cursor = 'grabbing';
});
const pinchPts = new Map();
function startPinch() {
  const pts = [...pinchPts.values()];
  pinch = { d: Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y), z: state.zoom };
  dragging = null;
}
canvas.addEventListener('pointermove', e => {
  const p = { x: e.offsetX, y: e.offsetY };
  if (pinchPts.has(e.pointerId)) pinchPts.set(e.pointerId, { ...p, id: e.pointerId });
  if (pinch && pinchPts.size >= 2) {
    const pts = [...pinchPts.values()];
    const d = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    const target = pinch.z * d / pinch.d;
    zoomBy(target / state.zoom, (pts[0].x+pts[1].x)/2, (pts[0].y+pts[1].y)/2);
    return;
  }
  if (dragging === 'object') {
    const wx = (p.x - W/2 - state.panX) / S();
    state.dObj = Math.min(70, Math.max(4, -wx));
    document.getElementById('sl-do').value = state.dObj;
    updateReadouts(); requestAnimationFrame(draw);
  } else if (dragging === 'pan' && lastP) {
    state.panX += p.x - lastP.x; state.panY += p.y - lastP.y;
    lastP = p; requestAnimationFrame(draw);
  }
});
function endPointer(e) {
  pinchPts.delete(e.pointerId);
  if (pinchPts.size < 2) pinch = null;
  dragging = null; lastP = null; canvas.style.cursor = 'grab';
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoomBy(e.deltaY < 0 ? 1.1 : 1/1.1, e.offsetX, e.offsetY);
}, { passive: false });

/* ============================================================
   DRAWING HELPERS
============================================================ */
function urFont(sz) { return `600 ${sz}px 'Jameel Noori Nastaliq','Noto Nastaliq Urdu',serif`; }
function enFont(sz) { return `700 ${sz}px 'Oxanium',sans-serif`; }
function labelFont(sz) { return cur === 'ur' ? urFont(sz + 2) : enFont(sz); }
function text(str, x, y, color = '#94a3b8', sz = 13, align = 'center') {
  ctx.font = labelFont(sz); ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(str, x, y);
}
function line(x1, y1, x2, y2, color, w = 2, dash = []) {
  ctx.beginPath(); ctx.setLineDash(dash); ctx.strokeStyle = color; ctx.lineWidth = w;
  ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.setLineDash([]);
}
function arrowHead(x, y, ang, color, size = 9) {
  ctx.beginPath(); ctx.fillStyle = color;
  ctx.moveTo(x, y);
  ctx.lineTo(x - size * Math.cos(ang - 0.42), y - size * Math.sin(ang - 0.42));
  ctx.lineTo(x - size * Math.cos(ang + 0.42), y - size * Math.sin(ang + 0.42));
  ctx.closePath(); ctx.fill();
}
function ray(x1, y1, x2, y2, color, dash = [], head = true) {
  line(x1, y1, x2, y2, color, 2, dash);
  if (head) arrowHead((x1+x2)/2, (y1+y2)/2, Math.atan2(y2-y1, x2-x1), color);
}
function drawArrowObj(x, yBase, yTip, color, glow, dashed = false) {
  ctx.save();
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = 14; }
  line(x, yBase, x, yTip, color, 4, dashed ? [7,5] : []);
  arrowHead(x, yTip, yTip < yBase ? -Math.PI/2 : Math.PI/2, color, 13);
  ctx.restore();
}

function drawLensShape(x, halfH, type, color = '#7dd3fc') {
  ctx.save();
  ctx.shadowColor = 'rgba(0,243,255,.6)'; ctx.shadowBlur = 16;
  ctx.strokeStyle = color; ctx.lineWidth = 2.5;
  ctx.fillStyle = 'rgba(125,211,252,.12)';
  const w = Math.max(10, halfH * 0.30);
  ctx.beginPath();
  if (type === 'convex') {
    ctx.moveTo(x, -halfH);
    ctx.quadraticCurveTo(x + w, 0, x, halfH);
    ctx.quadraticCurveTo(x - w, 0, x, -halfH);
  } else {
    const e = w * 0.75;
    ctx.moveTo(x - e, -halfH); ctx.lineTo(x + e, -halfH);
    ctx.quadraticCurveTo(x + e - w, 0, x + e, halfH);
    ctx.lineTo(x - e, halfH);
    ctx.quadraticCurveTo(x - e + w, 0, x - e, -halfH);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}

/* ============================================================
   MAIN DRAW
============================================================ */
function draw() {
  ctx.clearRect(0, 0, W, H);
  if (state.mode === 'eye') drawEye(); else drawLensSim();
}

function drawLensSim() {
  const isConvex = state.mode === 'convex';
  const f = state.f, u = state.dObj, ho = state.hObj;
  const r = computeLens();
  const axisY = Y(0);

  // principal axis
  line(X(-78), axisY, X(78), axisY, 'rgba(148,163,184,.5)', 1.5, [8,6]);
  text(T('lbl_axis'), X(70), axisY - 10, 'rgba(148,163,184,.7)', 11);

  // focus marks
  const marks = isConvex
    ? [[-f,'F₁'],[f,'F₂'],[-2*f,'2F₁'],[2*f,'2F₂']]
    : [[-f,'F₁'],[f,'F₂']];
  marks.forEach(([wx, lb]) => {
    line(X(wx), axisY - 7, X(wx), axisY + 7, '#fbbf24', 2.5);
    ctx.font = enFont(12); ctx.fillStyle = '#fbbf24'; ctx.textAlign = 'center';
    ctx.fillText(lb, X(wx), axisY + 24);
  });

  // lens
  const halfH = 14 * S();
  ctx.save(); ctx.translate(X(0), axisY);
  drawLensShape(0, halfH, isConvex ? 'convex' : 'concave');
  ctx.restore();
  text(T(isConvex ? 'lbl_lens_convex' : 'lbl_lens_concave'), X(0), Y(15.5) - 6, '#7dd3fc', 13);

  // object
  const ox = X(-u), oy = Y(ho);
  drawArrowObj(ox, axisY, oy, '#00f3ff', true);
  text(T('lbl_object'), ox, oy - 12, '#00f3ff', 13);

  // ==== rays ====
  const lx = X(0), lyTop = Y(ho);
  const yellow = 'rgba(250,204,21,.95)', mag = '#f472b6', grn = '#4ade80';
  const ext = 55 * S();

  // Ray 1: object top -> lens (parallel to axis)
  ray(ox, oy, lx, lyTop, yellow);

  if (r.infinity) {
    // exits toward F2 direction; centre ray parallel to it
    let d = norm(X(f) - lx, axisY - lyTop);
    ray(lx, lyTop, lx + d.x * ext, lyTop + d.y * ext, yellow);
    d = norm(lx - ox, axisY - oy);
    ray(ox, oy, lx + d.x * ext, axisY + d.y * ext, mag);
    ctx.save();
    ctx.font = labelFont(15); ctx.fillStyle = '#fbbf24'; ctx.textAlign = 'center';
    ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 10;
    ctx.fillText(T('img_at_infinity'), X(28), Y(12));
    ctx.restore();
  } else if (isConvex && r.v > 0) {
    const ix = X(r.v), iy = Y(r.hi);
    extendPast(lx, lyTop, ix, iy, yellow);            // refracted through F2 to image
    extendPast(ox, oy, ix, iy, mag);                  // centre ray
    ray(ox, oy, lx, iy, grn);                         // through F1, exits parallel
    extendPast(lx, iy, ix, iy, grn);
    drawArrowObj(ix, axisY, iy, '#ef4444', true);
    text(T('lbl_image'), ix, iy + (r.hi < 0 ? 24 : -12), '#ef4444', 13);
  } else if (isConvex) {
    // object inside F1 -> virtual, erect, magnified
    const ix = X(r.v), iy = Y(r.hi);
    let d = norm(X(f) - lx, axisY - lyTop);
    ray(lx, lyTop, lx + d.x * ext, lyTop + d.y * ext, yellow);
    line(lx, lyTop, ix, iy, 'rgba(250,204,21,.5)', 1.5, [6,5]);
    d = norm(lx - ox, axisY - oy);
    ray(ox, oy, lx + d.x * ext, axisY + d.y * ext, mag);
    line(ox, oy, ix, iy, 'rgba(244,114,182,.5)', 1.5, [6,5]);
    drawArrowObj(ix, axisY, iy, '#4ade80', true, true);
    text(T('lbl_virtual_image'), ix, iy - 12, '#4ade80', 13);
  } else {
    // concave -> always virtual, erect, smaller (between O and F1)
    const ix = X(r.v), iy = Y(r.hi);
    let d = norm(lx - X(-f), lyTop - axisY);
    ray(lx, lyTop, lx + d.x * ext, lyTop + d.y * ext, yellow);
    line(X(-f), axisY, lx, lyTop, 'rgba(250,204,21,.45)', 1.5, [6,5]);
    d = norm(lx - ox, axisY - oy);
    ray(ox, oy, lx + d.x * ext, axisY + d.y * ext, mag);
    drawArrowObj(ix, axisY, iy, '#4ade80', true, true);
    text(T('lbl_virtual_image'), ix, iy - 12, '#4ade80', 13);
  }
}
function norm(dx, dy) { const L = Math.hypot(dx, dy) || 1; return { x: dx / L, y: dy / L }; }
function extendPast(x1, y1, x2, y2, color) {
  const d = norm(x2 - x1, y2 - y1);
  ray(x1, y1, x2, y2, color);
  line(x2, y2, x2 + d.x * 24 * S(), y2 + d.y * 24 * S(), color, 2);
}

/* ---------------- EYE DEFECTS ---------------- */
function drawEye() {
  const sev = state.severity / 100;
  const myo = state.defect === 'myopia';
  const R = 13;                        // eye radius (world cm)
  const ecx = 26;                      // eye centre x
  const lensX = ecx - R;               // eye lens position
  const retinaX = ecx + R;
  const fNormal = 2 * R;
  const fEye = myo ? fNormal * (1 - 0.30 * sev) : fNormal * (1 + 0.42 * sev);
  const specX = lensX - 9;

  const axisY = Y(0);
  line(X(-72), axisY, X(retinaX + 6), axisY, 'rgba(148,163,184,.35)', 1, [8,6]);

  // eyeball
  ctx.save();
  ctx.beginPath(); ctx.strokeStyle = '#7dd3fc'; ctx.lineWidth = 2.5;
  ctx.shadowColor = 'rgba(0,243,255,.4)'; ctx.shadowBlur = 12;
  ctx.fillStyle = 'rgba(30,41,59,.55)';
  ctx.ellipse(X(ecx), axisY, R * S(), R * S() * 0.92, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.restore();
  // retina arc
  ctx.beginPath(); ctx.strokeStyle = '#f472b6'; ctx.lineWidth = 4;
  ctx.arc(X(ecx), axisY, R * S() * 0.97, -0.62, 0.62);
  ctx.stroke();
  text(T('lbl_retina'), X(retinaX + 2), Y(9), '#f472b6', 13, cur === 'ur' ? 'right' : 'left');

  // eye lens
  ctx.save(); ctx.translate(X(lensX), axisY);
  drawLensShape(0, 6.5 * S(), 'convex');
  ctx.restore();
  text(T('lbl_eye_lens'), X(lensX), Y(10.5), '#7dd3fc', 12);

  // spectacle lens if corrected
  if (state.corrected) {
    ctx.save(); ctx.translate(X(specX), axisY);
    drawLensShape(0, 7.5 * S(), myo ? 'concave' : 'convex', '#4ade80');
    ctx.restore();
    text(T(myo ? 'lbl_correction_concave' : 'lbl_correction_convex'), X(specX), Y(-11.5), '#4ade80', 12);
  }

  // rays
  const heights = [4.2, 2.1, -2.1, -4.2];
  const startX = -70;
  const fEff = state.corrected ? fNormal : fEye;
  const rayColor = 'rgba(250,204,21,.95)';

  heights.forEach(h0 => {
    let h = h0;
    if (state.corrected) {
      // parallel to spectacle
      ray(X(startX), Y(h), X(specX), Y(h), rayColor, [], h0 > 0);
      // small bend between spectacle and eye lens (illustrative)
      h = h0 * (myo ? 1.12 : 0.85);
      line(X(specX), Y(h0), X(lensX), Y(h), rayColor, 2);
    } else {
      ray(X(startX), Y(h), X(lensX), Y(h), rayColor, [], h0 > 0);
    }
    // refract toward focus at lensX + fEff
    const fx = lensX + fEff, fy = 0;
    const dx = fx - lensX, dy = fy - h;      // world direction
    // find intersection with retina sphere (approx: draw to retinaX)
    const tRet = (retinaX - lensX) / dx;
    const hRet = h + dy * tRet;
    if (fEff <= (retinaX - lensX) + 0.01) {
      // crosses focus inside eye then continues to retina
      line(X(lensX), Y(h), X(fx), Y(0), rayColor, 2);
      if (Math.abs(fx - retinaX) > 0.3) line(X(fx), Y(0), X(retinaX), Y(hRet), rayColor, 2);
    } else {
      // focus behind retina: solid to retina, dashed to focus
      line(X(lensX), Y(h), X(retinaX), Y(hRet), rayColor, 2);
      line(X(retinaX), Y(hRet), X(fx), Y(0), 'rgba(250,204,21,.45)', 1.5, [6,5]);
    }
  });

  // focal point marker + status
  const fx = lensX + fEff;
  ctx.save();
  ctx.beginPath();
  ctx.fillStyle = state.corrected ? '#22c55e' : '#ef4444';
  ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 16;
  ctx.arc(X(fx), axisY, 6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  text(T('lbl_focus_point'), X(fx), axisY + 26, state.corrected ? '#22c55e' : '#ef4444', 12);

  text(T('lbl_parallel_rays'), X(-44), Y(7.5), 'rgba(250,204,21,.9)', 13);

  ctx.save();
  ctx.font = labelFont(16);
  ctx.fillStyle = state.corrected ? '#22c55e' : '#ef4444';
  ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 12;
  ctx.textAlign = 'center';
  ctx.fillText(state.corrected ? T('lbl_sharp') : T('lbl_blur'), X(ecx), Y(-17));
  ctx.restore();
}

/* ============================================================
   QUIZ
============================================================ */
const quiz = { i: 0, answers: Array(5).fill(null), done: false };
function restartQuiz() { quiz.i = 0; quiz.answers = Array(5).fill(null); quiz.done = false; renderQuiz(); }
function answer(oi) {
  if (quiz.answers[quiz.i] !== null) return;
  quiz.answers[quiz.i] = oi;
  renderQuiz();
}
function nextQ() {
  if (quiz.i < 4) quiz.i++; else quiz.done = true;
  renderQuiz();
}
function renderQuiz() {
  const box = document.getElementById('quiz-box');
  const Q = LANG[cur].quiz;
  if (quiz.done) {
    const score = quiz.answers.reduce((s, a, i) => s + (a === Q[i].a ? 1 : 0), 0);
    const pct = Math.round(score / 5 * 100);
    const msg = pct >= 80 ? T('score_msg_great') : pct >= 60 ? T('score_msg_good') : T('score_msg_low');
    const circ = 2 * Math.PI * 54;
    box.innerHTML = `
      <div class="fade-in text-center py-6" data-testid="quiz-result">
        <h2 class="font-display text-lg font-bold text-cyan-400 mb-6">${T('final_score')}</h2>
        <div class="relative inline-block score-ring">
          <svg width="140" height="140" viewBox="0 0 140 140">
            <circle cx="70" cy="70" r="54" fill="none" stroke="#334155" stroke-width="10"/>
            <circle cx="70" cy="70" r="54" fill="none" stroke="#00f3ff" stroke-width="10" stroke-linecap="round"
              stroke-dasharray="${circ}" stroke-dashoffset="${circ * (1 - pct/100)}" transform="rotate(-90 70 70)"/>
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span class="num text-3xl font-extrabold text-cyan-300" data-testid="quiz-score">${score}/5</span>
            <span class="num text-sm text-slate-400">${pct}%</span>
          </div>
        </div>
        <p class="mt-6 text-base text-slate-300">${msg}</p>
        <button data-testid="quiz-restart-btn" onclick="restartQuiz()" class="mt-8 px-8 py-3.5 rounded-xl bg-cyan-500/15 border border-cyan-400/50 text-cyan-300 font-bold glow-cyan hover:bg-cyan-500/25 transition">
          <i class="fa-solid fa-rotate-right"></i> ${T('restart')}
        </button>
      </div>`;
    return;
  }
  const q = Q[quiz.i], picked = quiz.answers[quiz.i];
  const opts = q.opts.map((o, oi) => {
    let cls = 'opt-btn';
    if (picked !== null) {
      cls += ' locked';
      if (oi === q.a) cls += ' correct';
      else if (oi === picked) cls += ' wrong';
    }
    return `<button data-testid="quiz-option-${oi}" onclick="answer(${oi})" class="${cls} w-full text-start px-5 py-4 rounded-xl glass-panel text-sm md:text-base font-bold text-slate-200 flex items-center gap-3">
      <span class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-600 flex items-center justify-center text-cyan-400 num shrink-0">${String.fromCharCode(65+oi)}</span>
      <span>${o}</span>
    </button>`;
  }).join('');
  const fb = picked === null ? '' : `
    <div class="fade-in mt-5 rounded-xl px-5 py-4 ${picked === q.a ? 'bg-green-500/10 border border-green-500/40 glow-green' : 'bg-red-500/10 border border-red-500/40 glow-red'}">
      <div class="font-bold ${picked === q.a ? 'text-green-400' : 'text-red-400'} mb-1" data-testid="quiz-feedback">
        <i class="fa-solid ${picked === q.a ? 'fa-circle-check' : 'fa-circle-xmark'}"></i> ${picked === q.a ? T('correct_fb') : T('wrong_fb')}
      </div>
      <p class="text-sm text-slate-300 leading-relaxed">${q.ex}</p>
    </div>
    <button data-testid="quiz-next-btn" onclick="nextQ()" class="mt-5 w-full px-6 py-3.5 rounded-xl bg-cyan-500/15 border border-cyan-400/50 text-cyan-300 font-bold hover:bg-cyan-500/25 transition">
      ${quiz.i < 4 ? T('next_q') : T('see_result')} <i class="fa-solid fa-arrow-right rtl-flip"></i>
    </button>`;
  box.innerHTML = `
    <div class="fade-in">
      <div class="flex items-center justify-between mb-5">
        <h2 class="font-display text-lg font-bold text-cyan-400">${T('quiz_title')}</h2>
        <span class="text-sm text-slate-400 font-bold" data-testid="quiz-progress">${T('quiz_progress')(quiz.i+1,5)}</span>
      </div>
      <div class="flex gap-1.5 mb-6">${[0,1,2,3,4].map(i =>
        `<div class="h-1.5 flex-1 rounded-full ${i < quiz.i || quiz.answers[i] !== null ? 'bg-cyan-400' : i === quiz.i ? 'bg-cyan-700' : 'bg-slate-700'}"></div>`).join('')}
      </div>
      <p class="text-base md:text-lg font-bold text-slate-100 mb-6 leading-relaxed" data-testid="quiz-question">${q.q}</p>
      <div class="space-y-3">${opts}</div>
      ${fb}
    </div>`;
}

/* ============================================================
   INIT
============================================================ */
window.addEventListener('resize', () => { fitCanvas(); requestAnimationFrame(draw); });
document.getElementById('lang-select').value = cur;
changeLanguage(cur);
document.getElementById('intro-topic').textContent = T('intro_topic');
setTimeout(() => {
  const intro = document.getElementById('intro'), app = document.getElementById('app');
  if (window.__denied || !intro || !app) return;
  intro.style.opacity = '0';
  app.style.opacity = '1';
  setTimeout(() => intro.remove(), 750);
  fitCanvas(); requestAnimationFrame(draw);
}, 2100);
fitCanvas(); requestAnimationFrame(draw);
</script>
</body>
