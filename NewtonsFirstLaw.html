<style>
/* Jameel Noori Nastaliq — preferred Urdu font */
@font-face {
  font-family: 'Jameel Noori Nastaliq';
  src: url('https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoNastaliqUrdu/NotoNastaliqUrdu-Regular.ttf') format('truetype');

}
@font-face {
  font-family: 'Jameel Noori Nastaliq';
  src: url('https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoNastaliqUrdu/NotoNastaliqUrdu-Bold.ttf') format('truetype');

  font-style: normal;
  font-display: swap;
}

/* Custom Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #0f172a; }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #475569; }

/* RTL Styling Adjustments for Urdu with Jameel Noori Nastaliq */
[dir="rtl"] .rtl-flip { transform: scaleX(-1); }
[dir="rtl"] {
  font-family: 'Jameel Noori Nastaliq', 'Noto Nastaliq Urdu', serif !important;
  line-height: 2.3 !important;
}

/* Glassmorphism Classes */
.glass-panel {
  background: rgba(15, 23, 42, 0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.1);
}
.glass-card {
  background: rgba(30, 41, 59, 0.6);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.08);
}

/* Pulse Glow Effects */
.glow-cyan { box-shadow: 0 0 20px rgba(0, 243, 255, 0.35); }
.glow-red { box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
.glow-green { box-shadow: 0 0 20px rgba(34, 197, 94, 0.35); }

/* Canvas styling */
canvas { touch-action: none; }

/* Custom Slider Styling */
input[type=range] {
  -webkit-appearance: none;
  background: #334155;
  border-radius: 8px;
  height: 8px;
  width: 100%;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  height: 20px; width: 20px; border-radius: 50%;
  background: #00f3ff; cursor: pointer;
  box-shadow: 0 0 10px #00f3ff;
  transition: transform 0.1s ease;
}
input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
input[type=range]::-moz-range-thumb {
  height: 20px; width: 20px; border-radius: 50%; border: none;
  background: #00f3ff; cursor: pointer; box-shadow: 0 0 10px #00f3ff;
}

/* Extended design language */
body {
  font-family: 'Manrope', sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  overflow: hidden;
  margin: 0;
}
.font-display { font-family: 'Oxanium', 'Manrope', sans-serif; }
[dir="rtl"] .font-display { font-family: 'Jameel Noori Nastaliq', 'Noto Nastaliq Urdu', serif; }
[dir="rtl"] body, [dir="rtl"] { font-size: 1.08em; }

.bg-grid {
  background-image:
    linear-gradient(rgba(0,243,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,243,255,0.04) 1px, transparent 1px);
  background-size: 44px 44px;
}

/* Intro */
#intro {
  position: fixed; inset: 0; z-index: 100;
  background: radial-gradient(ellipse at center, #10233f 0%, #0f172a 65%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity .7s ease;
}
.intro-title {
  font-family: 'Oxanium', sans-serif;
  font-weight: 800; letter-spacing: .14em;
  background: linear-gradient(92deg, #00f3ff, #7dd3fc, #00f3ff);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: introZoom 1.6s cubic-bezier(.2,.8,.2,1) both, glowPulse 2s ease-in-out infinite;
}
.intro-topic {
  color: #94a3b8; letter-spacing: .28em;
  animation: introFade 1.4s .35s ease both;
}
.intro-ring {
  width: 160px; height: 160px; border-radius: 50%;
  border: 2px solid rgba(0,243,255,.35);
  box-shadow: 0 0 60px rgba(0,243,255,.25), inset 0 0 40px rgba(0,243,255,.12);
  display:flex; align-items:center; justify-content:center;
  animation: ringSpin 2.4s linear infinite, introZoom 1.2s ease both;
  margin-bottom: 28px; position: relative;
}
.intro-ring::before {
  content:''; position:absolute; inset:-10px; border-radius:50%;
  border-top: 2px solid #00f3ff; border-right: 2px solid transparent;
  border-bottom: 2px solid transparent; border-left: 2px solid transparent;
}
@keyframes ringSpin { to { transform: rotate(360deg); } }
@keyframes introZoom { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
@keyframes introFade { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes glowPulse {
  0%,100% { text-shadow: 0 0 24px rgba(0,243,255,.55); }
  50% { text-shadow: 0 0 54px rgba(0,243,255,.9); }
}

.tab-btn {
  position: relative; transition: color .25s ease, background-color .25s ease;
  border-radius: 12px;
}
.tab-btn.active {
  color: #00f3ff; background: rgba(0,243,255,.08);
  box-shadow: inset 0 0 0 1px rgba(0,243,255,.35), 0 0 18px rgba(0,243,255,.15);
}
.view { animation: viewIn .35s ease both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.ctrl-btn {
  transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .12s ease, color .2s ease;
  border: 1px solid rgba(255,255,255,.1);
}
.ctrl-btn:active { transform: scale(.96); }
.ctrl-btn.active {
  background: rgba(0,243,255,.12); color: #00f3ff;
  border-color: rgba(0,243,255,.5); box-shadow: 0 0 16px rgba(0,243,255,.25);
}
.ctrl-btn.on-green {
  background: rgba(34,197,94,.14); color: #4ade80;
  border-color: rgba(34,197,94,.5); box-shadow: 0 0 14px rgba(34,197,94,.25);
}
.ctrl-btn.on-amber {
  background: rgba(245,158,11,.14); color: #fbbf24;
  border-color: rgba(245,158,11,.5);
}

.opt-btn {
  transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .12s ease;
  border: 1px solid rgba(255,255,255,.1);
}
.opt-btn:not(.locked):hover { border-color: rgba(0,243,255,.45); background: rgba(0,243,255,.06); }
.opt-btn:not(.locked):active { transform: scale(.98); }
.opt-btn.correct { background: rgba(34,197,94,.16); border-color:#22c55e; box-shadow: 0 0 18px rgba(34,197,94,.3); }
.opt-btn.wrong { background: rgba(239,68,68,.14); border-color:#ef4444; box-shadow: 0 0 18px rgba(239,68,68,.3); }

.zoom-btn {
  width: 42px; height: 42px; border-radius: 12px;
  background: rgba(15,23,42,.8); border:1px solid rgba(255,255,255,.12);
  color:#00f3ff; display:flex; align-items:center; justify-content:center;
  backdrop-filter: blur(8px); cursor:pointer;
  transition: background-color .2s ease, box-shadow .2s ease, transform .12s ease;
}
.zoom-btn:hover { background: rgba(0,243,255,.12); box-shadow: 0 0 14px rgba(0,243,255,.25); }
.zoom-btn:active { transform: scale(.92); }

.stat-val { font-family: 'Oxanium', monospace; color:#00f3ff; }
[dir="rtl"] .stat-val { font-family: 'Oxanium', monospace !important; line-height: 1.4 !important; }
.num { font-family:'Oxanium', monospace !important; line-height:1.4 !important; direction:ltr; unicode-bidi:embed; }

#fabricLayer, .canvas-container {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  z-index: 20;
  pointer-events: none;
}
.canvas-container canvas { width: 100% !important; height: 100% !important; }

.predict-opt.selected {
  border-color: rgba(0,243,255,.6) !important;
  background: rgba(0,243,255,.1) !important;
  color: #67e8f9;
}
</style>

<body class="bg-grid">

<!-- ===================== INTRO ===================== -->
<div id="intro">
  <div class="intro-ring"><i class="fa-solid fa-cube text-5xl text-cyan-300" style="filter:drop-shadow(0 0 14px rgba(0,243,255,.8))"></i></div>
  <div class="intro-title text-4xl sm:text-5xl lg:text-6xl">IQRA VIRTUAL LAB</div>

<!-- ===================== APP ===================== -->
<div id="app" class="h-screen flex flex-col opacity-0 transition-opacity duration-700">

  <!-- HEADER -->
  <header class="glass-panel flex items-center justify-between px-3 md:px-6 py-3 z-30 gap-2 flex-wrap">

      <div class="w-10 h-10 rounded-xl bg-slate-900 border border-cyan-500/40 glow-cyan flex items-center justify-center shrink-0">
        <i class="fa-solid fa-flask text-cyan-400"></i>
      </div>
      <div class="min-w-0">
        <div class="font-display font-extrabold tracking-widest text-cyan-400 text-sm md:text-base truncate" style="font-family:'Oxanium',sans-serif !important;">IQRA VIRTUAL LAB</div>
        <div class="text-xs text-slate-400 truncate" data-i18n="topic"></div>
      </div>
    </div>

    <nav class="flex items-center gap-2 glass-card rounded-2xl p-1.5">
      <button id="tab-sim" onclick="switchTab('sim')" class="tab-btn active px-3 md:px-6 py-2.5 font-bold text-sm md:text-base text-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-house"></i><span data-i18n="tab_sim"></span>

      <button id="tab-quiz" onclick="switchTab('quiz')" class="tab-btn px-3 md:px-6 py-2.5 font-bold text-sm md:text-base text-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-clipboard-question"></i><span data-i18n="tab_quiz"></span>
      </button>

    <div class="flex items-center gap-3">
      <!-- Annotation Toolbar (Hidden by default) -->
      <div id="anno-toolbar" class="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 transition-all duration-300 max-w-0 overflow-hidden opacity-0">
        <input type="color" id="anno-color" value="#00f3ff" onchange="changeAnnoColor(this.value)" class="w-6 h-6 cursor-pointer bg-transparent border-0 p-0" title="Color">
        <button id="anno-pen" onclick="setAnnoMode('pen')" class="text-cyan-400 p-1.5 rounded hover:bg-slate-700 transition" title="Pen"><i class="fa-solid fa-pen"></i></button>
        <button id="anno-eraser" onclick="setAnnoMode('eraser')" class="text-slate-400 p-1.5 rounded hover:bg-slate-700 transition" title="Eraser"><i class="fa-solid fa-eraser"></i></button>
        <button onclick="clearAnnotations()" class="text-red-400 p-1.5 rounded hover:bg-slate-700 transition" title="Clear All"><i class="fa-solid fa-trash-can"></i></button>
      </div>

      <!-- Annotation Toggle Button -->
      <button id="btn-anno-toggle" onclick="toggleAnnotationMode()" class="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 flex items-center justify-center border border-slate-700 transition" title="Toggle Annotation">
        <i class="fa-solid fa-pen-nib"></i>
      </button>

      <!-- Language Selector -->
      <div class="relative">
        <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-slate-900 border border-slate-700 text-cyan-400 text-sm rounded-lg focus:ring-cyan-500 focus:border-cyan-500 px-3 py-2 cursor-pointer font-bold outline-none">

      <!-- Fullscreen Button -->

        <i class="fa-solid fa-expand" id="fs-icon"></i>
      </button>
    </div>
  </header>

  <!-- ===================== SIMULATION ===================== -->
  <main id="view-sim" class="view flex-1 flex flex-col xl:flex-row gap-3 p-3 min-h-0 overflow-hidden">

    <!-- LEFT CONTROLS -->
    <aside class="xl:w-72 shrink-0 flex flex-col gap-3 overflow-y-auto min-h-0 order-2 xl:order-1">
      <div class="glass-card rounded-2xl p-4 space-y-3">
        <div class="text-xs uppercase tracking-widest text-cyan-300/80 font-bold flex items-center gap-2">
          <i class="fa-solid fa-sliders"></i><span data-i18n="ctrl_title"></span>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <button id="btn-start" onclick="startSim()" class="ctrl-btn rounded-xl px-2 py-3 text-xs font-bold text-slate-200 flex flex-col items-center gap-1">
            <i class="fa-solid fa-play text-green-400"></i><span data-i18n="btn_start"></span>
          </button>
          <button id="btn-pause" onclick="pauseSim()" class="ctrl-btn rounded-xl px-2 py-3 text-xs font-bold text-slate-200 flex flex-col items-center gap-1">
            <i class="fa-solid fa-pause text-amber-400"></i><span data-i18n="btn_pause"></span>
          </button>
          <button onclick="resetSim()" class="ctrl-btn rounded-xl px-2 py-3 text-xs font-bold text-slate-200 flex flex-col items-center gap-1">
            <i class="fa-solid fa-rotate-left text-cyan-400"></i><span data-i18n="btn_reset"></span>
          </button>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button id="btn-apply" onclick="applyForce()" class="ctrl-btn rounded-xl px-3 py-3 text-xs font-bold text-slate-200 flex items-center justify-center gap-2">
            <i class="fa-solid fa-bolt text-yellow-400"></i><span data-i18n="btn_apply"></span>
          </button>
          <button id="btn-remove" onclick="removeForce()" class="ctrl-btn rounded-xl px-3 py-3 text-xs font-bold text-slate-200 flex items-center justify-center gap-2">
            <i class="fa-solid fa-ban text-red-400"></i><span data-i18n="btn_remove"></span>
          </button>
          <button onclick="reverseForce()" class="ctrl-btn rounded-xl px-3 py-3 text-xs font-bold text-slate-200 flex items-center justify-center gap-2">
            <i class="fa-solid fa-arrows-left-right text-cyan-400"></i><span data-i18n="btn_reverse"></span>
          </button>
          <button id="btn-auto" onclick="runAutoExperiment()" class="ctrl-btn rounded-xl px-3 py-3 text-xs font-bold text-slate-200 flex items-center justify-center gap-2">
            <i class="fa-solid fa-wand-magic-sparkles text-fuchsia-400"></i><span data-i18n="btn_auto"></span>
          </button>
        </div>
      </div>

      <div class="glass-card rounded-2xl p-4 space-y-4">
        <div>
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs text-slate-400 font-bold" data-i18n="lbl_force"></span>
            <span class="stat-val text-sm num" id="val-force">10 N</span>
          </div>
          <input id="slider-force" type="range" min="0" max="50" value="10" step="1" oninput="onForceSlider(this.value)">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button id="btn-dir-left" onclick="setForceDir(-1)" class="ctrl-btn rounded-xl px-3 py-2.5 text-xs font-bold text-slate-200">
            <i class="fa-solid fa-arrow-left"></i> <span data-i18n="btn_left"></span>
          </button>
          <button id="btn-dir-right" onclick="setForceDir(1)" class="ctrl-btn active rounded-xl px-3 py-2.5 text-xs font-bold text-slate-200">
            <span data-i18n="btn_right"></span> <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
        <div>
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs text-slate-400 font-bold" data-i18n="lbl_mass"></span>
            <span class="stat-val text-sm num" id="val-mass">2 kg</span>
          </div>
          <input id="slider-mass" type="range" min="1" max="10" value="2" step="0.5" oninput="onMassSlider(this.value)">
        </div>
        <div>
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs text-slate-400 font-bold" data-i18n="lbl_friction"></span>
            <span class="stat-val text-sm num" id="val-friction">0%</span>
          </div>
          <input id="slider-friction" type="range" min="0" max="100" value="0" step="5" oninput="onFrictionSlider(this.value)">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button id="btn-smooth" onclick="setSurface('smooth')" class="ctrl-btn active rounded-xl px-3 py-2.5 text-xs font-bold text-slate-200">
            <i class="fa-solid fa-ice-cream"></i> <span data-i18n="btn_smooth"></span>
          </button>
          <button id="btn-rough" onclick="setSurface('rough')" class="ctrl-btn rounded-xl px-3 py-2.5 text-xs font-bold text-slate-200">

          </button>
        </div>
        <button id="btn-space" onclick="toggleSpaceMode()" class="ctrl-btn w-full rounded-xl px-3 py-3 text-xs font-bold text-slate-200 flex items-center justify-center gap-2">
          <i class="fa-solid fa-rocket text-indigo-300"></i><span data-i18n="btn_space"></span>

          </button>
          <button id="btn-show-v" onclick="toggleVec('showVel')" class="ctrl-btn active rounded-xl px-2 py-2.5 text-xs font-bold text-slate-200">

let fCanvas;
let isAnnoActive = false;

function initAnnotationCanvas(w, h) {
  fCanvas = new fabric.Canvas('fabricLayer', {
    isDrawingMode: false,
    width: w,
    height: h
  });
  fCanvas.freeDrawingBrush.color = document.getElementById('anno-color').value;
  fCanvas.freeDrawingBrush.width = 4;

  fCanvas.on('mouse:down', function(options) {
    if(isAnnoActive && !fCanvas.isDrawingMode && options.target) {
      fCanvas.remove(options.target);
    }
  });

  const fabricContainer = document.querySelector('.canvas-container');
  if (fabricContainer) fabricContainer.style.pointerEvents = 'none';
}

function toggleAnnotationMode() {
  isAnnoActive = !isAnnoActive;
  const btn = document.getElementById('btn-anno-toggle');
  const toolbar = document.getElementById('anno-toolbar');
  const fabricContainer = document.querySelector('.canvas-container');

  if (isAnnoActive) {
    btn.classList.replace('text-slate-400', 'text-cyan-400');
    toolbar.classList.remove('max-w-0', 'opacity-0');
    toolbar.classList.add('max-w-xs', 'opacity-100');
    if(fabricContainer) fabricContainer.style.pointerEvents = 'auto';
    setAnnoMode('pen');
  } else {
    btn.classList.replace('text-cyan-400', 'text-slate-400');
    toolbar.classList.remove('max-w-xs', 'opacity-100');
    toolbar.classList.add('max-w-0', 'opacity-0');
    if(fabricContainer) fabricContainer.style.pointerEvents = 'none';
    if (fCanvas) fCanvas.isDrawingMode = false;
  }
}

function setAnnoMode(mode) {
  document.getElementById('anno-pen').classList.replace('text-cyan-400', 'text-slate-400');
  document.getElementById('anno-eraser').classList.replace('text-cyan-400', 'text-slate-400');

  if (mode === 'pen') {
    document.getElementById('anno-pen').classList.replace('text-slate-400', 'text-cyan-400');
    if(fCanvas) fCanvas.isDrawingMode = true;
  } else {
    document.getElementById('anno-eraser').classList.replace('text-slate-400', 'text-cyan-400');
    if(fCanvas) fCanvas.isDrawingMode = false;
  }
}

function changeAnnoColor(color) {
  if(fCanvas) fCanvas.freeDrawingBrush.color = color;
  setAnnoMode('pen');
}

function clearAnnotations() {
  if(fCanvas) fCanvas.clear();
}

  document.getElementById('intro-topic').textContent = T('intro_topic');
  document.getElementById('intro-loading').textContent = T('intro_loading');
  renderPredictOptions();
  updateReadouts();
  updateLawStatus();
  renderQuiz();
}

function changeLanguage(l) {
  if (l !== 'en' && l !== 'ur') return;
  cur = l;
  localStorage.setItem('iqra_n1_lang', l);
  document.documentElement.setAttribute('dir', l === 'ur' ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', l);
  document.getElementById('lang-select').value = l;
  applyI18n();
}

  } else {

    if (icon) icon.className = 'fa-solid fa-expand';
  }
}
document.addEventListener('fullscreenchange', () => {
  const icon = document.getElementById('fs-icon');
  if (icon) icon.className = document.fullscreenElement ? 'fa-solid fa-compress' : 'fa-solid fa-expand';
});

function switchTab(t) {
  document.getElementById('view-sim').classList.toggle('hidden', t !== 'sim');
  document.getElementById('view-quiz').classList.toggle('hidden', t !== 'quiz');
  document.getElementById('tab-sim').classList.toggle('active', t === 'sim');
  document.getElementById('tab-quiz').classList.toggle('active', t === 'quiz');
  if (t === 'sim') { fitCanvas(); }
}

/* ============================================================
   CONTROLS
============================================================ */
function onForceSlider(v) {
  state.forceMag = +v;
  if (state.forceOn) state.appliedF = state.forceMag * state.forceDir;
  updateReadouts();
}
function onMassSlider(v) {
  state.mass = +v;
  updateReadouts();
}
function onFrictionSlider(v) {
  state.frictionPct = +v;
  if (state.frictionPct > 0 && state.surface === 'smooth' && !state.spaceMode) setSurface('rough', true);
  updateReadouts();
}
function setForceDir(d) {
  state.forceDir = d;
  if (state.forceOn) state.appliedF = state.forceMag * state.forceDir;
  document.getElementById('btn-dir-left').classList.toggle('active', d < 0);
  document.getElementById('btn-dir-right').classList.toggle('active', d > 0);
  updateReadouts();
}
function applyForce() {
  state.forceOn = true;
  state.appliedF = state.forceMag * state.forceDir;
  document.getElementById('btn-apply').classList.add('on-green');
  document.getElementById('btn-remove').classList.remove('on-green');
  if (!state.running) startSim();
  updateReadouts();
}
function removeForce() {
  state.forceOn = false;
  state.appliedF = 0;
  document.getElementById('btn-apply').classList.remove('on-green');
  document.getElementById('btn-remove').classList.add('on-green');
  setTimeout(() => document.getElementById('btn-remove').classList.remove('on-green'), 600);
  if (Math.abs(state.frictionF) < 0.05 && Math.abs(state.v) > 0.05) {
    showDiscovery('msg_uniform');
  }
  updateReadouts();
}
function reverseForce() {
  setForceDir(-state.forceDir);
  if (state.forceOn) applyForce();
}
function setSurface(s, fromSlider) {
  state.surface = s;
  state.spaceMode = false;
  document.getElementById('btn-space').classList.remove('active');
  document.getElementById('btn-smooth').classList.toggle('active', s === 'smooth');
  document.getElementById('btn-rough').classList.toggle('active', s === 'rough');
  if (!fromSlider) {
    if (s === 'smooth') {
      state.frictionPct = 0;
      document.getElementById('slider-friction').value = 0;
    } else if (state.frictionPct === 0) {
      state.frictionPct = 40;
      document.getElementById('slider-friction').value = 40;
    }
  }
  updateReadouts();
}
function toggleSpaceMode() {
  state.spaceMode = !state.spaceMode;
  document.getElementById('btn-space').classList.toggle('active', state.spaceMode);
  if (state.spaceMode) {
    state.frictionPct = 0;
    document.getElementById('slider-friction').value = 0;
    document.getElementById('btn-smooth').classList.remove('active');
    document.getElementById('btn-rough').classList.remove('active');
    showDiscovery('msg_space');
  } else {
    setSurface('smooth');
  }
  updateReadouts();
}
function toggleVec(key) {
  state[key] = !state[key];
  const map = { showForces:'btn-show-f', showVel:'btn-show-v', showAcc:'btn-show-a', showGraph:'btn-show-g' };
  document.getElementById(map[key]).classList.toggle('active', state[key]);
  document.getElementById('graph-panel').classList.toggle('hidden', !state.showGraph);
}

function startSim() {
  state.running = true;
  document.getElementById('btn-start').classList.add('on-green');
  document.getElementById('btn-pause').classList.remove('on-amber');
}
function pauseSim() {
  state.running = false;
  document.getElementById('btn-start').classList.remove('on-green');
  document.getElementById('btn-pause').classList.add('on-amber');
}
function resetSim() {
  if (state.autoTimer) { clearTimeout(state.autoTimer); state.autoTimer = null; }
  state.running = false;
  state.x = 0; state.v = 0; state.a = 0;
  state.forceOn = false; state.appliedF = 0;
  state.frictionF = 0; state.netF = 0;
  state.trail = []; state.graphHist = [];
  state.messageKey = null;
  document.getElementById('btn-start').classList.remove('on-green');
  document.getElementById('btn-pause').classList.remove('on-amber');
  document.getElementById('btn-apply').classList.remove('on-green');
  document.getElementById('discovery-banner').classList.add('hidden');
  updateReadouts();
}

function showDiscovery(key) {
  state.messageKey = key;
  const banner = document.getElementById('discovery-banner');
  const text = document.getElementById('discovery-text');
  text.textContent = T(key);
  banner.classList.remove('hidden');
  const tip = document.getElementById('concept-tip');
  tip.textContent = T(key);
}

/* ============================================================
   EXPERIMENTS
============================================================ */
function loadExperiment(n) {
  resetSim();
  state.spaceMode = false;
  document.getElementById('btn-space').classList.remove('active');

  if (n === 1) {
    state.mass = 2; state.forceMag = 0; state.forceOn = false; state.appliedF = 0;
    setSurface('smooth'); setForceDir(1);
    document.getElementById('slider-force').value = 0;
    document.getElementById('slider-mass').value = 2;
    showDiscovery('msg_rest');
    startSim();
  } else if (n === 2) {
    state.mass = 2; state.forceMag = 10;
    setSurface('smooth'); setForceDir(1);
    document.getElementById('slider-force').value = 10;
    document.getElementById('slider-mass').value = 2;
    applyForce();
    showDiscovery('msg_accel');
  } else if (n === 3) {
    state.mass = 2; state.forceMag = 15; state.v = 0;
    setSurface('smooth'); setForceDir(1);
    document.getElementById('slider-force').value = 15;
    document.getElementById('slider-mass').value = 2;
    applyForce();
    state.autoTimer = setTimeout(() => {
      removeForce();
      showDiscovery('msg_uniform');
    }, 2200);
  } else if (n === 4) {
    state.mass = 2; state.forceMag = 20; state.v = 8;
    setSurface('rough');
    state.frictionPct = 55;
    document.getElementById('slider-friction').value = 55;
    document.getElementById('slider-force').value = 20;
    document.getElementById('slider-mass').value = 2;
    removeForce();
    startSim();
    showDiscovery('msg_friction');
  } else if (n === 5) {
    toggleSpaceMode();
    state.mass = 3; state.forceMag = 12; state.v = 0;
    document.getElementById('slider-force').value = 12;
    document.getElementById('slider-mass').value = 3;
    applyForce();
    state.autoTimer = setTimeout(() => {
      removeForce();
      showDiscovery('msg_space');
    }, 1800);
  }
  updateReadouts();
}

function runAutoExperiment() {
  loadExperiment(3);
}

function runBreakChallenge() {
  resetSim();
  setSurface('smooth');
  state.forceMag = 0;
  document.getElementById('slider-force').value = 0;
  showDiscovery('msg_break');
  startSim();
  state.autoTimer = setTimeout(() => showDiscovery('msg_break_fail'), 5000);
}

function runPredictTest() {

/* ============================================================
   PHYSICS
============================================================ */
function computeForces() {
  const applied = state.forceOn ? state.forceMag * state.forceDir : 0;
  let fric = 0;
  const mu = state.spaceMode ? 0 : (state.frictionPct / 100) * WORLD.muMax;
  const maxStatic = mu * state.mass * WORLD.g;

  if (Math.abs(state.v) > 0.02) {
    fric = -Math.sign(state.v) * maxStatic;
  } else {
    if (Math.abs(applied) <= maxStatic + 1e-6) {
      fric = -applied;
      state.v = 0;
    } else {
      fric = -Math.sign(applied || 1) * maxStatic;
    }
  }

  state.appliedF = applied;
  state.frictionF = fric;
  state.netF = applied + fric;
  state.a = state.netF / state.mass;
}

function stepPhysics(dt) {
  if (!state.running) return;
  computeForces();
  state.v += state.a * dt;
  if (Math.abs(state.v) < 0.015 && Math.abs(state.netF) < 0.05) state.v = 0;
  state.x += state.v * dt;

  if (state.x > WORLD.trackHalf - 1) state.x = -WORLD.trackHalf + 1;
  if (state.x < -WORLD.trackHalf + 1) state.x = WORLD.trackHalf - 1;

  state.trail.push({ x: state.x, t: performance.now() });
  if (state.trail.length > 80) state.trail.shift();

  state.graphHist.push({ v: state.v, a: state.a, f: state.netF });
  if (state.graphHist.length > 120) state.graphHist.shift();

  updateLawStatus();
}

function updateLawStatus() {
  const el = document.getElementById('law-status');
  if (!el) return;
  if (Math.abs(state.netF) < 0.08) {
    if (Math.abs(state.v) < 0.05) {
      el.textContent = T('law_rest');
      el.className = 'glass-panel rounded-xl px-3 py-3 text-xs leading-relaxed text-center text-slate-300';
    } else {
      el.textContent = T('law_uniform');
      el.className = 'glass-panel rounded-xl px-3 py-3 text-xs leading-relaxed text-center text-cyan-200 glow-cyan';
    }
  } else {
    el.textContent = T('law_changing');
    el.className = 'glass-panel rounded-xl px-3 py-3 text-xs leading-relaxed text-center text-amber-200';
  }
}

function updateReadouts() {
  document.getElementById('val-force').textContent = state.forceMag.toFixed(0) + ' N';
  document.getElementById('val-mass').textContent = state.mass.toFixed(1) + ' kg';
  document.getElementById('val-friction').textContent = state.frictionPct.toFixed(0) + '%';
  document.getElementById('d-mass').textContent = state.mass.toFixed(1) + ' kg';
  document.getElementById('d-applied').textContent = state.appliedF.toFixed(1) + ' N';
  document.getElementById('d-fric').textContent = state.frictionF.toFixed(1) + ' N';
  document.getElementById('d-net').textContent = state.netF.toFixed(1) + ' N';
  document.getElementById('d-vel').textContent = state.v.toFixed(2) + ' m/s';
  document.getElementById('d-acc').textContent = state.a.toFixed(2) + ' m/s²';
  if (Math.abs(state.v) < 0.05) document.getElementById('d-dir').textContent = T('dir_none');
  else document.getElementById('d-dir').textContent = state.v > 0 ? T('dir_right') : T('dir_left');
  if (state.messageKey) {
    document.getElementById('discovery-text').textContent = T(state.messageKey);
  }
}

/* ============================================================
   ZOOM / PAN
============================================================ */
function S() { return baseScale * state.zoom; }
function X(wx) { return W/2 + wx * S() + state.panX; }
function Y(wy) { return H * 0.58 - wy * S() + state.panY; }

function zoomBy(k, cx, cy) {
  cx = cx ?? W/2; cy = cy ?? H/2;
  const old = state.zoom;
  state.zoom = Math.min(3.5, Math.max(0.45, state.zoom * k));
  const r = state.zoom / old;
  state.panX = (state.panX + W/2 - cx) * r + cx - W/2;
  state.panY = (state.panY + H/2 - cy) * r + cy - H/2;
}
function resetView() {
  state.zoom = 1; state.panX = 0; state.panY = 0;
  fitBestZoom();
}
function fitBestZoom() {
  const need = (WORLD.trackHalf * 2 + 4) * baseScale;
  const z = Math.min(1.2, Math.max(0.55, (W - 40) / need));
  state.zoom = z;
  state.panX = 0; state.panY = 0;
}

/* ============================================================
   DRAWING
============================================================ */
function drawArrow(x1, y1, x2, y2, color, label) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy);
  if (len < 4) return;
  const ang = Math.atan2(dy, dx);
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - 12*Math.cos(ang-0.4), y2 - 12*Math.sin(ang-0.4));
  ctx.lineTo(x2 - 12*Math.cos(ang+0.4), y2 - 12*Math.sin(ang+0.4));
  ctx.closePath(); ctx.fill();
  if (label) {
    ctx.font = `600 12px Manrope,sans-serif`;
    ctx.fillText(label, (x1+x2)/2, (y1+y2)/2 - 10);
  }
  ctx.restore();
}

function drawBackground() {
  if (state.spaceMode) {
    const g = ctx.createRadialGradient(W/2, H/2, 40, W/2, H/2, Math.max(W,H));
    g.addColorStop(0, '#0b1228'); g.addColorStop(1, '#020617');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#e2e8f0';
    for (let i=0;i<70;i++) {
      const sx = ((i*97 + 13) % W);
      const sy = ((i*53 + 29) % (H*0.7));
      ctx.globalAlpha = 0.35 + (i%5)*0.12;
      ctx.beginPath(); ctx.arc(sx, sy, (i%3)*0.6+0.6, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  } else {
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, '#0b1730'); g.addColorStop(1, '#0f172a');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  }
}

function drawTrack() {
  const y = Y(0);
  const x0 = X(-WORLD.trackHalf), x1 = X(WORLD.trackHalf);

  ctx.fillStyle = state.spaceMode ? 'rgba(99,102,241,0.12)' :
    (state.surface === 'rough' ? 'rgba(120,53,15,0.45)' : 'rgba(56,189,248,0.12)');
  ctx.fillRect(x0, y - 6, x1-x0, 28);

  ctx.strokeStyle = state.spaceMode ? 'rgba(165,180,252,0.5)' :
    (state.surface === 'rough' ? 'rgba(251,146,60,0.7)' : 'rgba(34,211,238,0.55)');
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();

  if (state.surface === 'rough' && !state.spaceMode) {
    ctx.strokeStyle = 'rgba(180,83,9,0.55)';
    ctx.lineWidth = 1.5;
    for (let i = -WORLD.trackHalf; i < WORLD.trackHalf; i += 0.7) {
      const px = X(i);
      ctx.beginPath(); ctx.moveTo(px, y+2); ctx.lineTo(px+4, y+10); ctx.stroke();
    }
  }

  // ticks
  ctx.fillStyle = 'rgba(148,163,184,0.5)';
  ctx.font = '11px Oxanium,monospace';
  for (let i = -15; i <= 15; i += 5) {
    const px = X(i);
    ctx.beginPath(); ctx.moveTo(px, y); ctx.lineTo(px, y+8); ctx.stroke();
    ctx.fillText(i+' m', px-10, y+22);
  }
}

function drawPuck() {
  const px = X(state.x), py = Y(WORLD.puckR);
  const r = WORLD.puckR * S();

  // trail
  if (state.trail.length > 1) {
    ctx.strokeStyle = 'rgba(0,243,255,0.25)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    state.trail.forEach((p,i) => {
      const tx = X(p.x), ty = Y(WORLD.puckR*0.2);
      if (i===0) ctx.moveTo(tx,ty); else ctx.lineTo(tx,ty);
    });
    ctx.stroke();
  }

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(px, Y(0)+4, r*1.1, r*0.28, 0, 0, Math.PI*2); ctx.fill();

  const grad = ctx.createRadialGradient(px-r*0.3, py-r*0.4, r*0.1, px, py, r);
  grad.addColorStop(0, '#67e8f9');
  grad.addColorStop(0.55, '#0891b2');
  grad.addColorStop(1, '#155e75');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(165,243,252,0.8)';
  ctx.lineWidth = 2; ctx.stroke();

  ctx.fillStyle = '#ecfeff';
  ctx.font = `700 ${Math.max(11, r*0.45)}px Oxanium,monospace`;
  ctx.textAlign = 'center';
  ctx.fillText(state.mass.toFixed(1)+' kg', px, py+4);
  ctx.textAlign = 'start';

  // vectors
  if (state.showForces) {
    const scale = 3.2;
    if (Math.abs(state.appliedF) > 0.05) {
      const len = Math.min(140, Math.abs(state.appliedF) * scale);
      const dir = Math.sign(state.appliedF);
      drawArrow(px, py - r - 8, px + dir*len, py - r - 8, '#fbbf24', Math.abs(state.appliedF).toFixed(0)+' N');
    }
    if (Math.abs(state.frictionF) > 0.05) {
      const len = Math.min(120, Math.abs(state.frictionF) * scale);
      const dir = Math.sign(state.frictionF);
      drawArrow(px, py + 4, px + dir*len, py + 4, '#f87171', '|f| '+Math.abs(state.frictionF).toFixed(1)+' N');
    }
    // weight & normal (decorative when showForces)
    drawArrow(px, py, px, py + Math.min(50, state.mass*6), '#94a3b8', 'mg');
    drawArrow(px, py, px, py - Math.min(50, state.mass*6), '#a5b4fc', 'N');
  }
  if (state.showVel && Math.abs(state.v) > 0.05) {
    const len = Math.min(130, Math.abs(state.v) * 12);
    drawArrow(px, py - r - 28, px + Math.sign(state.v)*len, py - r - 28, '#22d3ee', '|v| '+Math.abs(state.v).toFixed(1));
  }
  if (state.showAcc && Math.abs(state.a) > 0.05) {
    const len = Math.min(100, Math.abs(state.a) * 10);
    drawArrow(px, py + r + 18, px + Math.sign(state.a)*len, py + r + 18, '#c084fc', '|a| '+Math.abs(state.a).toFixed(1));
  }
}

function drawGraph() {
  if (!state.showGraph || !gctx) return;
  const gw = gCanvas.width, gh = gCanvas.height;
  gctx.clearRect(0,0,gw,gh);
  gctx.fillStyle = 'rgba(15,23,42,0.3)';
  gctx.fillRect(0,0,gw,gh);
  gctx.strokeStyle = 'rgba(148,163,184,0.3)';
  gctx.beginPath(); gctx.moveTo(0, gh/2); gctx.lineTo(gw, gh/2); gctx.stroke();
  if (state.graphHist.length < 2) return;
  gctx.strokeStyle = '#22d3ee'; gctx.lineWidth = 2;
  gctx.beginPath();
  state.graphHist.forEach((p,i) => {
    const x = (i/(state.graphHist.length-1)) * (gw-8) + 4;
    const y = gh/2 - p.v * 4;
    if (i===0) gctx.moveTo(x,y); else gctx.lineTo(x,y);
  });
  gctx.stroke();
  gctx.fillStyle = '#67e8f9';
  gctx.font = '10px Oxanium,monospace';
  gctx.fillText('v–t', 8, 14);
}

function draw() {
  drawBackground();
  drawTrack();
  drawPuck();
  drawGraph();
}

function loop(ts) {
  const dt = Math.min(0.033, (ts - lastTs) / 1000 || 0.016);
  lastTs = ts;
  stepPhysics(dt);
  updateReadouts();
  draw();
  requestAnimationFrame(loop);
}

/* ============================================================
   CANVAS FIT & INPUT
============================================================ */
function fitCanvas() {
  const wrap = document.getElementById('sim-viewport');
  if (!wrap) return;
  const rect = wrap.getBoundingClientRect();
  W = Math.max(320, Math.floor(rect.width));
  H = Math.max(240, Math.floor(rect.height));
  canvas.width = W; canvas.height = H;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  if (fCanvas) {
    fCanvas.setWidth(W);
    fCanvas.setHeight(H);
    fCanvas.calcOffset();
  }
  fitBestZoom();
}

function ptr(e) {
  const r = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}

function onDown(e) {
  if (isAnnoActive) return;
  e.preventDefault();
  if (e.touches && e.touches.length === 2) {
    const r = canvas.getBoundingClientRect();
    const a = {x:e.touches[0].clientX-r.left, y:e.touches[0].clientY-r.top};
    const b = {x:e.touches[1].clientX-r.left, y:e.touches[1].clientY-r.top};
    pinch = { d: Math.hypot(a.x-b.x, a.y-b.y), z: state.zoom };
    dragging = null;
    return;
  }
  dragging = 'pan';
  lastP = ptr(e);
  canvas.style.cursor = 'grabbing';
}
function onMove(e) {
  if (isAnnoActive) return;
  if (e.touches && e.touches.length === 2 && pinch) {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    const a = {x:e.touches[0].clientX-r.left, y:e.touches[0].clientY-r.top};
    const b = {x:e.touches[1].clientX-r.left, y:e.touches[1].clientY-r.top};
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    const target = pinch.z * (d / pinch.d);
    zoomBy(target / state.zoom, (a.x+b.x)/2, (a.y+b.y)/2);
    return;
  }
  if (dragging === 'pan' && lastP) {
    e.preventDefault();
    const p = ptr(e);
    state.panX += p.x - lastP.x;
    state.panY += p.y - lastP.y;
    lastP = p;
  }
}
function onUp() {
  dragging = null; lastP = null; pinch = null;
  canvas.style.cursor = 'grab';
}

/* ============================================================
   QUIZ
============================================================ */
const quiz = { i: 0, score: 0, answered: false, picked: null, done: false };

function renderQuiz() {
  const body = document.getElementById('quiz-body');
  if (!body) return;
  const Q = LANG[cur].quiz;

  if (quiz.done) {
    const pct = Math.round((quiz.score/5)*100);
    let msg = T('score_msg_low');
    if (pct >= 80) msg = T('score_msg_great');
    else if (pct >= 60) msg = T('score_msg_good');
    document.getElementById('quiz-progress').textContent = '';
    body.innerHTML = `
      <div class="text-center space-y-6 py-6">
        <div class="text-slate-400" data-i18n="final_score">${T('final_score')}</div>
        <div class="flex flex-col items-center gap-1">
          <span class="num text-5xl font-extrabold text-cyan-300">${quiz.score}/5</span>
          <span class="num text-lg text-slate-400">${pct}%</span>
        </div>
        <p class="text-slate-300">${msg}</p>
        <button onclick="restartQuiz()" class="ctrl-btn active rounded-2xl px-8 py-4 font-bold text-cyan-300">
          <i class="fa-solid fa-rotate-right me-2"></i>${T('restart')}
        </button>
      </div>`;
    return;
  }

  const q = Q[quiz.i];
  document.getElementById('quiz-progress').textContent = T('quiz_progress')(quiz.i+1, 5);
  const opts = q.opts.map((o, oi) => {
    let cls = 'opt-btn w-full text-start px-5 py-4 rounded-xl glass-panel text-sm md:text-base font-bold text-slate-200 flex items-center gap-3';
    if (quiz.answered) {
      cls += ' locked';
      if (oi === q.a) cls += ' correct';
      else if (oi === quiz.picked) cls += ' wrong';
    }
    return `<button onclick="answerQuiz(${oi})" class="${cls}">
      <span class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-600 flex items-center justify-center text-cyan-400 num shrink-0">${String.fromCharCode(65+oi)}</span>
      <span>${o}</span>
    </button>`;
  }).join('');

  let fb = '';
  if (quiz.answered) {
    const ok = quiz.picked === q.a;
    fb = `<div class="mt-4 glass-panel rounded-xl px-4 py-3 ${ok?'text-green-300 glow-green':'text-red-300 glow-red'}">
      <div class="font-bold mb-1">${ok ? T('correct_fb') : T('wrong_fb')}</div>
      <div class="text-sm text-slate-300">${q.ex}</div>
    </div>
    <button onclick="nextQuiz()" class="mt-4 ctrl-btn active rounded-xl px-6 py-3 font-bold text-cyan-300">
      ${quiz.i >= 4 ? T('see_result') : T('next_q')} <i class="fa-solid fa-arrow-right ms-2"></i>
    </button>`;
  }

  body.innerHTML = `
    <h3 class="text-lg md:text-xl font-bold text-white mb-4 leading-relaxed">${q.q}</h3>
    <div class="space-y-3">${opts}</div>
    ${fb}`;
}

function answerQuiz(oi) {
  if (quiz.answered) return;
  quiz.answered = true;
  quiz.picked = oi;
  if (oi === LANG[cur].quiz[quiz.i].a) quiz.score++;
  renderQuiz();
}
function nextQuiz() {
  if (quiz.i >= 4) { quiz.done = true; renderQuiz(); return; }
  quiz.i++; quiz.answered = false; quiz.picked = null;
  renderQuiz();
}
function restartQuiz() {
  quiz.i = 0; quiz.score = 0; quiz.answered = false; quiz.picked = null; quiz.done = false;
  renderQuiz();
}

/* ============================================================
   BOOT
============================================================ */
function boot() {
  canvas = document.getElementById('sim-canvas');
  ctx = canvas.getContext('2d');
  gCanvas = document.getElementById('graph-canvas');
  gctx = gCanvas.getContext('2d');

  changeLanguage(cur);

  fitCanvas();
  initAnnotationCanvas(W, H);

  canvas.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, {passive:false});
  canvas.addEventListener('touchmove', onMove, {passive:false});
  canvas.addEventListener('touchend', onUp);
  canvas.addEventListener('wheel', e => {
    if (isAnnoActive) return;
    e.preventDefault();
    zoomBy(e.deltaY < 0 ? 1.1 : 1/1.1, e.offsetX, e.offsetY);
  }, {passive:false});

  window.addEventListener('resize', () => { fitCanvas(); });

  computeForces();
  updateReadouts();
  renderPredictOptions();
  requestAnimationFrame(loop);

  // Intro ~5s
  setTimeout(() => {
    const intro = document.getElementById('intro');
    intro.style.opacity = '0';
    document.getElementById('app').style.opacity = '1';
    setTimeout(() => {
      intro.remove();
      fitCanvas();
    }, 700);
  }, 5000);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
</body>
