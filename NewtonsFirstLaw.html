/* ============================================================
   CONTROLS
============================================================ */
function pA() { return state.A.m * state.A.v0; }
function pB() { return state.B.m * state.B.v0; }

function clampVel(v) { return Math.min(20, Math.max(1, Math.round(v*2)/2)); }

function syncSameP(from) {
  if (!state.sameP) return;
  state.targetP = from === 'A' ? pA() : pB();
  if (from === 'A') {
    state.B.v0 = clampVel(state.targetP / state.B.m);
    document.getElementById('slider-vb').value = state.B.v0;
  } else if (from === 'B') {
    state.A.v0 = clampVel(state.targetP / state.A.m);
    document.getElementById('slider-va').value = state.A.v0;
  } else {
    state.A.v0 = clampVel(state.targetP / state.A.m);
    state.B.v0 = clampVel(state.targetP / state.B.m);
    document.getElementById('slider-va').value = state.A.v0;
    document.getElementById('slider-vb').value = state.B.v0;
  }
}

function onMassA(v) {
  state.A.m = +v;
  state.A.r = 0.35 + state.A.m * 0.08;
  if (state.sameP) syncSameP('A');
  updateReadouts();
}
function onMassB(v) {
  state.B.m = +v;
  state.B.r = 0.35 + state.B.m * 0.08;
  if (state.sameP) syncSameP('B');
  updateReadouts();
}
function onVelA(v) {
  state.A.v0 = +v;
  if (state.sameP) {
    state.targetP = pA();
    state.B.v0 = clampVel(state.targetP / state.B.m);
    document.getElementById('slider-vb').value = state.B.v0;
  }
  updateReadouts();
}
function onVelB(v) {
  state.B.v0 = +v;
  if (state.sameP) {
    state.targetP = pB();
    state.A.v0 = clampVel(state.targetP / state.A.m);
    document.getElementById('slider-va').value = state.A.v0;
  }
  updateReadouts();
}

function toggleSameMomentum() {
  state.sameP = !state.sameP;
  document.getElementById('btn-same-p').classList.toggle('active', state.sameP);
  if (state.sameP) {
    state.targetP = pA();
    syncSameP('A');
  }
  updateReadouts();
}

function updateReadouts() {
  const pa = pA(), pb = pB();
  document.getElementById('val-ma').textContent = state.A.m.toFixed(1) + ' kg';
  document.getElementById('val-mb').textContent = state.B.m.toFixed(1) + ' kg';
  document.getElementById('val-va').textContent = state.A.v0.toFixed(1) + ' m/s';
  document.getElementById('val-vb').textContent = state.B.v0.toFixed(1) + ' m/s';
  document.getElementById('pa-val').textContent = 'p = ' + pa.toFixed(1);
  document.getElementById('pb-val').textContent = 'p = ' + pb.toFixed(1);
  document.getElementById('eq-a').textContent = `p = ${state.A.m.toFixed(1)} × ${state.A.v0.toFixed(1)} = ${pa.toFixed(1)}`;
  document.getElementById('eq-b').textContent = `p = ${state.B.m.toFixed(1)} × ${state.B.v0.toFixed(1)} = ${pb.toFixed(1)}`;
  const maxP = Math.max(40, pa, pb);
  document.getElementById('bar-pa').style.width = Math.min(100, (pa/maxP)*100) + '%';
  document.getElementById('bar-pb').style.width = Math.min(100, (pb/maxP)*100) + '%';

  const msg = document.getElementById('compare-msg');
  const diff = Math.abs(pa - pb);
  if (diff < 0.6) {
    msg.textContent = T('msg_same');
    msg.className = 'glass-panel rounded-2xl px-4 py-3 text-sm text-center text-cyan-200 leading-relaxed glow-cyan';
  } else {
    msg.textContent = T('msg_diff');
    msg.className = 'glass-panel rounded-2xl px-4 py-3 text-sm text-center text-amber-200 leading-relaxed';
  }

  if (state.resultKey) {
    document.getElementById('impact-text').textContent = T(state.resultKey);

}

function launchBoth() {
  resetPositions(false);
  state.A.v = state.A.v0;
  state.B.v = state.B.v0;
  state.running = true;
  state.resultKey = null;
  document.getElementById('impact-banner').classList.add('hidden');
  document.getElementById('btn-launch').classList.add('on-green');
}

function resetPositions(full) {
  state.A.x = -12; state.B.x = -12;
  state.A.v = 0; state.B.v = 0;
  state.A.hit = false; state.B.hit = false;
  state.obsA.x = state.obsA.x0; state.obsA.v = 0;
  state.obsB.x = state.obsB.x0; state.obsB.v = 0;
  state.flash = 0;
  if (full) {
    state.running = false;
    state.resultKey = null;
    document.getElementById('btn-launch').classList.remove('on-green');
    document.getElementById('impact-banner').classList.add('hidden');
  }
}

function resetSim() {
  resetPositions(true);
  updateReadouts();
}

/* ============================================================
   PHYSICS — collide with identical springy obstacles
============================================================ */
function stepPhysics(dt) {
  if (!state.running) return;

  ['A','B'].forEach(key => {
    const obj = state[key];
    const obs = key === 'A' ? state.obsA : state.obsB;
    if (!obj.hit) {
      obj.x += obj.v * dt;
      const contact = obs.x - obj.r - 0.55;
      if (obj.x >= contact) {
        obj.x = contact;
        // momentum transfer to obstacle (visual): impulse ~ p
        const p = obj.m * obj.v;
        obs.v = p / 6; // identical obstacles (mass ~6 visual units)
        obj.v *= 0.15;
        obj.hit = true;
        state.flash = 1;
      }
    } else {
      obj.x += obj.v * dt;
      obj.v *= Math.pow(0.15, dt);
    }
    obs.x += obs.v * dt;
    obs.v *= Math.pow(0.35, dt); // damping so displacement settles
    if (obs.x < obs.x0) { obs.x = obs.x0; obs.v = 0; }
  });

  if (state.flash > 0) state.flash -= dt * 1.4;

  if (state.A.hit && state.B.hit && Math.abs(state.obsA.v) < 0.05 && Math.abs(state.obsB.v) < 0.05) {
    const da = state.obsA.x - state.obsA.x0;
    const db = state.obsB.x - state.obsB.x0;
    if (Math.abs(da - db) < 0.35) state.resultKey = 'impact_same';
    else if (da > db) state.resultKey = 'impact_a';
    else state.resultKey = 'impact_b';
    document.getElementById('impact-text').textContent = T(state.resultKey);
    document.getElementById('impact-banner').classList.remove('hidden');
    state.running = false;
    document.getElementById('btn-launch').classList.remove('on-green');
  }
}

/* ============================================================
   DRAW / ZOOM
============================================================ */
function S() { return baseScale * state.zoom; }
function X(wx) { return W/2 + wx * S() + state.panX; }
function Y(wy) { return H/2 - wy * S() + state.panY; }

function zoomBy(k, cx, cy) {
  cx = cx ?? W/2; cy = cy ?? H/2;
  const old = state.zoom;
  state.zoom = Math.min(3.2, Math.max(0.5, state.zoom * k));
  const r = state.zoom / old;
  state.panX = (state.panX + W/2 - cx) * r + cx - W/2;
  state.panY = (state.panY + H/2 - cy) * r + cy - H/2;
}
function resetView() {
  state.zoom = 1; state.panX = 0; state.panY = 0;
  fitBestZoom();
}
function fitBestZoom() {
  const need = 28 * baseScale;
  state.zoom = Math.min(1.15, Math.max(0.55, (W - 40) / need));
  state.panX = 0; state.panY = 0;
}

function drawArrow(x1,y1,x2,y2,color,label) {
  const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx,dy);
  if (len < 3) return;
  const ang = Math.atan2(dy,dx);
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-11*Math.cos(ang-0.4), y2-11*Math.sin(ang-0.4));
  ctx.lineTo(x2-11*Math.cos(ang+0.4), y2-11*Math.sin(ang+0.4));
  ctx.closePath(); ctx.fill();
  if (label) {
    ctx.font = '600 12px Oxanium,monospace';
    ctx.fillText(label, (x1+x2)/2 - 10, (y1+y2)/2 - 8);
  }
  ctx.restore();
}

function drawLane(yWorld, obj, obs, labelKey, accent) {
  const y = Y(yWorld);
  const xL = X(-14), xR = X(14);

  // track
  ctx.fillStyle = 'rgba(15,23,42,0.65)';
  ctx.fillRect(xL, y - 28, xR - xL, 56);
  ctx.strokeStyle = accent + '66';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(xL, y+18); ctx.lineTo(xR, y+18); ctx.stroke();

  ctx.fillStyle = accent;
  ctx.font = cur === 'ur'
    ? `600 14px 'Jameel Noori Nastaliq','Noto Nastaliq Urdu',serif`
    : '700 13px Oxanium,sans-serif';
  ctx.fillText(T(labelKey), xL + 8, y - 34);

  // obstacle (spring block)
  const ox = X(obs.x), ow = 0.9 * S(), oh = 1.5 * S();
  // spring coils from rest position
  const restX = X(obs.x0);
  ctx.strokeStyle = 'rgba(148,163,184,0.55)';
  ctx.lineWidth = 2;
  const coils = 6;
  for (let i=0;i<coils;i++) {
    const t0 = i/coils, t1 = (i+1)/coils;
    const xa = restX + (ox - restX - ow/2) * t0;
    const xb = restX + (ox - restX - ow/2) * t1;
    const ya = y + ((i%2)?-10:10);
    const yb = y + (((i+1)%2)?-10:10);
    ctx.beginPath(); ctx.moveTo(xa, ya); ctx.lineTo(xb, yb); ctx.stroke();
  }

  ctx.fillStyle = '#64748b';
  ctx.fillRect(ox - ow/2, y - oh/2, ow, oh);
  ctx.strokeStyle = '#94a3b8';
  ctx.strokeRect(ox - ow/2, y - oh/2, ow, oh);
  ctx.fillStyle = '#e2e8f0';
  ctx.font = cur === 'ur'
    ? `600 12px 'Jameel Noori Nastaliq','Noto Nastaliq Urdu',serif`
    : '600 11px Manrope,sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(T('canvas_obstacle'), ox, y + 4);
  ctx.textAlign = 'start';

  // displacement marker
  const d = obs.x - obs.x0;
  if (d > 0.05) {
    ctx.fillStyle = accent;
    ctx.font = '700 12px Oxanium,monospace';
    ctx.fillText('Δx = ' + d.toFixed(2) + ' m', ox + ow/2 + 8, y - oh/2 - 6);
  }

  // object
  const px = X(obj.x), py = y - 2;
  const r = obj.r * S();
  const g = ctx.createRadialGradient(px - r*0.3, py - r*0.3, r*0.1, px, py, r);
  g.addColorStop(0, '#fff');
  g.addColorStop(0.35, accent);
  g.addColorStop(1, '#0f172a');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#fff8'; ctx.lineWidth = 2; ctx.stroke();

  ctx.fillStyle = '#0f172a';
  ctx.font = `700 ${Math.max(10, r*0.4)}px Oxanium,monospace`;
  ctx.textAlign = 'center';
  ctx.fillText(obj.m.toFixed(1)+' kg', px, py + 4);
  ctx.textAlign = 'start';

  // velocity / momentum vector
  if (Math.abs(obj.v) > 0.05 || (!obj.hit && state.running)) {
    const spd = Math.abs(obj.v || obj.v0);
    const len = Math.min(110, 18 + Math.tanh(spd/10)*80);
    const dir = Math.sign(obj.v || obj.v0) || 1;
    drawArrow(px + r + 4, py - r - 10, px + r + 4 + dir*len, py - r - 10, accent, '|v| '+spd.toFixed(1));
  }

  // momentum badge
  ctx.fillStyle = 'rgba(15,23,42,0.75)';
  ctx.strokeStyle = accent;
  ctx.lineWidth = 1.5;
  roundRect(px - 34, py + r + 8, 68, 22, 8);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = accent;
  ctx.font = '700 11px Oxanium,monospace';
  ctx.textAlign = 'center';
  ctx.fillText('p='+(obj.m*obj.v0).toFixed(1), px, py + r + 23);
  ctx.textAlign = 'start';
}

function roundRect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function draw() {
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, '#0b1730'); g.addColorStop(1, '#0f172a');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // title formula
  ctx.fillStyle = 'rgba(0,243,255,0.85)';
  ctx.font = '700 16px Oxanium,monospace';
  ctx.textAlign = 'center';
  ctx.fillText('p = m × v', W/2, 28);
  ctx.textAlign = 'start';

  drawLane(3.2, state.A, state.obsA, 'canvas_track_a', '#22d3ee');
  drawLane(-3.2, state.B, state.obsB, 'canvas_track_b', '#fbbf24');

  // center divider
  ctx.strokeStyle = 'rgba(148,163,184,0.2)';
  ctx.setLineDash([6,6]);
  ctx.beginPath(); ctx.moveTo(X(-14), Y(0)); ctx.lineTo(X(14), Y(0)); ctx.stroke();
  ctx.setLineDash([]);

  if (state.flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${state.flash*0.18})`;
    ctx.fillRect(0,0,W,H);
  }
}

function loop(ts) {
  const dt = Math.min(0.033, (ts - lastTs)/1000 || 0.016);
  lastTs = ts;
  stepPhysics(dt);
  draw();
  requestAnimationFrame(loop);
}

/* ============================================================
   CANVAS INPUT
============================================================ */
function fitCanvas() {
  const wrap = document.getElementById('sim-viewport');
  if (!wrap) return;
  const rect = wrap.getBoundingClientRect();
  W = Math.max(320, Math.floor(rect.width));
  H = Math.max(260, Math.floor(rect.height));
  canvas.width = W; canvas.height = H;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  if (fCanvas) { fCanvas.setWidth(W); fCanvas.setHeight(H); fCanvas.calcOffset(); }
  fitBestZoom();
}

function ptr(e) {
  const r = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}
function onDown(e) {
  if (isAnnoActive) return;
  e.preventDefault();
  if (e.touches && e.touches.length === 2) {
    const r = canvas.getBoundingClientRect();
    const a = {x:e.touches[0].clientX-r.left, y:e.touches[0].clientY-r.top};
    const b = {x:e.touches[1].clientX-r.left, y:e.touches[1].clientY-r.top};
    pinch = { d: Math.hypot(a.x-b.x,a.y-b.y), z: state.zoom };
    dragging = null; return;
  }
  dragging = 'pan'; lastP = ptr(e); canvas.style.cursor = 'grabbing';
}
function onMove(e) {
  if (isAnnoActive) return;
  if (e.touches && e.touches.length === 2 && pinch) {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    const a = {x:e.touches[0].clientX-r.left, y:e.touches[0].clientY-r.top};
    const b = {x:e.touches[1].clientX-r.left, y:e.touches[1].clientY-r.top};
    const d = Math.hypot(a.x-b.x,a.y-b.y);
    zoomBy((pinch.z * (d/pinch.d)) / state.zoom, (a.x+b.x)/2, (a.y+b.y)/2);
    return;
  }
  if (dragging === 'pan' && lastP) {
    e.preventDefault();
    const p = ptr(e);
    state.panX += p.x - lastP.x; state.panY += p.y - lastP.y;
    lastP = p;
  }
}
function onUp() { dragging = null; lastP = null; pinch = null; canvas.style.cursor = 'grab'; }

/* ============================================================
   QUIZ
============================================================ */
const quiz = { i: 0, score: 0, answered: false, picked: null, done: false };

function renderQuiz() {
  const body = document.getElementById('quiz-body');
  if (!body) return;
  const Q = LANG[cur].quiz;
  if (quiz.done) {
    const pct = Math.round((quiz.score/5)*100);
    let msg = T('score_msg_low');
    if (pct >= 80) msg = T('score_msg_great');
    else if (pct >= 60) msg = T('score_msg_good');
    document.getElementById('quiz-progress').textContent = '';
    body.innerHTML = `
      <div class="text-center space-y-6 py-6">
        <div class="text-slate-400">${T('final_score')}</div>
        <div class="flex flex-col items-center gap-1">
          <span class="num text-5xl font-extrabold text-cyan-300">${quiz.score}/5</span>
          <span class="num text-lg text-slate-400">${pct}%</span>
        </div>
        <p class="text-slate-300">${msg}</p>
        <button onclick="restartQuiz()" class="ctrl-btn active rounded-2xl px-8 py-4 font-bold text-cyan-300">
          <i class="fa-solid fa-rotate-right me-2"></i>${T('restart')}
        </button>
      </div>`;
    return;
  }
  const q = Q[quiz.i];
  document.getElementById('quiz-progress').textContent = T('quiz_progress')(quiz.i+1, 5);
  const opts = q.opts.map((o, oi) => {
    let cls = 'opt-btn w-full text-start px-5 py-4 rounded-xl glass-panel text-sm md:text-base font-bold text-slate-200 flex items-center gap-3';
    if (quiz.answered) {
      cls += ' locked';
      if (oi === q.a) cls += ' correct';
      else if (oi === quiz.picked) cls += ' wrong';
    }
    return `<button onclick="answerQuiz(${oi})" class="${cls}">
      <span class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-600 flex items-center justify-center text-cyan-400 num shrink-0">${String.fromCharCode(65+oi)}</span>
      <span>${o}</span>
    </button>`;
  }).join('');
  let fb = '';
  if (quiz.answered) {
    const ok = quiz.picked === q.a;
    fb = `<div class="mt-4 glass-panel rounded-xl px-4 py-3 ${ok?'text-green-300 glow-green':'text-red-300 glow-red'}">
      <div class="font-bold mb-1">${ok ? T('correct_fb') : T('wrong_fb')}</div>
      <div class="text-sm text-slate-300">${q.ex}</div>
    </div>
    <button onclick="nextQuiz()" class="mt-4 ctrl-btn active rounded-xl px-6 py-3 font-bold text-cyan-300">
      ${quiz.i >= 4 ? T('see_result') : T('next_q')} <i class="fa-solid fa-arrow-right ms-2"></i>
    </button>`;
  }
  body.innerHTML = `<h3 class="text-lg md:text-xl font-bold text-white mb-4 leading-relaxed">${q.q}</h3>
    <div class="space-y-3">${opts}</div>${fb}`;
}
function answerQuiz(oi) {
  if (quiz.answered) return;
  quiz.answered = true; quiz.picked = oi;
  if (oi === LANG[cur].quiz[quiz.i].a) quiz.score++;
  renderQuiz();
}
function nextQuiz() {
  if (quiz.i >= 4) { quiz.done = true; renderQuiz(); return; }
  quiz.i++; quiz.answered = false; quiz.picked = null; renderQuiz();
}
function restartQuiz() {
  quiz.i = 0; quiz.score = 0; quiz.answered = false; quiz.picked = null; quiz.done = false;
  renderQuiz();
}

/* ============================================================
   BOOT
============================================================ */
function boot() {
  canvas = document.getElementById('sim-canvas');
  ctx = canvas.getContext('2d');
  changeLanguage(cur);
  state.A.r = 0.35 + state.A.m * 0.08;
  state.B.r = 0.35 + state.B.m * 0.08;
  fitCanvas();
  initAnnotationCanvas(W, H);
  updateReadouts();

  canvas.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, {passive:false});
  canvas.addEventListener('touchmove', onMove, {passive:false});
  canvas.addEventListener('touchend', onUp);
  canvas.addEventListener('wheel', e => {
    if (isAnnoActive) return;
    e.preventDefault();
    zoomBy(e.deltaY < 0 ? 1.1 : 1/1.1, e.offsetX, e.offsetY);
  }, {passive:false});
  window.addEventListener('resize', () => fitCanvas());

  requestAnimationFrame(loop);

  setTimeout(() => {
    const intro = document.getElementById('intro');
    intro.style.opacity = '0';
    document.getElementById('app').style.opacity = '1';
    setTimeout(() => { intro.remove(); fitCanvas(); }, 700);
  }, 5000);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
