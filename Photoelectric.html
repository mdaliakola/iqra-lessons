const C = 2.998e8;          // m/s

const HC_NM = 1239.8;         // eV·nm  (E = HC_NM / λ)

/* ============================================================
   PHYSICS HELPERS
============================================================ */
function freqFromLambda(nm) { return C / (nm * 1e-9); } // Hz
function lambdaFromFreq(Hz) { return C / Hz * 1e9; }    // nm
function photonEnergy(nm) { return HC_NM / nm; }        // eV
function metal() { return METALS[state.metalIdx]; }
function thresholdFreq(phi) { return phi / H_EV; }      // Hz
function thresholdLambda(phi) { return HC_NM / phi; }   // nm

function physics() {
  const m = metal();
  const hf = photonEnergy(state.lambda);
  const f = freqFromLambda(state.lambda);
  const f0 = thresholdFreq(m.phi);
  const l0 = thresholdLambda(m.phi);
  const emitting = state.lightOn && hf >= m.phi - 1e-6;
  const nearThresh = state.lightOn && Math.abs(hf - m.phi) < 0.05;
  const Kmax = emitting ? Math.max(0, hf - m.phi) : 0;
  const Vs = Kmax; // volts when Kmax in eV
  const Isat = emitting ? (state.intensity / 100) * 12 : 0; // μA scale
  let I = 0;
  if (emitting && state.intensity > 0) {
    if (state.V >= 0) I = Isat;
    else if (Vs < 1e-6) I = 0;
    else if (state.V <= -Vs) I = 0;
    else I = Isat * (1 + state.V / Vs);
  }
  return { m, hf, f, f0, l0, emitting, nearThresh, Kmax, Vs, Isat, I };
}

function wavelengthColor(nm) {
  if (nm < 380) return { r: 140, g: 60, b: 255 }; // UV-ish purple
  if (nm < 440) return { r: 80, g: 0, b: 255 };
  if (nm < 490) return { r: 0, g: 180, b: 255 };
  if (nm < 510) return { r: 0, g: 255, b: 180 };
  if (nm < 580) return { r: 180, g: 255, b: 0 };
  if (nm < 645) return { r: 255, g: 160, b: 0 };
  if (nm < 700) return { r: 255, g: 40, b: 40 };
  return { r: 180, g: 40, b: 40 };
}
function rgbStr(c, a=1) { return `rgba(${c.r},${c.g},${c.b},${a})`; }

function fmtSci(x, dig=2) {
  if (!isFinite(x) || x === 0) return '0';
  const exp = Math.floor(Math.log10(Math.abs(x)));
  const mant = x / Math.pow(10, exp);
  const supers = {'-': '⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  const eStr = String(exp).split('').map(ch => supers[ch] || ch).join('');
  return `${mant.toFixed(dig)}×10${eStr}`;
}

function changeLanguage(l) {
  if (l !== 'en' && l !== 'ur') return;
  cur = l;
  localStorage.setItem('iqra_pe_lang', cur);
  document.documentElement.lang = cur === 'ur' ? 'ur' : 'en';
  document.documentElement.dir = cur === 'ur' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (LANG[cur][k] != null) el.textContent = LANG[cur][k];
  });
  const introTopic = document.getElementById('intro-topic');
  if (introTopic) introTopic.textContent = T('intro_topic');
  const introLoad = document.getElementById('intro-loading');
  if (introLoad) introLoad.textContent = T('intro_loading');
  populateMetals();
  updateUI();
  renderQuiz();
}

function switchTab(tab) {
  document.getElementById('view-sim').classList.toggle('hidden', tab !== 'sim');
  document.getElementById('view-quiz').classList.toggle('hidden', tab !== 'quiz');
  document.getElementById('tab-sim').classList.toggle('active', tab === 'sim');
  document.getElementById('tab-quiz').classList.toggle('active', tab === 'quiz');
  if (tab === 'sim') {
    requestAnimationFrame(() => { fitCanvas(); resizeAnno(); });
  }
  if (tab === 'quiz') renderQuiz();
}

function toggleFullScreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement) {
    (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen)?.call(el);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
  }
}
document.addEventListener('fullscreenchange', () => {
  const icon = document.getElementById('fs-icon');
  if (icon) icon.className = document.fullscreenElement ? 'fa-solid fa-compress' : 'fa-solid fa-expand';
});

function setViewMode(mode) {
  state.view = mode;
  ['apparatus','micro','graph'].forEach(m => {
    const el = document.getElementById('mode-' + m);
    if (el) el.classList.toggle('active', state.view === m);
  });
  updateTip();
}

/* ============================================================

============================================================ */
function populateMetals() {
  const sel = document.getElementById('sel-metal');
  const v = sel.value || METALS[state.metalIdx].id;
  sel.innerHTML = METALS.map((m,i) =>
    `<option value="${m.id}" ${m.id===v||(!v&&i===state.metalIdx)?'selected':''}>${metalName(m.id)} (φ = ${m.phi.toFixed(2)} eV)</option>`
  ).join('');
  const idx = METALS.findIndex(m => m.id === sel.value);
  if (idx >= 0) state.metalIdx = idx;
}

function toggleLight() {
  state.lightOn = !state.lightOn;
  updateUI();
}

function onWavelength() {
  state.lambda = +document.getElementById('sl-lambda').value;
  const f14 = freqFromLambda(state.lambda) / 1e14;
  document.getElementById('sl-freq').value = f14.toFixed(2);
  updateUI();
}

function onFrequency() {
  const f14 = +document.getElementById('sl-freq').value;
  state.lambda = Math.min(800, Math.max(200, lambdaFromFreq(f14 * 1e14)));
  document.getElementById('sl-lambda').value = Math.round(state.lambda);
  updateUI();
}

function onControl() {
  const sel = document.getElementById('sel-metal');
  const idx = METALS.findIndex(m => m.id === sel.value);
  if (idx >= 0) state.metalIdx = idx;
  state.intensity = +document.getElementById('sl-int').value;
  state.V = +document.getElementById('sl-V').value;
  updateUI();
}

function updateUI() {
  const p = physics();
  document.getElementById('val-lambda').textContent = `${Math.round(state.lambda)} nm`;
  document.getElementById('val-freq').textContent = `${fmtSci(p.f, 2)} Hz`;
  document.getElementById('val-int').textContent = `${state.intensity}%`;
  document.getElementById('val-V').textContent = `${state.V >= 0 ? '+' : ''}${state.V.toFixed(1)} V`;

  document.getElementById('rd-hf').textContent = `${p.hf.toFixed(2)} eV`;
  document.getElementById('rd-phi').textContent = `${p.m.phi.toFixed(2)} eV`;
  document.getElementById('rd-kmax').textContent = p.emitting ? `${p.Kmax.toFixed(2)} eV` : '0 eV';
  document.getElementById('rd-Vs').textContent = p.emitting ? `${p.Vs.toFixed(2)} V` : '—';
  document.getElementById('rd-f0').textContent = `${fmtSci(p.f0, 2)} Hz`;
  document.getElementById('rd-I').textContent = `${p.I.toFixed(2)} μA`;

  document.getElementById('eq-panel').textContent = p.emitting
    ? `${T('eq_emit')}   →   ${p.hf.toFixed(2)} = ${p.m.phi.toFixed(2)} + ${p.Kmax.toFixed(2)} eV`
    : T('eq_none');

  const btn = document.getElementById('btn-light');
  const lab = document.getElementById('light-label');
  lab.textContent = state.lightOn ? T('light_on') : T('light_off');
  if (state.lightOn) {
    btn.classList.add('bg-cyan-500/20', 'border-cyan-400/60', 'text-cyan-300');
    btn.classList.remove('bg-slate-800', 'border-slate-600', 'text-slate-400');
  } else {
    btn.classList.remove('bg-cyan-500/20', 'border-cyan-400/60', 'text-cyan-300');
    btn.classList.add('bg-slate-800', 'border-slate-600', 'text-slate-400');
  }

  const banner = document.getElementById('status-banner');
  let msg = T('status_off'), cls = 'text-slate-300';
  if (state.lightOn) {
    if (!p.emitting) { msg = T('status_below'); cls = 'text-red-300'; }
    else if (p.nearThresh) { msg = T('status_threshold'); cls = 'text-amber-300'; }
    else if (state.V <= -p.Vs && p.Vs > 0) { msg = T('status_stopped'); cls = 'text-orange-300'; }
    else if (state.V >= 0) { msg = T('status_sat'); cls = 'text-green-300'; }
    else { msg = T('status_emit'); cls = 'text-cyan-300'; }
  }
  banner.className = `absolute top-3 glass-panel rounded-xl px-4 py-2 text-xs md:text-sm font-bold pointer-events-none z-10 ${cls}`;
  banner.style.insetInlineStart = '12px';
  banner.style.insetInlineEnd = '70px';
  banner.textContent = msg;
  updateTip();
}

function updateTip() {
  const p = physics();
  let tip = T('tip_off');
  if (state.view === 'micro') tip = T('tip_micro');
  else if (state.view === 'graph') tip = T('tip_graph');
  else if (!state.lightOn) tip = T('tip_off');
  else if (!p.emitting) tip = T('tip_below');
  else if (state.V < 0) tip = T('tip_voltage');
  else if (state.intensity < 40) tip = T('tip_emit_int');
  else tip = T('tip_emit_freq');
  document.getElementById('tip-text').textContent = tip;
}

/* ============================================================
   ANNOTATION (Fabric.js) — exact required logic
============================================================ */
let fCanvas;
let isAnnoActive = false;

function initAnnotationCanvas(w, h) {
  if (fCanvas) {
    fCanvas.setWidth(w);
    fCanvas.setHeight(h);
    fCanvas.calcOffset();
    return;
  }
  fCanvas = new fabric.Canvas('fabricLayer', {
    isDrawingMode: false,
    width: w,
    height: h
  });
  fCanvas.freeDrawingBrush.color = document.getElementById('anno-color').value;
  fCanvas.freeDrawingBrush.width = 4;

  fCanvas.on('mouse:down', function(options) {
    if (isAnnoActive && !fCanvas.isDrawingMode && options.target) {
      fCanvas.remove(options.target);
    }
  });

  const fabricContainer = document.querySelector('.canvas-container');
  if (fabricContainer) fabricContainer.style.pointerEvents = 'none';
}

function toggleAnnotationMode() {
  isAnnoActive = !isAnnoActive;
  const btn = document.getElementById('btn-anno-toggle');
  const toolbar = document.getElementById('anno-toolbar');
  const fabricContainer = document.querySelector('.canvas-container');

  if (isAnnoActive) {
    btn.classList.replace('text-slate-400', 'text-cyan-400');
    toolbar.classList.remove('max-w-0', 'opacity-0');
    toolbar.classList.add('max-w-xs', 'opacity-100');
    if (fabricContainer) fabricContainer.style.pointerEvents = 'auto';
    setAnnoMode('pen');
  } else {
    btn.classList.replace('text-cyan-400', 'text-slate-400');
    toolbar.classList.remove('max-w-xs', 'opacity-100');
    toolbar.classList.add('max-w-0', 'opacity-0');
    if (fabricContainer) fabricContainer.style.pointerEvents = 'none';
    if (fCanvas) fCanvas.isDrawingMode = false;
  }
}

function setAnnoMode(mode) {
  document.getElementById('anno-pen').classList.replace('text-cyan-400', 'text-slate-400');
  document.getElementById('anno-eraser').classList.replace('text-cyan-400', 'text-slate-400');

  if (mode === 'pen') {
    document.getElementById('anno-pen').classList.replace('text-slate-400', 'text-cyan-400');
    if (fCanvas) fCanvas.isDrawingMode = true;
  } else {
    document.getElementById('anno-eraser').classList.replace('text-slate-400', 'text-cyan-400');
    if (fCanvas) fCanvas.isDrawingMode = false;
  }
}

function changeAnnoColor(color) {
  if (fCanvas) fCanvas.freeDrawingBrush.color = color;
  setAnnoMode('pen');
}

function clearAnnotations() {
  if (fCanvas) fCanvas.clear();
}

function resizeAnno() {
  const wrap = document.getElementById('canvas-wrap');
  if (!wrap) return;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (w < 10 || h < 10) return;
  initAnnotationCanvas(w, h);
}

/* ============================================================
   ZOOM & PAN
============================================================ */
function S() { return baseScale * state.zoom; }

function zoomBy(k, cx, cy) {
  const old = state.zoom;
  state.zoom = Math.min(4, Math.max(0.45, state.zoom * k));
  const r = state.zoom / old;
  if (cx != null) {
    state.panX = cx - (cx - state.panX) * r;
    state.panY = cy - (cy - state.panY) * r;
  }
}

function resetView() {
  state.zoom = 1; state.panX = 0; state.panY = 0;
}

let dragging = false, lastPan = null, pinch = null;

function setupPointer() {
  const el = document.getElementById('sim-canvas');
  el.addEventListener('wheel', e => {
    if (isAnnoActive) return;
    e.preventDefault();
    zoomBy(e.deltaY < 0 ? 1.1 : 1/1.1, e.offsetX, e.offsetY);
  }, { passive: false });

  el.addEventListener('pointerdown', e => {
    if (isAnnoActive) return;
    if (e.pointerType === 'touch' && e.isPrimary === false) return;
    dragging = true;
    lastPan = { x: e.clientX, y: e.clientY };
    el.setPointerCapture(e.pointerId);
    el.classList.replace('cursor-grab', 'cursor-grabbing');
  });
  el.addEventListener('pointermove', e => {
    if (!dragging || isAnnoActive || !lastPan) return;
    state.panX += e.clientX - lastPan.x;
    state.panY += e.clientY - lastPan.y;
    lastPan = { x: e.clientX, y: e.clientY };
  });
  el.addEventListener('pointerup', e => {
    dragging = false; lastPan = null;
    el.classList.replace('cursor-grabbing', 'cursor-grab');
  });
  el.addEventListener('pointercancel', () => { dragging = false; lastPan = null; });

  el.addEventListener('touchstart', e => {
    if (isAnnoActive) return;
    if (e.touches.length === 2) {
      const pts = [...e.touches].map(t => ({ x: t.clientX, y: t.clientY }));
      pinch = { d: Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y), z: state.zoom };
      dragging = false;
    }
  }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (isAnnoActive || !pinch || e.touches.length !== 2) return;
    e.preventDefault();
    const pts = [...e.touches].map(t => ({ x: t.clientX, y: t.clientY }));
    const d = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    const target = pinch.z * (d / pinch.d);
    zoomBy(target / state.zoom, (pts[0].x+pts[1].x)/2 - el.getBoundingClientRect().left,
                                  (pts[0].y+pts[1].y)/2 - el.getBoundingClientRect().top);
  }, { passive: false });
  el.addEventListener('touchend', () => { pinch = null; });
}

/* ============================================================
   CANVAS DRAWING
============================================================ */
function fitCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  canvas = document.getElementById('sim-canvas');
  if (!wrap || !canvas) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = wrap.clientWidth, h = wrap.clientHeight;
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  baseScale = Math.min(w / 900, h / 560);
  resizeAnno();
}

function world(x, y) {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const s = S();
  return {
    x: w/2 + state.panX + x * s,
    y: h/2 + state.panY + y * s
  };
}

function spawnParticles(dt, p) {
  const col = wavelengthColor(state.lambda);
  if (state.lightOn && state.intensity > 0) {
    const rate = (state.intensity / 100) * 18 * dt;
    for (let i = 0; i < rate; i++) {
      if (Math.random() > rate) break;
      particles.photons.push({
        x: -320 + Math.random()*20, y: -180 + Math.random()*40,
        vx: 180 + Math.random()*40, vy: 90 + Math.random()*30,
        life: 1, col, hit: false
      });
    }
  }
  // update photons
  for (let i = particles.photons.length - 1; i >= 0; i--) {
    const ph = particles.photons[i];
    ph.x += ph.vx * dt; ph.y += ph.vy * dt; ph.life -= dt * 0.35;
    // hit emitter region
    if (!ph.hit && ph.x > -210 && ph.x < -150 && ph.y > -70 && ph.y < 70) {
      ph.hit = true;
      if (p.emitting && Math.random() < 0.55) {
        const speed = 60 + p.Kmax * 50;
        const reach = !(state.V <= -p.Vs && p.Vs > 0);
        const accel = state.V * 35;
        particles.electrons.push({
          x: -160, y: ph.y * 0.6 + (Math.random()-0.5)*20,
          vx: (reach ? 40 : 10) + speed * 0.3, vy: (Math.random()-0.5)*30,
          ax: accel, life: 1.4, stopped: !reach && state.V < 0
        });
      }
      particles.photons.splice(i, 1);
      continue;
    }
    if (ph.life <= 0 || ph.x > 200) particles.photons.splice(i, 1);
  }
  // update electrons
  for (let i = particles.electrons.length - 1; i >= 0; i--) {
    const el = particles.electrons[i];
    el.vx += el.ax * dt;
    if (el.stopped) { el.vx *= 0.92; el.life -= dt * 1.2; }
    else el.life -= dt * 0.45;
    el.x += el.vx * dt; el.y += el.vy * dt;
    if (el.x > 200 || el.life <= 0 || el.x < -250) particles.electrons.splice(i, 1);
  }
  // cap
  if (particles.photons.length > 80) particles.photons.splice(0, particles.photons.length - 80);
  if (particles.electrons.length > 60) particles.electrons.splice(0, particles.electrons.length - 60);
}

function draw() {
  if (!ctx || !canvas) return;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);

  // vignette bg
  const g = ctx.createRadialGradient(w*0.5, h*0.45, 40, w*0.5, h*0.5, Math.max(w,h)*0.7);
  g.addColorStop(0, 'rgba(15,30,55,0.9)');
  g.addColorStop(1, 'rgba(8,12,24,0.2)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  if (state.view === 'graph') drawGraph();
  else if (state.view === 'micro') drawMicro();
  else drawApparatus();
}

function drawApparatus() {
  const p = physics();
  const col = wavelengthColor(state.lambda);
  const s = S();

  // tube glass
  const tube = world(0, 10);
  ctx.save();
  ctx.translate(tube.x, tube.y);
  ctx.scale(s, s);

  // vacuum chamber
  roundRect(ctx, -260, -120, 520, 240, 90);
  ctx.fillStyle = 'rgba(30,58,95,0.25)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(125,211,252,0.45)';
  ctx.lineWidth = 3;
  ctx.stroke();
  // inner glow
  roundRect(ctx, -250, -110, 500, 220, 82);
  ctx.strokeStyle = 'rgba(0,243,255,0.12)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // VACUUM label
  ctx.fillStyle = 'rgba(148,163,184,0.8)';
  ctx.font = 'bold 13px Oxanium, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(T('lbl_vacuum'), 0, -95);

  // light source
  ctx.fillStyle = 'rgba(15,23,42,0.95)';
  roundRect(ctx, -340, -200, 90, 70, 12);
  ctx.fill();
  ctx.strokeStyle = state.lightOn ? rgbStr(col, 0.9) : 'rgba(100,116,139,0.6)';
  ctx.lineWidth = 2;
  ctx.stroke();
  if (state.lightOn) {
    const lg = ctx.createRadialGradient(-295, -165, 2, -295, -165, 40);
    lg.addColorStop(0, rgbStr(col, 0.95));
    lg.addColorStop(1, rgbStr(col, 0));
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.arc(-295, -165, 40, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 11px Manrope, sans-serif';
  ctx.fillText(T('lbl_source'), -295, -145);
  ctx.fillStyle = 'rgba(148,163,184,0.9)';
  ctx.font = '10px Manrope, sans-serif';
  ctx.fillText(T('lbl_filter'), -295, -132);

  // beam
  if (state.lightOn && state.intensity > 0) {
    const beam = ctx.createLinearGradient(-300, -165, -170, 0);
    beam.addColorStop(0, rgbStr(col, 0.55 * state.intensity/100));
    beam.addColorStop(1, rgbStr(col, 0.05));
    ctx.fillStyle = beam;
    ctx.beginPath();
    ctx.moveTo(-300, -180); ctx.lineTo(-300, -150);
    ctx.lineTo(-165, 40); ctx.lineTo(-165, -40);
    ctx.closePath(); ctx.fill();
  }

  // emitter plate
  const mc = p.m.color;
  ctx.fillStyle = mc;
  roundRect(ctx, -200, -75, 28, 150, 4);
  ctx.fill();
  ctx.shadowColor = mc; ctx.shadowBlur = 18;
  ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = '#0f172a';
  ctx.font = 'bold 11px Manrope, sans-serif';
  ctx.save();
  ctx.translate(-186, 0); ctx.rotate(-Math.PI/2);
  ctx.fillText(T('lbl_emitter'), 0, 4);
  ctx.restore();
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 12px Manrope, sans-serif';
  ctx.fillText(metalName(p.m.id), -186, 100);

  // collector plate
  ctx.fillStyle = '#94a3b8';
  roundRect(ctx, 170, -75, 28, 150, 4);
  ctx.fill();
  ctx.fillStyle = '#0f172a';
  ctx.save();
  ctx.translate(184, 0); ctx.rotate(-Math.PI/2);
  ctx.fillText(T('lbl_collector'), 0, 4);
  ctx.restore();

  // field arrows
  if (state.lightOn) {
    ctx.strokeStyle = state.V >= 0 ? 'rgba(34,197,94,0.35)' : 'rgba(239,68,68,0.4)';
    ctx.fillStyle = ctx.strokeStyle;
    ctx.lineWidth = 1.5;
    for (let y = -50; y <= 50; y += 25) {
      arrow(ctx, -150, y, 150, y, state.V >= 0 ? 1 : -1);
    }
  }

  // circuit below
  ctx.strokeStyle = 'rgba(148,163,184,0.7)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-186, 75); ctx.lineTo(-186, 160); ctx.lineTo(184, 160); ctx.lineTo(184, 75);
  ctx.stroke();

  // battery
  ctx.fillStyle = 'rgba(15,23,42,0.95)';
  roundRect(ctx, -40, 140, 80, 40, 8);
  ctx.fill();
  ctx.strokeStyle = state.V >= 0 ? 'rgba(34,197,94,0.7)' : 'rgba(239,68,68,0.7)';
  ctx.stroke();
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 11px Oxanium, monospace';
  ctx.fillText(`${state.V >= 0 ? '+' : ''}${state.V.toFixed(1)} V`, 0, 158);
  ctx.font = '10px Manrope, sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText(T('lbl_battery'), 0, 172);

  // ammeter
  ctx.beginPath(); ctx.arc(-120, 160, 18, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(15,23,42,0.95)'; ctx.fill();
  ctx.strokeStyle = '#00f3ff'; ctx.stroke();
  ctx.fillStyle = '#00f3ff';
  ctx.font = 'bold 12px Oxanium, monospace';
  ctx.fillText(T('lbl_ammeter'), -120, 164);
  ctx.fillStyle = '#94a3b8';
  ctx.font = '10px Oxanium, monospace';
  ctx.fillText(`${p.I.toFixed(1)} μA`, -120, 195);

  // voltmeter
  ctx.beginPath(); ctx.arc(120, 120, 16, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(15,23,42,0.95)'; ctx.fill();
  ctx.strokeStyle = '#fbbf24'; ctx.stroke();
  ctx.fillStyle = '#fbbf24';
  ctx.font = 'bold 12px Oxanium, monospace';
  ctx.fillText(T('lbl_voltmeter'), 120, 124);

  // particles in local space
  particles.photons.forEach(ph => {
    ctx.beginPath();
    ctx.fillStyle = rgbStr(ph.col, Math.max(0.2, ph.life));
    ctx.shadowColor = rgbStr(ph.col, 0.8); ctx.shadowBlur = 10;
    ctx.arc(ph.x, ph.y, 4, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = rgbStr(ph.col, 0.9);
    ctx.font = 'bold 10px Oxanium, monospace';
    ctx.fillText(T('lbl_photon'), ph.x, ph.y - 8);
  });
  particles.electrons.forEach(el => {
    ctx.beginPath();
    ctx.fillStyle = `rgba(250,204,21,${Math.max(0.25, el.life)})`;
    ctx.shadowColor = 'rgba(250,204,21,0.9)'; ctx.shadowBlur = 12;
    ctx.arc(el.x, el.y, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  });

  ctx.restore();
}

function drawMicro() {
  const p = physics();
  const col = wavelengthColor(state.lambda);
  const origin = world(0, 0);
  const s = S();
  ctx.save();
  ctx.translate(origin.x, origin.y);
  ctx.scale(s, s);

  // metal lattice
  ctx.fillStyle = 'rgba(30,41,59,0.85)';
  roundRect(ctx, -80, -140, 360, 280, 20);
  ctx.fill();
  ctx.strokeStyle = p.m.color; ctx.lineWidth = 2; ctx.stroke();

  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 14px Manrope, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(T('lbl_metal_surface') + ' — ' + metalName(p.m.id), 100, -155);

  // atoms + electrons
  for (let row = 0; row < 5; row++) {
    for (let colI = 0; colI < 6; colI++) {
      const ax = -20 + colI * 50;
      const ay = -100 + row * 50;
      ctx.beginPath();
      ctx.fillStyle = p.m.color;
      ctx.globalAlpha = 0.85;
      ctx.arc(ax, ay, 14, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.fillStyle = '#facc15';
      const wob = Math.sin(performance.now()/400 + row + colI) * 3;
      ctx.arc(ax + 10 + wob, ay - 6, 4, 0, Math.PI*2); ctx.fill();
    }
  }

  // incoming photons from left
  if (state.lightOn) {
    for (let i = 0; i < 5; i++) {
      const t = (performance.now()/800 + i*0.2) % 1;
      const px = -280 + t * 200;
      const py = -60 + i * 30;
      ctx.beginPath();
      ctx.fillStyle = rgbStr(col, 0.9);
      ctx.shadowColor = rgbStr(col, 1); ctx.shadowBlur = 14;
      ctx.arc(px, py, 7, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px Oxanium, monospace';
      ctx.fillText(T('lbl_photon'), px, py - 12);
    }
  }

  // interaction outcome
  ctx.fillStyle = 'rgba(15,23,42,0.9)';
  roundRect(ctx, -300, 160, 520, 70, 14);
  ctx.fill();
  ctx.strokeStyle = p.emitting ? 'rgba(34,197,94,0.5)' : 'rgba(239,68,68,0.5)';
  ctx.stroke();
  ctx.fillStyle = p.emitting ? '#86efac' : '#fca5a5';
  ctx.font = 'bold 15px Manrope, sans-serif';
  const msg = !state.lightOn ? T('status_off')
    : p.emitting ? `${T('lbl_ejected')}:  hf (${p.hf.toFixed(2)} eV) ≥ φ (${p.m.phi.toFixed(2)} eV)`
    : `${T('lbl_reflected')}:  hf (${p.hf.toFixed(2)} eV) < φ (${p.m.phi.toFixed(2)} eV)`;
  ctx.fillText(msg, -40, 200);

  // flying electrons if emitting
  if (p.emitting && state.lightOn) {
    for (let i = 0; i < 4; i++) {
      const t = (performance.now()/900 + i*0.25) % 1;
      const ex = 220 + t * 80;
      const ey = -80 + i * 35 + Math.sin(t*6)*8;
      ctx.beginPath();
      ctx.fillStyle = '#facc15';
      ctx.shadowColor = '#facc15'; ctx.shadowBlur = 12;
      ctx.arc(ex, ey, 5, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fde68a';
      ctx.font = 'bold 11px Oxanium, monospace';
      ctx.fillText(T('lbl_electron'), ex + 14, ey + 4);
    }
  }

  ctx.restore();
}

function drawGraph() {
  const p = physics();
  const origin = world(0, 10);
  const s = S();
  ctx.save();
  ctx.translate(origin.x, origin.y);
  ctx.scale(s, s);

  ctx.fillStyle = 'rgba(15,23,42,0.75)';
  roundRect(ctx, -340, -210, 680, 420, 20);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,243,255,0.25)';
  ctx.lineWidth = 2; ctx.stroke();

  ctx.fillStyle = '#00f3ff';
  ctx.font = 'bold 16px Manrope, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(T('graph_title'), 0, -180);

  // axes
  const gx0 = -260, gy0 = 140, gw = 520, gh = 280;
  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(gx0, gy0 - gh); ctx.lineTo(gx0, gy0); ctx.lineTo(gx0 + gw, gy0);
  ctx.stroke();

  ctx.fillStyle = '#94a3b8';
  ctx.font = '12px Oxanium, monospace';
  ctx.fillText(T('graph_V'), gx0 + gw/2, gy0 + 36);
  ctx.save();
  ctx.translate(gx0 - 36, gy0 - gh/2);
  ctx.rotate(-Math.PI/2);
  ctx.fillText(T('graph_I'), 0, 0);
  ctx.restore();

  // V range -8..8, I 0..14
  const Vmin = -8, Vmax = 8, Imax = 14;
  const xOf = V => gx0 + ((V - Vmin) / (Vmax - Vmin)) * gw;
  const yOf = I => gy0 - (I / Imax) * gh;

  // zero line
  ctx.strokeStyle = 'rgba(148,163,184,0.3)';
  ctx.beginPath(); ctx.moveTo(xOf(0), gy0); ctx.lineTo(xOf(0), gy0 - gh); ctx.stroke();

  // curve for current settings
  ctx.beginPath();
  ctx.strokeStyle = '#00f3ff';
  ctx.lineWidth = 3;
  ctx.shadowColor = 'rgba(0,243,255,0.5)'; ctx.shadowBlur = 10;
  let started = false;
  for (let V = Vmin; V <= Vmax; V += 0.05) {
    let I = 0;
    if (p.emitting && state.intensity > 0) {
      if (V >= 0) I = p.Isat;
      else if (p.Vs < 1e-6) I = 0;
      else if (V <= -p.Vs) I = 0;
      else I = p.Isat * (1 + V / p.Vs);
    }
    const x = xOf(V), y = yOf(I);
    if (!started) { ctx.moveTo(x, y); started = true; }
    else ctx.lineTo(x, y);
  }
  ctx.stroke(); ctx.shadowBlur = 0;

  // operating point
  ctx.beginPath();
  ctx.fillStyle = '#fbbf24';
  ctx.arc(xOf(state.V), yOf(p.I), 7, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

  // Vs marker
  if (p.emitting && p.Vs > 0) {
    ctx.strokeStyle = 'rgba(239,68,68,0.7)';
    ctx.setLineDash([6,4]);
    ctx.beginPath();
    ctx.moveTo(xOf(-p.Vs), gy0); ctx.lineTo(xOf(-p.Vs), gy0 - gh);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#fca5a5';
    ctx.font = 'bold 12px Oxanium, monospace';
    ctx.fillText(`−Vs = ${(-p.Vs).toFixed(2)} V`, xOf(-p.Vs), gy0 - gh - 10);
  }

  // legend
  ctx.fillStyle = '#cbd5e1';
  ctx.font = '13px Manrope, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`I = ${p.I.toFixed(2)} μA   @   V = ${state.V.toFixed(1)} V`, gx0, gy0 + 60);
  ctx.fillText(`Isat ∝ intensity    |    Vs ∝ frequency`, gx0, gy0 + 82);

  ctx.restore();
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x+r, y);
  c.arcTo(x+w, y, x+w, y+h, r);
  c.arcTo(x+w, y+h, x, y+h, r);
  c.arcTo(x, y+h, x, y, r);
  c.arcTo(x, y, x+w, y, r);
  c.closePath();
}

function arrow(c, x1, y1, x2, y2, dir) {
  // dir 1: left->right, -1: right->left
  const xa = dir > 0 ? x1 : x2;
  const xb = dir > 0 ? x2 : x1;
  c.beginPath();
  c.moveTo(xa, y1); c.lineTo(xb, y2); c.stroke();
  const tipX = xb, tipY = y2;
  const back = dir > 0 ? -10 : 10;
  c.beginPath();
  c.moveTo(tipX, tipY);
  c.lineTo(tipX + back, tipY - 5);
  c.lineTo(tipX + back, tipY + 5);
  c.closePath(); c.fill();
}

function loop(t) {
  const dt = Math.min(0.05, (t - (lastT || t)) / 1000);
  lastT = t;
  const p = physics();
  if (state.view === 'apparatus') spawnParticles(dt, p);
  else { particles.photons.length = 0; particles.electrons.length = 0; }
  draw();
  animId = requestAnimationFrame(loop);
}

/* ============================================================
   QUIZ
============================================================ */
const quiz = { i: 0, answers: Array(5).fill(null), done: false };
function restartQuiz() { quiz.i = 0; quiz.answers = Array(5).fill(null); quiz.done = false; renderQuiz(); }
function answer(oi) {
  if (quiz.answers[quiz.i] !== null) return;
  quiz.answers[quiz.i] = oi; renderQuiz();
}
function nextQ() {
  if (quiz.i < 4) quiz.i++; else quiz.done = true;
  renderQuiz();
}
function renderQuiz() {
  const box = document.getElementById('quiz-box');
  if (!box) return;
  const Q = LANG[cur].quiz;
  if (quiz.done) {
    const score = quiz.answers.reduce((s, a, i) => s + (a === Q[i].a ? 1 : 0), 0);
    const pct = Math.round(score / 5 * 100);
    const msg = pct >= 80 ? T('score_msg_great') : pct >= 60 ? T('score_msg_good') : T('score_msg_low');
    const circ = 2 * Math.PI * 54;
    box.innerHTML = `
      <div class="fade-in text-center py-6" data-testid="quiz-result">
        <h2 class="font-display text-lg font-bold text-cyan-400 mb-6">${T('final_score')}</h2>
        <div class="relative inline-block score-ring">
          <svg width="140" height="140" viewBox="0 0 140 140">
            <circle cx="70" cy="70" r="54" fill="none" stroke="#334155" stroke-width="10"/>
            <circle cx="70" cy="70" r="54" fill="none" stroke="#00f3ff" stroke-width="10" stroke-linecap="round"
              stroke-dasharray="${circ}" stroke-dashoffset="${circ * (1 - pct/100)}" transform="rotate(-90 70 70)"/>
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span class="num text-3xl font-extrabold text-cyan-300" data-testid="quiz-score">${score}/5</span>
            <span class="num text-sm text-slate-400">${pct}%</span>
          </div>
        </div>
        <p class="mt-6 text-base text-slate-300">${msg}</p>
        <button data-testid="quiz-restart-btn" onclick="restartQuiz()" class="mt-8 px-8 py-3.5 rounded-xl bg-cyan-500/15 border border-cyan-400/50 text-cyan-300 font-bold glow-cyan hover:bg-cyan-500/25 transition">
          <i class="fa-solid fa-rotate-right"></i> ${T('restart')}
        </button>
      </div>`;
    return;
  }
  const q = Q[quiz.i], picked = quiz.answers[quiz.i];
  const opts = q.opts.map((o, oi) => {
    let cls = 'opt-btn';
    if (picked !== null) {
      cls += ' locked';
      if (oi === q.a) cls += ' correct';
      else if (oi === picked) cls += ' wrong';
    }
    return `<button data-testid="quiz-option-${oi}" onclick="answer(${oi})" class="${cls} w-full text-start px-5 py-4 rounded-xl glass-panel text-sm md:text-base font-bold text-slate-200 flex items-center gap-3">
      <span class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-600 flex items-center justify-center text-cyan-400 num shrink-0">${String.fromCharCode(65+oi)}</span>
      <span>${o}</span>
    </button>`;
  }).join('');
  const fb = picked === null ? '' : `
    <div class="fade-in mt-5 rounded-xl px-5 py-4 ${picked === q.a ? 'bg-green-500/10 border border-green-500/40 glow-green' : 'bg-red-500/10 border border-red-500/40 glow-red'}">
      <div class="font-bold ${picked === q.a ? 'text-green-400' : 'text-red-400'} mb-1" data-testid="quiz-feedback">
        <i class="fa-solid ${picked === q.a ? 'fa-circle-check' : 'fa-circle-xmark'}"></i> ${picked === q.a ? T('correct_fb') : T('wrong_fb')}
      </div>
      <p class="text-sm text-slate-300 leading-relaxed">${q.ex}</p>
    </div>
    <button data-testid="quiz-next-btn" onclick="nextQ()" class="mt-5 w-full px-6 py-3.5 rounded-xl bg-cyan-500/15 border border-cyan-400/50 text-cyan-300 font-bold hover:bg-cyan-500/25 transition">
      ${quiz.i < 4 ? T('next_q') : T('see_result')} <i class="fa-solid fa-arrow-right rtl-flip"></i>
    </button>`;
  box.innerHTML = `
    <div class="fade-in">
      <div class="flex items-center justify-between mb-5">
        <h2 class="font-display text-lg font-bold text-cyan-400">${T('quiz_title')}</h2>
        <span class="text-sm text-slate-400 font-bold" data-testid="quiz-progress">${T('quiz_progress')(quiz.i+1,5)}</span>
      </div>
      <div class="flex gap-1.5 mb-6">${[0,1,2,3,4].map(i =>
        `<div class="h-1.5 flex-1 rounded-full ${i < quiz.i || quiz.answers[i] !== null ? 'bg-cyan-400' : i === quiz.i ? 'bg-cyan-700' : 'bg-slate-700'}"></div>`).join('')}
      </div>
      <p class="text-base md:text-lg font-bold text-slate-100 mb-6 leading-relaxed" data-testid="quiz-question">${q.q}</p>
      <div class="space-y-3">${opts}</div>
      ${fb}
    </div>`;
}

/* ============================================================
   INIT
============================================================ */
window.addEventListener('resize', () => { fitCanvas(); });
document.getElementById('lang-select').value = (cur === 'ur' ? 'ur' : 'en');
populateMetals();
changeLanguage(cur);
setupPointer();
fitCanvas();
animId = requestAnimationFrame(loop);

setTimeout(() => {
  const intro = document.getElementById('intro'), app = document.getElementById('app');
  if (window.__denied || !intro || !app) return;
  intro.style.opacity = '0';
  app.style.opacity = '1';
  setTimeout(() => {
    intro.remove();
    fitCanvas();
  }, 800);
}, 5000);
</script>
