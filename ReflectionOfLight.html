<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IQRA VIRTUAL LAB — Reflection of Light</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&family=Manrope:wght@400;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<style>
  /* Custom Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #0f172a; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #475569; }

  /* RTL Styling Adjustments for Urdu with Jameel Noori Nastaliq */
  [dir="rtl"] .rtl-flip { transform: scaleX(-1); }
  [dir="rtl"] {
    font-family: 'Jameel Noori Nastaliq', 'Noto Nastaliq Urdu', serif !important;
    line-height: 2.3 !important;
  }

  /* Glassmorphism Classes */
  .glass-panel {
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .glass-card {
    background: rgba(30, 41, 59, 0.6);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  /* Pulse Glow Effects */
  .glow-cyan { box-shadow: 0 0 20px rgba(0, 243, 255, 0.35); }
  .glow-red { box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
  .glow-green { box-shadow: 0 0 20px rgba(34, 197, 94, 0.35); }

  /* Canvas styling */
  canvas { touch-action: none; }

  /* Custom Slider Styling */
  input[type=range] {
    -webkit-appearance: none;
    background: #334155;
    border-radius: 8px;
    height: 8px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    height: 20px; width: 20px; border-radius: 50%;
    background: #00f3ff; cursor: pointer;
    box-shadow: 0 0 10px #00f3ff;
    transition: transform 0.1s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
  input[type=range]:disabled::-webkit-slider-thumb { background: #64748b; box-shadow: none; cursor: not-allowed; }

  /* Jameel Noori Nastaliq (preferred Urdu) + Google Noto fallback */
  @font-face {
    font-family: 'Jameel Noori Nastaliq';
    src: local('Jameel Noori Nastaleeq'), local('Jameel Noori Nastaliq'),
         url('https://fonts.gstatic.com/s/notonastaliqurdu/v20/TuGJUVp97srt-x5wuZd7o-pWX5-w8KAMcKgmuInsq1mqmRQ.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  body {
    font-family: 'Manrope', sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    overflow: hidden;
  }
  .font-display { font-family: 'Oxanium', 'Manrope', sans-serif; }
  [dir="rtl"] .font-display { font-family: 'Jameel Noori Nastaliq', 'Noto Nastaliq Urdu', serif; }
  [dir="rtl"] body, [dir="rtl"] { font-size: 1.08em; }

  .bg-grid {
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(0,243,255,0.08), transparent 50%),
      radial-gradient(ellipse at 90% 100%, rgba(56,189,248,0.06), transparent 45%),
      linear-gradient(rgba(0,243,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,243,255,0.035) 1px, transparent 1px);
    background-size: auto, auto, 44px 44px, 44px 44px;
    background-color: #0f172a;
  }

  #intro {
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(ellipse at center, #10233f 0%, #0f172a 65%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity .8s ease;
  }
  .intro-title {
    font-family: 'Oxanium', sans-serif;
    font-weight: 800; letter-spacing: .14em;
    background: linear-gradient(92deg, #00f3ff, #7dd3fc, #00f3ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: introZoom 1.6s cubic-bezier(.2,.8,.2,1) both, glowPulse 2s ease-in-out infinite;
  }
  .intro-topic {
    color: #94a3b8; letter-spacing: .28em;
    animation: introFade 1.4s .4s ease both;
  }
  .intro-ring {
    width: 160px; height: 160px; border-radius: 50%;
    border: 2px solid rgba(0,243,255,.35);
    box-shadow: 0 0 60px rgba(0,243,255,.25), inset 0 0 40px rgba(0,243,255,.12);
    display:flex; align-items:center; justify-content:center;
    animation: ringSpin 2.4s linear infinite, introZoom 1.2s ease both;
    margin-bottom: 28px; position: relative;
  }
  .intro-ring::before {
    content:''; position:absolute; inset:-10px; border-radius:50%;
    border-top: 2px solid #00f3ff; border-right: 2px solid transparent;
    border-bottom: 2px solid transparent; border-left: 2px solid transparent;
  }
  @keyframes ringSpin { to { transform: rotate(360deg); } }
  @keyframes introZoom { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
  @keyframes introFade { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes glowPulse {
    0%,100% { text-shadow: 0 0 24px rgba(0,243,255,.55); }
    50% { text-shadow: 0 0 54px rgba(0,243,255,.9); }
  }

  .tab-btn {
    position: relative; transition: color .25s ease, background-color .25s ease;
    border-radius: 12px;
  }
  .tab-btn.active {
    color: #00f3ff; background: rgba(0,243,255,.08);
    box-shadow: inset 0 0 0 1px rgba(0,243,255,.35), 0 0 18px rgba(0,243,255,.15);
  }
  .view { animation: viewIn .35s ease both; }
  @keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .mode-btn {
    transition: background-color .25s ease, color .25s ease, box-shadow .25s ease, transform .15s ease;
    border: 1px solid rgba(255,255,255,.1);
  }
  .mode-btn:active { transform: scale(.96); }
  .mode-btn.active {
    background: rgba(0,243,255,.12); color: #00f3ff;
    border-color: rgba(0,243,255,.5); box-shadow: 0 0 16px rgba(0,243,255,.25);
  }

  .toggle-pill {
    transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease;
    border: 1px solid rgba(255,255,255,.12);
  }
  .toggle-pill.on {
    background: rgba(0,243,255,.14); color: #00f3ff;
    border-color: rgba(0,243,255,.45); box-shadow: 0 0 14px rgba(0,243,255,.2);
  }

  .opt-btn {
    transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .12s ease;
    border: 1px solid rgba(255,255,255,.1);
  }
  .opt-btn:not(.locked):hover { border-color: rgba(0,243,255,.45); background: rgba(0,243,255,.06); }
  .opt-btn:not(.locked):active { transform: scale(.98); }
  .opt-btn.correct { background: rgba(34,197,94,.16); border-color:#22c55e; box-shadow: 0 0 18px rgba(34,197,94,.3); }
  .opt-btn.wrong { background: rgba(239,68,68,.14); border-color:#ef4444; box-shadow: 0 0 18px rgba(239,68,68,.3); }

  .zoom-btn {
    width: 42px; height: 42px; border-radius: 12px;
    background: rgba(15,23,42,.85); border:1px solid rgba(255,255,255,.12);
    color:#00f3ff; display:flex; align-items:center; justify-content:center;
    backdrop-filter: blur(8px); cursor:pointer;
    transition: background-color .2s ease, box-shadow .2s ease, transform .12s ease;
  }
  .zoom-btn:hover { background: rgba(0,243,255,.12); box-shadow: 0 0 14px rgba(0,243,255,.25); }
  .zoom-btn:active { transform: scale(.92); }

  .stat-val { font-family: 'Oxanium', monospace; color:#00f3ff; }
  [dir="rtl"] .stat-val { font-family: 'Oxanium', monospace !important; line-height: 1.4 !important; }
  .num { font-family:'Oxanium', monospace !important; line-height:1.4 !important; direction:ltr; unicode-bidi:embed; }

  .fade-in { animation: viewIn .4s ease both; }
  .score-ring { filter: drop-shadow(0 0 14px rgba(0,243,255,.5)); }

  #canvas-wrap .canvas-container {
    position: absolute !important;
    inset: 0;
    width: 100% !important;
    height: 100% !important;
    pointer-events: none;
    z-index: 5;
  }
  #canvas-wrap .canvas-container canvas {
    width: 100% !important;
    height: 100% !important;
  }

  select, button { outline: none; }
  #anno-color { -webkit-appearance: none; appearance: none; }

  /* Floating annotation card (minimizable) */
  #anno-float {
    position: absolute;
    top: 12px;
    inset-inline-start: 12px;
    z-index: 25;
    transition: width .3s ease, height .3s ease, padding .3s ease, opacity .25s ease;
    max-width: min(280px, calc(100% - 90px));
  }
  #anno-float.collapsed {
    width: 48px;
    padding: 0;
  }
  #anno-float.collapsed .anno-float-body { display: none; }
  #anno-float.collapsed .anno-float-title { display: none; }
</style>
</head>
<body class="bg-grid">

<!-- INTRO -->
<div id="intro">
  <div class="intro-ring"><i class="fa-solid fa-sun text-5xl text-cyan-300" style="filter:drop-shadow(0 0 14px rgba(0,243,255,.8))"></i></div>
  <div class="intro-title text-4xl sm:text-5xl lg:text-6xl">IQRA VIRTUAL LAB</div>
  <div class="intro-topic text-base md:text-lg mt-5 font-bold uppercase" id="intro-topic">REFLECTION OF LIGHT</div>
  <div class="mt-8 flex items-center gap-3 text-slate-400 text-sm" style="animation:introFade 1.4s .8s ease both">
    <i class="fa-solid fa-spinner animate-spin text-cyan-400"></i>
    <span id="intro-loading">Loading Interactive Physics Lab...</span>
  </div>
</div>

<!-- APP -->
<div id="app" class="h-screen flex flex-col opacity-0 transition-opacity duration-700">

  <!-- HEADER -->
  <header class="glass-panel flex items-center justify-between px-3 md:px-6 py-3 z-30 gap-2">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-10 h-10 rounded-xl bg-slate-900 border border-cyan-500/40 glow-cyan flex items-center justify-center shrink-0">
        <i class="fa-solid fa-flask text-cyan-400"></i>
      </div>
      <div class="min-w-0">
        <div class="font-display font-extrabold tracking-widest text-cyan-400 text-sm md:text-base truncate" style="font-family:'Oxanium',sans-serif !important;">IQRA VIRTUAL LAB</div>
        <div class="text-xs text-slate-400 truncate" data-i18n="topic"></div>
      </div>
    </div>

    <nav class="flex items-center gap-1.5 glass-card rounded-2xl p-1.5 shrink-0">
      <button id="tab-sim" data-testid="tab-simulation" onclick="switchTab('sim')" class="tab-btn active px-3 md:px-5 py-2.5 font-bold text-sm text-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-house"></i><span data-i18n="tab_sim"></span>
      </button>
      <button id="tab-quiz" data-testid="tab-quiz" onclick="switchTab('quiz')" class="tab-btn px-3 md:px-5 py-2.5 font-bold text-sm text-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-clipboard-question"></i><span data-i18n="tab_quiz"></span>
      </button>
    </nav>

    <div class="flex items-center gap-3">
      <!-- Annotation Toolbar (Hidden by default) -->
      <div id="anno-toolbar" class="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 transition-all duration-300 max-w-0 overflow-hidden opacity-0">
        <input type="color" id="anno-color" value="#00f3ff" onchange="changeAnnoColor(this.value)" class="w-6 h-6 cursor-pointer bg-transparent border-0 p-0" title="Color">
        <button id="anno-pen" onclick="setAnnoMode('pen')" class="text-cyan-400 p-1.5 rounded hover:bg-slate-700 transition" title="Pen"><i class="fa-solid fa-pen"></i></button>
        <button id="anno-eraser" onclick="setAnnoMode('eraser')" class="text-slate-400 p-1.5 rounded hover:bg-slate-700 transition" title="Eraser"><i class="fa-solid fa-eraser"></i></button>
        <button onclick="clearAnnotations()" class="text-red-400 p-1.5 rounded hover:bg-slate-700 transition" title="Clear All"><i class="fa-solid fa-trash-can"></i></button>
      </div>

      <!-- Annotation Toggle Button -->
      <button id="btn-anno-toggle" onclick="toggleAnnotationMode()" class="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 flex items-center justify-center border border-slate-700 transition" title="Toggle Annotation">
        <i class="fa-solid fa-pen-nib"></i>
      </button>

      <!-- Language Selector -->
      <div class="relative">
        <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-slate-900 border border-slate-700 text-cyan-400 text-sm rounded-lg focus:ring-cyan-500 focus:border-cyan-500 px-3 py-2 cursor-pointer font-bold outline-none">
          <option value="en">🌐 English</option>
          <option value="ur">🌐 اردو</option>
          <option value="hi" disabled>🌐 हिंदी (Soon)</option>
          <option value="bn" disabled>🌐 বাংলা (Soon)</option>
          <option value="ta" disabled>🌐 தமிழ் (Soon)</option>
        </select>
      </div>

      <!-- Fullscreen Button -->
      <button onclick="toggleFullScreen()" class="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-400 flex items-center justify-center border border-slate-700 transition" title="Toggle Fullscreen">
        <i class="fa-solid fa-expand" id="fs-icon"></i>
      </button>
    </div>
  </header>

  <!-- SIMULATION -->
  <main id="view-sim" class="view flex-1 flex flex-col lg:flex-row gap-3 p-3 md:p-4 min-h-0 overflow-y-auto lg:overflow-hidden">

    <section class="flex-1 flex flex-col gap-3 min-h-0 min-w-0">
      <div class="glass-card rounded-2xl p-3 flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between">
        <div class="text-sm md:text-base font-bold text-slate-200 flex items-center gap-2">
          <i class="fa-solid fa-lightbulb text-amber-400"></i>
          <span data-i18n="central_q"></span>
        </div>
        <div class="flex flex-wrap gap-2">
          <button id="mode-law" onclick="setViewMode('law')" class="mode-btn active px-3 py-2 rounded-xl font-bold text-xs md:text-sm text-slate-300 flex items-center gap-2">
            <i class="fa-solid fa-ruler-combined"></i><span data-i18n="mode_law"></span>
          </button>
          <button id="mode-surface" onclick="setViewMode('surface')" class="mode-btn px-3 py-2 rounded-xl font-bold text-xs md:text-sm text-slate-300 flex items-center gap-2">
            <i class="fa-solid fa-wave-square"></i><span data-i18n="mode_surface"></span>
          </button>
          <button id="mode-laws" onclick="setViewMode('laws')" class="mode-btn px-3 py-2 rounded-xl font-bold text-xs md:text-sm text-slate-300 flex items-center gap-2">
            <i class="fa-solid fa-book-open"></i><span data-i18n="mode_laws"></span>
          </button>
        </div>
      </div>

      <!-- Canvas viewport -->
      <div id="canvas-wrap" class="glass-card rounded-2xl relative flex-1 min-h-[340px] overflow-hidden" data-testid="sim-viewport">
        <canvas id="sim-canvas" data-testid="sim-canvas" class="absolute inset-0 w-full h-full cursor-grab"></canvas>
        <canvas id="fabricLayer"></canvas>

        <!-- Floating minimizable annotation controls -->
        <div id="anno-float" class="glass-panel rounded-2xl p-3 collapsed glow-cyan">
          <div class="flex items-center justify-between gap-2">
            <span class="anno-float-title text-xs font-bold text-cyan-300" data-i18n="anno_title"></span>
            <button onclick="toggleAnnoFloat()" class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 text-cyan-400 flex items-center justify-center hover:bg-slate-700 transition" title="Minimize">
              <i id="anno-float-icon" class="fa-solid fa-pen-ruler"></i>
            </button>
          </div>
          <div class="anno-float-body mt-3 flex items-center gap-2 flex-wrap">
            <input type="color" id="anno-color-float" value="#00f3ff" onchange="syncAnnoColor(this.value)" class="w-8 h-8 cursor-pointer bg-transparent border-0 p-0" title="Color">
            <button onclick="setAnnoMode('pen'); ensureAnnoOn()" class="px-3 py-2 rounded-lg bg-slate-800 text-cyan-400 border border-slate-700 hover:bg-slate-700"><i class="fa-solid fa-pen"></i></button>
            <button onclick="setAnnoMode('eraser'); ensureAnnoOn()" class="px-3 py-2 rounded-lg bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700"><i class="fa-solid fa-eraser"></i></button>
            <button onclick="clearAnnotations()" class="px-3 py-2 rounded-lg bg-slate-800 text-red-400 border border-slate-700 hover:bg-slate-700"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        </div>

        <div class="absolute bottom-3 flex flex-col gap-2 z-20" style="inset-inline-end:12px" dir="ltr">
          <button class="zoom-btn" data-testid="zoom-in-btn" onclick="zoomBy(1.2)" title="+"><i class="fa-solid fa-plus"></i></button>
          <button class="zoom-btn" data-testid="zoom-out-btn" onclick="zoomBy(1/1.2)" title="−"><i class="fa-solid fa-minus"></i></button>
          <button class="zoom-btn" data-testid="zoom-reset-btn" onclick="resetView()" title="Reset"><i class="fa-solid fa-crosshairs"></i></button>
        </div>
        <div id="status-banner" class="absolute top-3 glass-panel rounded-xl px-4 py-2 text-xs md:text-sm font-bold pointer-events-none z-10" style="inset-inline-start:12px;inset-inline-end:70px; margin-top:56px" data-testid="status-banner"></div>
      </div>
    </section>

    <!-- SIDE PANEL -->
    <aside class="w-full lg:w-[360px] xl:w-[400px] flex flex-col gap-3 lg:overflow-y-auto lg:min-h-0 shrink-0 pb-2">

      <div class="glass-card rounded-2xl p-4 space-y-5">
        <h2 class="font-display font-bold text-base text-cyan-400 flex items-center gap-2">
          <i class="fa-solid fa-sliders"></i><span data-i18n="ctrl_title"></span>
        </h2>

        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-bold text-slate-300" data-i18n="angle_i"></label>
            <span class="stat-val text-sm num" id="val-i">45°</span>
          </div>
          <input type="range" data-testid="slider-incidence" id="sl-i" class="w-full" min="5" max="80" step="1" value="45" oninput="onAngle()">
          <div class="flex justify-between text-[10px] text-slate-500 mt-1 num"><span>5°</span><span>80°</span></div>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <button onclick="setPreset(30)" class="mode-btn px-2 py-2.5 rounded-xl font-bold text-sm text-slate-300">30°</button>
          <button onclick="setPreset(45)" class="mode-btn px-2 py-2.5 rounded-xl font-bold text-sm text-slate-300">45°</button>
          <button onclick="setPreset(60)" class="mode-btn px-2 py-2.5 rounded-xl font-bold text-sm text-slate-300">60°</button>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <button id="tog-normal" onclick="toggleFlag('showNormal')" class="toggle-pill on px-3 py-3 rounded-xl font-bold text-xs md:text-sm text-slate-300 flex items-center justify-center gap-2">
            <i class="fa-solid fa-arrows-up-down"></i><span data-i18n="tog_normal"></span>
          </button>
          <button id="tog-angles" onclick="toggleFlag('showAngles')" class="toggle-pill on px-3 py-3 rounded-xl font-bold text-xs md:text-sm text-slate-300 flex items-center justify-center gap-2">
            <i class="fa-solid fa-circle-notch"></i><span data-i18n="tog_angles"></span>
          </button>
          <button id="tog-labels" onclick="toggleFlag('showLabels')" class="toggle-pill on px-3 py-3 rounded-xl font-bold text-xs md:text-sm text-slate-300 flex items-center justify-center gap-2">
            <i class="fa-solid fa-tags"></i><span data-i18n="tog_labels"></span>
          </button>
          <button id="tog-beam" onclick="toggleFlag('showBeam')" class="toggle-pill px-3 py-3 rounded-xl font-bold text-xs md:text-sm text-slate-300 flex items-center justify-center gap-2">
            <i class="fa-solid fa-sun"></i><span data-i18n="tog_beam"></span>
          </button>
        </div>

        <div id="surface-controls" class="space-y-3 hidden">
          <label class="text-sm font-bold text-slate-300 block" data-i18n="surface_type"></label>
          <div class="grid grid-cols-2 gap-2">
            <button id="surf-smooth" onclick="setSurface('smooth')" class="mode-btn active px-3 py-3 rounded-xl font-bold text-sm text-slate-300" data-i18n="surf_smooth"></button>
            <button id="surf-rough" onclick="setSurface('rough')" class="mode-btn px-3 py-3 rounded-xl font-bold text-sm text-slate-300" data-i18n="surf_rough"></button>
          </div>
          <div id="rough-wrap" class="hidden">
            <div class="flex justify-between items-center mb-2">
              <label class="text-sm font-bold text-slate-300" data-i18n="roughness"></label>
              <span class="stat-val text-sm num" id="val-rough">50%</span>
            </div>
            <input type="range" id="sl-rough" class="w-full" min="10" max="100" step="5" value="50" oninput="onRough()">
          </div>
        </div>
      </div>

      <!-- Live readings -->
      <div class="glass-card rounded-2xl p-4 space-y-3">
        <h2 class="font-display font-bold text-base text-cyan-400 flex items-center gap-2">
          <i class="fa-solid fa-gauge-high"></i><span data-i18n="readings"></span>
        </h2>
        <div class="grid grid-cols-2 gap-2 text-sm">
          <div class="glass-panel rounded-xl p-3 glow-red">
            <div class="text-slate-400 text-xs mb-1" data-i18n="rd_i"></div>
            <div class="stat-val num text-base text-red-400" id="rd-i">45°</div>

  mode: 'law',          // law | surface | laws

function T(k) {
  const v = LANG[lang][k];
  return typeof v === 'function' ? v : (v ?? k);
}

/* ============================================================
   LANGUAGE
============================================================ */
function changeLanguage(l) {
  if (l !== 'en' && l !== 'ur') return;
  lang = l;
  localStorage.setItem('iqra_lang', lang);
  document.documentElement.lang = lang === 'ur' ? 'ur' : 'en';
  document.documentElement.dir = lang === 'ur' ? 'rtl' : 'ltr';
  document.getElementById('lang-select').value = lang;

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const val = T(key);
    if (typeof val === 'string') el.textContent = val;
  });

  const introTopic = document.getElementById('intro-topic');
  if (introTopic) introTopic.textContent = T('intro_topic');
  const introLoad = document.getElementById('intro-loading');
  if (introLoad) introLoad.textContent = T('intro_loading');

  updateUI();
  updateTip();
  if (!document.getElementById('view-quiz').classList.contains('hidden')) renderQuiz();
}

function switchTab(tab) {
  document.getElementById('view-sim').classList.toggle('hidden', tab !== 'sim');
  document.getElementById('view-quiz').classList.toggle('hidden', tab !== 'quiz');
  document.getElementById('tab-sim').classList.toggle('active', tab === 'sim');
  document.getElementById('tab-quiz').classList.toggle('active', tab === 'quiz');
  if (tab === 'quiz') renderQuiz();
  if (tab === 'sim') {
    requestAnimationFrame(() => { fitCanvas(); resizeAnno(); });
  }
}

function toggleFullScreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement) {
    el.requestFullscreen?.();
    document.getElementById('fs-icon').className = 'fa-solid fa-compress';
  } else {
    document.exitFullscreen?.();
    document.getElementById('fs-icon').className = 'fa-solid fa-expand';
  }
}

function setViewMode(mode) {
  state.mode = mode;
  document.getElementById('mode-law').classList.toggle('active', mode === 'law');
  document.getElementById('mode-surface').classList.toggle('active', mode === 'surface');
  document.getElementById('mode-laws').classList.toggle('active', mode === 'laws');
  document.getElementById('surface-controls').classList.toggle('hidden', mode !== 'surface');
  updateTip();
  updateStatus();
}

function setSurface(s) {
  state.surface = s;
  document.getElementById('surf-smooth').classList.toggle('active', s === 'smooth');
  document.getElementById('surf-rough').classList.toggle('active', s === 'rough');
  document.getElementById('rough-wrap').classList.toggle('hidden', s !== 'rough');
  updateTip();
  updateStatus();
}

function toggleFlag(key) {
  state[key] = !state[key];
  const map = { showNormal:'tog-normal', showAngles:'tog-angles', showLabels:'tog-labels', showBeam:'tog-beam' };
  const el = document.getElementById(map[key]);
  if (el) el.classList.toggle('on', state[key]);
}

  state.angle = +document.getElementById('sl-i').value;
  updateUI();
}
function setPreset(a) {
  state.angle = a;
  document.getElementById('sl-i').value = a;
  updateUI();
}
function onRough() {
  state.roughness = +document.getElementById('sl-rough').value;
  document.getElementById('val-rough').textContent = state.roughness + '%';

  document.getElementById('val-i').textContent = state.angle + '°';

  updateStatus();
}

function updateTip() {
  let key = 'tip_law';
  if (state.mode === 'laws') key = 'tip_laws';
  else if (state.mode === 'surface') key = state.surface === 'rough' ? 'tip_rough' : 'tip_smooth';
  document.getElementById('tip-text').textContent = T(key);
}

function updateStatus() {
  const b = document.getElementById('status-banner');
  if (state.mode === 'laws') b.textContent = T('status_laws');
  else if (state.mode === 'surface') b.textContent = state.surface === 'rough' ? T('status_diffuse') : T('status_specular');
  else b.textContent = T('status_drag') + ' — ' + T('status_equal');

/* ============================================================
   ANNOTATION (Fabric.js) — exact logic + float helpers
============================================================ */
function initAnnotationCanvas(w, h) {
  if (fCanvas) {
    fCanvas.setWidth(w);
    fCanvas.setHeight(h);
    fCanvas.calcOffset();
    return;
  }
  fCanvas = new fabric.Canvas('fabricLayer', {
    isDrawingMode: false,
    width: w,
    height: h
  });
  fCanvas.freeDrawingBrush.color = document.getElementById('anno-color').value;
  fCanvas.freeDrawingBrush.width = 4;

  fCanvas.on('mouse:down', function(options) {
    if (isAnnoActive && !fCanvas.isDrawingMode && options.target) {
      fCanvas.remove(options.target);
    }
  });

  const fabricContainer = document.querySelector('.canvas-container');
  if (fabricContainer) fabricContainer.style.pointerEvents = 'none';
}

function toggleAnnotationMode() {
  isAnnoActive = !isAnnoActive;
  const btn = document.getElementById('btn-anno-toggle');
  const toolbar = document.getElementById('anno-toolbar');
  const fabricContainer = document.querySelector('.canvas-container');

  if (isAnnoActive) {
    btn.classList.replace('text-slate-400', 'text-cyan-400');
    toolbar.classList.remove('max-w-0', 'opacity-0');
    toolbar.classList.add('max-w-xs', 'opacity-100');
    if (fabricContainer) fabricContainer.style.pointerEvents = 'auto';
    setAnnoMode('pen');
  } else {
    btn.classList.replace('text-cyan-400', 'text-slate-400');
    toolbar.classList.remove('max-w-xs', 'opacity-100');
    toolbar.classList.add('max-w-0', 'opacity-0');
    if (fabricContainer) fabricContainer.style.pointerEvents = 'none';
    if (fCanvas) fCanvas.isDrawingMode = false;
  }
}

function setAnnoMode(mode) {
  document.getElementById('anno-pen').classList.replace('text-cyan-400', 'text-slate-400');
  document.getElementById('anno-eraser').classList.replace('text-cyan-400', 'text-slate-400');

  if (mode === 'pen') {
    document.getElementById('anno-pen').classList.replace('text-slate-400', 'text-cyan-400');
    if (fCanvas) fCanvas.isDrawingMode = true;
  } else {
    document.getElementById('anno-eraser').classList.replace('text-slate-400', 'text-cyan-400');
    if (fCanvas) fCanvas.isDrawingMode = false;
  }
}

function changeAnnoColor(color) {
  if (fCanvas) fCanvas.freeDrawingBrush.color = color;
  const f = document.getElementById('anno-color-float');
  if (f) f.value = color;
  setAnnoMode('pen');
}

function syncAnnoColor(color) {
  document.getElementById('anno-color').value = color;
  changeAnnoColor(color);
}

function clearAnnotations() {
  if (fCanvas) fCanvas.clear();
}

function ensureAnnoOn() {
  if (!isAnnoActive) toggleAnnotationMode();
}

function toggleAnnoFloat() {
  annoFloatOpen = !annoFloatOpen;
  const card = document.getElementById('anno-float');
  const icon = document.getElementById('anno-float-icon');
  card.classList.toggle('collapsed', !annoFloatOpen);
  icon.className = annoFloatOpen ? 'fa-solid fa-chevron-up' : 'fa-solid fa-pen-ruler';
}

function resizeAnno() {
  const wrap = document.getElementById('canvas-wrap');
  if (!wrap) return;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (w < 10 || h < 10) return;
  initAnnotationCanvas(w, h);
}

/* ============================================================
   ZOOM & PAN
============================================================ */
function S() { return baseScale * state.zoom; }

function zoomBy(k, cx, cy) {
  const old = state.zoom;
  state.zoom = Math.min(4, Math.max(0.45, state.zoom * k));
  const r = state.zoom / old;
  if (cx != null) {
    state.panX = cx - (cx - state.panX) * r;
    state.panY = cy - (cy - state.panY) * r;
  }
}

function resetView() {
  state.zoom = 1; state.panX = 0; state.panY = 0;
}

let dragging = false, lastPan = null, pinch = null;

function setupPointer() {
  const el = document.getElementById('sim-canvas');

  el.addEventListener('wheel', e => {
    if (isAnnoActive) return;
    e.preventDefault();
    zoomBy(e.deltaY < 0 ? 1.1 : 1/1.1, e.offsetX, e.offsetY);
  }, { passive: false });

  el.addEventListener('pointerdown', e => {
    if (isAnnoActive) return;
    const rect = el.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    if (rayHandle && Math.hypot(x - rayHandle.x, y - rayHandle.y) < 28) {
      draggingRay = true;
      el.setPointerCapture(e.pointerId);
      return;
    }
    dragging = true;
    lastPan = { x: e.clientX, y: e.clientY };
    el.setPointerCapture(e.pointerId);
    el.classList.replace('cursor-grab', 'cursor-grabbing');
  });

  el.addEventListener('pointermove', e => {
    if (isAnnoActive) return;
    const rect = el.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;

    if (draggingRay) {
      const O = world(0, 80);
      const vx = x - O.x, vy = y - O.y;
      // Angle from upward normal (0,-1); magnitude is incidence angle
      if (vy < -8) {
        let i = Math.abs(Math.atan2(vx, -vy) * 180 / Math.PI);
        i = Math.max(5, Math.min(80, Math.round(i)));
        state.angle = i;
        document.getElementById('sl-i').value = state.angle;
        updateUI();
      }
      return;
    }

    if (!dragging || !lastPan) return;
    state.panX += e.clientX - lastPan.x;
    state.panY += e.clientY - lastPan.y;
    lastPan = { x: e.clientX, y: e.clientY };
  });

  el.addEventListener('pointerup', () => {
    dragging = false; draggingRay = false; lastPan = null;
    el.classList.replace('cursor-grabbing', 'cursor-grab');
  });
  el.addEventListener('pointercancel', () => { dragging = false; draggingRay = false; lastPan = null; });

  el.addEventListener('touchstart', e => {
    if (isAnnoActive) return;
    if (e.touches.length === 2) {
      const pts = [...e.touches].map(t => ({ x: t.clientX, y: t.clientY }));
      pinch = { d: Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y), z: state.zoom };
      dragging = false; draggingRay = false;
    }
  }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (isAnnoActive || !pinch || e.touches.length !== 2) return;
    e.preventDefault();
    const pts = [...e.touches].map(t => ({ x: t.clientX, y: t.clientY }));
    const d = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    const target = pinch.z * (d / pinch.d);
    zoomBy(target / state.zoom, (pts[0].x+pts[1].x)/2 - el.getBoundingClientRect().left,
                                  (pts[0].y+pts[1].y)/2 - el.getBoundingClientRect().top);
  }, { passive: false });
  el.addEventListener('touchend', () => { pinch = null; });
}

/* ============================================================
   CANVAS DRAWING
============================================================ */
function fitCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  canvas = document.getElementById('sim-canvas');
  if (!wrap || !canvas) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = wrap.clientWidth, h = wrap.clientHeight;
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  baseScale = Math.min(w / 900, h / 560);
  resizeAnno();
}

function world(x, y) {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const s = S();
  return {
    x: w/2 + state.panX + x * s,
    y: h/2 + state.panY + y * s
  };
}

function enFont(sz) { return `700 ${sz}px Oxanium, Manrope, sans-serif`; }
function urFont(sz) { return `600 ${sz}px 'Jameel Noori Nastaliq','Noto Nastaliq Urdu',serif`; }
function Lfont(sz) { return lang === 'ur' ? urFont(sz) : enFont(sz); }

function drawArrow(x1, y1, x2, y2, color, width) {
  const s = S();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = Math.max(2, width * s);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  const ang = Math.atan2(y2 - y1, x2 - x1);
  const ah = 12 * s;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - ah * Math.cos(ang - 0.4), y2 - ah * Math.sin(ang - 0.4));
  ctx.lineTo(x2 - ah * Math.cos(ang + 0.4), y2 - ah * Math.sin(ang + 0.4));
  ctx.closePath();
  ctx.fill();
}

function drawLabel(text, x, y, color, size) {
  const s = S();
  ctx.font = Lfont(Math.max(11, size * s));
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const pad = 6 * s;
  const tw = ctx.measureText(text).width;
  ctx.fillStyle = 'rgba(15,23,42,0.75)';
  ctx.beginPath();
  roundRect(ctx, x - tw/2 - pad, y - size*s*0.7 - pad*0.3, tw + pad*2, size*s*1.4 + pad*0.6, 8*s);
  ctx.fill();
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function roundRect(c, x, y, w, h, r) {
  c.moveTo(x+r, y);
  c.arcTo(x+w, y, x+w, y+h, r);
  c.arcTo(x+w, y+h, x, y+h, r);
  c.arcTo(x, y+h, x, y, r);
  c.arcTo(x, y, x+w, y, r);
  c.closePath();
}

function drawMirror(rough) {
  const s = S();
  const left = world(-380, 80);
  const right = world(380, 80);
  const O = world(0, 80);

  // Mirror body
  ctx.fillStyle = 'rgba(100,116,139,0.55)';
  ctx.fillRect(left.x, O.y, right.x - left.x, 18 * s);

  // Top shiny edge
  ctx.strokeStyle = rough ? '#94a3b8' : '#e2e8f0';
  ctx.lineWidth = Math.max(2, 3 * s);
  ctx.beginPath();
  if (!rough) {
    ctx.moveTo(left.x, O.y);
    ctx.lineTo(right.x, O.y);
  } else {
    // jagged rough surface
    const amp = (state.roughness / 100) * 10 * s;
    ctx.moveTo(left.x, O.y);
    for (let x = left.x; x <= right.x; x += 8 * s) {
      const n = Math.sin(x * 0.08) * amp + Math.sin(x * 0.21) * amp * 0.5;
      ctx.lineTo(x, O.y + n);
    }
  }
  ctx.stroke();

  // Hatch marks under mirror
  ctx.strokeStyle = 'rgba(148,163,184,0.45)';
  ctx.lineWidth = Math.max(1, 1.5 * s);
  for (let x = left.x + 10*s; x < right.x; x += 16*s) {
    ctx.beginPath();
    ctx.moveTo(x, O.y + 18*s);
    ctx.lineTo(x - 10*s, O.y + 30*s);
    ctx.stroke();
  }

  // Labels P O Q
  if (state.showLabels) {
    drawLabel('P', left.x + 20*s, O.y + 48*s, '#94a3b8', 13);
    drawLabel('Q', right.x - 20*s, O.y + 48*s, '#94a3b8', 13);
    drawLabel('O', O.x, O.y + 48*s, '#fbbf24', 13);
    drawLabel(T('lbl_mirror'), O.x, O.y + 78*s, '#94a3b8', 12);
  }
}

function drawNormal() {
  if (!state.showNormal && state.mode !== 'laws') return;
  const s = S();
  const O = world(0, 80);
  const N = world(0, -220);
  ctx.save();
  ctx.setLineDash([8*s, 6*s]);
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = Math.max(1.5, 2.2 * s);
  ctx.beginPath();
  ctx.moveTo(O.x, O.y);
  ctx.lineTo(N.x, N.y);
  ctx.stroke();
  ctx.restore();

  // Right-angle mark
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = Math.max(1, 1.5*s);
  const m = 14 * s;
  ctx.beginPath();
  ctx.moveTo(O.x, O.y - m);
  ctx.lineTo(O.x + m, O.y - m);
  ctx.lineTo(O.x + m, O.y);
  ctx.stroke();

  if (state.showLabels) {
    drawLabel('N', N.x, N.y - 18*s, '#38bdf8', 14);
    drawLabel(T('lbl_normal'), N.x + 70*s, N.y + 40*s, '#7dd3fc', 12);
  }
}

function rayEnds(angleDeg, length) {
  // angle from normal, incident from LEFT
  const rad = angleDeg * Math.PI / 180;
  const O = { x: 0, y: 80 };
  const inc = {
    x: O.x - Math.sin(rad) * length,
    y: O.y - Math.cos(rad) * length
  };
  const ref = {
    x: O.x + Math.sin(rad) * length,
    y: O.y - Math.cos(rad) * length
  };
  return { O, inc, ref, rad };
}

function drawRays() {
  const s = S();
  const len = 280;
  const { O, inc, ref, rad } = rayEnds(state.angle, len);
  const Os = world(O.x, O.y);
  const As = world(inc.x, inc.y);
  const Bs = world(ref.x, ref.y);

  // Soft glow wedges for angles
  if (state.showAngles) {
    const R = 70 * s;
    // incidence wedge (red)
    ctx.beginPath();
    ctx.moveTo(Os.x, Os.y);
    ctx.arc(Os.x, Os.y, R, -Math.PI/2 - rad, -Math.PI/2, false);
    ctx.closePath();
    ctx.fillStyle = 'rgba(239,68,68,0.18)';
    ctx.fill();
    // reflection wedge (green)
    ctx.beginPath();
    ctx.moveTo(Os.x, Os.y);
    ctx.arc(Os.x, Os.y, R, -Math.PI/2, -Math.PI/2 + rad, false);
    ctx.closePath();
    ctx.fillStyle = 'rgba(34,197,94,0.18)';
    ctx.fill();

    const midI = world(-Math.sin(rad/2)*95, 80 - Math.cos(rad/2)*95);
    const midR = world(Math.sin(rad/2)*95, 80 - Math.cos(rad/2)*95);
    drawLabel(T('lbl_i') + ' = ' + state.angle + '°', midI.x - 10*s, midI.y, '#f87171', 13);
    drawLabel(T('lbl_r') + ' = ' + state.angle + '°', midR.x + 10*s, midR.y, '#4ade80', 13);
  }

  // Beam bundle (extra parallel-ish rays)
  if (state.showBeam && state.mode !== 'surface') {
    for (let k = -2; k <= 2; k++) {
      if (k === 0) continue;
      const off = k * 14;
      const O2 = world(off, 80);
      const A2 = world(inc.x + off, inc.y);
      const B2 = world(ref.x + off, ref.y);
      ctx.globalAlpha = 0.35;
      drawArrow(A2.x, A2.y, O2.x, O2.y, '#f87171', 1.5);
      drawArrow(O2.x, O2.y, B2.x, B2.y, '#4ade80', 1.5);
      ctx.globalAlpha = 1;
    }
  }

  // Main rays
  drawArrow(As.x, As.y, Os.x, Os.y, '#ef4444', 3.2);
  drawArrow(Os.x, Os.y, Bs.x, Bs.y, '#22c55e', 3.2);

  // Drag handle on incident end
  rayHandle = { x: As.x, y: As.y };
  ctx.beginPath();
  ctx.arc(As.x, As.y, 12 * s, 0, Math.PI * 2);
  ctx.fillStyle = '#ef4444';
  ctx.shadowColor = 'rgba(239,68,68,0.7)';
  ctx.shadowBlur = 16;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Point of incidence
  ctx.beginPath();
  ctx.arc(Os.x, Os.y, 5 * s, 0, Math.PI * 2);
  ctx.fillStyle = '#fbbf24';
  ctx.fill();

  if (state.showLabels) {
    drawLabel(T('lbl_incident'), As.x - 40*s, As.y - 24*s, '#fca5a5', 12);
    drawLabel(T('lbl_reflected'), Bs.x + 40*s, Bs.y - 24*s, '#86efac', 12);
    drawLabel(T('lbl_poi'), Os.x + 70*s, Os.y - 18*s, '#fbbf24', 11);
  }
}

function drawDiffuse() {
  const s = S();
  const len = 260;
  const { O, inc } = rayEnds(state.angle, len);
  const Os = world(O.x, O.y);
  const As = world(inc.x, inc.y);

  drawArrow(As.x, As.y, Os.x, Os.y, '#ef4444', 3.2);
  rayHandle = { x: As.x, y: As.y };
  ctx.beginPath();
  ctx.arc(As.x, As.y, 12 * s, 0, Math.PI * 2);
  ctx.fillStyle = '#ef4444';
  ctx.fill();

  // Scattered rays
  const n = 7;
  const spread = (state.roughness / 100) * 55;
  for (let i = 0; i < n; i++) {
    const a = state.angle + (i - (n-1)/2) * (spread / ((n-1)/2 || 1));
    const clamped = Math.max(5, Math.min(85, a));
    const rad = clamped * Math.PI / 180;
    const rx = O.x + Math.sin(rad) * (180 + (i%3)*20);
    const ry = O.y - Math.cos(rad) * (180 + (i%3)*20);
    const Bs = world(rx, ry);
    ctx.globalAlpha = 0.45 + (i === Math.floor(n/2) ? 0.35 : 0);
    drawArrow(Os.x, Os.y, Bs.x, Bs.y, '#4ade80', 2);
    ctx.globalAlpha = 1;
  }

  if (state.showLabels) {
    drawLabel(T('lbl_incident'), As.x - 40*s, As.y - 24*s, '#fca5a5', 12);
    drawLabel(T('surf_rough'), Os.x, Os.y + 100*s, '#fbbf24', 13);
  }
}

function drawLawsPanel() {
  const s = S();
  // Still draw the geometry so laws are visible
  drawMirror(false);
  drawNormal();
  drawRays();

  const cards = [
    { t: T('lbl_law1'), c: '#22c55e' },
    { t: T('lbl_law2'), c: '#38bdf8' },
    { t: T('lbl_law3'), c: '#a78bfa' }
  ];
  const start = world(-360, -250);
  cards.forEach((card, i) => {
    const y = start.y + i * 48 * s;
    ctx.fillStyle = 'rgba(15,23,42,0.82)';
    ctx.strokeStyle = card.c;
    ctx.lineWidth = 2;
    ctx.beginPath();
    roundRect(ctx, start.x, y, 520 * s, 40 * s, 10 * s);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = card.c;
    ctx.font = Lfont(Math.max(11, 13 * s));
    ctx.textAlign = lang === 'ur' ? 'right' : 'left';
    ctx.textBaseline = 'middle';
    const tx = lang === 'ur' ? start.x + 500*s : start.x + 16*s;
    ctx.fillText(card.t, tx, y + 20*s);
  });
}

function drawFrame() {
  if (!ctx || !canvas) return;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);

  // subtle vignette
  const g = ctx.createRadialGradient(w/2, h/2, 40, w/2, h/2, Math.max(w,h)*0.7);
  g.addColorStop(0, 'rgba(15,23,42,0)');
  g.addColorStop(1, 'rgba(2,6,23,0.35)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  if (state.mode === 'laws') {
    drawLawsPanel();
  } else if (state.mode === 'surface' && state.surface === 'rough') {
    drawMirror(true);
    if (state.showNormal) drawNormal();
    drawDiffuse();
  } else {
    drawMirror(false);
    drawNormal();
    drawRays();
  }
}

function loop() {
  drawFrame();
  requestAnimationFrame(loop);
}

/* ============================================================
   QUIZ
============================================================ */
let quizIdx = 0, quizScore = 0, quizAnswered = false, quizDone = false;

function renderQuiz() {
  const box = document.getElementById('quiz-box');
  const questions = LANG[lang].quiz;

  if (quizDone) {
    const pct = Math.round((quizScore / questions.length) * 100);
    box.innerHTML = `
      <div class="text-center fade-in space-y-6">
        <div class="text-5xl text-cyan-400"><i class="fa-solid fa-trophy score-ring"></i></div>
        <h2 class="font-display text-2xl md:text-3xl font-extrabold text-cyan-300">${T('score_title')}</h2>
        <div class="grid grid-cols-2 gap-4 max-w-md mx-auto">
          <div class="glass-panel rounded-2xl p-5">
            <div class="text-slate-400 text-sm mb-1">${T('your_score')}</div>
            <div class="stat-val text-3xl num">${quizScore}/${questions.length}</div>
          </div>
          <div class="glass-panel rounded-2xl p-5">
            <div class="text-slate-400 text-sm mb-1">${T('pct_label')}</div>
            <div class="stat-val text-3xl num">${pct}%</div>
          </div>
        </div>
        <button onclick="restartQuiz()" class="px-8 py-3 rounded-xl font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 hover:bg-cyan-500/30 transition glow-cyan">
          <i class="fa-solid fa-rotate-right"></i> ${T('restart')}
        </button>
      </div>`;
    return;
  }

  const q = questions[quizIdx];
  const letters = ['A','B','C','D'];
  box.innerHTML = `
    <div class="fade-in space-y-5">
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <h2 class="font-display text-xl md:text-2xl font-extrabold text-cyan-300">${T('quiz_title')}</h2>
        <span class="text-sm text-slate-400 font-bold">${T('quiz_progress')(quizIdx+1, questions.length)}</span>
      </div>
      <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
        <div class="h-full bg-cyan-400 transition-all" style="width:${((quizIdx)/questions.length)*100}%"></div>
      </div>
      <p class="text-lg md:text-xl font-bold text-slate-100 leading-relaxed">${q.q}</p>
      <div class="space-y-3" id="opt-list">
        ${q.opts.map((o,i)=>`
          <button class="opt-btn w-full text-start px-4 py-4 rounded-xl font-semibold text-slate-200 bg-slate-900/50"
            onclick="answerQuiz(${i})" data-idx="${i}">
            <span class="inline-flex w-8 h-8 items-center justify-center rounded-lg bg-slate-800 text-cyan-400 text-sm me-3 num">${letters[i]}</span>
            ${o}
          </button>`).join('')}
      </div>
      <div id="quiz-fb" class="hidden glass-panel rounded-xl px-4 py-3 text-sm"></div>
      <div class="flex justify-end">
        <button id="quiz-next" onclick="nextQuiz()" class="hidden px-6 py-3 rounded-xl font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 hover:bg-cyan-500/30 transition"></button>
      </div>
    </div>`;
  quizAnswered = false;
}

function answerQuiz(i) {
  if (quizAnswered) return;
  quizAnswered = true;
  const q = LANG[lang].quiz[quizIdx];
  const btns = document.querySelectorAll('#opt-list .opt-btn');
  btns.forEach(b => b.classList.add('locked'));
  btns[i].classList.add(i === q.a ? 'correct' : 'wrong');
  if (i !== q.a) btns[q.a].classList.add('correct');
  if (i === q.a) quizScore++;

  const fb = document.getElementById('quiz-fb');
  fb.classList.remove('hidden');
  fb.innerHTML = `<span class="font-bold ${i===q.a?'text-green-400':'text-red-400'}">${i===q.a?T('correct_fb'):T('wrong_fb')}</span>
    <span class="text-slate-300 ms-2">${q.ex}</span>`;

  const next = document.getElementById('quiz-next');
  next.classList.remove('hidden');
  next.textContent = quizIdx === LANG[lang].quiz.length - 1 ? T('see_results') : T('next_q');
}

function nextQuiz() {
  if (quizIdx >= LANG[lang].quiz.length - 1) {
    quizDone = true;
    renderQuiz();
    return;
  }
  quizIdx++;
  renderQuiz();
}

function restartQuiz() {
  quizIdx = 0; quizScore = 0; quizAnswered = false; quizDone = false;
  renderQuiz();
}

/* ============================================================
   BOOT
============================================================ */
function boot() {
  changeLanguage(lang);
  fitCanvas();
  setupPointer();
  updateUI();
  updateTip();
  loop();

  window.addEventListener('resize', () => { fitCanvas(); });

  // Intro ~5s
  setTimeout(() => {
    const intro = document.getElementById('intro');
    const app = document.getElementById('app');
    intro.style.opacity = '0';
    setTimeout(() => {
      intro.style.display = 'none';
      app.classList.remove('opacity-0');
      fitCanvas();
      resizeAnno();
    }, 800);
  }, 5000);
}

document.addEventListener('DOMContentLoaded', boot);
</script>
