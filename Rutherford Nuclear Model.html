<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<script>
if(window.top===window.self){
document.documentElement.innerHTML="<h1 style='color:red;text-align:center;margin-top:50px;font-family:sans-serif;'>Access Denied! Please open this lesson through the Smart Panel App.</h1>";

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IQRA VIRTUAL LAB — Rutherford’s Nuclear Model</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&family=Manrope:wght@400;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/jameel-noori-nastaleeq" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<style>
/* Custom Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #0f172a; }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #475569; }

/* RTL Styling Adjustments for Urdu with Jameel Noori Nastaliq */
[dir="rtl"] .rtl-flip { transform: scaleX(-1); }
[dir="rtl"] {
  font-family: 'Jameel Noori Nastaliq', 'Noto Nastaliq Urdu', serif !important;
  line-height: 2.3 !important;
}

/* Glassmorphism Classes */
.glass-panel {
  background: rgba(15, 23, 42, 0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.1);
}
.glass-card {
  background: rgba(30, 41, 59, 0.6);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.08);
}

/* Pulse Glow Effects */
.glow-cyan { box-shadow: 0 0 20px rgba(0, 243, 255, 0.35); }
.glow-red { box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
.glow-green { box-shadow: 0 0 20px rgba(34, 197, 94, 0.35); }

/* Canvas styling */
canvas { touch-action: none; }

/* Custom Slider Styling */
input[type=range] {
  -webkit-appearance: none;
  background: #334155;
  border-radius: 8px;
  height: 8px;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  height: 20px; width: 20px; border-radius: 50%;
  background: #00f3ff; cursor: pointer;
  box-shadow: 0 0 10px #00f3ff;
  transition: transform 0.1s ease;
}
input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }

/* ============ Extended design language ============ */
html, body { height: 100%; margin: 0; }
body {
  font-family: 'Manrope', sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  overflow: hidden;
}
.font-display { font-family: 'Oxanium', 'Manrope', sans-serif; }
[dir="rtl"] .font-display { font-family: 'Jameel Noori Nastaliq', 'Noto Nastaliq Urdu', serif; }
[dir="rtl"] body, [dir="rtl"] { font-size: 1.08em; }

.bg-grid {
  background-image:
    linear-gradient(rgba(0,243,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,243,255,0.04) 1px, transparent 1px);
  background-size: 44px 44px;
}

#intro {
  position: fixed; inset: 0; z-index: 100;
  background: radial-gradient(ellipse at center, #10233f 0%, #0f172a 65%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity .7s ease;
}
.intro-title {
  font-family: 'Oxanium', sans-serif;
  font-weight: 800; letter-spacing: .14em;
  background: linear-gradient(92deg, #00f3ff, #7dd3fc, #fbbf24, #00f3ff);
  background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: introZoom 1.6s cubic-bezier(.2,.8,.2,1) both, glowPulse 2s ease-in-out infinite, shimmer 3s linear infinite;
}
.intro-topic {
  color: #94a3b8; letter-spacing: .18em;
  animation: introFade 1.4s .35s ease both;
  text-align: center; max-width: 90vw;
}
.intro-ring {
  width: 160px; height: 160px; border-radius: 50%;
  border: 2px solid rgba(0,243,255,.35);
  box-shadow: 0 0 60px rgba(0,243,255,.25), inset 0 0 40px rgba(0,243,255,.12);
  display:flex; align-items:center; justify-content:center;
  animation: ringSpin 2.4s linear infinite, introZoom 1.2s ease both;
  margin-bottom: 28px; position: relative;
}
.intro-ring::before {
  content:''; position:absolute; inset:-10px; border-radius:50%;
  border-top: 2px solid #00f3ff; border-right: 2px solid transparent;
  border-bottom: 2px solid transparent; border-left: 2px solid transparent;
}
@keyframes ringSpin { to { transform: rotate(360deg); } }
@keyframes introZoom { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
@keyframes introFade { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes glowPulse {
  0%,100% { text-shadow: 0 0 24px rgba(0,243,255,.55); }
  50% { text-shadow: 0 0 54px rgba(0,243,255,.9); }
}
@keyframes shimmer { 0%{ background-position:0% 0; } 100%{ background-position:200% 0; } }

.tab-btn {
  position: relative; transition: color .25s ease, background-color .25s ease;
  border-radius: 12px;
}
.tab-btn.active {
  color: #00f3ff; background: rgba(0,243,255,.08);
  box-shadow: inset 0 0 0 1px rgba(0,243,255,.35), 0 0 18px rgba(0,243,255,.15);
}
.view { animation: viewIn .35s ease both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.mode-btn {
  transition: background-color .25s ease, color .25s ease, box-shadow .25s ease, transform .15s ease;
  border: 1px solid rgba(255,255,255,.1);
}
.mode-btn:active { transform: scale(.96); }
.mode-btn.active {
  background: rgba(0,243,255,.12); color: #00f3ff;
  border-color: rgba(0,243,255,.5); box-shadow: 0 0 16px rgba(0,243,255,.25);
}

.opt-btn {
  transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .12s ease;
  border: 1px solid rgba(255,255,255,.1);
}
.opt-btn:not(.locked):hover { border-color: rgba(0,243,255,.45); background: rgba(0,243,255,.06); }
.opt-btn:not(.locked):active { transform: scale(.98); }
.opt-btn.correct { background: rgba(34,197,94,.16); border-color:#22c55e; box-shadow: 0 0 18px rgba(34,197,94,.3); }
.opt-btn.wrong { background: rgba(239,68,68,.14); border-color:#ef4444; box-shadow: 0 0 18px rgba(239,68,68,.3); }

.zoom-btn {
  width: 42px; height: 42px; border-radius: 12px;
  background: rgba(15,23,42,.8); border:1px solid rgba(255,255,255,.12);
  color:#00f3ff; display:flex; align-items:center; justify-content:center;
  backdrop-filter: blur(8px); cursor:pointer;
  transition: background-color .2s ease, box-shadow .2s ease, transform .12s ease;
}
.zoom-btn:hover { background: rgba(0,243,255,.12); box-shadow: 0 0 14px rgba(0,243,255,.25); }
.zoom-btn:active { transform: scale(.92); }

.stat-val { font-family: 'Oxanium', monospace; color:#00f3ff; }
[dir="rtl"] .stat-val { font-family: 'Oxanium', monospace !important; line-height: 1.4 !important; }
.num { font-family:'Oxanium', monospace !important; line-height:1.4 !important; direction:ltr; unicode-bidi:embed; }

.fade-in { animation: viewIn .4s ease both; }
.score-ring { filter: drop-shadow(0 0 14px rgba(0,243,255,.5)); }

/* Fabric overlay */
#fabricLayer, .canvas-container {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  z-index: 20;
  pointer-events: none;
}
.canvas-container canvas { position: absolute !important; left: 0 !important; top: 0 !important; }

/* Floating annotation card (minimizable) */
#anno-float {
  position: absolute; z-index: 30; left: 12px; top: 56px;
  transition: all .3s ease;
  cursor: grab;
}
#anno-float.minimized .anno-float-body { display: none; }
#anno-float.minimized { width: auto; }

.chip {
  display:inline-flex; align-items:center; gap:.35rem;
  padding:.2rem .55rem; border-radius:999px; font-size:.72rem; font-weight:600;
  background:rgba(0,243,255,0.10); color:#7dd3fc; border:1px solid rgba(0,243,255,0.25);
}
.chip.warm { background:rgba(245,158,11,0.12); color:#fbbf24; border-color:rgba(245,158,11,0.35); }
.chip.danger { background:rgba(239,68,68,0.12); color:#fca5a5; border-color:rgba(239,68,68,0.35); }
.chip.ok { background:rgba(34,197,94,0.12); color:#86efac; border-color:rgba(34,197,94,0.35); }
</style>
</head>
<body class="bg-grid">

<div id="intro">
  <div class="intro-ring"><i class="fa-solid fa-atom text-5xl text-cyan-300" style="filter:drop-shadow(0 0 14px rgba(0,243,255,.8))"></i></div>
  <div class="intro-title text-4xl sm:text-5xl lg:text-6xl">IQRA VIRTUAL LAB</div>
  <div class="intro-topic text-base md:text-lg mt-5 font-bold uppercase" id="intro-topic">Rutherford’s Nuclear Model of Atom</div>
</div>

<div id="app" class="h-screen flex flex-col opacity-0 transition-opacity duration-700">

  <!-- HEADER -->
  <header class="glass-panel flex items-center justify-between px-4 md:px-6 py-3 z-30 shrink-0">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-10 h-10 rounded-xl bg-slate-900 border border-cyan-500/40 glow-cyan flex items-center justify-center shrink-0">
        <i class="fa-solid fa-flask text-cyan-400"></i>
      </div>
      <div class="min-w-0">
        <div class="font-display font-extrabold tracking-widest text-cyan-400 text-sm md:text-base" style="font-family:'Oxanium',sans-serif !important;">IQRA VIRTUAL LAB</div>
        <div class="text-xs text-slate-400 truncate" data-i18n="topic"></div>
      </div>
    </div>

    <nav class="flex items-center gap-2 glass-card rounded-2xl p-1.5">
      <button id="tab-sim" onclick="switchTab('sim')" class="tab-btn active px-3 md:px-6 py-2.5 font-bold text-sm md:text-base text-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-house"></i><span data-i18n="tab_sim"></span>
      </button>
      <button id="tab-quiz" onclick="switchTab('quiz')" class="tab-btn px-3 md:px-6 py-2.5 font-bold text-sm md:text-base text-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-clipboard-question"></i><span data-i18n="tab_quiz"></span>
      </button>
    </nav>

    <div class="flex items-center gap-3">
      <!-- Annotation Toolbar (Hidden by default) -->
      <div id="anno-toolbar" class="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 transition-all duration-300 max-w-0 overflow-hidden opacity-0">
        <input type="color" id="anno-color" value="#00f3ff" onchange="changeAnnoColor(this.value)" class="w-6 h-6 cursor-pointer bg-transparent border-0 p-0" title="Color">
        <button id="anno-pen" onclick="setAnnoMode('pen')" class="text-cyan-400 p-1.5 rounded hover:bg-slate-700 transition" title="Pen"><i class="fa-solid fa-pen"></i></button>
        <button id="anno-eraser" onclick="setAnnoMode('eraser')" class="text-slate-400 p-1.5 rounded hover:bg-slate-700 transition" title="Eraser"><i class="fa-solid fa-eraser"></i></button>
        <button onclick="clearAnnotations()" class="text-red-400 p-1.5 rounded hover:bg-slate-700 transition" title="Clear All"><i class="fa-solid fa-trash-can"></i></button>
      </div>

      <!-- Annotation Toggle Button -->
      <button id="btn-anno-toggle" onclick="toggleAnnotationMode()" class="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 flex items-center justify-center border border-slate-700 transition" title="Toggle Annotation">
        <i class="fa-solid fa-pen-nib"></i>
      </button>

      <!-- Language Selector -->
      <div class="relative">
        <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-slate-900 border border-slate-700 text-cyan-400 text-sm rounded-lg focus:ring-cyan-500 focus:border-cyan-500 px-3 py-2 cursor-pointer font-bold outline-none">
          <option value="en">🌐 English</option>
          <option value="ur">🌐 اردو</option>
          <option value="hi" disabled>🌐 हिंदी (Soon)</option>
          <option value="bn" disabled>🌐 বাংলা (Soon)</option>
          <option value="ta" disabled>🌐 தமிழ் (Soon)</option>
        </select>
      </div>

      <!-- Fullscreen Button -->
      <button onclick="toggleFullScreen()" class="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-400 flex items-center justify-center border border-slate-700 transition" title="Toggle Fullscreen">
        <i class="fa-solid fa-expand" id="fs-icon"></i>
      </button>
    </div>
  </header>

  <!-- ===================== SIMULATION VIEW ===================== -->
  <main id="view-sim" class="view flex-1 flex flex-col lg:flex-row gap-4 p-4 min-h-0 overflow-y-auto lg:overflow-hidden">

    <section class="flex-1 flex flex-col gap-3 min-h-0 min-w-0">
      <!-- Mode selector -->
      <div class="glass-card rounded-2xl p-2 flex flex-wrap gap-2">
        <button id="mode-macro" onclick="setMode('macro')" class="mode-btn active flex-1 min-w-[140px] px-4 py-3 rounded-xl font-bold text-sm md:text-base text-slate-300 flex items-center justify-center gap-2">
          <i class="fa-solid fa-flask-vial"></i><span data-i18n="mode_macro"></span>
        </button>
        <button id="mode-micro" onclick="setMode('micro')" class="mode-btn flex-1 min-w-[140px] px-4 py-3 rounded-xl font-bold text-sm md:text-base text-slate-300 flex items-center justify-center gap-2">
          <i class="fa-solid fa-atom"></i><span data-i18n="mode_micro"></span>
        </button>
      </div>

      <!-- Canvas viewport -->
      <div id="canvas-wrap" class="glass-card rounded-2xl relative flex-1 min-h-[340px] overflow-hidden">
        <canvas id="sim-canvas" class="absolute inset-0 w-full h-full cursor-grab"></canvas>
        <canvas id="fabricLayer"></canvas>

        <!-- Floating annotation controls card -->
        <div id="anno-float" class="glass-panel rounded-xl shadow-xl minimized hidden">
          <div class="flex items-center gap-2 px-3 py-2 border-b border-white/5">
            <i class="fa-solid fa-pen-ruler text-cyan-400 text-sm"></i>
            <span class="text-xs font-bold text-cyan-300" data-i18n="anno_title">Annotate</span>
            <button onclick="toggleAnnoFloat()" class="ml-auto w-7 h-7 rounded-lg bg-slate-800 text-slate-300 hover:text-cyan-300 flex items-center justify-center" title="Minimize">
              <i class="fa-solid fa-minus" id="anno-float-icon"></i>
            </button>
          </div>
          <div class="anno-float-body flex items-center gap-2 px-3 py-2">
            <input type="color" id="anno-color-float" value="#00f3ff" onchange="syncAnnoColor(this.value)" class="w-7 h-7 cursor-pointer bg-transparent border-0 p-0">
            <button onclick="setAnnoMode('pen')" class="text-cyan-400 p-1.5 rounded hover:bg-slate-700"><i class="fa-solid fa-pen"></i></button>
            <button onclick="setAnnoMode('eraser')" class="text-slate-400 p-1.5 rounded hover:bg-slate-700"><i class="fa-solid fa-eraser"></i></button>
            <button onclick="clearAnnotations()" class="text-red-400 p-1.5 rounded hover:bg-slate-700"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        </div>

        <div class="absolute bottom-3 flex flex-col gap-2 z-10" style="inset-inline-end:12px" dir="ltr">
          <button class="zoom-btn" onclick="zoomBy(1.2)" title="+"><i class="fa-solid fa-plus"></i></button>
          <button class="zoom-btn" onclick="zoomBy(1/1.2)" title="-"><i class="fa-solid fa-minus"></i></button>
          <button class="zoom-btn" onclick="resetView()" title="Reset"><i class="fa-solid fa-crosshairs"></i></button>
        </div>
        <div id="drag-hint" class="absolute top-3 glass-panel rounded-xl px-4 py-2 text-xs md:text-sm text-cyan-300 pointer-events-none z-10" style="inset-inline-start:12px">
          <i class="fa-solid fa-hand-pointer"></i> <span data-i18n="drag_hint"></span>
        </div>
      </div>
    </section>

    <!-- SIDE PANEL -->
    <aside class="w-full lg:w-[340px] xl:w-[380px] flex flex-col gap-4 lg:overflow-y-auto lg:min-h-0 shrink-0 pb-2">

      <!-- CONTROLS MACRO -->
      <div id="panel-macro" class="glass-card rounded-2xl p-5 space-y-5">
        <h2 class="font-display font-bold text-base text-cyan-400 flex items-center gap-2">
          <i class="fa-solid fa-sliders"></i><span data-i18n="ctrl_title"></span>
        </h2>

        <div class="flex gap-2">
          <button id="btn-fire" onclick="toggleBeam()" class="flex-1 mode-btn active px-3 py-3 rounded-xl font-bold text-sm flex items-center justify-center gap-2">
            <i class="fa-solid fa-play" id="fire-icon"></i><span data-i18n="btn_fire"></span>
          </button>
          <button onclick="resetCounters()" class="px-4 py-3 rounded-xl font-bold text-sm glass-panel text-slate-300 hover:text-cyan-300">
            <i class="fa-solid fa-rotate-left"></i>
          </button>
        </div>

        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-bold text-slate-300" data-i18n="beam_rate"></label>
            <span class="stat-val text-sm num" id="val-rate">40 /s</span>
          </div>
          <input type="range" id="sl-rate" class="w-full" min="5" max="120" step="5" value="40" oninput="onSlider()">
        </div>

        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-bold text-slate-300" data-i18n="foil_thick"></label>
            <span class="stat-val text-sm num" id="val-thick">1.0×</span>
          </div>
          <input type="range" id="sl-thick" class="w-full" min="0.5" max="4" step="0.1" value="1" oninput="onSlider()">
          <div class="text-[10px] text-slate-500 mt-1 mono num">~10<sup>−4</sup> mm</div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-bold text-slate-300" data-i18n="foil_mat"></label>
            <span class="stat-val text-sm" id="val-mat">Au</span>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <button id="mat-au" onclick="setMaterial('au')" class="mode-btn active px-2 py-2.5 rounded-xl font-bold text-xs">Au</button>
            <button id="mat-al" onclick="setMaterial('al')" class="mode-btn px-2 py-2.5 rounded-xl font-bold text-xs">Al</button>
            <button id="mat-pb" onclick="setMaterial('pb')" class="mode-btn px-2 py-2.5 rounded-xl font-bold text-xs">Pb</button>
          </div>
        </div>
      </div>

      <!-- CONTROLS MICRO -->
      <div id="panel-micro" class="glass-card rounded-2xl p-5 space-y-5 hidden">
        <h2 class="font-display font-bold text-base text-cyan-400 flex items-center gap-2">
          <i class="fa-solid fa-sliders"></i><span data-i18n="micro_ctrl"></span>
        </h2>

        <div class="flex gap-2">
          <button id="btn-launch" onclick="launchAlpha()" class="flex-1 mode-btn active px-3 py-3 rounded-xl font-bold text-sm flex items-center justify-center gap-2">
            <i class="fa-solid fa-bolt"></i><span data-i18n="btn_launch"></span>
          </button>
          <button onclick="clearTrails()" class="px-4 py-3 rounded-xl font-bold text-sm glass-panel text-slate-300 hover:text-cyan-300">
            <i class="fa-solid fa-eraser"></i>
          </button>
        </div>

        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-bold text-slate-300" data-i18n="impact_b"></label>
            <span class="stat-val text-sm num" id="val-b">40</span>
          </div>
          <input type="range" id="sl-b" class="w-full" min="0" max="120" step="1" value="40" oninput="onSlider()">
          <div class="flex justify-between text-[10px] text-slate-500 mt-1">
            <span data-i18n="b_headon"></span>
            <span data-i18n="b_far"></span>
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-bold text-slate-300" data-i18n="nucleus_z"></label>
            <span class="stat-val text-sm num" id="val-z">79</span>
          </div>
          <input type="range" id="sl-z" class="w-full" min="1" max="92" step="1" value="79" oninput="onSlider()">
        </div>

        <label class="flex items-center gap-3 cursor-pointer select-none">
          <input type="checkbox" id="chk-orbits" checked onchange="state.showOrbits=this.checked" class="w-5 h-5 accent-cyan-400">
          <span class="text-sm text-slate-300" data-i18n="show_orbits"></span>
        </label>
      </div>

      <!-- OBSERVATIONS -->
      <div class="glass-card rounded-2xl p-5 space-y-4">
        <h2 class="font-display font-bold text-base text-cyan-400 flex items-center gap-2">
          <i class="fa-solid fa-microscope"></i><span data-i18n="obs_title"></span>
        </h2>
        <div id="obs-macro" class="space-y-3">
          <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
            <span class="text-sm text-slate-400" data-i18n="cnt_total"></span>
            <span class="stat-val text-sm num" id="obs-total">0</span>
          </div>
          <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
            <span class="text-sm text-slate-400 flex items-center gap-2"><span class="chip ok">A</span><span data-i18n="cnt_straight"></span></span>
            <span class="stat-val text-sm num text-green-400" id="obs-straight">0</span>
          </div>
          <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
            <span class="text-sm text-slate-400 flex items-center gap-2"><span class="chip warm">B</span><span data-i18n="cnt_deflect"></span></span>
            <span class="stat-val text-sm num text-amber-300" id="obs-deflect">0</span>

/* ============================================================
   PHYSICS HELPERS
============================================================ */
function scatterDecision() {
  // Educational probabilities scaled by thickness & material Z
  const baseBack = (1 / 20000) * state.thickness * MAT[state.material].scatter;
  const baseDef = 0.04 * state.thickness * Math.sqrt(MAT[state.material].scatter);
  const r = Math.random();
  if (r < baseBack) return 'back';
  if (r < baseBack + baseDef) return 'deflect';
  return 'straight';
}

function rutherfordAngle(b, Z) {
  // Soft-core Rutherford-like deflection (degrees), educational
  const d = 0.5 * Z; // characteristic length in sim units
  const bb = Math.max(0.5, Math.abs(b));
  let theta = 2 * Math.atan(d / bb) * (180 / Math.PI);
  if (b < 2) theta = Math.min(180, 160 + (2 - b) * 10);
  return Math.min(179, theta) * Math.sign(b === 0 ? 1 : b);
}

function pathLabel(angleAbs) {
  if (angleAbs < 8) return 'straight';
  if (angleAbs < 90) return 'deflect';
  return 'back';
}

/* ============================================================
   MACRO PARTICLES
============================================================ */
function spawnParticle() {
  const kind = scatterDecision();
  let angle = 0;
  if (kind === 'straight') angle = (Math.random() - 0.5) * 6 * Math.PI / 180;
  else if (kind === 'deflect') {
    const a = (12 + Math.random() * 70) * Math.PI / 180;
    angle = Math.random() < 0.5 ? a : -a;
  } else {
    angle = Math.PI + (Math.random() - 0.5) * 0.5;
  }
  particles.push({
    x: -280, y: (Math.random() - 0.5) * 8,
    vx: 220, vy: 0,
    phase: 'approach',
    kind, angle,
    life: 1,
    trail: []
  });
  state.counts.total++;
  if (kind === 'straight') state.counts.straight++;
  else if (kind === 'deflect') state.counts.deflect++;
  else state.counts.back++;
}

function updateMacro(dt) {
  if (state.running) {
    spawnAcc += state.rate * dt;
    while (spawnAcc >= 1) { spawnParticle(); spawnAcc -= 1; }
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    if (p.phase === 'approach') {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.x >= 0) {
        p.phase = 'scatter';
        const speed = 240;
        if (p.kind === 'back') {
          p.vx = Math.cos(p.angle) * speed;
          p.vy = Math.sin(p.angle) * speed;
        } else {
          p.vx = Math.cos(p.angle) * speed;
          p.vy = Math.sin(p.angle) * speed;
        }
        flashes.push({ x: 0, y: p.y, t: 0.35, kind: p.kind });
      }
    } else {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt * 0.15;
    }
    p.trail.push({ x: p.x, y: p.y });
    if (p.trail.length > 18) p.trail.shift();

    // Hit detector ring (~radius 240)
    const r = Math.hypot(p.x, p.y);
    if (r > 245 || p.life <= 0 || p.x < -320) {
      if (r > 230 && r < 260) flashes.push({ x: p.x, y: p.y, t: 0.45, kind: 'hit' });
      particles.splice(i, 1);
    }
  }
  for (let i = flashes.length - 1; i >= 0; i--) {
    flashes[i].t -= dt;
    if (flashes[i].t <= 0) flashes.splice(i, 1);
  }
  updateObs();
}

/* ============================================================
   MICRO ALPHAS
============================================================ */
function launchAlpha() {
  // Alternate side each launch so students explore both halves
  if (!launchAlpha._flip) launchAlpha._flip = 1;
  const sb = state.impactB === 0 ? 0 : state.impactB * launchAlpha._flip;
  if (state.impactB > 0) launchAlpha._flip *= -1;

  const ang = Math.abs(rutherfordAngle(sb || 0.8, state.Z));
  const kind = pathLabel(ang);
  state.lastAngle = ang;
  state.lastPath = kind;

  microAlphas.push({
    x: -220, y: sb,
    vx: 180, vy: 0,
    b: sb,
    phase: 'in',
    ang,
    kind,
    trail: []
  });
  updateObs();
}

function updateMicro(dt) {
  for (let i = microAlphas.length - 1; i >= 0; i--) {
    const p = microAlphas[i];
    if (p.phase === 'in') {
      // Coulomb repulsion from nucleus at origin (educational soft-core)
      const rx = p.x, ry = p.y;
      const rr = Math.max(8, Math.hypot(rx, ry));
      const F = (1400 * state.Z) / (rr * rr);
      p.vx += (rx / rr) * F * dt;
      p.vy += (ry / rr) * F * dt;
      // soft speed cap for stable trails
      const spd = Math.hypot(p.vx, p.vy);
      if (spd > 420) { p.vx *= 420/spd; p.vy *= 420/spd; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.trail.push({ x: p.x, y: p.y });
      if (p.trail.length > 220) p.trail.shift();
      if (Math.hypot(p.x, p.y) > 290 || p.x < -300) {
        trails.push({ pts: p.trail.slice(), kind: p.kind });
        if (trails.length > 8) trails.shift();
        microAlphas.splice(i, 1);
      }
    }
  }
}

/* ============================================================
   OBS / TIP
============================================================ */
function updateObs() {
  if (state.mode === 'macro') {
    document.getElementById('obs-total').textContent = state.counts.total;
    document.getElementById('obs-straight').textContent = state.counts.straight;
    document.getElementById('obs-deflect').textContent = state.counts.deflect;
    document.getElementById('obs-back').textContent = state.counts.back;
    const n = state.counts.back > 0 ? Math.round(state.counts.total / state.counts.back) : 0;
    document.getElementById('obs-ratio').textContent = T('ratio_msg')(n);
  } else {
    const a = state.lastAngle;
    document.getElementById('obs-angle').textContent = a == null ? '—' : (a.toFixed(0) + '°');
    const pk = state.lastPath;
    document.getElementById('obs-path').textContent = pk === 'straight' ? 'A' : pk === 'deflect' ? 'B' : pk === 'back' ? 'C' : '—';
    let msg = T('tip_micro');
    if (pk === 'straight') msg = T('path_straight');
    else if (pk === 'deflect') msg = T('path_deflect');
    else if (pk === 'back') msg = T('path_back');
    document.getElementById('micro-status').textContent = msg;
  }
}

function updateTip() {
  let tip = T('tip_macro');
  if (state.mode === 'micro') tip = T('tip_micro');
  else if (state.thickness > 2.2) tip = T('tip_macro_thick');
  else if (state.material === 'pb') tip = T('tip_macro_pb');
  else if (state.material === 'al') tip = T('tip_macro_al');
  if (state.mode === 'micro' && state.Z !== 79) tip = T('tip_micro_z');
  document.getElementById('tip-text').textContent = tip;
}

/* ============================================================
   DRAW
============================================================ */
const canvas = document.getElementById('sim-canvas');
const ctx = canvas.getContext('2d');

function S() { return baseScale * state.zoom; }
function X(wx) { return W/2 + wx * S() + state.panX; }
function Y(wy) { return H/2 - wy * S() + state.panY; }

function drawLabel(text, x, y, color='#94a3b8') {
  ctx.save();
  ctx.fillStyle = color;
  ctx.font = cur === 'ur'
    ? `600 13px 'Jameel Noori Nastaliq','Noto Nastaliq Urdu',serif`
    : `600 12px Manrope,sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawMacro() {
  // Detector ring
  const R = 240 * S();
  ctx.save();
  ctx.beginPath();
  ctx.arc(X(0), Y(0), R, 0.15*Math.PI, 1.85*Math.PI);
  ctx.lineWidth = 18 * S();
  ctx.strokeStyle = '#7c3aed';
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(X(0), Y(0), R - 6*S(), 0.15*Math.PI, 1.85*Math.PI);
  ctx.lineWidth = 10 * S();
  ctx.strokeStyle = '#334155';
  ctx.stroke();
  ctx.restore();
  drawLabel(T('lbl_detector'), X(0), Y(0) - R - 18);

  // Source lead box
  const sx = X(-280), sy = Y(0);
  ctx.fillStyle = '#475569';
  roundRect(sx - 36*S(), sy - 28*S(), 52*S(), 56*S(), 6);
  ctx.fill();
  ctx.fillStyle = '#facc15';
  ctx.beginPath();
  ctx.moveTo(sx - 18*S(), sy - 18*S());
  ctx.lineTo(sx - 6*S(), sy - 18*S());
  ctx.lineTo(sx - 12*S(), sy - 6*S());
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#f97316';
  ctx.beginPath(); ctx.arc(sx - 12*S(), sy, 8*S(), 0, Math.PI*2); ctx.fill();
  drawLabel(T('lbl_source'), sx, sy + 48*S());

  // Beam guide
  ctx.strokeStyle = 'rgba(251,146,60,0.35)';
  ctx.setLineDash([6, 6]);
  ctx.beginPath(); ctx.moveTo(sx + 16*S(), sy); ctx.lineTo(X(-8), Y(0)); ctx.stroke();
  ctx.setLineDash([]);
  drawLabel(T('lbl_beam'), X(-150), Y(28));

  // Gold foil
  const fc = MAT[state.material].color;
  ctx.fillStyle = fc;
  ctx.globalAlpha = 0.55;
  const tw = Math.max(4, 4 * state.thickness) * S();
  ctx.fillRect(X(0) - tw/2, Y(90), tw, 180 * S());
  ctx.globalAlpha = 1;
  ctx.strokeStyle = fc;
  ctx.lineWidth = 2;
  ctx.strokeRect(X(0) - tw/2, Y(90), tw, 180 * S());
  drawLabel(T('lbl_foil') + ' (' + MAT[state.material].name + ')', X(0), Y(-110));

  // Path legend
  ctx.save();
  const lx = X(-260), ly = Y(-160);
  [['#86efac','A'],['#fbbf24','B'],['#f87171','C']].forEach((c,i)=>{
    ctx.fillStyle = c[0];
    ctx.beginPath(); ctx.arc(lx, ly + i*22, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#cbd5e1';
    ctx.font = '600 12px Manrope';
    ctx.textAlign = 'left';
    ctx.fillText(c[1], lx + 12, ly + i*22 + 4);
  });
  ctx.restore();

  // Particles
  particles.forEach(p => {
    ctx.strokeStyle = p.kind === 'back' ? 'rgba(248,113,113,0.5)' : p.kind === 'deflect' ? 'rgba(251,191,36,0.45)' : 'rgba(134,239,172,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    p.trail.forEach((t,i)=>{ const fn = i?ctx.lineTo:ctx.moveTo; fn.call(ctx, X(t.x), Y(t.y)); });
    ctx.stroke();
    ctx.fillStyle = p.kind === 'back' ? '#f87171' : p.kind === 'deflect' ? '#fbbf24' : '#fdba74';
    ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), 3.5*S(), 0, Math.PI*2); ctx.fill();
  });

  flashes.forEach(f => {
    const a = Math.max(0, f.t / 0.45);
    ctx.fillStyle = f.kind === 'hit' ? `rgba(250,204,21,${a})` : `rgba(255,255,255,${a})`;
    const spikes = 8;
    ctx.beginPath();
    for (let i=0;i<spikes;i++){
      const ang = (i/spikes)*Math.PI*2;
      const r1 = 10*S()*a, r2 = 4*S()*a;
      ctx.lineTo(X(f.x)+Math.cos(ang)*r1, Y(f.y)-Math.sin(ang)*r1);
      ctx.lineTo(X(f.x)+Math.cos(ang+Math.PI/spikes)*r2, Y(f.y)-Math.sin(ang+Math.PI/spikes)*r2);
    }
    ctx.closePath(); ctx.fill();
  });
}

function drawMicro() {
  // Atom boundary
  ctx.save();
  ctx.setLineDash([4, 6]);
  ctx.strokeStyle = 'rgba(148,163,184,0.45)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(X(0), Y(0), 160*S(), 0, Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  if (state.showOrbits) {
    [60, 100, 140].forEach((r, i) => {
      ctx.strokeStyle = `rgba(56,189,248,${0.15 + i*0.05})`;
      ctx.beginPath(); ctx.arc(X(0), Y(0), r*S(), 0, Math.PI*2); ctx.stroke();
      const t = performance.now()/1000;
      const ex = Math.cos(t*(0.6+i*0.25)+i)*r;
      const ey = Math.sin(t*(0.6+i*0.25)+i)*r;
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath(); ctx.arc(X(ex), Y(ey), 5*S(), 0, Math.PI*2); ctx.fill();
    });
    drawLabel(T('lbl_electron'), X(110), Y(150), '#7dd3fc');
  }

  // Nucleus — size scales mildly with Z
  const nr = (10 + Math.sqrt(state.Z) * 1.2) * S();
  const g = ctx.createRadialGradient(X(0), Y(0), 0, X(0), Y(0), nr);
  g.addColorStop(0, '#fecaca'); g.addColorStop(1, '#ef4444');
  ctx.fillStyle = g;
  ctx.shadowColor = 'rgba(239,68,68,0.6)';
  ctx.shadowBlur = 18;
  ctx.beginPath(); ctx.arc(X(0), Y(0), nr, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  drawLabel(T('lbl_nucleus') + ' (Z=' + state.Z + ')', X(0), Y(0) + nr/S() + 22, '#fca5a5');

  // Impact parameter guide
  ctx.strokeStyle = 'rgba(0,243,255,0.35)';
  ctx.setLineDash([4,4]);
  ctx.beginPath();
  ctx.moveTo(X(-220), Y(state.impactB));
  ctx.lineTo(X(-40), Y(state.impactB));
  ctx.stroke();
  ctx.setLineDash([]);
  drawLabel('b = ' + state.impactB, X(-140), Y(state.impactB) - 12, '#67e8f9');

  // Past trails
  trails.forEach(tr => {
    ctx.strokeStyle = tr.kind === 'back' ? 'rgba(248,113,113,0.35)' : tr.kind === 'deflect' ? 'rgba(251,191,36,0.35)' : 'rgba(134,239,172,0.3)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    tr.pts.forEach((t,i)=>{ (i?ctx.lineTo:ctx.moveTo).call(ctx, X(t.x), Y(t.y)); });
    ctx.stroke();
  });

  // Active alphas
  microAlphas.forEach(p => {
    ctx.strokeStyle = 'rgba(251,146,60,0.7)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    p.trail.forEach((t,i)=>{ (i?ctx.lineTo:ctx.moveTo).call(ctx, X(t.x), Y(t.y)); });
    ctx.stroke();
    ctx.fillStyle = '#fb923c';
    ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), 6*S(), 0, Math.PI*2); ctx.fill();
    drawLabel(T('lbl_alpha'), X(p.x), Y(p.y) - 14, '#fdba74');
  });
}

function roundRect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function render() {
  ctx.clearRect(0,0,W,H);
  // vignette bg
  const bg = ctx.createRadialGradient(W/2,H/2,40,W/2,H/2,Math.max(W,H)*0.7);
  bg.addColorStop(0, '#132033'); bg.addColorStop(1, '#0b1220');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  if (state.mode === 'macro') drawMacro();
  else drawMicro();
}

/* ============================================================
   ZOOM / PAN
============================================================ */
function zoomBy(f) {
  state.zoom = Math.min(3.5, Math.max(0.45, state.zoom * f));
}
function resetView() {
  state.zoom = 1; state.panX = 0; state.panY = 0;
  fitView();
}
function fitView() {
  baseScale = Math.min(W, H) / 560;
}

let dragging = false, lastPX=0, lastPY=0;
canvas.addEventListener('pointerdown', e => {
  if (isAnnoActive) return;
  dragging = true; canvas.setPointerCapture(e.pointerId);
  lastPX = e.clientX; lastPY = e.clientY;
  canvas.style.cursor = 'grabbing';
});
canvas.addEventListener('pointermove', e => {
  if (!dragging || isAnnoActive) return;
  state.panX += e.clientX - lastPX;
  state.panY += e.clientY - lastPY;
  lastPX = e.clientX; lastPY = e.clientY;
});
canvas.addEventListener('pointerup', () => { dragging = false; canvas.style.cursor = 'grab'; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoomBy(e.deltaY < 0 ? 1.1 : 1/1.1);
}, { passive: false });

// Pinch zoom
let pinchDist = null;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchDist = Math.hypot(dx, dy);
  }
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinchDist) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const d = Math.hypot(dx, dy);
    zoomBy(d / pinchDist);
    pinchDist = d;
  }
}, { passive: false });
canvas.addEventListener('touchend', () => { pinchDist = null; });

/* ============================================================
   ANNOTATION (Fabric.js) — exact logic
============================================================ */
let fCanvas;
let isAnnoActive = false;

function initAnnotationCanvas(w, h) {
  if (fCanvas) {
    fCanvas.setWidth(w);
    fCanvas.setHeight(h);
    fCanvas.calcOffset();
    return;
  }
  fCanvas = new fabric.Canvas('fabricLayer', {
    isDrawingMode: false,
    width: w,
    height: h
  });
  fCanvas.freeDrawingBrush.color = document.getElementById('anno-color').value;
  fCanvas.freeDrawingBrush.width = 4;

  fCanvas.on('mouse:down', function(options) {
    if (isAnnoActive && !fCanvas.isDrawingMode && options.target) {
      fCanvas.remove(options.target);
    }
  });

  const fabricContainer = document.querySelector('.canvas-container');
  if (fabricContainer) fabricContainer.style.pointerEvents = 'none';
}

function toggleAnnotationMode() {
  isAnnoActive = !isAnnoActive;
  const btn = document.getElementById('btn-anno-toggle');
  const toolbar = document.getElementById('anno-toolbar');
  const fabricContainer = document.querySelector('.canvas-container');
  const floatCard = document.getElementById('anno-float');

  if (isAnnoActive) {
    btn.classList.replace('text-slate-400', 'text-cyan-400');
    toolbar.classList.remove('max-w-0', 'opacity-0');
    toolbar.classList.add('max-w-xs', 'opacity-100');
    if (fabricContainer) fabricContainer.style.pointerEvents = 'auto';
    floatCard.classList.remove('hidden');
    floatCard.classList.remove('minimized');
    setAnnoMode('pen');
  } else {
    btn.classList.replace('text-cyan-400', 'text-slate-400');
    toolbar.classList.remove('max-w-xs', 'opacity-100');
    toolbar.classList.add('max-w-0', 'opacity-0');
    if (fabricContainer) fabricContainer.style.pointerEvents = 'none';
    floatCard.classList.add('hidden');
    if (fCanvas) fCanvas.isDrawingMode = false;
  }
}

function setAnnoMode(mode) {
  document.getElementById('anno-pen').classList.replace('text-cyan-400', 'text-slate-400');
  document.getElementById('anno-eraser').classList.replace('text-cyan-400', 'text-slate-400');

  if (mode === 'pen') {
    document.getElementById('anno-pen').classList.replace('text-slate-400', 'text-cyan-400');
    if (fCanvas) fCanvas.isDrawingMode = true;
  } else {
    document.getElementById('anno-eraser').classList.replace('text-slate-400', 'text-cyan-400');
    if (fCanvas) fCanvas.isDrawingMode = false;
  }
}

function changeAnnoColor(color) {
  if (fCanvas) fCanvas.freeDrawingBrush.color = color;
  document.getElementById('anno-color-float').value = color;
  setAnnoMode('pen');
}
function syncAnnoColor(color) {
  document.getElementById('anno-color').value = color;
  changeAnnoColor(color);
}
function clearAnnotations() {
  if (fCanvas) fCanvas.clear();
}
function toggleAnnoFloat() {
  const el = document.getElementById('anno-float');
  el.classList.toggle('minimized');
  const icon = document.getElementById('anno-float-icon');
  icon.className = el.classList.contains('minimized') ? 'fa-solid fa-plus' : 'fa-solid fa-minus';
}

// Drag floating anno card
(function(){
  const el = document.getElementById('anno-float');
  let dx=0, dy=0, on=false;
  el.addEventListener('pointerdown', e => {
    if (e.target.closest('button') || e.target.tagName === 'INPUT') return;
    on = true; dx = e.clientX - el.offsetLeft; dy = e.clientY - el.offsetTop;
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', e => {
    if (!on) return;
    const wrap = document.getElementById('canvas-wrap').getBoundingClientRect();
    el.style.left = Math.max(0, Math.min(wrap.width - 40, e.clientX - wrap.left - dx)) + 'px';
    el.style.top = Math.max(0, Math.min(wrap.height - 40, e.clientY - wrap.top - dy)) + 'px';
  });
  el.addEventListener('pointerup', () => on=false);
})();

/* ============================================================
   FULLSCREEN
============================================================ */
function toggleFullScreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement) {
    el.requestFullscreen?.();
    document.getElementById('fs-icon').className = 'fa-solid fa-compress';
  } else {
    document.exitFullscreen?.();
    document.getElementById('fs-icon').className = 'fa-solid fa-expand';
  }
}

/* ============================================================
   QUIZ
============================================================ */
let quizIdx = 0, quizScore = 0, quizAnswered = false;

function renderQuiz() {
  const box = document.getElementById('quiz-box');
  const quiz = LANG[cur].quiz;
  if (quizIdx >= quiz.length) {
    const pct = Math.round((quizScore / quiz.length) * 100);
    let msg = T('score_msg_low');
    if (pct >= 80) msg = T('score_msg_great');
    else if (pct >= 50) msg = T('score_msg_good');
    box.innerHTML = `
      <div class="text-center fade-in space-y-6">
        <div class="text-cyan-400 font-display font-bold text-xl" data-i18n="final_score">${T('final_score')}</div>
        <div class="relative inline-flex items-center justify-center">
          <svg class="score-ring" width="140" height="140" viewBox="0 0 140 140">
            <circle cx="70" cy="70" r="58" fill="none" stroke="#1e293b" stroke-width="12"/>
            <circle cx="70" cy="70" r="58" fill="none" stroke="#00f3ff" stroke-width="12"
              stroke-dasharray="${2*Math.PI*58}" stroke-dashoffset="${2*Math.PI*58*(1-pct/100)}"
              stroke-linecap="round" transform="rotate(-90 70 70)"/>
          </svg>
          <div class="absolute text-3xl font-black text-cyan-300 num">${pct}%</div>
        </div>
        <div class="text-2xl font-bold">${quizScore} / ${quiz.length}</div>
        <p class="text-slate-300">${msg}</p>
        <button onclick="restartQuiz()" class="mode-btn active px-6 py-3 rounded-xl font-bold">${T('restart')}</button>
      </div>`;
    return;
  }
  const q = quiz[quizIdx];
  box.innerHTML = `
    <div class="fade-in">
      <div class="flex items-center justify-between mb-4 gap-3">
        <h2 class="font-display font-bold text-lg text-cyan-400">${T('quiz_title')}</h2>
        <span class="chip">${T('quiz_progress')(quizIdx+1, quiz.length)}</span>
      </div>
      <p class="text-lg md:text-xl font-bold mb-5 leading-relaxed">${q.q}</p>
      <div class="space-y-3" id="quiz-opts">
        ${q.opts.map((o,i)=>`
          <button class="opt-btn w-full text-start px-4 py-3.5 rounded-xl font-semibold text-slate-200"
            onclick="answerQuiz(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}
      </div>
      <div id="quiz-fb" class="mt-4 hidden"></div>
      <div class="mt-5 flex justify-end">
        <button id="quiz-next" class="mode-btn active px-5 py-2.5 rounded-xl font-bold hidden" onclick="nextQuiz()"></button>
      </div>
    </div>`;
  quizAnswered = false;
}

function answerQuiz(i) {
  if (quizAnswered) return;
  quizAnswered = true;
  const q = LANG[cur].quiz[quizIdx];
  const btns = document.querySelectorAll('#quiz-opts .opt-btn');
  btns.forEach((b, idx) => {
    b.classList.add('locked');
    if (idx === q.a) b.classList.add('correct');
    if (idx === i && i !== q.a) b.classList.add('wrong');
  });
  if (i === q.a) quizScore++;
  const fb = document.getElementById('quiz-fb');
  fb.classList.remove('hidden');
  fb.innerHTML = `<div class="glass-panel rounded-xl px-4 py-3 ${i===q.a?'text-green-300 glow-green':'text-red-300 glow-red'}">
    <strong>${i===q.a?T('correct_fb'):T('wrong_fb')}</strong>
    <p class="mt-1 text-slate-300 text-sm leading-relaxed">${q.ex}</p>
  </div>`;
  const next = document.getElementById('quiz-next');
  next.classList.remove('hidden');
  next.textContent = quizIdx + 1 >= LANG[cur].quiz.length ? T('see_result') : T('next_q');
}

function nextQuiz() { quizIdx++; renderQuiz(); }
function restartQuiz() { quizIdx = 0; quizScore = 0; renderQuiz(); }

/* ============================================================
   RESIZE / LOOP
============================================================ */
function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  const rect = wrap.getBoundingClientRect();
  W = Math.max(320, Math.floor(rect.width));
  H = Math.max(280, Math.floor(rect.height));
  canvas.width = W; canvas.height = H;
  fitView();
  initAnnotationCanvas(W, H);
}

let lastT = performance.now();
function loop(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000);
  lastT = t;
  if (state.mode === 'macro') updateMacro(dt);
  else updateMicro(dt);
  render();
  requestAnimationFrame(loop);
}

/* ============================================================
   INTRO + BOOT
============================================================ */
function boot() {
  changeLanguage(cur);
  resizeCanvas();
  updateObs();
  updateTip();
  updateFireBtn();
  window.addEventListener('resize', resizeCanvas);
  requestAnimationFrame(loop);

  // Auto-start a gentle beam after intro for engagement
  setTimeout(() => {
    if (state.mode === 'macro' && !state.running) {
      state.running = true;
      updateFireBtn();
    }
  }, 800);
}

setTimeout(() => {
  const intro = document.getElementById('intro');
  intro.style.opacity = '0';
  setTimeout(() => {
    intro.style.display = 'none';
    const app = document.getElementById('app');
    app.style.display = 'flex';
    app.classList.remove('opacity-0');
    boot();
  }, 700);
}, 4800);
</script>
</body>
</html>
