<meta charset="UTF-8">

<title>IQRA VIRTUAL LAB — Rutherford’s Nuclear Model</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&family=Manrope:wght@400;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/jameel-noori-nastaleeq" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<style>
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #0f172a; }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #475569; }
[dir="rtl"] .rtl-flip { transform: scaleX(-1); }
[dir="rtl"] {
  font-family: 'Jameel Noori Nastaliq', 'Noto Nastaliq Urdu', serif !important;
  line-height: 2.3 !important;
}
.glass-panel {
  background: rgba(15, 23, 42, 0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.1);
}
.glass-card {
  background: rgba(30, 41, 59, 0.6);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.08);
}
.glow-cyan { box-shadow: 0 0 20px rgba(0, 243, 255, 0.35); }
.glow-red { box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
.glow-green { box-shadow: 0 0 20px rgba(34, 197, 94, 0.35); }
canvas { touch-action: none; }
input[type=range] {
  -webkit-appearance: none;
  background: #334155;
  border-radius: 8px;
  height: 8px;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  height: 20px; width: 20px; border-radius: 50%;
  background: #00f3ff; cursor: pointer;
  box-shadow: 0 0 10px #00f3ff;
  transition: transform 0.1s ease;
}
input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
html, body { height: 100%; margin: 0; }
body {
  font-family: 'Manrope', sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  overflow: hidden;
}
.font-display { font-family: 'Oxanium', 'Manrope', sans-serif; }
[dir="rtl"] .font-display { font-family: 'Jameel Noori Nastaliq', 'Noto Nastaliq Urdu', serif; }
[dir="rtl"] body, [dir="rtl"] { font-size: 1.08em; }
.bg-grid {
  background-image:
    linear-gradient(rgba(0,243,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,243,255,0.04) 1px, transparent 1px);
  background-size: 44px 44px;
}
#intro {
  position: fixed; inset: 0; z-index: 100;
  background: radial-gradient(ellipse at center, #10233f 0%, #0f172a 65%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity .7s ease;
}
.intro-title {
  font-family: 'Oxanium', sans-serif;
  font-weight: 800; letter-spacing: .14em;
  background: linear-gradient(92deg, #00f3ff, #7dd3fc, #fbbf24, #00f3ff);
  background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: introZoom 1.6s cubic-bezier(.2,.8,.2,1) both, glowPulse 2s ease-in-out infinite, shimmer 3s linear infinite;
}
.intro-topic {
  color: #94a3b8; letter-spacing: .18em;
  animation: introFade 1.4s .35s ease both;
  text-align: center; max-width: 90vw;
}
.intro-ring {
  width: 160px; height: 160px; border-radius: 50%;
  border: 2px solid rgba(0,243,255,.35);
  box-shadow: 0 0 60px rgba(0,243,255,.25), inset 0 0 40px rgba(0,243,255,.12);
  display:flex; align-items:center; justify-content:center;
  animation: ringSpin 2.4s linear infinite, introZoom 1.2s ease both;
  margin-bottom: 28px; position: relative;
}
.intro-ring::before {
  content:''; position:absolute; inset:-10px; border-radius:50%;
  border-top: 2px solid #00f3ff; border-right: 2px solid transparent;
  border-bottom: 2px solid transparent; border-left: 2px solid transparent;
}
@keyframes ringSpin { to { transform: rotate(360deg); } }
@keyframes introZoom { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
@keyframes introFade { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes glowPulse {
  0%,100% { text-shadow: 0 0 24px rgba(0,243,255,.55); }
  50% { text-shadow: 0 0 54px rgba(0,243,255,.9); }
}
@keyframes shimmer { 0%{ background-position:0% 0; } 100%{ background-position:200% 0; } }
.tab-btn {
  position: relative; transition: color .25s ease, background-color .25s ease;
  border-radius: 12px;
}
.tab-btn.active {
  color: #00f3ff; background: rgba(0,243,255,.08);
  box-shadow: inset 0 0 0 1px rgba(0,243,255,.35), 0 0 18px rgba(0,243,255,.15);
}
.view { animation: viewIn .35s ease both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.mode-btn {
  transition: background-color .25s ease, color .25s ease, box-shadow .25s ease, transform .15s ease;
  border: 1px solid rgba(255,255,255,.1);
}
.mode-btn:active { transform: scale(.96); }
.mode-btn.active {
  background: rgba(0,243,255,.12); color: #00f3ff;
  border-color: rgba(0,243,255,.5); box-shadow: 0 0 16px rgba(0,243,255,.25);
}
.opt-btn {
  transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .12s ease;
  border: 1px solid rgba(255,255,255,.1);
}
.opt-btn:not(.locked):hover { border-color: rgba(0,243,255,.45); background: rgba(0,243,255,.06); }
.opt-btn:not(.locked):active { transform: scale(.98); }
.opt-btn.correct { background: rgba(34,197,94,.16); border-color:#22c55e; box-shadow: 0 0 18px rgba(34,197,94,.3); }
.opt-btn.wrong { background: rgba(239,68,68,.14); border-color:#ef4444; box-shadow: 0 0 18px rgba(239,68,68,.3); }
.zoom-btn {
  width: 42px; height: 42px; border-radius: 12px;
  background: rgba(15,23,42,.8); border:1px solid rgba(255,255,255,.12);
  color:#00f3ff; display:flex; align-items:center; justify-content:center;
  backdrop-filter: blur(8px); cursor:pointer;
  transition: background-color .2s ease, box-shadow .2s ease, transform .12s ease;
}
.zoom-btn:hover { background: rgba(0,243,255,.12); box-shadow: 0 0 14px rgba(0,243,255,.25); }
.zoom-btn:active { transform: scale(.92); }
.stat-val { font-family: 'Oxanium', monospace; color:#00f3ff; }
[dir="rtl"] .stat-val { font-family: 'Oxanium', monospace !important; line-height: 1.4 !important; }
.num { font-family:'Oxanium', monospace !important; line-height:1.4 !important; direction:ltr; unicode-bidi:embed; }
.fade-in { animation: viewIn .4s ease both; }
.score-ring { filter: drop-shadow(0 0 14px rgba(0,243,255,.5)); }
#fabricLayer, .canvas-container {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  z-index: 20;
  pointer-events: none;
}
.canvas-container canvas { position: absolute !important; left: 0 !important; top: 0 !important; }
#anno-float {
  position: absolute; z-index: 30; left: 12px; top: 56px;
  transition: all .3s ease;
  cursor: grab;
}
#anno-float.minimized .anno-float-body { display: none; }
.chip {
  display:inline-flex; align-items:center; gap:.35rem;
  padding:.2rem .55rem; border-radius:999px; font-size:.72rem; font-weight:600;
  background:rgba(0,243,255,0.10); color:#7dd3fc; border:1px solid rgba(0,243,255,0.25);
}
.chip.warm { background:rgba(245,158,11,0.12); color:#fbbf24; border-color:rgba(245,158,11,0.35); }
.chip.danger { background:rgba(239,68,68,0.12); color:#fca5a5; border-color:rgba(239,68,68,0.35); }
.chip.ok { background:rgba(34,197,94,0.12); color:#86efac; border-color:rgba(34,197,94,0.35); }
</style>
</head>
<body class="bg-grid">

<div id="intro">
  <div class="intro-ring"><i class="fa-solid fa-atom text-5xl text-cyan-300" style="filter:drop-shadow(0 0 14px rgba(0,243,255,.8))"></i></div>
  <div class="intro-title text-4xl sm:text-5xl lg:text-6xl">IQRA VIRTUAL LAB</div>
  <div class="intro-topic text-base md:text-lg mt-5 font-bold uppercase" id="intro-topic">Rutherford’s Nuclear Model of Atom</div>
</div>

<div id="app" class="h-screen flex flex-col opacity-0 transition-opacity duration-700">

  <header class="glass-panel flex items-center justify-between px-4 md:px-6 py-3 z-30 shrink-0">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-10 h-10 rounded-xl bg-slate-900 border border-cyan-500/40 glow-cyan flex items-center justify-center shrink-0">
        <i class="fa-solid fa-flask text-cyan-400"></i>
      </div>
      <div class="min-w-0">
        <div class="font-display font-extrabold tracking-widest text-cyan-400 text-sm md:text-base" style="font-family:'Oxanium',sans-serif !important;">IQRA VIRTUAL LAB</div>
        <div class="text-xs text-slate-400 truncate" data-i18n="topic"></div>
      </div>
    </div>

    <nav class="flex items-center gap-2 glass-card rounded-2xl p-1.5">
      <button id="tab-sim" onclick="switchTab('sim')" class="tab-btn active px-3 md:px-6 py-2.5 font-bold text-sm md:text-base text-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-house"></i><span data-i18n="tab_sim"></span>
      </button>
      <button id="tab-quiz" onclick="switchTab('quiz')" class="tab-btn px-3 md:px-6 py-2.5 font-bold text-sm md:text-base text-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-clipboard-question"></i><span data-i18n="tab_quiz"></span>
      </button>
    </nav>

    <div class="flex items-center gap-3">
      <div id="anno-toolbar" class="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 transition-all duration-300 max-w-0 overflow-hidden opacity-0">
        <input type="color" id="anno-color" value="#00f3ff" onchange="changeAnnoColor(this.value)" class="w-6 h-6 cursor-pointer bg-transparent border-0 p-0" title="Color">
        <button id="anno-pen" onclick="setAnnoMode('pen')" class="text-cyan-400 p-1.5 rounded hover:bg-slate-700 transition" title="Pen"><i class="fa-solid fa-pen"></i></button>
        <button id="anno-eraser" onclick="setAnnoMode('eraser')" class="text-slate-400 p-1.5 rounded hover:bg-slate-700 transition" title="Eraser"><i class="fa-solid fa-eraser"></i></button>
        <button onclick="clearAnnotations()" class="text-red-400 p-1.5 rounded hover:bg-slate-700 transition" title="Clear All"><i class="fa-solid fa-trash-can"></i></button>
      </div>
      <button id="btn-anno-toggle" onclick="toggleAnnotationMode()" class="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 flex items-center justify-center border border-slate-700 transition" title="Toggle Annotation">
        <i class="fa-solid fa-pen-nib"></i>
      </button>
      <div class="relative">
        <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-slate-900 border border-slate-700 text-cyan-400 text-sm rounded-lg focus:ring-cyan-500 focus:border-cyan-500 px-3 py-2 cursor-pointer font-bold outline-none">
          <option value="en">🌐 English</option>
          <option value="ur">🌐 اردو</option>
          <option value="hi" disabled>🌐 हिंदी (Soon)</option>
          <option value="bn" disabled>🌐 বাংলা (Soon)</option>
          <option value="ta" disabled>🌐 தமிழ் (Soon)</option>
        </select>
      </div>
      <button onclick="toggleFullScreen()" class="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-400 flex items-center justify-center border border-slate-700 transition" title="Toggle Fullscreen">
        <i class="fa-solid fa-expand" id="fs-icon"></i>
      </button>
    </div>
  </header>

  <main id="view-sim" class="view flex-1 flex flex-col lg:flex-row gap-4 p-4 min-h-0 overflow-y-auto lg:overflow-hidden">
    <section class="flex-1 flex flex-col gap-3 min-h-0 min-w-0">
      <div class="glass-card rounded-2xl p-2 flex flex-wrap gap-2">
        <button id="mode-macro" onclick="setMode('macro')" class="mode-btn active flex-1 min-w-[140px] px-4 py-3 rounded-xl font-bold text-sm md:text-base text-slate-300 flex items-center justify-center gap-2">
          <i class="fa-solid fa-flask-vial"></i><span data-i18n="mode_macro"></span>
        </button>
        <button id="mode-micro" onclick="setMode('micro')" class="mode-btn flex-1 min-w-[140px] px-4 py-3 rounded-xl font-bold text-sm md:text-base text-slate-300 flex items-center justify-center gap-2">
          <i class="fa-solid fa-atom"></i><span data-i18n="mode_micro"></span>
        </button>
      </div>

      <div id="canvas-wrap" class="glass-card rounded-2xl relative flex-1 min-h-[360px] overflow-hidden">
        <canvas id="sim-canvas" class="absolute inset-0 w-full h-full cursor-grab"></canvas>
        <canvas id="fabricLayer"></canvas>

        <div id="anno-float" class="glass-panel rounded-xl shadow-xl minimized hidden">
          <div class="flex items-center gap-2 px-3 py-2 border-b border-white/5">
            <i class="fa-solid fa-pen-ruler text-cyan-400 text-sm"></i>
            <span class="text-xs font-bold text-cyan-300" data-i18n="anno_title">Annotate</span>
            <button onclick="toggleAnnoFloat()" class="ml-auto w-7 h-7 rounded-lg bg-slate-800 text-slate-300 hover:text-cyan-300 flex items-center justify-center">
              <i class="fa-solid fa-minus" id="anno-float-icon"></i>
            </button>
          </div>
          <div class="anno-float-body flex items-center gap-2 px-3 py-2">
            <input type="color" id="anno-color-float" value="#00f3ff" onchange="syncAnnoColor(this.value)" class="w-7 h-7 cursor-pointer bg-transparent border-0 p-0">
            <button onclick="setAnnoMode('pen')" class="text-cyan-400 p-1.5 rounded hover:bg-slate-700"><i class="fa-solid fa-pen"></i></button>
            <button onclick="setAnnoMode('eraser')" class="text-slate-400 p-1.5 rounded hover:bg-slate-700"><i class="fa-solid fa-eraser"></i></button>
            <button onclick="clearAnnotations()" class="text-red-400 p-1.5 rounded hover:bg-slate-700"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        </div>

        <div class="absolute bottom-3 flex flex-col gap-2 z-10" style="inset-inline-end:12px" dir="ltr">
          <button class="zoom-btn" onclick="zoomBy(1.2)"><i class="fa-solid fa-plus"></i></button>
          <button class="zoom-btn" onclick="zoomBy(1/1.2)"><i class="fa-solid fa-minus"></i></button>
          <button class="zoom-btn" onclick="resetView()"><i class="fa-solid fa-crosshairs"></i></button>
        </div>
        <div id="drag-hint" class="absolute top-3 glass-panel rounded-xl px-4 py-2 text-xs md:text-sm text-cyan-300 pointer-events-none z-10" style="inset-inline-start:12px">
          <i class="fa-solid fa-hand-pointer"></i> <span data-i18n="drag_hint"></span>
        </div>
      </div>
    </section>

    <aside class="w-full lg:w-[340px] xl:w-[380px] flex flex-col gap-4 lg:overflow-y-auto lg:min-h-0 shrink-0 pb-2">
      <div id="panel-macro" class="glass-card rounded-2xl p-5 space-y-5">
        <h2 class="font-display font-bold text-base text-cyan-400 flex items-center gap-2">
          <i class="fa-solid fa-sliders"></i><span data-i18n="ctrl_title"></span>
        </h2>
        <div class="flex gap-2">
          <button id="btn-fire" onclick="toggleBeam()" class="flex-1 mode-btn active px-3 py-3 rounded-xl font-bold text-sm flex items-center justify-center gap-2">
            <i class="fa-solid fa-play" id="fire-icon"></i><span data-i18n="btn_fire"></span>
          </button>
          <button onclick="resetCounters()" class="px-4 py-3 rounded-xl font-bold text-sm glass-panel text-slate-300 hover:text-cyan-300">
            <i class="fa-solid fa-rotate-left"></i>
          </button>
        </div>
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-bold text-slate-300" data-i18n="beam_rate"></label>
            <span class="stat-val text-sm num" id="val-rate">40 /s</span>
          </div>
          <input type="range" id="sl-rate" class="w-full" min="5" max="120" step="5" value="40" oninput="onSlider()">
        </div>
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-bold text-slate-300" data-i18n="foil_thick"></label>
            <span class="stat-val text-sm num" id="val-thick">1.0×</span>
          </div>
          <input type="range" id="sl-thick" class="w-full" min="0.5" max="4" step="0.1" value="1" oninput="onSlider()">
          <div class="text-[10px] text-slate-500 mt-1 num">~10<sup>−4</sup> mm</div>
        </div>
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-bold text-slate-300" data-i18n="foil_mat"></label>
            <span class="stat-val text-sm" id="val-mat">Au</span>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <button id="mat-au" onclick="setMaterial('au')" class="mode-btn active px-2 py-2.5 rounded-xl font-bold text-xs">Au</button>
            <button id="mat-al" onclick="setMaterial('al')" class="mode-btn px-2 py-2.5 rounded-xl font-bold text-xs">Al</button>
            <button id="mat-pb" onclick="setMaterial('pb')" class="mode-btn px-2 py-2.5 rounded-xl font-bold text-xs">Pb</button>
          </div>
        </div>
      </div>

      <div id="panel-micro" class="glass-card rounded-2xl p-5 space-y-5 hidden">
        <h2 class="font-display font-bold text-base text-cyan-400 flex items-center gap-2">
          <i class="fa-solid fa-sliders"></i><span data-i18n="micro_ctrl"></span>
        </h2>
        <div class="flex gap-2">
          <button id="btn-launch" onclick="launchAlpha()" class="flex-1 mode-btn active px-3 py-3 rounded-xl font-bold text-sm flex items-center justify-center gap-2">
            <i class="fa-solid fa-bolt"></i><span data-i18n="btn_launch"></span>
          </button>
          <button onclick="clearTrails()" class="px-4 py-3 rounded-xl font-bold text-sm glass-panel text-slate-300 hover:text-cyan-300">
            <i class="fa-solid fa-eraser"></i>
          </button>
        </div>
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-bold text-slate-300" data-i18n="impact_b"></label>
            <span class="stat-val text-sm num" id="val-b">40</span>
          </div>
          <input type="range" id="sl-b" class="w-full" min="0" max="120" step="1" value="40" oninput="onSlider()">
          <div class="flex justify-between text-[10px] text-slate-500 mt-1">
            <span data-i18n="b_headon"></span>
            <span data-i18n="b_far"></span>
          </div>
        </div>
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-bold text-slate-300" data-i18n="nucleus_z"></label>
            <span class="stat-val text-sm num" id="val-z">79</span>
          </div>
          <input type="range" id="sl-z" class="w-full" min="1" max="92" step="1" value="79" oninput="onSlider()">
        </div>
        <label class="flex items-center gap-3 cursor-pointer select-none">
          <input type="checkbox" id="chk-orbits" checked onchange="state.showOrbits=this.checked" class="w-5 h-5 accent-cyan-400">
          <span class="text-sm text-slate-300" data-i18n="show_orbits"></span>
        </label>
      </div>

      <div class="glass-card rounded-2xl p-5 space-y-4">
        <h2 class="font-display font-bold text-base text-cyan-400 flex items-center gap-2">
          <i class="fa-solid fa-microscope"></i><span data-i18n="obs_title"></span>
        </h2>
        <div id="obs-macro" class="space-y-3">
          <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
            <span class="text-sm text-slate-400" data-i18n="cnt_total"></span>
            <span class="stat-val text-sm num" id="obs-total">0</span>
          </div>
          <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
            <span class="text-sm text-slate-400 flex items-center gap-2"><span class="chip ok">A</span><span data-i18n="cnt_straight"></span></span>
            <span class="stat-val text-sm num text-green-400" id="obs-straight">0</span>
          </div>
          <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
            <span class="text-sm text-slate-400 flex items-center gap-2"><span class="chip warm">B</span><span data-i18n="cnt_deflect"></span></span>
            <span class="stat-val text-sm num text-amber-300" id="obs-deflect">0</span>
          </div>
          <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
            <span class="text-sm text-slate-400 flex items-center gap-2"><span class="chip danger">C</span><span data-i18n="cnt_back"></span></span>
            <span class="stat-val text-sm num text-red-400" id="obs-back">0</span>
          </div>
          <div class="glass-panel rounded-xl px-4 py-3 text-sm font-bold text-center text-cyan-200" id="obs-ratio"></div>
        </div>
        <div id="obs-micro" class="space-y-3 hidden">
          <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
            <span class="text-sm text-slate-400" data-i18n="angle_scat"></span>
            <span class="stat-val text-sm num" id="obs-angle">—</span>

function T(k) {
  const L = LANG[cur] || LANG.en;
  return L[k] !== undefined ? L[k] : (LANG.en[k] || k);
}

let cur = localStorage.getItem('iqra_lang') || 'en';
const MAT = {
  au: { Z: 79, color: '#fbbf24', name: 'Au', scatter: 1.0 },
  al: { Z: 13, color: '#94a3b8', name: 'Al', scatter: 0.28 },
  pb: { Z: 82, color: '#78716c', name: 'Pb', scatter: 1.15 }
};

/* ============================================================
   DIAGRAM LAYOUT (matches Rutherford gold-foil figure)
   Source = BOTTOM-RIGHT → beam toward CENTER foil
   C-shaped detector gap faces the source
============================================================ */
const LAY = {
  srcAng: -40 * Math.PI / 180, // bottom-right
  srcR: 248,
  detR: 188,
  gap: 0.48,                   // half-opening toward source (rad)
  foilH: 100
};

const state = {
  mode: 'macro', running: false,
  rate: 40, thickness: 1, material: 'au',
  impactB: 40, Z: 79, showOrbits: true,
  zoom: 1, panX: 0, panY: 0,
  counts: { total: 0, straight: 0, deflect: 0, back: 0 },
  lastAngle: null, lastPath: ''
};

let particles = [], flashes = [], hitMarks = [];
let trails = [], microAlphas = [];
let spawnAcc = 0, W = 800, H = 500, baseScale = 1;
let launchFlip = 1;

function srcXY() {
  return { x: Math.cos(LAY.srcAng) * LAY.srcR, y: Math.sin(LAY.srcAng) * LAY.srcR };
}
function dirIn() { // source → foil
  const s = srcXY();
  const L = Math.hypot(s.x, s.y) || 1;
  return { x: -s.x / L, y: -s.y / L };
}
function fwdAng() {
  const d = dirIn();
  return Math.atan2(d.y, d.x);
}

function changeLanguage(l) {
  if (l !== 'en' && l !== 'ur') return;
  cur = l;
  localStorage.setItem('iqra_lang', cur);
  document.documentElement.lang = cur === 'ur' ? 'ur' : 'en';
  document.documentElement.dir = cur === 'ur' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = T(el.dataset.i18n);
    if (typeof v === 'string') el.textContent = v;
  });
  const intro = document.getElementById('intro-topic');
  if (intro) intro.textContent = T('intro_topic');
  document.getElementById('lang-select').value = cur;
  updateFireBtn(); updateObs(); updateTip();
  if (!document.getElementById('view-quiz').classList.contains('hidden')) renderQuiz();
}

function switchTab(tab) {
  document.getElementById('view-sim').classList.toggle('hidden', tab !== 'sim');
  document.getElementById('view-quiz').classList.toggle('hidden', tab !== 'quiz');
  document.getElementById('tab-sim').classList.toggle('active', tab === 'sim');
  document.getElementById('tab-quiz').classList.toggle('active', tab === 'quiz');
  if (tab === 'quiz') renderQuiz();
  if (tab === 'sim') setTimeout(resizeCanvas, 40);
}

function setMode(m) {
  state.mode = m;
  document.getElementById('mode-macro').classList.toggle('active', m === 'macro');
  document.getElementById('mode-micro').classList.toggle('active', m === 'micro');
  document.getElementById('panel-macro').classList.toggle('hidden', m !== 'macro');
  document.getElementById('panel-micro').classList.toggle('hidden', m !== 'micro');
  document.getElementById('obs-macro').classList.toggle('hidden', m !== 'macro');
  document.getElementById('obs-micro').classList.toggle('hidden', m !== 'micro');
  particles = []; flashes = [];
  updateTip(); resetView();
}

function setMaterial(m) {
  state.material = m;
  state.Z = MAT[m].Z;
  ['au','al','pb'].forEach(k => document.getElementById('mat-'+k).classList.toggle('active', k === m));
  document.getElementById('val-mat').textContent = MAT[m].name;
  document.getElementById('sl-z').value = state.Z;
  document.getElementById('val-z').textContent = state.Z;
  updateTip();
}

function onSlider() {
  state.rate = +document.getElementById('sl-rate').value;
  state.thickness = +document.getElementById('sl-thick').value;
  state.impactB = +document.getElementById('sl-b').value;
  state.Z = +document.getElementById('sl-z').value;
  document.getElementById('val-rate').textContent = state.rate + ' /s';
  document.getElementById('val-thick').textContent = state.thickness.toFixed(1) + '×';
  document.getElementById('val-b').textContent = state.impactB;
  document.getElementById('val-z').textContent = state.Z;
  updateTip();
}

function updateFireBtn() {
  const icon = document.getElementById('fire-icon');
  const span = document.querySelector('#btn-fire [data-i18n], #btn-fire span:last-child');
  if (state.running) {
    icon.className = 'fa-solid fa-pause';
    if (span) span.textContent = T('btn_pause');
  } else {
    icon.className = 'fa-solid fa-play';
    if (span) span.textContent = T('btn_fire');
  }
}
function toggleBeam() { state.running = !state.running; updateFireBtn(); }
function resetCounters() {
  state.counts = { total: 0, straight: 0, deflect: 0, back: 0 };
  particles = []; flashes = []; hitMarks = [];
  updateObs();
}
function clearTrails() {
  trails = []; microAlphas = [];
  state.lastAngle = null; updateObs();
}

function scatterKind() {
  const back = (1 / 20000) * state.thickness * MAT[state.material].scatter;
  const defl = 0.035 * state.thickness * Math.sqrt(MAT[state.material].scatter);
  const r = Math.random();
  if (r < back) return 'back';
  if (r < back + defl) return 'deflect';
  return 'straight';
}

function spawnParticle() {
  const kind = scatterKind();
  const s = srcXY(), d = dirIn(), fwd = fwdAng();
  const px = -d.y, py = d.x;
  const j = (Math.random() - 0.5) * 5;
  let ang = fwd;
  if (kind === 'straight') ang = fwd + (Math.random() - 0.5) * 0.07;
  else if (kind === 'deflect') {
    const a = (14 + Math.random() * 72) * Math.PI / 180;
    ang = fwd + (Math.random() < 0.5 ? a : -a);
  } else {
    ang = fwd + Math.PI + (Math.random() - 0.5) * 0.4;
  }
  particles.push({
    x: s.x + d.x * 34 + px * j,
    y: s.y + d.y * 34 + py * j,
    vx: d.x * 200, vy: d.y * 200,
    phase: 'in', kind, ang, life: 1, trail: []
  });
  state.counts.total++;
  if (kind === 'straight') state.counts.straight++;
  else if (kind === 'deflect') state.counts.deflect++;
  else state.counts.back++;
}

function updateMacro(dt) {
  if (state.running) {
    spawnAcc += state.rate * dt;
    while (spawnAcc >= 1) { spawnParticle(); spawnAcc -= 1; }
  }
  const s = srcXY();
  const denom = s.x * s.x + s.y * s.y;
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.phase === 'in') {
      const dist = Math.hypot(p.x, p.y);
      const prog = denom > 0 ? ((s.x - p.x) * s.x + (s.y - p.y) * s.y) / denom : 1;
      if (dist < 11 || prog >= 0.97) {
        p.phase = 'out';
        const sp = 225;
        p.vx = Math.cos(p.ang) * sp;
        p.vy = Math.sin(p.ang) * sp;
        p.x = Math.cos(p.ang) * 8;
        p.y = Math.sin(p.ang) * 8;
        flashes.push({ x: 0, y: 0, t: 0.25, kind: p.kind });
      }
    } else {
      p.life -= dt * 0.12;
    }
    p.trail.push({ x: p.x, y: p.y });
    if (p.trail.length > 20) p.trail.shift();

    const r = Math.hypot(p.x, p.y);
    const a = Math.atan2(p.y, p.x);
    let da = a - LAY.srcAng;
    while (da > Math.PI) da -= 2 * Math.PI;
    while (da < -Math.PI) da += 2 * Math.PI;
    const inGap = Math.abs(da) < LAY.gap;

    if (r > LAY.detR - 3 && r < LAY.detR + 16 && !inGap) {
      hitMarks.push({ ang: a, t: 1.4, kind: p.kind });
      if (hitMarks.length > 90) hitMarks.shift();
      flashes.push({ x: Math.cos(a) * LAY.detR, y: Math.sin(a) * LAY.detR, t: 0.45, kind: 'hit' });
      particles.splice(i, 1);
      continue;
    }
    if (r > LAY.detR + 50 || p.life <= 0) particles.splice(i, 1);
  }
  for (let i = flashes.length - 1; i >= 0; i--) {
    flashes[i].t -= dt;
    if (flashes[i].t <= 0) flashes.splice(i, 1);
  }
  for (let i = hitMarks.length - 1; i >= 0; i--) {
    hitMarks[i].t -= dt * 0.18;
    if (hitMarks[i].t <= 0) hitMarks.splice(i, 1);
  }
  updateObs();
}

function rutherfordDeg(b, Z) {
  const d = 0.55 * Z;
  const bb = Math.max(0.6, Math.abs(b));
  let th = 2 * Math.atan(d / bb) * 180 / Math.PI;
  if (Math.abs(b) < 2) th = Math.min(180, 155 + (2 - Math.abs(b)) * 12);
  return Math.min(179, th);
}
function pathOf(absAng) {
  if (absAng < 8) return 'straight';
  if (absAng < 90) return 'deflect';
  return 'back';
}

function launchAlpha() {
  const sb = state.impactB === 0 ? 0 : state.impactB * launchFlip;
  if (state.impactB > 0) launchFlip *= -1;
  const ang = rutherfordDeg(sb || 0.8, state.Z);
  const kind = pathOf(ang);
  state.lastAngle = ang; state.lastPath = kind;
  microAlphas.push({ x: -220, y: sb, vx: 175, vy: 0, kind, trail: [] });
  updateObs();
}

function updateMicro(dt) {
  for (let i = microAlphas.length - 1; i >= 0; i--) {
    const p = microAlphas[i];
    const rr = Math.max(8, Math.hypot(p.x, p.y));
    const F = (1450 * state.Z) / (rr * rr);
    p.vx += (p.x / rr) * F * dt;
    p.vy += (p.y / rr) * F * dt;
    const spd = Math.hypot(p.vx, p.vy);
    if (spd > 430) { p.vx *= 430 / spd; p.vy *= 430 / spd; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.trail.push({ x: p.x, y: p.y });
    if (p.trail.length > 220) p.trail.shift();
    if (Math.hypot(p.x, p.y) > 295 || p.x < -305) {
      trails.push({ pts: p.trail.slice(), kind: p.kind });
      if (trails.length > 8) trails.shift();
      microAlphas.splice(i, 1);
    }
  }
}

function updateObs() {
  if (state.mode === 'macro') {
    document.getElementById('obs-total').textContent = state.counts.total;
    document.getElementById('obs-straight').textContent = state.counts.straight;
    document.getElementById('obs-deflect').textContent = state.counts.deflect;
    document.getElementById('obs-back').textContent = state.counts.back;
    const n = state.counts.back > 0 ? Math.round(state.counts.total / state.counts.back) : 0;
    document.getElementById('obs-ratio').textContent = T('ratio_msg')(n);
  } else {
    document.getElementById('obs-angle').textContent = state.lastAngle == null ? '—' : state.lastAngle.toFixed(0) + '°';
    const pk = state.lastPath;
    document.getElementById('obs-path').textContent = pk === 'straight' ? 'A' : pk === 'deflect' ? 'B' : pk === 'back' ? 'C' : '—';
    let msg = T('tip_micro');
    if (pk === 'straight') msg = T('path_straight');
    else if (pk === 'deflect') msg = T('path_deflect');
    else if (pk === 'back') msg = T('path_back');
    document.getElementById('micro-status').textContent = msg;
  }
}

function updateTip() {
  let tip = T('tip_macro');
  if (state.mode === 'micro') tip = state.Z !== 79 ? T('tip_micro_z') : T('tip_micro');
  else if (state.thickness > 2.2) tip = T('tip_macro_thick');
  else if (state.material === 'pb') tip = T('tip_macro_pb');
  else if (state.material === 'al') tip = T('tip_macro_al');
  document.getElementById('tip-text').textContent = tip;
}

/* ===================== DRAW ===================== */
const canvas = document.getElementById('sim-canvas');
const ctx = canvas.getContext('2d');
function S() { return baseScale * state.zoom; }
function X(wx) { return W / 2 + wx * S() + state.panX; }
function Y(wy) { return H / 2 - wy * S() + state.panY; }

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function fontUI(sz) {
  return cur === 'ur'
    ? `600 ${sz}px 'Jameel Noori Nastaliq','Noto Nastaliq Urdu',serif`
    : `600 ${sz}px Manrope,sans-serif`;
}

function leader(text, lx, ly, tx, ty, color) {
  ctx.save();
  ctx.strokeStyle = 'rgba(244,114,182,0.6)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(X(tx), Y(ty));
  ctx.lineTo(X(lx), Y(ly));
  ctx.stroke();
  ctx.font = fontUI(11);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const tw = ctx.measureText(text).width;
  ctx.fillStyle = 'rgba(15,23,42,0.82)';
  roundRect(X(lx) - tw / 2 - 7, Y(ly) - 11, tw + 14, 22, 7);
  ctx.fill();
  ctx.fillStyle = color;
  ctx.fillText(text, X(lx), Y(ly));
  ctx.restore();
}

function starburst(wx, wy, r, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    ctx.lineTo(X(wx) + Math.cos(a) * r * S(), Y(wy) - Math.sin(a) * r * S());
    ctx.lineTo(X(wx) + Math.cos(a + Math.PI / 8) * r * 0.4 * S(), Y(wy) - Math.sin(a + Math.PI / 8) * r * 0.4 * S());
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function badge(wx, wy, letter, fill) {
  const bx = X(wx), by = Y(wy);
  ctx.beginPath(); ctx.arc(bx, by, 12, 0, Math.PI * 2);
  ctx.fillStyle = fill; ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px Oxanium,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(letter, bx, by + 1);
}

function drawCDetector() {
  const R = LAY.detR;
  const start = LAY.srcAng + LAY.gap;
  const span = 2 * Math.PI - 2 * LAY.gap;
  const steps = 100;
  // outer magenta/pink
  ctx.save();
  ctx.lineCap = 'butt';
  ctx.lineWidth = 18 * S();
  ctx.strokeStyle = '#be185d';
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = start + span * i / steps;
    const px = X(Math.cos(a) * R), py = Y(Math.sin(a) * R);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  // inner grey face
  ctx.lineWidth = 11 * S();
  ctx.strokeStyle = '#6b7280';
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = start + span * i / steps;
    const rr = R - 9;
    const px = X(Math.cos(a) * rr), py = Y(Math.sin(a) * rr);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.restore();
  const la = LAY.srcAng + Math.PI;
  leader(T('lbl_detector'), Math.cos(la) * (R + 36), Math.sin(la) * (R + 36),
    Math.cos(la) * R, Math.sin(la) * R, '#f9a8d4');
}

function drawFoil() {
  const tw = Math.max(6, 6 * state.thickness);
  const fh = LAY.foilH;
  ctx.save();
  // yellow glow
  const g = ctx.createRadialGradient(X(0), Y(0), 2, X(0), Y(0), fh * 0.65 * S());
  g.addColorStop(0, 'rgba(250,204,21,0.45)');
  g.addColorStop(1, 'rgba(250,204,21,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(X(0), Y(0), fh * 0.7 * S(), 0, Math.PI * 2); ctx.fill();

  ctx.shadowColor = 'rgba(250,204,21,0.95)';
  ctx.shadowBlur = 18 * S();
  ctx.fillStyle = 'rgba(253,224,71,0.55)';
  ctx.fillRect(X(-tw / 2), Y(fh / 2), tw * S(), fh * S());
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#f59e0b';
  ctx.lineWidth = 2;
  ctx.strokeRect(X(-tw / 2), Y(fh / 2), tw * S(), fh * S());
  ctx.strokeStyle = '#fef9c3';
  ctx.lineWidth = 2 * S();
  ctx.beginPath(); ctx.moveTo(X(0), Y(fh / 2)); ctx.lineTo(X(0), Y(-fh / 2)); ctx.stroke();
  ctx.restore();
  leader(T('lbl_foil'), -70, 78, 0, 28, '#fde68a');
}

function drawSource() {
  const s = srcXY(), d = dirIn();
  const cx = X(s.x), cy = Y(s.y), sc = S();
  ctx.save();
  // lead box body
  ctx.fillStyle = '#708090';
  roundRect(cx - 30 * sc, cy - 26 * sc, 60 * sc, 52 * sc, 6);
  ctx.fill();
  // top face (3D)
  ctx.fillStyle = '#9aa5b1';
  ctx.beginPath();
  ctx.moveTo(cx - 30 * sc, cy - 26 * sc);
  ctx.lineTo(cx - 18 * sc, cy - 40 * sc);
  ctx.lineTo(cx + 42 * sc, cy - 40 * sc);
  ctx.lineTo(cx + 30 * sc, cy - 26 * sc);
  ctx.closePath(); ctx.fill();
  // side face
  ctx.fillStyle = '#5b6773';
  ctx.beginPath();
  ctx.moveTo(cx + 30 * sc, cy - 26 * sc);
  ctx.lineTo(cx + 42 * sc, cy - 40 * sc);
  ctx.lineTo(cx + 42 * sc, cy + 12 * sc);
  ctx.lineTo(cx + 30 * sc, cy + 26 * sc);
  ctx.closePath(); ctx.fill();
  // radiation trefoil on top
  const rx = cx + 6 * sc, ry = cy - 33 * sc;
  ctx.fillStyle = '#facc15';
  for (let i = 0; i < 3; i++) {
    const a = -Math.PI / 2 + i * 2 * Math.PI / 3;
    ctx.beginPath(); ctx.moveTo(rx, ry);
    ctx.arc(rx, ry, 9 * sc, a - 0.42, a + 0.42); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = '#111827';
  ctx.beginPath(); ctx.arc(rx, ry, 2.4 * sc, 0, Math.PI * 2); ctx.fill();
  // slit + glowing source
  ctx.fillStyle = '#f97316';
  ctx.shadowColor = '#fb923c'; ctx.shadowBlur = 14;
  ctx.beginPath();
  ctx.arc(X(s.x + d.x * 28), Y(s.y + d.y * 28), 7 * sc, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  // dashed beam guide
  ctx.strokeStyle = 'rgba(250,204,21,0.45)';
  ctx.setLineDash([6, 5]); ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(X(s.x + d.x * 34), Y(s.y + d.y * 34));
  ctx.lineTo(X(d.x * 16), Y(d.y * 16));
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  leader(T('lbl_source'), s.x + 70, s.y - 55, s.x + 22, s.y - 8, '#e2e8f0');
  leader(T('lbl_slit'), s.x - 55, s.y + 50, s.x + d.x * 28, s.y + d.y * 28, '#94a3b8');
  const mid = { x: s.x * 0.55, y: s.y * 0.55 };
  leader(T('lbl_beam'), mid.x + 55, mid.y + 42, mid.x, mid.y, '#fdba74');
}

function drawPathBadges() {
  const fwd = fwdAng(), R = LAY.detR - 28;
  // A straight
  const ax = Math.cos(fwd) * R, ay = Math.sin(fwd) * R;
  ctx.strokeStyle = 'rgba(134,239,172,0.7)'; ctx.lineWidth = 2.5 * S();
  ctx.beginPath(); ctx.moveTo(X(Math.cos(fwd)*16), Y(Math.sin(fwd)*16)); ctx.lineTo(X(ax), Y(ay)); ctx.stroke();
  badge(ax * 0.72, ay * 0.72, 'A', '#7c3aed');
  // B deflect
  const bAng = fwd + 0.9;
  const bx = Math.cos(bAng) * (R - 10), by = Math.sin(bAng) * (R - 10);
  ctx.strokeStyle = 'rgba(251,191,36,0.75)';
  ctx.beginPath(); ctx.moveTo(X(Math.cos(bAng)*16), Y(Math.sin(bAng)*16)); ctx.lineTo(X(bx), Y(by)); ctx.stroke();
  badge(bx * 0.7, by * 0.7, 'B', '#7c3aed');
  // C rebound toward source
  const cAng = fwd + Math.PI;
  const cx = Math.cos(cAng) * 95, cy = Math.sin(cAng) * 95;
  ctx.strokeStyle = 'rgba(248,113,113,0.85)';
  ctx.beginPath(); ctx.moveTo(X(Math.cos(cAng)*14), Y(Math.sin(cAng)*14)); ctx.lineTo(X(cx), Y(cy)); ctx.stroke();
  badge(cx * 0.65, cy * 0.65, 'C', '#7c3aed');
}

function drawAtomicInset() {
  // Fixed to bottom-left of viewport (diagram style)
  const ix = 90, iy = H - 95;
  const sc = Math.min(1, Math.max(0.75, S()));
  ctx.save();
  ctx.fillStyle = 'rgba(15,23,42,0.88)';
  ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  roundRect(ix - 72 * sc, iy - 72 * sc, 148 * sc, 148 * sc, 14);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#94a3b8';
  ctx.font = cur === 'ur'
    ? `700 11px 'Jameel Noori Nastaliq','Noto Nastaliq Urdu',serif`
    : `700 10px Oxanium,sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(T('lbl_atomic_model'), ix, iy - 56 * sc);

  ctx.setLineDash([3, 3]);
  ctx.strokeStyle = 'rgba(148,163,184,0.5)';
  ctx.beginPath(); ctx.arc(ix, iy - 4, 40 * sc, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(ix, iy - 4, 26 * sc, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#ef4444';
  ctx.shadowColor = 'rgba(239,68,68,0.5)'; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(ix, iy - 4, 8 * sc, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#3b82f6';
  [[26, 0.4], [40, 1.7], [26, 3.4], [40, 4.9]].forEach(([r, a]) => {
    ctx.beginPath();
    ctx.arc(ix + Math.cos(a) * r * sc, iy - 4 + Math.sin(a) * r * sc, 3.2 * sc, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.fillStyle = '#fca5a5'; ctx.font = '600 9px Manrope';
  ctx.fillText(T('lbl_nucleus'), ix, iy + 52 * sc);
  ctx.fillStyle = '#93c5fd';
  ctx.fillText(T('lbl_electron'), ix, iy + 64 * sc);
  ctx.restore();
}

function drawMacro() {
  drawCDetector();
  hitMarks.forEach(h => {
    const a = Math.max(0, Math.min(1, h.t));
    starburst(Math.cos(h.ang) * (LAY.detR - 5), Math.sin(h.ang) * (LAY.detR - 5),
      6 + 5 * a, `rgba(250,204,21,${0.3 + 0.6 * a})`);
  });
  drawFoil();
  drawSource();
  drawPathBadges();

  particles.forEach(p => {
    ctx.strokeStyle = p.kind === 'back' ? 'rgba(248,113,113,0.5)'
      : p.kind === 'deflect' ? 'rgba(251,191,36,0.45)' : 'rgba(253,186,116,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    p.trail.forEach((t, i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, X(t.x), Y(t.y)));
    ctx.stroke();
    ctx.fillStyle = p.kind === 'back' ? '#f87171' : p.kind === 'deflect' ? '#fbbf24' : '#facc15';
    ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), 3.4 * S(), 0, Math.PI * 2); ctx.fill();
  });
  flashes.forEach(f => {
    const a = Math.max(0, f.t / 0.45);
    starburst(f.x, f.y, 8 + 5 * a, f.kind === 'hit' ? `rgba(250,204,21,${a})` : `rgba(255,255,255,${a * 0.75})`);
  });
  drawAtomicInset();
}

function drawMicro() {
  ctx.save();
  ctx.setLineDash([5, 6]);
  ctx.strokeStyle = 'rgba(148,163,184,0.5)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(X(0), Y(0), 155 * S(), 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]); ctx.restore();

  if (state.showOrbits) {
    [55, 95, 135].forEach((r, i) => {
      ctx.strokeStyle = `rgba(59,130,246,${0.12 + i * 0.05})`;
      ctx.beginPath(); ctx.arc(X(0), Y(0), r * S(), 0, Math.PI * 2); ctx.stroke();
      const t = performance.now() / 1000;
      const ex = Math.cos(t * (0.55 + i * 0.2) + i) * r;
      const ey = Math.sin(t * (0.55 + i * 0.2) + i) * r;
      ctx.fillStyle = '#3b82f6';
      ctx.beginPath(); ctx.arc(X(ex), Y(ey), 5 * S(), 0, Math.PI * 2); ctx.fill();
    });
    ctx.fillStyle = '#93c5fd'; ctx.font = fontUI(12); ctx.textAlign = 'center';
    ctx.fillText(T('lbl_electron'), X(120), Y(148));
  }

  const nr = (12 + Math.sqrt(state.Z) * 1.1) * S();
  ctx.fillStyle = '#dc2626';
  ctx.shadowColor = 'rgba(220,38,38,0.55)'; ctx.shadowBlur = 16;
  ctx.beginPath(); ctx.arc(X(0), Y(0), nr, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#f87171'; ctx.font = fontUI(12); ctx.textAlign = 'center';
  ctx.fillText(T('lbl_nucleus') + ' (Z=' + state.Z + ')', X(0), Y(0) + nr / S() + 22);

  ctx.strokeStyle = 'rgba(0,243,255,0.35)'; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(X(-230), Y(state.impactB)); ctx.lineTo(X(-45), Y(state.impactB)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#67e8f9'; ctx.font = fontUI(11);
  ctx.fillText('b = ' + state.impactB, X(-145), Y(state.impactB) - 12);

  if (!microAlphas.length && !trails.length) {
    ctx.strokeStyle = 'rgba(226,232,240,0.3)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(X(-220), Y(95)); ctx.lineTo(X(220), Y(95)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X(-220), Y(30)); ctx.quadraticCurveTo(X(10), Y(42), X(180), Y(115)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X(-220), Y(0)); ctx.lineTo(X(-20), Y(0)); ctx.lineTo(X(-150), Y(-45)); ctx.stroke();
  }
  trails.forEach(tr => {
    ctx.strokeStyle = tr.kind === 'back' ? 'rgba(248,113,113,0.4)' : tr.kind === 'deflect' ? 'rgba(251,191,36,0.4)' : 'rgba(134,239,172,0.35)';
    ctx.lineWidth = 2.5; ctx.beginPath();
    tr.pts.forEach((t, i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, X(t.x), Y(t.y)));
    ctx.stroke();
  });
  microAlphas.forEach(p => {
    ctx.strokeStyle = 'rgba(251,146,60,0.75)'; ctx.lineWidth = 2.5; ctx.beginPath();
    p.trail.forEach((t, i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, X(t.x), Y(t.y)));
    ctx.stroke();
    ctx.fillStyle = '#fb923c';
    ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), 6 * S(), 0, Math.PI * 2); ctx.fill();
  });
}

function render() {
  ctx.clearRect(0, 0, W, H);
  const bg = ctx.createRadialGradient(W/2, H/2, 30, W/2, H/2, Math.max(W, H) * 0.7);
  bg.addColorStop(0, '#152238'); bg.addColorStop(1, '#0b1220');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  if (state.mode === 'macro') drawMacro(); else drawMicro();
}

function zoomBy(f) { state.zoom = Math.min(3.5, Math.max(0.45, state.zoom * f)); }
function resetView() { state.zoom = 1; state.panX = 0; state.panY = 0; fitView(); }
function fitView() { baseScale = Math.min(W, H) / 640; }

let dragging = false, lastPX = 0, lastPY = 0;
canvas.addEventListener('pointerdown', e => {
  if (isAnnoActive) return;
  dragging = true; canvas.setPointerCapture(e.pointerId);
  lastPX = e.clientX; lastPY = e.clientY; canvas.style.cursor = 'grabbing';
});
canvas.addEventListener('pointermove', e => {
  if (!dragging || isAnnoActive) return;
  state.panX += e.clientX - lastPX; state.panY += e.clientY - lastPY;
  lastPX = e.clientX; lastPY = e.clientY;
});
canvas.addEventListener('pointerup', () => { dragging = false; canvas.style.cursor = 'grab'; });
canvas.addEventListener('wheel', e => { e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.1 : 1/1.1); }, { passive: false });
let pinchDist = null;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchDist = Math.hypot(dx, dy);
  }
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinchDist) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const d = Math.hypot(dx, dy);
    zoomBy(d / pinchDist); pinchDist = d;
  }
}, { passive: false });
canvas.addEventListener('touchend', () => { pinchDist = null; });

/* Annotation — exact required logic */
let fCanvas, isAnnoActive = false;
function initAnnotationCanvas(w, h) {
  if (fCanvas) { fCanvas.setWidth(w); fCanvas.setHeight(h); fCanvas.calcOffset(); return; }
  fCanvas = new fabric.Canvas('fabricLayer', { isDrawingMode: false, width: w, height: h });
  fCanvas.freeDrawingBrush.color = document.getElementById('anno-color').value;
  fCanvas.freeDrawingBrush.width = 4;
  fCanvas.on('mouse:down', function(options) {
    if (isAnnoActive && !fCanvas.isDrawingMode && options.target) fCanvas.remove(options.target);
  });
  const fabricContainer = document.querySelector('.canvas-container');
  if (fabricContainer) fabricContainer.style.pointerEvents = 'none';
}
function toggleAnnotationMode() {
  isAnnoActive = !isAnnoActive;
  const btn = document.getElementById('btn-anno-toggle');
  const toolbar = document.getElementById('anno-toolbar');
  const fabricContainer = document.querySelector('.canvas-container');
  const floatCard = document.getElementById('anno-float');
  if (isAnnoActive) {
    btn.classList.replace('text-slate-400', 'text-cyan-400');
    toolbar.classList.remove('max-w-0', 'opacity-0');
    toolbar.classList.add('max-w-xs', 'opacity-100');
    if (fabricContainer) fabricContainer.style.pointerEvents = 'auto';
    floatCard.classList.remove('hidden'); floatCard.classList.remove('minimized');
    setAnnoMode('pen');
  } else {
    btn.classList.replace('text-cyan-400', 'text-slate-400');
    toolbar.classList.remove('max-w-xs', 'opacity-100');
    toolbar.classList.add('max-w-0', 'opacity-0');
    if (fabricContainer) fabricContainer.style.pointerEvents = 'none';
    floatCard.classList.add('hidden');
    if (fCanvas) fCanvas.isDrawingMode = false;
  }
}
function setAnnoMode(mode) {
  document.getElementById('anno-pen').classList.replace('text-cyan-400', 'text-slate-400');
  document.getElementById('anno-eraser').classList.replace('text-cyan-400', 'text-slate-400');
  if (mode === 'pen') {
    document.getElementById('anno-pen').classList.replace('text-slate-400', 'text-cyan-400');
    if (fCanvas) fCanvas.isDrawingMode = true;
  } else {
    document.getElementById('anno-eraser').classList.replace('text-slate-400', 'text-cyan-400');
    if (fCanvas) fCanvas.isDrawingMode = false;
  }
}
function changeAnnoColor(color) {
  if (fCanvas) fCanvas.freeDrawingBrush.color = color;
  document.getElementById('anno-color-float').value = color;
  setAnnoMode('pen');
}
function syncAnnoColor(color) {
  document.getElementById('anno-color').value = color;
  changeAnnoColor(color);
}
function clearAnnotations() { if (fCanvas) fCanvas.clear(); }
function toggleAnnoFloat() {
  const el = document.getElementById('anno-float');
  el.classList.toggle('minimized');
  document.getElementById('anno-float-icon').className =
    el.classList.contains('minimized') ? 'fa-solid fa-plus' : 'fa-solid fa-minus';
}
(function () {
  const el = document.getElementById('anno-float');
  let dx = 0, dy = 0, on = false;
  el.addEventListener('pointerdown', e => {
    if (e.target.closest('button') || e.target.tagName === 'INPUT') return;
    on = true; dx = e.clientX - el.offsetLeft; dy = e.clientY - el.offsetTop;
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', e => {
    if (!on) return;
    const wrap = document.getElementById('canvas-wrap').getBoundingClientRect();
    el.style.left = Math.max(0, Math.min(wrap.width - 40, e.clientX - wrap.left - dx)) + 'px';
    el.style.top = Math.max(0, Math.min(wrap.height - 40, e.clientY - wrap.top - dy)) + 'px';
  });
  el.addEventListener('pointerup', () => on = false);
})();

function toggleFullScreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.();
    document.getElementById('fs-icon').className = 'fa-solid fa-compress';
  } else {
    document.exitFullscreen?.();
    document.getElementById('fs-icon').className = 'fa-solid fa-expand';
  }
}

let quizIdx = 0, quizScore = 0, quizAnswered = false;
function renderQuiz() {
  const box = document.getElementById('quiz-box');
  const quiz = LANG[cur].quiz;
  if (quizIdx >= quiz.length) {
    const pct = Math.round((quizScore / quiz.length) * 100);
    let msg = T('score_msg_low');
    if (pct >= 80) msg = T('score_msg_great');
    else if (pct >= 50) msg = T('score_msg_good');
    box.innerHTML = `<div class="text-center fade-in space-y-6">
      <div class="text-cyan-400 font-display font-bold text-xl">${T('final_score')}</div>
      <div class="relative inline-flex items-center justify-center">
        <svg class="score-ring" width="140" height="140" viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="58" fill="none" stroke="#1e293b" stroke-width="12"/>
          <circle cx="70" cy="70" r="58" fill="none" stroke="#00f3ff" stroke-width="12"
            stroke-dasharray="${2*Math.PI*58}" stroke-dashoffset="${2*Math.PI*58*(1-pct/100)}"
            stroke-linecap="round" transform="rotate(-90 70 70)"/>
        </svg>
        <div class="absolute text-3xl font-black text-cyan-300 num">${pct}%</div>
      </div>
      <div class="text-2xl font-bold">${quizScore} / ${quiz.length}</div>
      <p class="text-slate-300">${msg}</p>
      <button onclick="restartQuiz()" class="mode-btn active px-6 py-3 rounded-xl font-bold">${T('restart')}</button>
    </div>`;
    return;
  }
  const q = quiz[quizIdx];
  box.innerHTML = `<div class="fade-in">
    <div class="flex items-center justify-between mb-4 gap-3">
      <h2 class="font-display font-bold text-lg text-cyan-400">${T('quiz_title')}</h2>
      <span class="chip">${T('quiz_progress')(quizIdx+1, quiz.length)}</span>
    </div>
    <p class="text-lg md:text-xl font-bold mb-5 leading-relaxed">${q.q}</p>
    <div class="space-y-3" id="quiz-opts">
      ${q.opts.map((o,i)=>`<button class="opt-btn w-full text-start px-4 py-3.5 rounded-xl font-semibold text-slate-200" onclick="answerQuiz(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}
    </div>
    <div id="quiz-fb" class="mt-4 hidden"></div>
    <div class="mt-5 flex justify-end">
      <button id="quiz-next" class="mode-btn active px-5 py-2.5 rounded-xl font-bold hidden" onclick="nextQuiz()"></button>
    </div>
  </div>`;
  quizAnswered = false;
}
function answerQuiz(i) {
  if (quizAnswered) return;
  quizAnswered = true;
  const q = LANG[cur].quiz[quizIdx];
  document.querySelectorAll('#quiz-opts .opt-btn').forEach((b, idx) => {
    b.classList.add('locked');
    if (idx === q.a) b.classList.add('correct');
    if (idx === i && i !== q.a) b.classList.add('wrong');
  });
  if (i === q.a) quizScore++;
  const fb = document.getElementById('quiz-fb');
  fb.classList.remove('hidden');
  fb.innerHTML = `<div class="glass-panel rounded-xl px-4 py-3 ${i===q.a?'text-green-300 glow-green':'text-red-300 glow-red'}">
    <strong>${i===q.a?T('correct_fb'):T('wrong_fb')}</strong>
    <p class="mt-1 text-slate-300 text-sm leading-relaxed">${q.ex}</p></div>`;
  const next = document.getElementById('quiz-next');
  next.classList.remove('hidden');
  next.textContent = quizIdx + 1 >= LANG[cur].quiz.length ? T('see_result') : T('next_q');
}
function nextQuiz() { quizIdx++; renderQuiz(); }
function restartQuiz() { quizIdx = 0; quizScore = 0; renderQuiz(); }

function resizeCanvas() {
  const rect = document.getElementById('canvas-wrap').getBoundingClientRect();
  W = Math.max(320, Math.floor(rect.width));
  H = Math.max(300, Math.floor(rect.height));
  canvas.width = W; canvas.height = H;
  fitView();
  initAnnotationCanvas(W, H);
}

let lastT = performance.now();
function loop(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000);
  lastT = t;
  if (state.mode === 'macro') updateMacro(dt); else updateMicro(dt);
  render();
  requestAnimationFrame(loop);
}

function boot() {
  changeLanguage(cur);
  resizeCanvas();
  updateObs(); updateTip(); updateFireBtn();
  window.addEventListener('resize', resizeCanvas);
  requestAnimationFrame(loop);
  setTimeout(() => {
    if (state.mode === 'macro' && !state.running) {
      state.running = true; updateFireBtn();
    }
  }, 600);
}

setTimeout(() => {
  const intro = document.getElementById('intro');
  intro.style.opacity = '0';
  setTimeout(() => {
    intro.style.display = 'none';
    const app = document.getElementById('app');
    app.style.display = 'flex';
    app.classList.remove('opacity-0');
    boot();
  }, 700);
}, 4800);
</script>
</body>
</html>
