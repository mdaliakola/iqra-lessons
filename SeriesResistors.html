/* ============================================================
   GLOBAL STATE
============================================================ */
let cur = localStorage.getItem('iqra_lang_series') || 'en';
const state = {
  V: 12,
  resistors: [10, 20, 30],
  switchOn: false,
  showAmmeter: true,
  showVoltmeter: true,
  probe: 'total', // total | 0 | 1 | 2 ...
  zoom: 1,
  panX: 0,
  panY: 0
};
const T = k => LANG[cur][k];
let animT = 0;
let canvas, ctx, W = 800, H = 500;
let baseScale = 1;
let dragging = null, lastP = null, pinch = null;

/* ============================================================
   PHYSICS
============================================================ */
function calc() {
  const Req = state.resistors.reduce((a,b)=>a+b, 0);
  const I = state.switchOn && Req > 0 ? state.V / Req : 0;
  const drops = state.resistors.map(r => I * r);
  let vm = 0;
  if (state.probe === 'total') vm = drops.reduce((a,b)=>a+b, 0);
  else {
    const idx = Number(state.probe);
    vm = drops[idx] || 0;
  }
  return { Req, I, drops, vm };
}

/* ============================================================
   LANGUAGE / TABS / UI
============================================================ */
function changeLanguage(l) {
  cur = l;
  localStorage.setItem('iqra_lang_series', l);
  document.documentElement.setAttribute('dir', l === 'ur' ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', l);
  document.body.style.fontFamily = l === 'ur'
    ? "'Jameel Noori Nastaliq', 'Noto Nastaliq Urdu', serif"
    : "'Manrope', sans-serif";
  document.getElementById('lang-select').value = l;
  document.getElementById('intro-topic').textContent = T('intro_topic');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    const val = T(key);
    if (typeof val === 'string') el.textContent = val;
  });
  buildResistorSliders();
  buildProbeButtons();
  updateReadouts();
  renderQuiz();
  requestAnimationFrame(draw);
}

function toggleFullScreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
    document.getElementById('fs-icon').className = 'fa-solid fa-compress';
  } else {
    document.exitFullscreen();
    document.getElementById('fs-icon').className = 'fa-solid fa-expand';
  }
}
document.addEventListener('fullscreenchange', () => {
  document.getElementById('fs-icon').className = document.fullscreenElement ? 'fa-solid fa-compress' : 'fa-solid fa-expand';
});

function switchTab(t) {
  document.getElementById('view-sim').classList.toggle('hidden', t !== 'sim');
  document.getElementById('view-quiz').classList.toggle('hidden', t !== 'quiz');
  document.getElementById('tab-sim').classList.toggle('active', t === 'sim');
  document.getElementById('tab-quiz').classList.toggle('active', t === 'quiz');
  if (t === 'sim') { fitCanvas(); requestAnimationFrame(draw); }
}

function toggleSwitch() {
  state.switchOn = !state.switchOn;
  document.getElementById('btn-switch').classList.toggle('switch-on', state.switchOn);
  updateReadouts();
}
function toggleAmmeter() {
  state.showAmmeter = !state.showAmmeter;
  document.getElementById('btn-ammeter').classList.toggle('active', state.showAmmeter);
  updateReadouts();
}
function toggleVoltmeter() {
  state.showVoltmeter = !state.showVoltmeter;
  document.getElementById('btn-voltmeter').classList.toggle('active', state.showVoltmeter);
  updateReadouts();
}
function addResistor() {
  if (state.resistors.length >= 5) return;
  state.resistors.push(15);
  if (state.probe !== 'total' && Number(state.probe) >= state.resistors.length) state.probe = 'total';
  buildResistorSliders();
  buildProbeButtons();
  updateReadouts();
}
function removeResistor() {
  if (state.resistors.length <= 1) return;
  state.resistors.pop();
  if (state.probe !== 'total' && Number(state.probe) >= state.resistors.length) state.probe = 'total';
  buildResistorSliders();
  buildProbeButtons();
  updateReadouts();
}
function setProbe(p) {
  state.probe = p;
  buildProbeButtons();
  updateReadouts();
}
function onControls() {
  state.V = parseFloat(document.getElementById('sl-v').value);
  state.resistors = state.resistors.map((_, i) => {
    const el = document.getElementById('sl-r'+i);
    return el ? parseFloat(el.value) : state.resistors[i];
  });
  updateReadouts();
}

function buildResistorSliders() {
  const box = document.getElementById('resistor-sliders');
  box.innerHTML = state.resistors.map((r,i) => `
    <div>
      <div class="flex justify-between items-center mb-2">
        <label class="text-sm font-bold text-slate-300">${T('lbl_resistor')(i+1)} (Ω)</label>
        <span class="stat-val text-sm num" id="val-r${i}">${r.toFixed(1)} Ω</span>
      </div>
      <input type="range" id="sl-r${i}" class="w-full" min="1" max="100" step="1" value="${r}" oninput="onControls()">
    </div>`).join('');
}
function buildProbeButtons() {
  const box = document.getElementById('probe-btns');
  const items = [{id:'total', label: T('probe_total')}].concat(
    state.resistors.map((_,i)=>({id:String(i), label:T('probe_r')(i+1)}))
  );
  box.innerHTML = items.map(it => `
    <button onclick="setProbe('${it.id}')" class="probe-btn ${state.probe===it.id?'active':''} px-3 py-2.5 rounded-xl font-bold text-xs text-slate-300">${it.label}</button>
  `).join('');
}

function updateReadouts() {
  const p = calc();
  document.getElementById('val-v').textContent = state.V.toFixed(1) + ' V';
  state.resistors.forEach((r,i)=>{
    const el = document.getElementById('val-r'+i);
    if (el) el.textContent = r.toFixed(1) + ' Ω';
  });
  document.getElementById('obs-req').textContent = p.Req.toFixed(1) + ' Ω';
  document.getElementById('obs-i').textContent = state.switchOn ? (p.I.toFixed(3) + ' A') : '0.000 A';
  document.getElementById('obs-vm').textContent = state.showVoltmeter
    ? (state.switchOn ? p.vm.toFixed(2) + ' V' : '0.00 V')
    : '—';

  const dropsBox = document.getElementById('obs-drops');
  dropsBox.innerHTML = state.resistors.map((r,i)=>`
    <div class="flex justify-between items-center border-b border-slate-700/40 pb-2">
      <span class="text-sm text-slate-400">${T('obs_drop')(i+1)}</span>
      <span class="stat-val text-sm num">${state.switchOn ? p.drops[i].toFixed(2)+' V' : '0.00 V'}</span>
    </div>`).join('');

  const law = document.getElementById('obs-law');
  if (!state.switchOn) {
    law.textContent = T('open_circuit');
    law.className = 'glass-panel rounded-xl px-4 py-3 text-sm font-bold text-center text-amber-300';
  } else {
    law.textContent = T('law_line')(p.I.toFixed(3), p.Req.toFixed(1), state.V.toFixed(1));
    law.className = 'glass-panel rounded-xl px-4 py-3 text-sm font-bold text-center text-cyan-300 glow-cyan';
  }

  // Concept tip
  let tip = T('tip_series');
  if (!state.switchOn) tip = T('tip_open');
  else if (state.showVoltmeter && state.probe === 'total') tip = T('tip_sum');
  else if (state.showVoltmeter) tip = T('tip_voltage');
  else if (state.showAmmeter) tip = T('tip_meters');
  document.getElementById('tip-text').textContent = tip;
}

/* ============================================================
   CANVAS DRAWING
============================================================ */
function fitCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  if (!wrap) return;
  const rect = wrap.getBoundingClientRect();
  W = Math.max(320, Math.floor(rect.width));
  H = Math.max(280, Math.floor(rect.height));
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  baseScale = Math.min(W / 900, H / 520);
  if (fCanvas) {
    fCanvas.setWidth(W);
    fCanvas.setHeight(H);
    fCanvas.calcOffset();
  }
}

function S() { return baseScale * state.zoom; }
function TX(x) { return W/2 + x * S() + state.panX; }
function TY(y) { return H/2 + y * S() + state.panY; }
function latinFont(weight, size) {
  return `${weight} ${size}px Oxanium, monospace`;
}
function labelFont(weight, size) {
  if (cur === 'ur') return `${weight} ${size}px "Jameel Noori Nastaliq", "Noto Nastaliq Urdu", serif`;
  return latinFont(weight, size);
}

function roundRect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawWire(x1,y1,x2,y2, glow) {
  ctx.strokeStyle = glow ? 'rgba(0,243,255,0.95)' : 'rgba(148,163,184,0.85)';
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';
  ctx.shadowColor = glow ? 'rgba(0,243,255,0.55)' : 'transparent';
  ctx.shadowBlur = glow ? 10 : 0;
  ctx.beginPath();
  ctx.moveTo(TX(x1), TY(y1));
  ctx.lineTo(TX(x2), TY(y2));
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawCurrentArrow(x, y, angle) {
  if (!state.switchOn) return;
  const px = TX(x), py = TY(y);
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(angle);
  ctx.fillStyle = '#67e8f9';
  ctx.beginPath();
  ctx.moveTo(10*S(), 0);
  ctx.lineTo(-6*S(), -6*S());
  ctx.lineTo(-6*S(), 6*S());
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawResistorSymbol(cx, cy, label, ohms, drop) {
  const w = 70, h = 28;
  const x = TX(cx - w/2), y = TY(cy - h/2);
  const ww = w * S(), hh = h * S();
  ctx.fillStyle = 'rgba(15,23,42,0.92)';
  ctx.strokeStyle = '#00f3ff';
  ctx.lineWidth = 2;
  roundRect(x, y, ww, hh, 6 * S());
  ctx.fill(); ctx.stroke();

  // zigzag hint
  ctx.strokeStyle = '#67e8f9';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  const zx = x + 10*S(), zy = y + hh/2, zw = ww - 20*S();
  const segs = 6;
  for (let i=0;i<=segs;i++){
    const px = zx + (zw*i)/segs;
    const py = zy + ((i%2===0)?-1:1)*6*S()*(i===0||i===segs?0:1);
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.stroke();

  ctx.fillStyle = '#e2e8f0';
  ctx.font = latinFont(700, Math.max(11, 12*S()));
  ctx.textAlign = 'center';
  ctx.fillText(label, TX(cx), TY(cy - 28));
  ctx.fillStyle = '#94a3b8';
  ctx.font = latinFont(600, Math.max(10, 11*S()));
  ctx.fillText(ohms.toFixed(0) + ' Ω', TX(cx), TY(cy + 32));
  if (state.switchOn) {
    ctx.fillStyle = '#fbbf24';
    ctx.fillText(drop.toFixed(2) + ' V', TX(cx), TY(cy + 48));
  }
}

function drawBattery(cx, cy) {
  const x = TX(cx), y = TY(cy);
  ctx.strokeStyle = '#fca5a5';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - 18*S(), y - 12*S());
  ctx.lineTo(x - 18*S(), y + 12*S());
  ctx.stroke();
  ctx.strokeStyle = '#f87171';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x - 6*S(), y - 22*S());
  ctx.lineTo(x - 6*S(), y + 22*S());
  ctx.stroke();
  ctx.strokeStyle = '#fca5a5';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + 6*S(), y - 12*S());
  ctx.lineTo(x + 6*S(), y + 12*S());
  ctx.stroke();
  ctx.strokeStyle = '#f87171';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x + 18*S(), y - 22*S());
  ctx.lineTo(x + 18*S(), y + 22*S());
  ctx.stroke();

  ctx.fillStyle = '#fca5a5';
  ctx.font = labelFont(700, Math.max(11,12*S()));
  ctx.textAlign = 'center';
  ctx.fillText(T('lbl_battery'), x, y - 38*S());
  ctx.fillStyle = '#00f3ff';
  ctx.font = latinFont(700, Math.max(11,12*S()));
  ctx.fillText(state.V.toFixed(1)+' V', x, y + 42*S());
  ctx.fillStyle = '#f87171';
  ctx.font = latinFont(800, Math.max(12,14*S()));
  ctx.fillText('−', x - 28*S(), y - 8*S());
  ctx.fillStyle = '#86efac';
  ctx.fillText('+', x + 30*S(), y - 8*S());
}

function drawSwitch(cx, cy) {
  const x = TX(cx), y = TY(cy);
  ctx.fillStyle = '#94a3b8';
  ctx.beginPath(); ctx.arc(x - 22*S(), y, 5*S(), 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 22*S(), y, 5*S(), 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = state.switchOn ? '#22c55e' : '#f59e0b';
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - 22*S(), y);
  if (state.switchOn) ctx.lineTo(x + 22*S(), y);
  else ctx.lineTo(x + 10*S(), y - 18*S());
  ctx.stroke();
  ctx.fillStyle = state.switchOn ? '#86efac' : '#fcd34d';
  ctx.font = labelFont(700, Math.max(11,12*S()));
  ctx.textAlign = 'center';
  ctx.fillText(T('lbl_switch') + ' ' + (state.switchOn ? T('switch_on') : T('switch_off')), x, y + 30*S());
}

function drawMeter(cx, cy, type, reading, color) {
  const r = 28 * S();
  const x = TX(cx), y = TY(cy);
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(15,23,42,0.95)';
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.shadowColor = color;
  ctx.shadowBlur = 12;
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = color;
  ctx.font = latinFont(800, Math.max(13,15*S()));
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(type, x, y - 6*S());
  ctx.fillStyle = '#e2e8f0';
  ctx.font = latinFont(700, Math.max(10,11*S()));
  ctx.fillText(reading, x, y + 12*S());
  ctx.textBaseline = 'alphabetic';
}

function drawElectrons(path, speed) {
  if (!state.switchOn) return;
  const n = 14;
  for (let i=0;i<n;i++){
    const t = (animT * speed + i/n) % 1;
    const p = pointOnPath(path, t);
    const g = ctx.createRadialGradient(TX(p.x), TY(p.y), 0, TX(p.x), TY(p.y), 5*S());
    g.addColorStop(0, '#67e8f9');
    g.addColorStop(1, 'rgba(0,243,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(TX(p.x), TY(p.y), 5*S(), 0, Math.PI*2);
    ctx.fill();
  }
}

function pointOnPath(segs, t) {
  let total = 0;
  const lens = segs.map(s => {
    const L = Math.hypot(s.x2-s.x1, s.y2-s.y1);
    total += L; return L;
  });
  let dist = t * total;
  for (let i=0;i<segs.length;i++){
    if (dist <= lens[i] || i===segs.length-1) {
      const u = lens[i] ? dist / lens[i] : 0;
      return { x: segs[i].x1 + (segs[i].x2-segs[i].x1)*u, y: segs[i].y1 + (segs[i].y2-segs[i].y1)*u };
    }
    dist -= lens[i];
  }
  return {x:segs[0].x1, y:segs[0].y1};
}

function layout() {
  // Horizontal series layout centered
  const n = state.resistors.length;
  const gap = 110;
  const totalW = n * gap + 280;
  const left = -totalW/2;
  const yTop = -40;
  const yBot = 90;

  const nodes = {};
  nodes.batL = {x: left + 40, y: yTop};
  nodes.batR = {x: left + 90, y: yTop};
  nodes.swL = {x: left + 140, y: yTop};
  nodes.swR = {x: left + 190, y: yTop};
  nodes.am = {x: left + 250, y: yTop};

  const rCenters = [];
  let x = left + 330;
  for (let i=0;i<n;i++){
    rCenters.push({x: x, y: yTop});
    x += gap;
  }
  nodes.rCenters = rCenters;
  nodes.topEnd = {x: x - gap + 55, y: yTop};
  nodes.botEnd = {x: nodes.topEnd.x, y: yBot};
  nodes.botStart = {x: nodes.batL.x, y: yBot};
  return nodes;
}

function draw() {
  if (!ctx) return;
  animT += 0.004;
  const p = calc();
  const L = layout();
  const glow = state.switchOn;

  ctx.clearRect(0,0,W,H);

  // soft vignette
  const grd = ctx.createRadialGradient(W/2,H/2,40, W/2,H/2, Math.max(W,H)*0.65);
  grd.addColorStop(0, 'rgba(0,243,255,0.04)');
  grd.addColorStop(1, 'rgba(15,23,42,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0,0,W,H);

  // wires
  drawWire(L.batR.x, L.batR.y, L.swL.x, L.swL.y, glow);
  drawWire(L.swR.x, L.swR.y, L.am.x - 40, L.am.y, glow);

  let prevX = L.am.x + (state.showAmmeter ? 40 : -20);
  drawWire(L.am.x + (state.showAmmeter?40:-40), L.am.y, L.rCenters[0].x - 45, L.rCenters[0].y, glow);
  for (let i=0;i<L.rCenters.length;i++){
    const c = L.rCenters[i];
    if (i>0) drawWire(L.rCenters[i-1].x+45, L.rCenters[i-1].y, c.x-45, c.y, glow);
  }
  const last = L.rCenters[L.rCenters.length-1];
  drawWire(last.x+45, last.y, L.topEnd.x, L.topEnd.y, glow);
  drawWire(L.topEnd.x, L.topEnd.y, L.botEnd.x, L.botEnd.y, glow);
  drawWire(L.botEnd.x, L.botEnd.y, L.botStart.x, L.botStart.y, glow);
  drawWire(L.botStart.x, L.botStart.y, L.batL.x, L.batL.y, glow);

  // Conventional current: + terminal → switch → ammeter → resistors → return → −
  const path = [
    {x1:L.batR.x,y1:L.batR.y,x2:L.swL.x,y2:L.swL.y},
    {x1:L.swR.x,y1:L.swR.y,x2:L.am.x,y2:L.am.y},
    {x1:L.am.x,y1:L.am.y,x2:L.rCenters[0].x,y2:L.rCenters[0].y}
  ];
  for (let i=0;i<L.rCenters.length-1;i++){
    path.push({x1:L.rCenters[i].x,y1:L.rCenters[i].y,x2:L.rCenters[i+1].x,y2:L.rCenters[i+1].y});
  }
  path.push(
    {x1:last.x,y1:last.y,x2:L.topEnd.x,y2:L.topEnd.y},
    {x1:L.topEnd.x,y1:L.topEnd.y,x2:L.botEnd.x,y2:L.botEnd.y},
    {x1:L.botEnd.x,y1:L.botEnd.y,x2:L.botStart.x,y2:L.botStart.y},
    {x1:L.botStart.x,y1:L.botStart.y,x2:L.batL.x,y2:L.batL.y}
  );
  drawElectrons(path, 0.35);
  if (state.switchOn) {
    drawCurrentArrow((L.swR.x + L.am.x)/2, L.am.y - 16, 0);
    drawCurrentArrow((L.botEnd.x + L.botStart.x)/2, L.botStart.y + 16, Math.PI);
  }

  drawBattery((L.batL.x+L.batR.x)/2, L.batL.y);
  drawSwitch((L.swL.x+L.swR.x)/2, L.swL.y);

  if (state.showAmmeter) {
    drawMeter(L.am.x, L.am.y, T('lbl_ammeter'), state.switchOn ? p.I.toFixed(2)+' A' : '0 A', '#34d399');
  }

  state.resistors.forEach((r,i)=>{
    drawResistorSymbol(L.rCenters[i].x, L.rCenters[i].y, 'R'+(i+1), r, p.drops[i]);
  });

  // Voltmeter dashed probe
  if (state.showVoltmeter) {
    let x1, x2, y = L.rCenters[0].y - 70;
    if (state.probe === 'total') {
      x1 = L.rCenters[0].x - 35;
      x2 = last.x + 35;
    } else {
      const idx = Number(state.probe);
      x1 = L.rCenters[idx].x - 35;
      x2 = L.rCenters[idx].x + 35;
    }
    const mid = (x1+x2)/2;
    ctx.setLineDash([6*S(), 5*S()]);
    ctx.strokeStyle = 'rgba(251,191,36,0.85)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(TX(x1), TY(L.rCenters[0].y - 14));
    ctx.lineTo(TX(x1), TY(y));
    ctx.lineTo(TX(x2), TY(y));
    ctx.lineTo(TX(x2), TY(L.rCenters[0].y - 14));
    ctx.stroke();
    ctx.setLineDash([]);
    drawMeter(mid, y - 10, T('lbl_voltmeter'), state.switchOn ? p.vm.toFixed(2)+' V' : '0 V', '#fbbf24');
  }

  // Formula banner
  ctx.fillStyle = 'rgba(15,23,42,0.72)';
  roundRect(TX(-200), TY(150), 400*S(), 36*S(), 10*S());
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,243,255,0.35)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = '#67e8f9';
  ctx.font = latinFont(700, Math.max(12, 14*S()));
  ctx.textAlign = 'center';
  ctx.fillText('Req = ΣR   ·   I = V / Req   ·   Vₙ = I × Rₙ', TX(0), TY(162));

  requestAnimationFrame(draw);
}

/* ============================================================
   ZOOM / PAN
============================================================ */
function zoomBy(k, cx, cy) {
  const old = state.zoom;
  state.zoom = Math.min(3.5, Math.max(0.45, state.zoom * k));
  const r = state.zoom / old;
  cx = cx ?? W/2; cy = cy ?? H/2;
  state.panX = (state.panX + W/2 - cx) * r + cx - W/2;
  state.panY = (state.panY + H/2 - cy) * r + cy - H/2;
}
function resetView(redraw=true) {
  state.zoom = 1; state.panX = 0; state.panY = 0;
}

function ptr(e) {
  const rect = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX - rect.left, y: t.clientY - rect.top };
}
function onDown(e) {
  if (isAnnoActive) return;
  e.preventDefault();
  if (e.touches && e.touches.length === 2) {
    const rect = canvas.getBoundingClientRect();
    const pts = [...e.touches].map(t=>({x:t.clientX-rect.left,y:t.clientY-rect.top}));
    pinch = { d: Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y), z: state.zoom };
    dragging = null; return;
  }
  dragging = 'pan';
  lastP = ptr(e);
  canvas.style.cursor = 'grabbing';
}
function onMove(e) {
  if (isAnnoActive) return;
  if (e.touches && e.touches.length === 2 && pinch) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const pts = [...e.touches].map(t=>({x:t.clientX-rect.left,y:t.clientY-rect.top}));
    const d = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    const target = pinch.z * (d / pinch.d);
    zoomBy(target / state.zoom, (pts[0].x+pts[1].x)/2, (pts[0].y+pts[1].y)/2);
    return;
  }
  if (dragging === 'pan' && lastP) {
    e.preventDefault();
    const p = ptr(e);
    state.panX += p.x - lastP.x;
    state.panY += p.y - lastP.y;
    lastP = p;
  }
}
function onUp() {
  dragging = null; lastP = null; pinch = null;
  canvas.style.cursor = 'grab';
}

/* ============================================================
   ANNOTATION (Fabric.js) — exact logic as specified
============================================================ */
let fCanvas;
let isAnnoActive = false;

function initAnnotationCanvas(w, h) {
  fCanvas = new fabric.Canvas('fabricLayer', {
    isDrawingMode: false,
    width: w,
    height: h
  });
  fCanvas.freeDrawingBrush.color = document.getElementById('anno-color').value;
  fCanvas.freeDrawingBrush.width = 4;

  fCanvas.on('mouse:down', function(options) {
    if(isAnnoActive && !fCanvas.isDrawingMode && options.target) {
      fCanvas.remove(options.target);
    }
  });

  const fabricContainer = document.querySelector('.canvas-container');
  if (fabricContainer) fabricContainer.style.pointerEvents = 'none';
}

function toggleAnnotationMode() {
  isAnnoActive = !isAnnoActive;
  const btn = document.getElementById('btn-anno-toggle');
  const toolbar = document.getElementById('anno-toolbar');
  const fabricContainer = document.querySelector('.canvas-container');

  if (isAnnoActive) {
    btn.classList.replace('text-slate-400', 'text-cyan-400');
    toolbar.classList.remove('max-w-0', 'opacity-0');
    toolbar.classList.add('max-w-xs', 'opacity-100');
    if(fabricContainer) fabricContainer.style.pointerEvents = 'auto';
    setAnnoMode('pen');
  } else {
    btn.classList.replace('text-cyan-400', 'text-slate-400');
    toolbar.classList.remove('max-w-xs', 'opacity-100');
    toolbar.classList.add('max-w-0', 'opacity-0');
    if(fabricContainer) fabricContainer.style.pointerEvents = 'none';
    if (fCanvas) fCanvas.isDrawingMode = false;
  }
}

function setAnnoMode(mode) {
  document.getElementById('anno-pen').classList.replace('text-cyan-400', 'text-slate-400');
  document.getElementById('anno-eraser').classList.replace('text-cyan-400', 'text-slate-400');

  if (mode === 'pen') {
    document.getElementById('anno-pen').classList.replace('text-slate-400', 'text-cyan-400');
    if(fCanvas) fCanvas.isDrawingMode = true;
  } else {
    document.getElementById('anno-eraser').classList.replace('text-slate-400', 'text-cyan-400');
    if(fCanvas) fCanvas.isDrawingMode = false;
  }
}

function changeAnnoColor(color) {
  if(fCanvas) fCanvas.freeDrawingBrush.color = color;
  setAnnoMode('pen');
}

function clearAnnotations() {
  if(fCanvas) fCanvas.clear();
}

/* ============================================================
   QUIZ
============================================================ */
const quiz = { i: 0, score: 0, answered: false, choice: null, done: false };

function restartQuiz() {
  quiz.i = 0; quiz.score = 0; quiz.answered = false; quiz.choice = null; quiz.done = false;
  renderQuiz();
}
function answer(oi) {
  if (quiz.answered || quiz.done) return;
  quiz.answered = true;
  quiz.choice = oi;
  const q = T('quiz')[quiz.i];
  if (oi === q.a) quiz.score++;
  renderQuiz();
}
function nextQ() {
  if (quiz.i >= 4) { quiz.done = true; renderQuiz(); return; }
  quiz.i++; quiz.answered = false; quiz.choice = null; renderQuiz();
}
function renderQuiz() {
  const box = document.getElementById('quiz-box');
  if (quiz.done) {
    const pct = Math.round(quiz.score/5*100);
    const msg = quiz.score >= 4 ? T('score_msg_great') : quiz.score >= 3 ? T('score_msg_good') : T('score_msg_low');
    box.innerHTML = `
      <div class="text-center space-y-6 fade-in">
        <h2 class="font-display text-2xl font-extrabold text-cyan-400">${T('final_score')}</h2>
        <div class="inline-flex flex-col items-center gap-2">
          <svg class="score-ring" width="140" height="140" viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="52" fill="none" stroke="#1e293b" stroke-width="10"/>
            <circle cx="60" cy="60" r="52" fill="none" stroke="#00f3ff" stroke-width="10"
              stroke-dasharray="${2*Math.PI*52}" stroke-dashoffset="${2*Math.PI*52*(1-quiz.score/5)}"
              stroke-linecap="round" transform="rotate(-90 60 60)"/>
            <text x="60" y="58" text-anchor="middle" fill="#00f3ff" font-size="28" font-family="Oxanium" font-weight="800">${quiz.score}/5</text>
            <text x="60" y="78" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Oxanium">${pct}%</text>
          </svg>
        </div>
        <p class="text-slate-300 text-base">${msg}</p>
        <button onclick="restartQuiz()" class="px-6 py-3 rounded-xl font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 hover:bg-cyan-500/30 transition glow-cyan">
          <i class="fa-solid fa-rotate-right"></i> ${T('restart')}
        </button>
      </div>`;
    return;
  }
  const q = T('quiz')[quiz.i];
  const opts = q.opts.map((o,oi)=>{
    let cls = 'opt-btn';
    if (quiz.answered) {
      cls += ' locked';
      if (oi === q.a) cls += ' correct';
      else if (oi === quiz.choice) cls += ' wrong';
    }
    return `<button onclick="answer(${oi})" class="${cls} w-full text-start px-5 py-4 rounded-xl glass-panel text-sm md:text-base font-bold text-slate-200 flex items-center gap-3">
      <span class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-600 flex items-center justify-center text-cyan-400 num shrink-0">${String.fromCharCode(65+oi)}</span>
      <span>${o}</span>
    </button>`;
  }).join('');

  let fb = '';
  if (quiz.answered) {
    const ok = quiz.choice === q.a;
    fb = `<div class="mt-4 glass-panel rounded-xl px-4 py-3 ${ok?'text-green-300 glow-green':'text-red-300 glow-red'}">
      <div class="font-bold mb-1">${ok ? T('correct_fb') : T('wrong_fb')}</div>
      <div class="text-sm text-slate-300">${q.ex}</div>
    </div>
    <button onclick="nextQ()" class="mt-4 w-full px-5 py-3 rounded-xl font-bold bg-cyan-500/15 text-cyan-300 border border-cyan-500/40 hover:bg-cyan-500/25 transition">
      ${quiz.i>=4 ? T('see_result') : T('next_q')} <i class="fa-solid fa-arrow-${cur==='ur'?'left':'right'}"></i>
    </button>`;
  }

  box.innerHTML = `
    <div class="fade-in">
      <div class="flex items-center justify-between mb-4 gap-3">
        <h2 class="font-display text-xl md:text-2xl font-extrabold text-cyan-400">${T('quiz_title')}</h2>
        <span class="text-sm text-slate-400 font-bold">${T('quiz_progress')(quiz.i+1,5)}</span>
      </div>
      <div class="h-2 rounded-full bg-slate-800 mb-6 overflow-hidden">
        <div class="h-full bg-cyan-400 transition-all duration-300" style="width:${(quiz.i/5)*100}%"></div>
      </div>
      <p class="text-base md:text-lg font-bold text-slate-100 mb-5 leading-relaxed">${q.q}</p>
      <div class="space-y-3">${opts}</div>
      ${fb}
    </div>`;
}

/* ============================================================
   BOOT
============================================================ */
function boot() {
  canvas = document.getElementById('sim-canvas');
  ctx = canvas.getContext('2d');
  fitCanvas();
  initAnnotationCanvas(W, H);

  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, {passive:false});
  canvas.addEventListener('touchmove', onMove, {passive:false});
  canvas.addEventListener('touchend', onUp);
  canvas.addEventListener('wheel', (e)=>{
    if (isAnnoActive) return;
    e.preventDefault();
    zoomBy(e.deltaY < 0 ? 1.1 : 1/1.1, e.offsetX, e.offsetY);
  }, {passive:false});

  window.addEventListener('resize', ()=>{ fitCanvas(); });

  changeLanguage(cur);
  document.getElementById('btn-switch').classList.toggle('switch-on', state.switchOn);

  // Intro ~5s then reveal app
  setTimeout(()=>{
    const intro = document.getElementById('intro');
    intro.style.opacity = '0';
    setTimeout(()=>{
      intro.style.display = 'none';
      document.getElementById('app').style.opacity = '1';
      fitCanvas();
      requestAnimationFrame(draw);
    }, 700);
  }, 4800);
}

boot();
</script>
