let currentLang = localStorage.getItem('iqra_sound_lang') || 'en';
function t(key) {
  const pack = LANG[currentLang] || LANG.en;
  return pack[key] !== undefined ? pack[key] : (LANG.en[key] ?? key);
}

/* ============================================================
   APP STATE
============================================================ */
const state = {
  playing: false,
  frequency: 440,
  amplitude: 0.7,
  air: 1,              // 1 = 101 kPa, 0 = vacuum
  targetAir: 1,
  phase: 0,
  speakerPhase: 0,
  zoom: 1,
  panX: 0,
  panY: 0
};

const PRESSURE_STEPS = [1, 0.5, 0.2, 0.05, 0.01, 0.002];

let particles = [];
let canvas, ctx;
let animId = null;
let baseScale = 1;
let audioCtx = null, osc = null, gainNode = null;

/* ============================================================
   ANNOTATION (EXACT LOGIC)
============================================================ */
let fCanvas;
let isAnnoActive = false;

function initAnnotationCanvas(w, h) {
  fCanvas = new fabric.Canvas('fabricLayer', {
    isDrawingMode: false,
    width: w,
    height: h
  });
  fCanvas.freeDrawingBrush.color = document.getElementById('anno-color').value;
  fCanvas.freeDrawingBrush.width = 4;

  fCanvas.on('mouse:down', function(options) {
    if(isAnnoActive && !fCanvas.isDrawingMode && options.target) {
      fCanvas.remove(options.target);
    }
  });

  const fabricContainer = document.querySelector('.canvas-container');
  if (fabricContainer) fabricContainer.style.pointerEvents = 'none';
}

function toggleAnnotationMode() {
  isAnnoActive = !isAnnoActive;
  const btn = document.getElementById('btn-anno-toggle');
  const toolbar = document.getElementById('anno-toolbar');
  const fabricContainer = document.querySelector('.canvas-container');

  if (isAnnoActive) {
    btn.classList.replace('text-slate-400', 'text-cyan-400');
    toolbar.classList.remove('max-w-0', 'opacity-0');
    toolbar.classList.add('max-w-xs', 'opacity-100');
    if(fabricContainer) fabricContainer.style.pointerEvents = 'auto';
    setAnnoMode('pen');
  } else {
    btn.classList.replace('text-cyan-400', 'text-slate-400');
    toolbar.classList.remove('max-w-xs', 'opacity-100');
    toolbar.classList.add('max-w-0', 'opacity-0');
    if(fabricContainer) fabricContainer.style.pointerEvents = 'none';
    if (fCanvas) fCanvas.isDrawingMode = false;
  }
}

function setAnnoMode(mode) {
  document.getElementById('anno-pen').classList.replace('text-cyan-400', 'text-slate-400');
  document.getElementById('anno-eraser').classList.replace('text-cyan-400', 'text-slate-400');

  if (mode === 'pen') {
    document.getElementById('anno-pen').classList.replace('text-slate-400', 'text-cyan-400');
    if(fCanvas) fCanvas.isDrawingMode = true;
  } else {
    document.getElementById('anno-eraser').classList.replace('text-slate-400', 'text-cyan-400');
    if(fCanvas) fCanvas.isDrawingMode = false;
  }
}

function changeAnnoColor(color) {
  if(fCanvas) fCanvas.freeDrawingBrush.color = color;
  setAnnoMode('pen');
}

function clearAnnotations() {
  if(fCanvas) fCanvas.clear();
}

/* ============================================================
   LANGUAGE / UI
============================================================ */
function applyI18n() {
  const pack = LANG[currentLang];
  document.documentElement.lang = currentLang === 'ur' ? 'ur' : 'en';
  document.documentElement.dir = currentLang === 'ur' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (pack[key] !== undefined) el.textContent = pack[key];
  });
  const intro = document.getElementById('intro-topic');
  if (intro) intro.textContent = pack.intro_topic;
  document.getElementById('lang-select').value = currentLang;
  updateObservations();
  updateTip();
  if (document.getElementById('view-quiz') && !document.getElementById('view-quiz').classList.contains('hidden')) {
    renderQuiz();
  }
}

function changeLanguage(v) {
  if (v !== 'en' && v !== 'ur') return;
  currentLang = v;
  localStorage.setItem('iqra_sound_lang', v);
  applyI18n();
}

function switchTab(name) {
  document.getElementById('view-sim').classList.toggle('hidden', name !== 'sim');
  document.getElementById('view-quiz').classList.toggle('hidden', name !== 'quiz');
  document.getElementById('tab-sim').classList.toggle('active', name === 'sim');
  document.getElementById('tab-quiz').classList.toggle('active', name === 'quiz');
  if (name === 'quiz') renderQuiz();
  if (name === 'sim') setTimeout(resizeAll, 50);
}

function toggleFullScreen() {
  const icon = document.getElementById('fs-icon');
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.();
    if (icon) { icon.classList.remove('fa-expand'); icon.classList.add('fa-compress'); }
  } else {
    document.exitFullscreen?.();
    if (icon) { icon.classList.remove('fa-compress'); icon.classList.add('fa-expand'); }
  }
}

/* ============================================================
   PARTICLES
============================================================ */
function buildParticles() {
  particles = [];
  const cols = 48;
  const rows = 14;
  for (let i = 0; i < cols; i++) {
    for (let j = 0; j < rows; j++) {
      const jitter = (Math.random() - 0.5) * 0.35;
      particles.push({
        bx: i + jitter,
        by: j + (Math.random() - 0.5) * 0.3,
        ox: 0
      });
    }
  }
}

function desiredCount() {
  return Math.max(8, Math.floor(particles.length * Math.pow(state.air, 0.85)));
}

/* ============================================================
   AUDIO
============================================================ */
function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    gainNode = audioCtx.createGain();
    gainNode.gain.value = 0;
    gainNode.connect(audioCtx.destination);
  }
}

function startSound() {
  ensureAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (!osc) {
    osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = state.frequency;
    osc.connect(gainNode);
    osc.start();
  }
  state.playing = true;
  updateAudioGain();
  updateObservations();
  updateTip();
}

function stopSound() {
  state.playing = false;
  if (gainNode && audioCtx) {
    gainNode.gain.cancelScheduledValues(audioCtx.currentTime);
    gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
  }
  updateObservations();
  updateTip();
}

function updateAudioGain() {
  if (!gainNode || !audioCtx) return;
  const vol = state.playing ? state.amplitude * Math.pow(state.air, 1.6) * 0.18 : 0;
  gainNode.gain.cancelScheduledValues(audioCtx.currentTime);
  gainNode.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.08);
  if (osc) osc.frequency.setTargetAtTime(state.frequency, audioCtx.currentTime, 0.05);
}

function onControls() {
  state.frequency = +document.getElementById('sl-freq').value;
  state.amplitude = +document.getElementById('sl-amp').value / 100;
  document.getElementById('val-freq').textContent = state.frequency + ' Hz';
  document.getElementById('val-amp').textContent = Math.round(state.amplitude * 100) + '%';
  updateAudioGain();
}

function pressureKPa() {
  return Math.max(0.2, state.air * 101);
}

function updatePressureUI() {
  const kpa = pressureKPa();
  document.getElementById('val-press').textContent = (kpa < 1 ? kpa.toFixed(1) : Math.round(kpa)) + ' kPa';
  document.getElementById('press-bar').style.width = (state.air * 100) + '%';
  document.getElementById('vac-banner').classList.toggle('hidden', state.air > 0.03);
}

function pumpAir() {
  const idx = PRESSURE_STEPS.findIndex(v => Math.abs(v - state.targetAir) < 0.0001);
  const next = PRESSURE_STEPS[Math.min(PRESSURE_STEPS.length - 1, (idx < 0 ? 0 : idx) + 1)];
  state.targetAir = next;
  updateTip();
}

function admitAir() {
  const idx = PRESSURE_STEPS.findIndex(v => Math.abs(v - state.targetAir) < 0.0001);
  const next = PRESSURE_STEPS[Math.max(0, (idx < 0 ? PRESSURE_STEPS.length - 1 : idx) - 1)];
  state.targetAir = next;
  updateTip();
}

function resetExperiment() {
  stopSound();
  state.targetAir = 1;
  state.air = 1;
  state.frequency = 440;
  state.amplitude = 0.7;
  state.phase = 0;
  document.getElementById('sl-freq').value = 440;
  document.getElementById('sl-amp').value = 70;
  onControls();
  updatePressureUI();
  updateObservations();
  updateTip();
}

function updateObservations() {
  const elSp = document.getElementById('obs-speaker');
  const elMed = document.getElementById('obs-medium');
  const elWave = document.getElementById('obs-wave');
  const elMic = document.getElementById('obs-mic');
  if (!elSp) return;

  elSp.textContent = state.playing ? t('sp_on') : t('sp_off');
  elSp.className = 'text-sm font-bold text-end ' + (state.playing ? 'text-emerald-400' : 'text-slate-300');

  if (state.air > 0.6) elMed.textContent = t('med_air');
  else if (state.air > 0.03) elMed.textContent = t('med_low');
  else elMed.textContent = t('med_vac');
  elMed.className = 'text-sm font-bold text-end ' + (state.air > 0.6 ? 'text-cyan-300' : state.air > 0.03 ? 'text-amber-300' : 'text-red-400');

  const strength = waveStrength();
  if (strength > 0.55) { elWave.textContent = t('wave_strong'); elWave.className = 'text-sm font-bold text-end text-emerald-400'; }
  else if (strength > 0.08) { elWave.textContent = t('wave_weak'); elWave.className = 'text-sm font-bold text-end text-amber-300'; }
  else { elWave.textContent = t('wave_none'); elWave.className = 'text-sm font-bold text-end text-red-400'; }

  if (strength > 0.55) { elMic.textContent = t('mic_strong'); elMic.className = 'text-sm font-bold text-end text-emerald-400'; }
  else if (strength > 0.08) { elMic.textContent = t('mic_weak'); elMic.className = 'text-sm font-bold text-end text-amber-300'; }
  else { elMic.textContent = t('mic_none'); elMic.className = 'text-sm font-bold text-end text-red-400'; }

  const pct = Math.round(strength * 100);
  document.getElementById('mic-pct').textContent = pct + '%';
  const meter = document.getElementById('mic-meter');
  meter.style.height = pct + '%';
  meter.className = 'meter-bar w-full rounded-b-lg ' + (pct > 55 ? 'bg-emerald-400' : pct > 8 ? 'bg-amber-400' : 'bg-slate-600');
}

function waveStrength() {
  if (!state.playing) return 0;
  return Math.min(1, state.amplitude * Math.pow(state.air, 1.35));
}

function updateTip() {
  const el = document.getElementById('tip-text');
  if (!el) return;
  if (state.air <= 0.03) el.textContent = t('tip_vacuum');
  else if (state.targetAir < state.air - 0.01) el.textContent = t('tip_pumping');
  else if (state.targetAir > state.air + 0.01 && state.air < 0.95) el.textContent = t('tip_restore');
  else if (state.playing) el.textContent = t('tip_running');
  else el.textContent = t('tip_idle');
}

/* ============================================================
   DRAWING
============================================================ */
function S() { return baseScale * state.zoom; }

function worldToScreen(x, y) {
  const s = S();
  return {
    x: canvas.width / 2 + state.panX + x * s,
    y: canvas.height / 2 + state.panY + y * s
  };
}

function drawRoundedRect(x, y, w, h, r, fill, stroke, lw) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
}

function drawSpeaker(cx, cy, vib) {
  const s = S();
  ctx.save();
  // body
  drawRoundedRect(cx - 38*s, cy - 48*s, 34*s, 96*s, 8*s, '#1e293b', '#00f3ff', 2);
  // cone
  const push = vib * 6 * s;
  ctx.beginPath();
  ctx.moveTo(cx - 4*s + push, cy - 36*s);
  ctx.lineTo(cx + 28*s + push, cy - 52*s);
  ctx.lineTo(cx + 28*s + push, cy + 52*s);
  ctx.lineTo(cx - 4*s + push, cy + 36*s);
  ctx.closePath();
  ctx.fillStyle = '#334155';
  ctx.fill();
  ctx.strokeStyle = '#67e8f9';
  ctx.lineWidth = 2;
  ctx.stroke();
  // center
  ctx.beginPath();
  ctx.arc(cx + 8*s + push, cy, 10*s, 0, Math.PI*2);
  ctx.fillStyle = '#0ea5e9';
  ctx.fill();
  if (state.playing) {
    ctx.beginPath();
    ctx.arc(cx + 34*s + push, cy, (18 + Math.abs(vib)*10)*s, -0.7, 0.7);
    ctx.strokeStyle = `rgba(0,243,255,${0.25 + Math.abs(vib)*0.4})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.fillStyle = '#94a3b8';
  ctx.font = `${12*s}px Manrope, sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(t('lbl_speaker'), cx - 10*s, cy + 70*s);
  ctx.restore();
}

function drawMic(cx, cy, signal) {
  const s = S();
  ctx.save();
  drawRoundedRect(cx - 10*s, cy - 40*s, 28*s, 55*s, 12*s, '#1e293b', '#22c55e', 2);
  ctx.beginPath();
  ctx.arc(cx + 4*s, cy - 40*s, 14*s, Math.PI, 0);
  ctx.fillStyle = '#334155';
  ctx.fill();
  ctx.strokeStyle = '#4ade80';
  ctx.stroke();
  // stand
  ctx.strokeStyle = '#64748b';
  ctx.beginPath();
  ctx.moveTo(cx + 4*s, cy + 15*s);
  ctx.lineTo(cx + 4*s, cy + 48*s);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx - 14*s, cy + 48*s);
  ctx.lineTo(cx + 22*s, cy + 48*s);
  ctx.stroke();
  // signal rings
  if (signal > 0.05) {
    for (let i = 1; i <= 3; i++) {
      ctx.beginPath();
      ctx.arc(cx - 8*s, cy - 20*s, (10 + i*8)*s * (0.6 + signal*0.5), 2.2, 4.1);
      ctx.strokeStyle = `rgba(74,222,128,${signal * (0.5 - i*0.1)})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }
  ctx.fillStyle = '#94a3b8';
  ctx.font = `${12*s}px Manrope, sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(t('lbl_mic'), cx + 4*s, cy + 68*s);
  ctx.restore();
}

function drawPressureGraph(gx, gy, gw, gh) {
  const s = S();
  drawRoundedRect(gx, gy, gw, gh, 12*s, 'rgba(15,23,42,0.85)', 'rgba(0,243,255,0.25)', 1.5);

  ctx.fillStyle = '#67e8f9';
  ctx.font = `bold ${13*s}px Oxanium, sans-serif`;
  ctx.textAlign = currentLang === 'ur' ? 'right' : 'left';
  ctx.fillText(t('lbl_graph'), currentLang === 'ur' ? gx + gw - 14*s : gx + 14*s, gy + 22*s);

  const midY = gy + gh * 0.55;
  const padX = 20 * s;
  const usableW = gw - padX * 2;

  // atmospheric line
  ctx.setLineDash([6*s, 6*s]);
  ctx.strokeStyle = 'rgba(148,163,184,0.55)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(gx + padX, midY);
  ctx.lineTo(gx + gw - padX, midY);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#94a3b8';
  ctx.font = `${10*s}px Manrope, sans-serif`;
  ctx.textAlign = 'left';
  ctx.fillText(t('lbl_atm'), gx + padX + 4*s, midY - 8*s);

  const k = wavelengthFactor();
  const ampPx = 28 * s * state.amplitude * Math.pow(state.air, 1.1) * (state.playing ? 1 : 0.08);
  const phase = state.phase;

  ctx.beginPath();
  for (let i = 0; i <= 120; i++) {
    const u = i / 120;
    const x = gx + padX + u * usableW;
    const y = midY - Math.sin(u * Math.PI * 2 * k - phase) * ampPx;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = '#00f3ff';
  ctx.lineWidth = 2.5;
  ctx.shadowColor = 'rgba(0,243,255,0.45)';
  ctx.shadowBlur = 10;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // peak / trough labels if playing & air present
  // wave = sin(u * 2πk - phase); crest when u*2πk - phase = π/2 + 2πn
  if (state.playing && state.air > 0.05) {
    let crestU = null, troughU = null;
    for (let n = -2; n < k + 3; n++) {
      const cu = (Math.PI/2 + phase + 2*Math.PI*n) / (2*Math.PI*k);
      const tu = (3*Math.PI/2 + phase + 2*Math.PI*n) / (2*Math.PI*k);
      if (crestU === null && cu >= 0.08 && cu <= 0.92) crestU = cu;
      if (troughU === null && tu >= 0.08 && tu <= 0.92) troughU = tu;
    }
    ctx.font = `bold ${11*s}px Manrope, sans-serif`;
    ctx.textAlign = 'center';
    if (crestU !== null) {
      const x = gx + padX + crestU * usableW;
      ctx.fillStyle = '#f87171';
      ctx.fillText(t('lbl_compression'), x, midY - ampPx - 10*s);
      ctx.beginPath();
      ctx.moveTo(x, midY - 4*s);
      ctx.lineTo(x, midY - ampPx + 4*s);
      ctx.strokeStyle = 'rgba(248,113,113,0.7)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    if (troughU !== null) {
      const x = gx + padX + troughU * usableW;
      ctx.fillStyle = '#60a5fa';
      ctx.fillText(t('lbl_rarefaction'), x, midY + ampPx + 18*s);
    }
  }
}

function wavelengthFactor() {
  // higher frequency => more cycles across chamber
  return 1.2 + (state.frequency - 120) / 760 * 1.6;
}

function drawScene() {
  if (!ctx) return;
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  // soft vignette bg
  const g = ctx.createRadialGradient(w/2, h/2, 40, w/2, h/2, Math.max(w,h)*0.7);
  g.addColorStop(0, '#152238');
  g.addColorStop(1, '#0b1220');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  const s = S();
  const chamberW = 520 * s;
  const chamberH = 210 * s;
  const chamberX = w/2 + state.panX - chamberW/2;
  const chamberY = h/2 + state.panY - 10*s;

  // pressure graph above chamber
  drawPressureGraph(chamberX, chamberY - 150*s, chamberW, 120*s);

  // chamber glass
  drawRoundedRect(chamberX, chamberY, chamberW, chamberH, 16*s, 'rgba(30,41,59,0.35)', 'rgba(148,163,184,0.35)', 2);
  // inner glow depending on air
  ctx.fillStyle = `rgba(56,189,248,${0.03 + state.air * 0.06})`;
  ctx.fillRect(chamberX + 2, chamberY + 2, chamberW - 4, chamberH - 4);

  ctx.fillStyle = '#64748b';
  ctx.font = `${11*s}px Manrope, sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(t('lbl_chamber'), chamberX + chamberW/2, chamberY - 8*s);

  // speaker & mic positions
  const speakerX = chamberX - 10*s;
  const speakerY = chamberY + chamberH/2;
  const micX = chamberX + chamberW + 10*s;
  const micY = chamberY + chamberH/2;

  const vib = state.playing ? Math.sin(state.speakerPhase) * state.amplitude : 0;
  drawSpeaker(speakerX, speakerY, vib);
  drawMic(micX, micY, waveStrength());

  // particles inside chamber
  const cols = 48, rows = 14;
  const marginX = 28 * s, marginY = 22 * s;
  const usableW = chamberW - marginX * 2;
  const usableH = chamberH - marginY * 2;
  const k = wavelengthFactor();
  const ampDisp = 10 * state.amplitude * Math.pow(state.air, 0.9) * (state.playing ? 1 : 0);
  const count = desiredCount();

  // density field labels aligned with wave peaks/troughs
  if (state.playing && state.air > 0.08) {
    ctx.font = `bold ${10*s}px Manrope, sans-serif`;
    ctx.textAlign = 'center';
    for (let n = -2; n < k + 3; n++) {
      const u = (Math.PI/2 + state.phase + 2*Math.PI*n) / (2*Math.PI*k);
      if (u >= 0.08 && u <= 0.92) {
        const x = chamberX + marginX + u * usableW;
        ctx.fillStyle = 'rgba(248,113,113,0.85)';
        ctx.fillText(t('lbl_compression'), x, chamberY + 16*s);
      }
      const tu = (3*Math.PI/2 + state.phase + 2*Math.PI*n) / (2*Math.PI*k);
      if (tu >= 0.08 && tu <= 0.92) {
        const tx = chamberX + marginX + tu * usableW;
        ctx.fillStyle = 'rgba(96,165,250,0.9)';
        ctx.fillText(t('lbl_rarefaction'), tx, chamberY + chamberH - 10*s);
      }
    }
  }

  for (let i = 0; i < count; i++) {
    const p = particles[i];
    const u = p.bx / (cols - 1);
    const v = p.by / (rows - 1);
    const wave = Math.sin(u * Math.PI * 2 * k - state.phase);
    // longitudinal displacement only
    const dx = wave * ampDisp * s;
    // slight density visual via alpha clustering already from displacement
    const x = chamberX + marginX + u * usableW + dx;
    const y = chamberY + marginY + v * usableH;
    const dens = 0.35 + 0.55 * ((wave + 1) / 2) * state.air;
    ctx.beginPath();
    ctx.arc(x, y, Math.max(1.2, 2.1 * s * (0.85 + dens * 0.3)), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(226,232,240,${0.25 + dens * 0.55})`;
    ctx.fill();
  }

  // propagation arrow
  ctx.save();
  ctx.strokeStyle = '#00f3ff';
  ctx.fillStyle = '#00f3ff';
  ctx.lineWidth = 2;
  const ay = chamberY + chamberH + 28*s;
  const ax1 = chamberX + 40*s;
  const ax2 = chamberX + chamberW - 40*s;
  ctx.beginPath();
  ctx.moveTo(ax1, ay);
  ctx.lineTo(ax2, ay);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(ax2, ay);
  ctx.lineTo(ax2 - 12*s, ay - 7*s);
  ctx.lineTo(ax2 - 12*s, ay + 7*s);
  ctx.closePath();
  ctx.fill();
  ctx.font = `bold ${12*s}px Manrope, sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(t('lbl_prop'), (ax1 + ax2) / 2, ay + 20*s);

  // molecule motion double arrow
  ctx.strokeStyle = '#94a3b8';
  ctx.fillStyle = '#94a3b8';
  const my = chamberY + chamberH/2;
  const mx = chamberX + chamberW/2;
  ctx.beginPath();
  ctx.moveTo(mx - 40*s, my + 70*s);
  ctx.lineTo(mx + 40*s, my + 70*s);
  ctx.stroke();
  // arrow heads both sides
  [[mx-40*s,1],[mx+40*s,-1]].forEach(([x,dir])=>{
    ctx.beginPath();
    ctx.moveTo(x, my + 70*s);
    ctx.lineTo(x + dir*10*s, my + 70*s - 6*s);
    ctx.lineTo(x + dir*10*s, my + 70*s + 6*s);
    ctx.closePath();
    ctx.fill();
  });
  ctx.font = `${11*s}px Manrope, sans-serif`;
  ctx.fillText(t('lbl_motion'), mx, my + 90*s);

  // one oscillation brace
  if (state.playing && state.air > 0.1) {
    const cycleW = usableW / k;
    const ox = chamberX + marginX;
    ctx.strokeStyle = 'rgba(250,204,21,0.7)';
    ctx.beginPath();
    ctx.moveTo(ox, chamberY + chamberH + 48*s);
    ctx.lineTo(ox + cycleW, chamberY + chamberH + 48*s);
    ctx.stroke();
    ctx.fillStyle = '#facc15';
    ctx.font = `${10*s}px Manrope, sans-serif`;
    ctx.fillText(t('lbl_one'), ox + cycleW/2, chamberY + chamberH + 64*s);
  }

  ctx.restore();
}

function tick(ts) {
  // smooth air toward target
  state.air += (state.targetAir - state.air) * 0.04;
  if (Math.abs(state.targetAir - state.air) < 0.001) state.air = state.targetAir;

  if (state.playing) {
    const speed = 0.045 + (state.frequency / 880) * 0.08;
    state.phase += speed;
    state.speakerPhase += 0.25 + (state.frequency / 880) * 0.35;
  }

  updateAudioGain();
  updatePressureUI();
  updateObservations();
  drawScene();
  animId = requestAnimationFrame(tick);
}

/* ============================================================
   ZOOM / PAN
============================================================ */
function zoomBy(k, cx, cy) {
  const old = state.zoom;
  state.zoom = Math.min(3.5, Math.max(0.45, state.zoom * k));
  const r = state.zoom / old;
  if (cx != null) {
    state.panX = cx - (cx - state.panX) * r;
    state.panY = cy - (cy - state.panY) * r;
  }
}

function resetView() {
  state.zoom = 1;
  state.panX = 0;
  state.panY = 0;
  fitBaseScale();
}

function fitBaseScale() {
  if (!canvas) return;
  const targetW = 700, targetH = 480;
  baseScale = Math.min(canvas.width / targetW, canvas.height / targetH) * 0.92;
}

let dragging = false, lastP = null, pinch = null;
const pinchPts = new Map();

function pointerPos(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) * (canvas.width / rect.width), y: (e.clientY - rect.top) * (canvas.height / rect.height) };
}

function onPointerDown(e) {
  if (isAnnoActive) return;
  canvas.setPointerCapture?.(e.pointerId);
  const p = pointerPos(e);
  if (pinchPts.size === 1) { pinchPts.set(e.pointerId, p); startPinch(); return; }
  pinchPts.set(e.pointerId, p);
  dragging = true;
  lastP = p;
  canvas.style.cursor = 'grabbing';
}

function startPinch() {
  const pts = [...pinchPts.values()];
  pinch = { d: Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y), z: state.zoom };
}

function onPointerMove(e) {
  if (isAnnoActive) return;
  const p = pointerPos(e);
  if (pinchPts.has(e.pointerId)) pinchPts.set(e.pointerId, p);
  if (pinch && pinchPts.size >= 2) {
    const pts = [...pinchPts.values()];
    const d = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    const target = pinch.z * d / pinch.d;
    zoomBy(target / state.zoom, (pts[0].x+pts[1].x)/2, (pts[0].y+pts[1].y)/2);
    return;
  }
  if (dragging && lastP) {
    state.panX += p.x - lastP.x;
    state.panY += p.y - lastP.y;
    lastP = p;
  }
}

function onPointerUp(e) {
  pinchPts.delete(e.pointerId);
  if (pinchPts.size < 2) pinch = null;
  if (pinchPts.size === 0) { dragging = false; lastP = null; canvas.style.cursor = 'grab'; }
}

function onWheel(e) {
  if (isAnnoActive) return;
  e.preventDefault();
  zoomBy(e.deltaY < 0 ? 1.1 : 1/1.1, e.offsetX * (canvas.width/canvas.clientWidth), e.offsetY * (canvas.height/canvas.clientHeight));
}

/* ============================================================
   QUIZ
============================================================ */
let quizIndex = 0, quizScore = 0, quizAnswered = false, quizDone = false;

function renderQuiz() {
  const box = document.getElementById('quiz-box');
  const qs = t('q');
  if (quizDone) {
    const pct = Math.round((quizScore / qs.length) * 100);
    box.innerHTML = `
      <div class="text-center space-y-6 fade-in">
        <h2 class="font-display text-2xl text-cyan-400 font-extrabold">${t('score_title')}</h2>
        <div class="text-6xl font-black text-white font-display">${quizScore}<span class="text-2xl text-slate-400"> / ${qs.length}</span></div>
        <div class="text-xl text-emerald-400 font-bold">${t('score_pct')}: <span class="num">${pct}%</span></div>
        <button onclick="restartQuiz()" class="action-btn active px-8 py-4 rounded-2xl font-bold text-base inline-flex items-center gap-2">
          <i class="fa-solid fa-rotate-right"></i>${t('restart')}
        </button>
      </div>`;
    return;
  }
  const item = qs[quizIndex];
  const letters = ['A','B','C','D'];
  box.innerHTML = `
    <div class="space-y-5">
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <h2 class="font-display text-xl md:text-2xl text-cyan-400 font-extrabold">${t('quiz_title')}</h2>
        <span class="text-sm text-slate-400 font-bold">${t('quiz_progress')(quizIndex+1, qs.length)}</span>
      </div>
      <div class="h-2 rounded-full bg-slate-800 overflow-hidden">
        <div class="h-full bg-cyan-400 transition-all" style="width:${((quizIndex)/qs.length)*100}%"></div>
      </div>
      <p class="text-lg md:text-xl font-bold text-slate-100 leading-relaxed">${item.q}</p>
      <div class="space-y-3" id="opts"></div>
      <div id="explain" class="hidden glass-panel rounded-xl px-4 py-3 text-sm"></div>
      <div class="flex justify-end">
        <button id="btn-next" onclick="nextQuestion()" class="hidden action-btn active px-6 py-3 rounded-xl font-bold">${t('next')}</button>
      </div>
    </div>`;
  const opts = document.getElementById('opts');
  item.opts.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt-btn w-full text-start px-4 py-4 rounded-xl font-semibold text-slate-200 flex items-start gap-3';
    b.innerHTML = `<span class="stat-val shrink-0">${letters[i]}</span><span>${opt}</span>`;
    b.onclick = () => selectAnswer(i);
    opts.appendChild(b);
  });
  quizAnswered = false;
}

function selectAnswer(i) {
  if (quizAnswered) return;
  quizAnswered = true;
  const qs = t('q');
  const item = qs[quizIndex];
  const buttons = [...document.getElementById('opts').children];
  buttons.forEach((b, idx) => {
    b.classList.add('locked');
    if (idx === item.a) b.classList.add('correct');
    if (idx === i && i !== item.a) b.classList.add('wrong');
  });
  if (i === item.a) quizScore++;
  const exp = document.getElementById('explain');
  exp.classList.remove('hidden');
  exp.innerHTML = `<span class="font-bold ${i===item.a?'text-emerald-400':'text-red-400'}">${i===item.a?t('correct_fb'):t('wrong_fb')}</span> — ${item.exp}`;
  const next = document.getElementById('btn-next');
  next.classList.remove('hidden');
  if (quizIndex === qs.length - 1) next.textContent = t('score_title');
}

function nextQuestion() {
  const qs = t('q');
  if (quizIndex >= qs.length - 1) {
    quizDone = true;
    renderQuiz();
    return;
  }
  quizIndex++;
  renderQuiz();
}

function restartQuiz() {
  quizIndex = 0;
  quizScore = 0;
  quizAnswered = false;
  quizDone = false;
  renderQuiz();
}

/* ============================================================
   RESIZE / INIT
============================================================ */
function resizeAll() {
  const wrap = document.getElementById('canvas-wrap');
  if (!wrap || !canvas) return;
  const rect = wrap.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(300, Math.floor(rect.width * dpr));
  canvas.height = Math.max(280, Math.floor(rect.height * dpr));
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  fitBaseScale();
  if (fCanvas) {
    fCanvas.setWidth(rect.width);
    fCanvas.setHeight(rect.height);
    fCanvas.calcOffset();
  } else {
    initAnnotationCanvas(rect.width, rect.height);
  }
}

function boot() {
  canvas = document.getElementById('sim-canvas');
  ctx = canvas.getContext('2d');
  buildParticles();
  applyI18n();
  onControls();
  updatePressureUI();
  updateObservations();
  updateTip();

  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);
  canvas.addEventListener('wheel', onWheel, { passive: false });

  window.addEventListener('resize', resizeAll);
  resizeAll();
  requestAnimationFrame(tick);

  // intro ~5s
  setTimeout(() => {
    const intro = document.getElementById('intro');
    intro.style.opacity = '0';
    setTimeout(() => {
      intro.style.display = 'none';
      document.getElementById('app').style.opacity = '1';
      resizeAll();
    }, 700);
  }, 4800);
}

document.addEventListener('DOMContentLoaded', boot);
</script>
